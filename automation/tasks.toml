# The three nudges and the launch variant, as data (founder decisions: "3 automations: weekly
# script batch, daily idea + hook drop, weekly performance review"; 7 Oct 2026: campaign board,
# use the harness). Prose the machine reads: modules/<lang>/automation.md (automation.grow-*).
#
# - Each [[task]] names the section that holds its whole text (one source, both editions) and the
#   template that renders a sample for lint: automation/<template> is just {{>section}}, rendered
#   with the `task` flag to dist/maintainer/tasks/<edition>/<stem>.txt. Every stem starts with
#   "task-nudge", so lint budgets it as task_nudge (platform/targets.toml, 900 characters NFC)
#   and does not ask it for the Ship Check card (it hands over to the project or the skill).
# - The 900 characters hold for the text as printed, slots written in by the machine; over it,
#   the machine shortens the Map lines first, never the rules.
# - ChatGPT tasks cannot read project files (limits.chatgpt_tasks_read_project_files = false), so
#   every ChatGPT text carries the pocket Map. Claude's one task uses the skill and reads the board.
# - `job` matches the Runs `Type` options in schemas/hub.toml (BATCH, DROP, REVIEW, LAUNCH).

schema_version = 1

[caps]
nudges_per_day = 1
weekend = false                          # no weekend nudges, except the launch task
max_chars_filled = 900                   # budgets.task_nudge
questions_per_run = 1
ends_with = "next.prefix + task.footer"  # the one NEXT line
never = ["post", "message anyone", "comment", "react", "follow", "join", "write to the board",
         "open apps on the coach's computer", "invent numbers, results, client words, testimonials, deadlines or scarcity",
         "send a second message the same day", "say the coach missed something"]
time_rule = "a few minutes past the hour; runs can start late"

[catch_up]
missed_batch = "the next DROP (or 'next' on any day) writes the rest of the week first, today's piece on top; days gone are left out, never counted (today.left_out once)"
missed_review = "Monday's BATCH keeps last week's bets and its NEXT asks for the numbers once; never chased twice"
late_run = "a late run does its own day's job for the current week"
wrong_day = "a run on a day it does not own (moved by hand, Run now) does that day's job only, never two jobs"
rerun = "a second run the same day writes nothing twice; already written → nothing reprinted, NEXT is today's piece"

[launch_mode]
from = "the launch calendar's day 1"
to = "the day after the close"
replaces = ["week", "today", "numbers", "claude"]  # paused by the coach on the machine's one-line prompt
task = "launch"
inside = "Monday's batch and Friday's scoreboard ride inside that day's Launch Desk (launch-plan.grow-desk 2-3)"
after = "cooldown: pause the launch task, resume the weekly nudges"

[apps.chatgpt]
plans = ["Plus", "Pro", "Business", "Free", "Go"]
tasks = ["week", "today", "numbers"]
where = "a new chat outside the project, or Scheduled in the sidebar → New"
free_go = "morning or afternoon windows; the three fill all 3 task slots (limits.chatgpt_tasks_free_go)"
notifications = "Settings → Notifications → Tasks: push and email (optional)"

[apps.claude]
plans = ["Pro", "Max", "Team", "Enterprise"]
tasks = ["claude"]
where = "Scheduled → New task → Set up manually; Weekdays, 7:07; no folder; Run now once"
note = "one task, the job chosen by the weekday: one nudge a day by construction"

[apps.none]
fallback = "3 weekly Google Calendar reminders (Monday, Wednesday, Friday) saying task.footer"

[[task]]
id = "week"
job = "BATCH"
name_key = "task.week.name"
section = "automation.grow-task-week"
template = "task-nudge.tmpl"
app = "chatgpt"
schedule = "every Monday at 7:07"
free_window = "morning"
runs_in_project = "the week from the last Weekly Talk and the board (automation.grow-jobs 1)"

[[task]]
id = "today"
job = "DROP"
name_key = "task.today.name"
section = "automation.grow-task-today"
template = "task-nudge-today.tmpl"
app = "chatgpt"
schedule = "every Tuesday, Wednesday and Thursday at 6:37"
free_window = "morning"
runs_in_project = "today's piece, or the catch-up of a missed week (automation.grow-jobs 2)"

[[task]]
id = "numbers"
job = "REVIEW"
name_key = "task.numbers.name"
section = "automation.grow-task-numbers"
template = "task-nudge-numbers.tmpl"
app = "chatgpt"
schedule = "every Friday at 15:07"
free_window = "afternoon"
runs_in_project = "the numbers ask, the 5-line review, up to 3 bets, the Numbers row, one research line (automation.grow-jobs 3)"

[[task]]
id = "claude"
job = "BATCH, DROP, REVIEW by weekday"
name_key = "task.week.name"              # the three names appear inside the text
section = "automation.grow-task-claude"
template = "task-nudge-claude.tmpl"
app = "claude"
schedule = "Weekdays at 7:07"
runs_in_task = "Monday the week, Tuesday to Thursday today's piece or the catch-up, Friday the numbers"

[[task]]
id = "launch"
job = "LAUNCH"
name = { en = "Launch day", vn = "Ngày mở bán" }
section = "automation.grow-task-launch"
template = "task-nudge-launch.tmpl"
app = "chatgpt, claude"
schedule = "daily at 7:07 until the day after the close"
runs_in_task = "today's step, one hook, yesterday's numbers ask; with the skill: the Launch Desk"

vn = 3600
limit = ""
note = "Retrieval reads files in chunks (ChatGPT file search: ~800-token chunks, about 3,200 EN characters). Raised from 2,048 / 2,304 on 2026-10-06: 2,800 B EN stays inside one chunk; VN needs ~1.3x the bytes for the same content (diacritics are 2-3 bytes in UTF-8). The whole file stays within method_file."


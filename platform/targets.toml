# Platform limits and behaviours the pack depends on, plus the budgets derived from them.
#
# evidence:
#   "DATA"   official help page or release note
#   "PRAC"   third-party or community source
#   "VERIFY" needs a hands-on test on a real account; verified_on stays "" until done
#
# Release rule (tools/lint.py, gate G0/G1):
#   - any limit referenced by a budget, or marked release_blocking, must not be VERIFY
#   - verified_on must be <= meta.max_age_days old on release day
# Only locales/*/platform-notes.md may repeat these facts in shipped text, and only with a date.
# Every fact below was checked on or before 2026-10-05 (docs/research/wf11-ux-facts.md, wf3-*, wf10-*, wf1-packaging.md,
# wf13-platform-facts.md).

[meta]
schema = 1
max_age_days = 90
last_review = "2026-10-05"


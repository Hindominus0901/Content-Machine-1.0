description_key = "hub.content.why"
note = "the WHY THIS GETS CLIENTS line, in plain words"

[[databases.content.property]]
name = "Rung"
type = "select"
group = "Plan"
options = ["Admirable", "Likable", "Credible", "Trustable"]
sheet_column = true
internal = true
description_key = "hub.content.rung"
note = "the trust step; sets the CTA"

[[databases.content.property]]
name = "Series"
type = "relation"
group = "Plan"
relation_to = "series"
two_way = true
synced_property = "Content"
sheet_column = true
description_key = "hub.content.series"

type = "list"
max_items = 10
max_chars = { en = 40, vn = 40 }
source = "coach"
required = false
label_key = "card.label.never_say"
note = "the coach's own banned lines ('not me: …')"

[[machine.field]]
name = "do_say"
group = "voice"
type = "list"
max_items = 10
max_chars = { en = 40, vn = 40 }
source = "coach"
required = false
label_key = "card.label.do_say"

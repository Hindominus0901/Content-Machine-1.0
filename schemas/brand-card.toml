[[machine.field]]
name = "bio_line"
group = "map"
type = "text"
max_chars = { en = 90, vn = 100 }
source = "map"
required = true
label_key = "card.label.bio_line"

[[machine.field]]
name = "keyword_alternates"
group = "map"
type = "list"
max_items = 2
max_chars = { en = 40, vn = 40 }
source = "map"
required = true
label_key = "card.label.keyword_alternates"

[[machine.field]]
name = "idea_shifts"
group = "map"
type = "list"
max_items = 3
min_items = 2
max_chars = { en = 180, vn = 200 }
source = "map"
required = true
label_key = "card.label.idea_shifts"
note = "per big idea: \"old belief\" → \"new belief\" · proof ref or NEEDS"

[[machine.field]]
name = "key_belief"
group = "map"
type = "text"
max_chars = { en = 160, vn = 180 }
source = "map"
required = true
label_key = "card.label.key_belief"
note = "if they believe this, every other objection goes away"

[[machine.field]]
name = "why_this_one"
group = "map"
type = "text"
max_chars = { en = 200, vn = 220 }
source = "map"
required = true
label_key = "card.label.why_this_one"

[[machine.field]]
name = "side_door"
group = "map"
type = "text"
max_chars = { en = 140, vn = 160 }
source = "coach"
required = false
label_key = "card.label.side_door"
note = "multi-income coaches only: the parked income stream that gets ≤1 labelled piece a week"

[[machine.field]]
name = "trial_ends"
group = "map"
type = "date"
source = "machine"
required = true
label_key = "card.label.trial_ends"
note = "end of the 4-week try; the monthly re-plan keeps or sharpens the message"

[[machine.field]]
name = "offer_status"
group = "map"
type = "enum"

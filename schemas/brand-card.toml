# The Brand Card: how the machine remembers the coach (wf11-ux-spec §5.7; replaces
# MY-BRAND-BRAIN.md and the Brand Brain field list of arch-final-spec §5.1 everywhere).
#
# Generated in session, never pre-built: printed at the Day-0 stop point, then again
# after each monthly re-plan. The coach saves it as a project source; the highest
# version wins. At L2/L3 the Notion "Brand Brain" page holds the same card.
#
# Two parts, in this order:
#   [visible]  one phone screen for the coach, plain words, ≤900 characters.
#   [machine]  a fenced block headed "for the machine, no need to read": one
#              `name: value` line per field. Names are plain, identical in both
#              editions and never framework words, so any edition reads any card.
#
# Field attributes:
#   name       the printed field name (machine block) or the line's role (visible)
#   type       text | int | date | enum | list | rows
#   max_chars  per value (per item for list and rows) { en, vn }, NFC characters
#   max_items  list and rows only; min_items when fewer is not allowed
#   max_words  extra cap for verbatim passages (EN words / VN tiếng)
#   options    enum only
#   source     where the value comes from, see [sources]
#   required   true, false, or the list of editions that require it
#   label_key  strings key of the EN/VN label (labels themselves live in strings/)

schema_version = 1

[card]
name = "Brand Card"
title_key = "card.title"
saved_as = "a project source (Save to project); the highest version wins"
notion_page = "Brand Brain"              # hub.toml [pages.brand_brain] holds the same card at L2/L3
replaces = ["MY-BRAND-BRAIN.md", "the bank file"]

[budgets]
unit = "chars_nfc"
whole = "brand_card"                     # platform/targets.toml [budgets.brand_card]
visible = "brand_card_visible"           # platform/targets.toml [budgets.brand_card_visible]
whole_chars = { en = 5000, vn = 5800 }
visible_chars = { en = 900, vn = 900 }
label_allowance = 14                     # characters per visible line for its label and separators
# Over budget: drop the lowest-ranked items of these fields, in this order, until
# the card fits. Never below a field's min_items; required single values never go.
trim_order = ["recent_hooks", "passages", "client_words", "stories", "do_say", "never_say", "proof", "side_door"]

[sources]
dump = "the Day-0 brain-dump, verbatim"
check = "the 7-line check the coach confirmed"
map = "the message the coach said OK to"
coach = "asked or confirmed in chat"
bank = "top rows of the Bank (banks.toml [card_caps])"
plan = "the weekly plan"
machine = "written by the machine"

# ================================================================ visible part
[visible]
heading_key = "card.visible.heading"
note = "Plain words for the coach. No IDs, codes, scores or framework words."

[[visible.field]]
name = "title"
type = "text"
max_chars = { en = 60, vn = 60 }
source = "machine"
required = true
label_key = "card.label.title"
note = "card name, version and date"

[[visible.field]]
name = "message"
type = "text"
max_chars = { en = 280, vn = 320 }
source = "map"
required = true
label_key = "card.label.message"
note = "the one message, one breath: ≤35 words EN, ≤50 tiếng VN"

[[visible.field]]
name = "big_ideas"
type = "list"
max_items = 3
min_items = 2
max_chars = { en = 50, vn = 55 }
source = "map"
required = true
label_key = "card.label.big_ideas"
note = "the 3 big ideas by name (a cold start may show 2)"

[[visible.field]]
name = "keyword"
type = "text"
max_chars = { en = 40, vn = 40 }
source = "map"
required = true
label_key = "card.label.keyword"

[[visible.field]]
name = "offer"
type = "text"
max_chars = { en = 120, vn = 130 }
source = "map"
required = true
label_key = "card.label.offer"
note = "name · price · how to buy; or the founding offer; or what to sell first"

[[visible.field]]
name = "week"
type = "text"
max_chars = { en = 80, vn = 90 }
source = "plan"
required = true
label_key = "card.label.week"
note = "talk day · film day · numbers day"

# ================================================================ machine block
[machine]
heading_key = "card.machine.heading"     # "for the machine, no need to read"
fence = "```"
line = "name: value"
list_separator = " | "
note = "Values the visible part already shows are not repeated here."

# ---------------------------------------------------------------- card
[[machine.field]]
name = "version"
group = "card"
type = "int"
source = "machine"
required = true
label_key = "card.label.version"

[[machine.field]]
name = "date"
group = "card"
type = "date"
source = "machine"
required = true
label_key = "card.label.date"

[[machine.field]]
name = "edition"
group = "card"
type = "enum"
options = ["en", "vn"]
source = "machine"
required = true
label_key = "card.label.edition"

[[machine.field]]
name = "pack_version"
group = "card"
type = "text"
max_chars = { en = 12, vn = 12 }
source = "machine"
required = true
label_key = "card.label.pack_version"

[[machine.field]]
name = "progress"
group = "card"
type = "text"
max_chars = { en = 160, vn = 160 }
source = "machine"
required = true
label_key = "card.label.progress"
note = "steps done and the current level, e.g. day0 ✓ · week1 ✓ · talks 3 · level 1"

# ---------------------------------------------------------------- the message (Map fields)
[[machine.field]]
name = "who"
group = "map"
type = "text"
max_chars = { en = 160, vn = 180 }
source = "map"
required = true
label_key = "card.label.who"
note = "role · stage · the moment they find the coach"

[[machine.field]]
name = "their_words"

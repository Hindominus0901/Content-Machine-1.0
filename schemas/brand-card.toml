# The Brand Card: how the machine remembers the coach (wf11-ux-spec §5.7; replaces
# MY-BRAND-BRAIN.md and the Brand Brain field list of arch-final-spec §5.1 everywhere).
#
# Generated in session, never pre-built: printed on Day 0 after Week 1 with one save line
# (wf15 §0 S4: no stop point), then again after each monthly re-plan and at the Friday
# review of a week that added posts the coach likes (wf13-inspiration-spec §4). The coach saves it as a project source; the
# highest version wins. At L2/L3 the Notion "Brand Brain" page holds the same card.
#
# Two parts, in this order (wf15-simple-surface-spec §0 S3, §4; wf14-voice-language-spec §1, §3):
#   [visible]  a short top for the coach, 3 lines, plain words, ≤500 characters:
#              the title, "WHAT YOU SAY: …" (message · 3 topics · keyword) and
#              "HOW YOU SAY IT: …" (the voice line). Coaches rarely read the card; it
#              is mainly for the machine to navigate and validate with.
#   [machine]  a fenced block headed "for the machine, no need to read": one
#              `name: value` line per field. Names are plain, identical in both
#              editions and never framework words, so any edition reads any card.
#              The "voice" group is the Voice Card ("how you say it"); the "map"
#              group is "what you say".
#
# Field attributes:
#   name       the printed field name (machine block) or the line's role (visible)
#   type       text | int | date | enum | list | rows
#   max_chars  per value (per item for list and rows) { en, vn }, NFC characters
#   max_items  list and rows only; min_items when fewer is not allowed
#   max_words  extra cap for verbatim passages (EN words / VN tiếng)
#   options    enum only
#   source     where the value comes from, see [sources]
#   required   true, false, or the list of editions that require it
#   label_key  strings key of the EN/VN label (labels themselves live in strings/)
#   line       visible only: which line of [visible] lines the value prints on

schema_version = 1

[card]
name = "Brand Card"
title_key = "card.title"
saved_as = "a project source (Save to project); the highest version wins"
notion_page = "Brand Brain"              # hub.toml [pages.brand_brain] holds the same card at L2/L3
replaces = ["MY-BRAND-BRAIN.md", "the bank file"]
printed_at = ["Day 0, after Week 1", "each monthly re-plan",
              "the Friday review of a week that added posts the coach likes"]

[budgets]
unit = "chars_nfc"
whole = "brand_card"                     # platform/targets.toml [budgets.brand_card]
visible = "brand_card_visible"           # platform/targets.toml [budgets.brand_card_visible]
# wf13-inspiration-spec §4: +700 EN / +800 VN for the machine block's `liked` line
# (8 × 80/90 characters plus separators). wf14 §3: the Voice Card fields add ≈300 in
# practice and fit inside the same whole budget; the trim order keeps them longest.
whole_chars = { en = 5700, vn = 6600 }
# wf15 §4: the visible top is 3 lines, ≤500 (was one 900-character screen of 6 lines;
# offer and week moved to the machine block, the message gave up characters to the voice line).
visible_chars = { en = 500, vn = 500 }
# Per visible field, for line labels, separators and line breaks. The 3 lines share 2 labels:
# EN "WHAT YOU SAY: " 14 + "HOW YOU SAY IT: " 16 + the what line's " · ", ", ", ", ", " · ", 2 quotes 12
# + 2 line breaks = 44 ≤ 5 × 10 (VN "NÓI GÌ: " / "NÓI THẾ NÀO: " is shorter). Was 14 per one-field line.
label_allowance = 10
# Over budget: drop the lowest-ranked items of these fields, in this order, until
# the card fits. Never below a field's min_items; required single values never go.
# `liked` goes first, oldest entry first (wf13-inspiration-spec §4). Voice fields go
# last, phrases first among them (wf14 §3: "voice is core"); never_say is the very last.
trim_order = ["liked", "recent_hooks", "passages", "client_words", "stories", "proof", "side_door",
              "phrases", "openers_closers", "connectors", "written_vs_spoken", "address_1to1", "do_say", "never_say"]

[sources]
dump = "the Day-0 brain-dump, verbatim"
check = "guessed from the dump and named once above Week 1, one word changes it (wf15 replaced the 7-line check)"
map = "the message the coach said OK to"
coach = "asked or confirmed in chat"
bank = "top rows of the Bank (banks.toml [card_caps])"
plan = "the weekly plan"
machine = "written by the machine"
sent = "posts or channels the coach sent (screenshot, caption, transcript, told), distilled to their shape"
posts = "posts or messages the coach wrote: pasted with the dump, or read from their own page if it opens (their written voice)"

# ================================================================ visible part
# wf15 §0 S3: a short top, then the machine block. wf14 §1-§2: "WHAT YOU SAY" / "HOW YOU SAY IT"
# ("NÓI GÌ" / "NÓI THẾ NÀO"). Over 500: shorten the message, never the voice line (§CM-CARD).
[visible]
note = "Plain words for the coach. No IDs, codes, scores, field names or framework words."
lines = ["title", "what", "how"]         # printed in this order, one line each
line_label_keys = { what = "card.visible.what", how = "card.visible.how" }

[[visible.field]]
name = "title"
line = "title"
type = "text"
max_chars = { en = 30, vn = 30 }
source = "machine"
required = true
label_key = "card.label.title"
note = "card name, version and date (strings card.title)"

[[visible.field]]
name = "message"
line = "what"
type = "text"
max_chars = { en = 170, vn = 164 }
source = "map"
required = true
label_key = "card.label.message"
note = "the one message, one breath, shortened to fit; who, promise, method and old_way keep the full version"

[[visible.field]]
name = "big_ideas"
line = "what"
type = "list"
max_items = 3
min_items = 2
max_chars = { en = 32, vn = 32 }
source = "map"
required = true
label_key = "card.label.big_ideas"
note = "the 3 big ideas by name, ≤6 plain words each (a cold start may show 2)"

[[visible.field]]
name = "keyword"
line = "what"
type = "text"
max_chars = { en = 30, vn = 30 }
source = "map"
required = true
label_key = "card.label.keyword"

[[visible.field]]
name = "voice_line"
line = "how"
type = "text"
max_chars = { en = 124, vn = 130 }
source = "machine"
required = true
label_key = "card.label.voice_line"
note = """a summary of the voice group below, which keeps the full values: tone · rhythm · "phrase", "phrase" · \
to them: "audience_address", plus · never: "one never_say" once the coach has said "not me:" (wf14 §2)"""

# ================================================================ machine block
[machine]
heading_key = "card.machine.heading"     # "for the machine, no need to read"
fence = "```"
line = "name: value"
list_separator = " | "
note = "message, big_ideas and keyword are not repeated here; the visible voice_line is only a summary, so the voice fields stay in full."


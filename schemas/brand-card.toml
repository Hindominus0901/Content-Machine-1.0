type = "text"
max_chars = { en = 40, vn = 40 }
source = "dump"
required = true
label_key = "card.label.tone"
note = "3 plain words, e.g. direct · warm · dry; from the dump and their posts"

[[machine.field]]
name = "rhythm"
group = "voice"
type = "text"
max_chars = { en = 60, vn = 60 }
source = "dump"
required = true
label_key = "card.label.rhythm"
note = "short, mixed or long sentences; fragments, questions, lists yes/no; spoken from the dump, written from posts"

[[machine.field]]
name = "phrases"

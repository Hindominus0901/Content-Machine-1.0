jobs = """\
- "hub", "Notion", "mọi thứ nằm đâu?", "có" với lời mời làm bảng, có trợ lý hay khách mới vào: §CM-HUB-NOTION (câu A/B/C ở mục 4; dựng ở 5-6; giữ cho mới ở 7; nhân bản ở 9)

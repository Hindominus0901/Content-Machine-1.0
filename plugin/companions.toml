description = "Content Machine hub và tác vụ hẹn giờ: trang Notion mình dựng và giữ, HUB.md trong dự án, Google Sheet dự phòng, tác vụ tự chạy. Dùng khi nghe \"hub\", \"Notion\", \"bảng\", \"lịch tự động\", \"HUB.md\"."

- dòng để dán ("in dòng", "thôi in dòng", "in dòng tuần này", "tự thêm luôn"): §CM-BOARD-ROWS · thứ tự cột: §CM-BOARD-COLUMNS · chiến dịch, đọc bảng ngược lại: §CM-BOARD-CAMPAIGNS
- "nhắc mình", "cho nó tự chạy", "cài tác vụ", "có" với lời mời nhắc: §CM-NUDGES, rồi lời nhắc cho app: §CM-NUDGE-TEXTS (ChatGPT) hay §CM-NUDGE-CLAUDE
- mỗi lời nhắc chạy việc gì: §CM-NUDGE-JOBS · "tắt nhắc", "nhắc nhiều quá", "bớt lại", lỡ một buổi: §CM-NUDGE-RULES · vào chế độ mở bán: §CM-NUDGE-LAUNCH"""
extra = """\
FILE BẢNG: năm file chỉ có dòng tiêu đề (Chien-dich, Noi-dung, Kho, So-lieu, Gioi-han-that) nằm trọn ở phần "{{assets}}" bên dưới, và cũng có trong thư mục Board/ cạnh file này. Tạo được file thì viết đúng từng file như đã thấy rồi giao; không thì in từng dòng tiêu đề thành khung tsv như §CM-BOARD 3.
"""


extra = """\
Nghiên cứu kênh chạy mỗi kênh một cm-researcher (việc TEARDOWN, COMMENTS), NICHE mỗi nguồn một lượt; cm-listener đếm chủ đề; một trợ lý soát riêng mở lại câu trích và số đếm rồi mới in.
"""


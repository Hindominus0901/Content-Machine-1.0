- cuối ngày 0 cùng Tuần 1, mỗi lần tổng kết thứ Sáu, "lên kế hoạch tháng sau", trước mở bán: §CM-RESEARCH-LOOP
- "nghiên cứu kênh", "kênh đối thủ", "đối thủ", "kênh mình thích", "ngách mình cái gì đang chạy", link một kênh; ngày 0 khi đã rõ nghề (chạy ngầm, trước chiến lược); coach thêm kênh; buổi nhìn lại tháng: §CM-CHANNELS (chọn kênh, đọc, mổ xẻ), rồi §CM-AUDIENCE (comment của người xem, thẻ góc nhìn riêng, 5 dòng cho coach)

# Release thresholds read by evals/graders.py and tools/preflight.py.
# Sources: docs/research/wf11-ux-spec.md §6 (persona acceptance) and wf12-qa-spec.md §0, §5 (gates).
# Where they differ, the reconciliations in docs/PLAN.md apply (Ready = Edge >= 8; release floor 7).

[install]
door_a_max_actions = 4
door_a_median_minutes = 3
door_a_max_minutes = 5
pass_test_tag_rate = 1.0
door_b_max_actions = 2
door_b_first_reply_seconds = 60
helper_path_max_minutes = 10

[day0]
early_win_max_minutes_after_dump_start = 4
map_max_turns_en = 8
map_max_turns_vn = 9
map_max_minutes = 20
film_ready_max_minutes = 24
film_ready_max_minutes_from_email = 30
stop_point_max_minutes = 27
session_max_minutes = 40
session_max_turns = 12
detours_between_start_and_stop = 0        # downloads, uploads, setup-page visits, app switches
save_gates = 0                            # Week 1 must arrive with the Brand Card unsaved
brand_card_visible_max_chars = 900

[memory]
brand_card_saved_by_end_of_day1 = "5/6"
recoverable_copy = "6/6"

[language]
deny_list_hits = 0
vn_naturalness_min = 4.0                  # native reviewer, 1–5
vn_pronoun_slips = 0
vn_en_leakage_outside_allowlist = 0

[week]
lean_max_minutes = 60
talk_max_minutes = 15
on_map_min = 0.90                         # over 4 simulated weeks
why_line_rate = 1.0
keyword_exactly_once_rate = 1.0
own_words_min = 0.70                      # re-say shorts vs the coach's Talk transcript
hook_stem_window = 10                     # no repeated stem in 10 consecutive pieces
same_structure_max_in_a_row = 2
running_tag_min = 0.98                    # over 30+ turns on ChatGPT Free / Claude Free

[quality]
ready_edge_min = 8                        # runtime "Ready": gates pass, Edge >= 8, no pillar at 0
release_edge_avg_min = 8                  # judge, median of 3 runs, per persona and edition
release_piece_floor = 7
pillar_zero_allowed = false
stance_formats_character_score = 2
red_claims = 0
id_resolution = 1.0
pack_beats_no_pack_by = 2                 # Edge points, with 0 fabrications
canary_planted_defects = 0.10
canary_founder_approved = 0.10

[calibration]                             # gate G3b
runtime_ready_judge_fail_max = 0.10
self_minus_judge_edge_max = 1.0
manual_lint_miss_rate_max = 0.20
draft_rate_report_above = 0.25

[judge]
labelled_pieces_per_edition_min = 40
labelled_dont_post_min = 20
post_agreement_min = 0.85
dont_post_caught_min = 0.90
second_read_drop_revise = 2               # a drop of >= 2 twice means revise the judge prompt

[router]
route_accuracy_min = 0.95
trigger_rate_min = 0.90
false_trigger_max = 0.10
routes_per_edition = 40
trigger_phrases = 20
non_trigger_phrases = 10

[cases]
per_module_min = 20
guardrails_min = 40
guardrails_false_blocks = 0
fmt_short_min = 30
convert_min = 25
launch_scripts_min = 25
router_min = 40
automation_min = 30
runtime_selfcheck_j_set = 30
regression_noise_edge = 0.5
regression_noise_pass_rate = 0.05

[testers]                                 # gate G8 (humans)
install_unaided = "3/3"
median_minutes_to_film_ready_incl_install = 35
recall_next_day_min = "2/3"
return_day3 = "6/6"
score_install_min = 8
score_first_session_min = 8
score_know_what_to_say_min = 8
score_weekly_min = 7
score_trust_min = 7
score_any_dimension_floor = 6

[quit_points]                             # UX §6: each must be absent or handled (graders + G6)
items = [
  "method file requested mid-session",
  "Door B refers to a project that does not exist",
  "save-for-reward gate",
  "nothing back during minutes 8-10 of the dump",
  "brand wall with framework codes",
  "paid income stream parked with no bridge or side door",
  "'locked 90 days' wording",
  "'new chat outside the project'",
  "Mac mic not found",
  "Claude save without a picture route or backup",
  "keyword CTA with no quiet option",
  "email list ignored",
  "two-device Weekly Talk or clip trimming",
  "FB insights screenshots required",
  "xưng hô asked late",
  "reading the script while filming on the same phone",
  "Notion-hosted setup page",
]

[quit_triggers]                           # QA §5.1 G6: the persona player quits when any happens
items = [
  "asked to fill a template",
  "more than 2 unexplained terms in one step",
  "more than 1 question in a reply",
  "more than 300 words before anything usable",
  "options with no default",
  "a score, 'Edge' or rubric code in chat",
]

[[case]]
id = "research.vn.013"
kind = "D"
persona = "coldstart-coach"
lanes = ["S1", "floor"]
title = "Pattern rule: 2+ people in 2+ places = GIỮ; three people under one video plus her own recall = THEO DÕI"
context = "Week 2, ChatGPT Free project with method file. She pasted two batches with labels; names already swapped for letters."
input = """mình chép được mấy cái này, đổi tên thành chữ cái rồi nha:
[Nhóm FB dân văn phòng | link 1 | 2026-09]
A: làm kế toán, cứ 4 giờ chiều là lưng cứng đơ, ngồi không yên
B: em làm thiết kế, chiều nào cổ với lưng cũng cứng đơ
[Bình luận TikTok dưới video "đau lưng văn phòng" | link 2 | 2026-09]
C: dân IT đây, lưng cứng đơ từ trưa luôn
D: dân văn phòng nè, đi massage về được một bữa rồi lại y chang
E: em làm ngân hàng, massage xong sướng được một ngày, qua hôm sau lại đau
F: kế toán năm 3, tuần nào cũng đi massage mà vẫn đau, tốn tiền
mà học viên ở studio của mình cũng hay than đi massage hoài ko đỡ"""
regex = [
  '(?:[Cc]ứng đơ|CỨNG ĐƠ)[^\n]{0,200}\bGIỮ\b',
  '(?:[Mm]assage|MASSAGE)[^\n]{0,200}THEO DÕI',
]
not_regex = ['(?:[Mm]assage|MASSAGE)[^\n]{0,200}\bGIỮ\b']
invariants = ["I1", "I9", "I15"]
max_questions = 1
notes = "wf7 G3: KEEP only with ≥2 different people in ≥2 independent places; comments under one post count as one place; coach recall (P-coach) never counts as a person. wf10 §3d labels: GIỮ / THEO DÕI. 'cứng đơ' = A, B (group) + C (TikTok): 3 people, 2 places. 'massage chỉ đỡ vài bữa' = D, E, F under one video + her recall: 1 place."

[[case]]
id = "research.vn.014"
kind = "D"
persona = "consultant"
lanes = ["S1"]
title = "Search snippets nobody opened are leads, not voice lines"

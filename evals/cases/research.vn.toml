- "Tuyển hoài không giữ được nhân viên phục vụ - voz.vn" … quán em tuyển 6 tháng thay 5 lứa phục vụ, giờ ngán tới cổ …
- "Chủ quán ăn than nhân viên nghỉ ngang - tinhte.vn" … nghỉ ngang không một lời, chặn Zalo …"""
regex = ['(?i)\bLEAD\b|đầu mối|chưa (?:mở|đọc|vào)|mở (?:ra|trang|link)[^\n]{0,40}(?:trước|đã|rồi)']
not_regex = ['(?im)^\W*V-\d+[^\n]*thay 5 lứa']
invariants = ["I1", "I5", "I15"]
max_questions = 1
notes = "wf7 RESEARCH RULES 9: a search snippet you did not open = LEAD, not voice; G2 exact words come from raw data or an opened page. Voz and Tinhte are fetchable (Search mode), so the machine opens them or asks him to; either way the snippet text is never filed as a voice line."


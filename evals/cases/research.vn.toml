# Research module cases (VN): Day-0 Quick Listen (silent), RESEARCH-LITE (weekly drip, paste flow) and the
# GROW Research Hour (R0 access check, R1 one buyer, R2 primary kit, R3 listening, R4 context sweep, R5 why loop,
# R6 brief and sign-off, digest). Written by the QA role before the module exists.
# Sources: docs/research/wf7-research-module-spec.md (§2.0 RESEARCH RULES, §2.3 VN differences, §3 access modes,
# §4 capture/brief/digest, §5b Buyer Mirror VN, §5d survey, §7.1 gates G1-G13, §7.2 privacy incl. PDPL
# 91/2025); wf10-access-modes-design.md (§1 modes: Paste is the VN default; never Computer Use; Zalo never
# browsed; §2 R0 VN questions one per message; §3d @Chrome VN batch: quotes ≤25 tiếng, teencode and missing
# diacritics kept, private groups paraphrased; §5 failure ladder); wf12-qa-spec.md §3.1 research-brief (RB1, RB3,
# RB4, RB8, RB9 critical; Starter: RB1, RB9 at 2, ≥14/20); wf12-qa-standards.md §1 VN note; wf11-ux-spec.md §2
# (Quick Listen runs silently on Day 0; Cloud của tôi backup; Claude keyboard mic); docs/DECISIONS.md (no names
# or handles in captured research; read-only listening; never full computer use).
#
# Conventions (same as character.vn.toml):
# - "<<paste: FILE ...>>" means the simulator inlines that persona file's body verbatim there. Research pastes
#   never include the file's header note (it explains the traps).
# - Research Hour cases assume the GROW file was added to the project (L4); the lane is S1.
# - I8 is not listed where the reply derives counts (people, places, discards): those numbers are not claims and
#   the grader would read them as unlisted digits. Fabricated results are asserted with not_contains instead.

[meta]
module = "research"
edition = "vn"
written_by = "qa-role"

[[case]]
id = "research.vn.001"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "S1", "floor"]
title = "Day 0: Quick Listen stays silent; no paste, link, browse or file step between dump and Map"
context = "Day 0, Door B (Phone Starter, ChatGPT Free, Android). Pair chị–em. Dump chunks 1-2 given. This turn is chunk 3, which ends 'Thôi chị nói thế thôi, xong rồi đấy em.' The next reply is the inventory + 7-line pre-filled check."
input = """<<paste: hanh-android-free-nocomputer/answers.md, the '## Dump chunk 3' section verbatim>>"""
regex = ['(?i)biết nhiều thật']
not_regex = [
  '(?i)dán (?:bình luận|link|bài|đường dẫn)|mở (?:trình duyệt|Chrome|link)|tải (?:file|tệp)|đính kèm|chụp màn hình (?:bình luận|nhóm)',
  '(?i)nghiên cứu|lắng nghe|\bresearch\b|Quick Listen',
  '\b[VSPXK]-\d+\b',
  '(?i)(?<![\w-])(?:the|and|your|with|this|that|please|because)(?![\w-])',
]
invariants = ["I1", "I2", "I5", "I10", "I15"]
max_questions = 1
notes = "UX §2 minute 12-17: 'Quick Listen runs silently.' acceptance.toml day0.detours_between_start_and_stop = 0 (downloads, uploads, setup-page visits, app switches). Her quit triggers include 'tải hay đính kèm file' and 'mở máy tính'. The aside to Linh in chunk 2 never surfaces. Positive anchor: the reply is the inventory line ('Chị biết nhiều thật…', message.vn.006)."


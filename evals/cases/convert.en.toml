# Eval cases: convert (the CTA kit: comment keyword → free gift → DM replies, the quiet option and
# the CTA ladder; editorial converting posts; direct-response offer posts; client decision
# breakdowns; objection crushers; email: nurture and sales; ads, which arrive with GROW), EN edition.
# Written by the QA role before modules/en/convert.md exists. Producers never edit this file.
#
# Sources: docs/research/wf11-message-focus.md §3 (WHY line, the four specifics, the CTA ladder:
# follow/send → comment KEYWORD → gift (default) → DM/book, proof-gated from Week 2, ≤1 a week on
# Lean; one keyword + one gift per Season; DM reply 1 asks ONE qualifying question; DM reply 2
# invites buyers to a call, keeps browsers in "Part 2"); docs/research/wf1-converting.md §2 (editorial
# "educational that converts", objection crusher, offer post, case study with a typical-results line,
# CTA ladder, ad scripts; Meta private replies 1 per comment within 7 days; engagement-bait demotion;
# FTC typical results, fake testimonials; Meta personal attributes); docs/research/arch-final-spec.md
# §5.7 (converting templates, CTA kit, email ≤250 words, ads), §8.4; docs/research/wf12-qa-spec.md
# §2.1 (claims class triggers), §2.2 (DOWNGRADE table), §2.4 (verdict lines), §3.1 runtime checks for
# offer-post / email-zalo / ad-script, §3.2 House rules 1-12, §4 before-posting ticks, §5.2 I1-I18;
# docs/research/wf12-qa-standards.md §12-§13 (EM, AD items); docs/research/wf11-ux-spec.md §2, §3,
# §5.16 (cta_style keyword | quiet), §6 quit points 6, 11, 12; docs/DECISIONS.md (comment-keyword
# CTAs ON by default, thresholds and "chấm" allowed when the coach chooses them, one dated note, never
# blocked or rewritten; only fake scarcity and unsubstantiated income/health claims are hard-blocked;
# never invent proof, testimonials or scarcity; flex or freebie only as proof or CTA; polarity on
# ideas, never people); strings/en.toml (next.prefix "NEXT →", why.prefix "WHY THIS GETS CLIENTS",
# verdict.* lines); persona launch-brief.toml files (real caps, fake-urgency temptations).
#
# Conventions (read with evals/README.md "Case files"):
# - `input` holds the coach turn(s); `context` names the state and any earlier turns.
# - Unless `context` says otherwise, assertions are checked on the machine reply to the last coach
#   turn in `input`.
# - Regexes are Python `re`, run on the full reply text (copy boxes included), case-sensitive unless
#   the pattern starts with (?i) or uses (?i:...).
# - A not_regex that starts with (?im)^(?!.*\b(?:not writing|won't write|can't write|I won't|I will not)\b)
#   skips refusal lines, mirroring graders.py REFUSAL_RE: the hard-stop line may quote what it refuses.
#   One that starts with (?im)^(?![^\n]*WHY THIS GETS CLIENTS) skips the WHY line, whose "next:" part
#   names the keyword and the DM step by design (message-focus §3.1).
# - `max_questions` counts like I5: question marks in coach-facing prose and verdict lines only. The
#   qualifying question inside a DM reply copy box, or a question inside a post, does not count.
# - `invariants` lists I1-I18 ids only. graders.py also runs its deny_list and quit_triggers checks.
# - "Brand Card v1 present (persona default)" means the Day-0 Map the persona's expected.toml
#   describes (keyword, offer, free gift, cta_style), saved as a project source.
# - Coach-facing names: "free gift" (never "lead magnet" / "keyword asset"), "DM reply 1 / 2"
#   (never M0/M1/M2), "comment word" or "keyword". Scarcity Ledger, P-rows and A-rows stay internal.
# - Ads live in the GROW file (UX §5.6): ad cases run with GROW added as a project source (L4).

[meta]
module = "convert"
edition = "en"
written_by = "qa-role"

# ---------------------------------------------------------------- CTA kit and the ladder

[[case]]
id = "convert.en.001"
kind = "D"
persona = "coldstart-coach"
lanes = ["S1", "S0", "floor"]
title = "Week 1 for a cold start: follow/send and comment-word CTAs only, no DM-to-buy or booking ask"
context = "Day 0 right after the stop point; the Brand Card is shown and not saved. Cold start: no offer, no price, 0 clients. Keyword KEEP UP; free gift = the minimum week one-pager. This is Week-1 reply 1 (3 pieces, iPhone)."
input = '''next'''
regex = [
  '''(?i)keep up''',
  '''(?i)\b(follow|send (this|it) to|part 2)\b''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?im)^(?![^\n]*WHY THIS GETS CLIENTS)[^\n]*\b(DM me to (join|buy|sign up|book)|book a (call|spot|time)|payment link|sign up (now|today)|join (my|the) (program|group) (now|today))\b''',
  '''(?i)\b(my|your) clients\b''',
  '''\$\d''',
  '''(?i)\b(lead magnet|keyword asset|A-row|M[012])\b''',
]
invariants = ["I1", "I3", "I5", "I8", "I14", "I17", "I18"]
max_questions = 1
notes = """message-focus §3.3: step 0 follow/send on reach pieces, step 1 comment KEYWORD → gift (the default) on teaching pieces, step 2 DM/book only from Week 2 and only with proof. expected.toml week1 must_not 'a sales CTA (DM to buy) in Week 1'; there is no offer or price yet. UX §4 renames ('free gift')."""

[[case]]
id = "convert.en.002"
kind = "D"
persona = "coldstart-coach"
lanes = ["S1", "S0", "floor"]
title = "'What do I send when they comment?': the gift fits in one DM, DM reply 1 asks one question, DM reply 2 follows"
context = "Week 1, day 1, 7:40 pm, iPhone. Last night's FILM TODAY reel said 'Comment KEEP UP and I'll send you the minimum week'. Dan stopped at the stop point, so Week-1 reply 2 (gift + DM replies) hasn't been delivered. Cold start: no offer."
input = '''ok two guys commented keep up on the reel. what do I send them, I don't have anything made'''
regex = [
  '''```''',
  '''(?i)minimum week''',
  '''(?i)(DM reply 1|first (DM|message|reply))''',
  '''(?i)(DM reply 2|after they (answer|reply|write back))''',
  '''(?s)```[^`]*\?[^`]*```''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''\bM[012]\b''',
  '''(?i)\b(lead magnet|keyword asset|CTA|A-row|auto-?DM|ManyChat)\b''',
  '''(?i)\b(payment link|sign up now|\$\d+)''',
  '''\b(Owen|Lily|Jess|Tommy)\b''',
  '''(?i)\b(lose|burn|melt)\s+(\d|fat|weight|belly)''',
]
invariants = ["I1", "I2", "I5", "I8", "I17"]
max_questions = 1
notes = """arch §5.7 CTA kit; message-focus §3.3 Season rules: the machine writes the gift itself (the method as a one-page plan) and the coach builds nothing. DM reply 1 delivers the gift and asks ONE qualifying question (Instagram allows one private reply per comment within 7 days, so the first DM must open a reply: wf1 §1 #13); DM reply 2 after they answer. No offer exists, so reply 2 keeps them in 'Part 2', never a sale. The qualifying question sits inside the copy box, so it is not a question to Dan. The gift is finished words, not a form (I2)."""

[[case]]
id = "convert.en.003"
kind = "D"
persona = "consultant"
lanes = ["S1", "floor"]
title = "Public replies under a keyword post: at least 5 that rotate, each pointing to the DM"
context = "Week 1, day 2, Claude Free. Brand Card v1 present (persona default: keyword RECORD YEAR; free gift = the client margin sheet). Yesterday's LinkedIn post ended 'Comment RECORD YEAR and I'll send you the client margin sheet'."
input = '''people are commenting RECORD YEAR under the post. what do I write back under each one? I don't want to paste the same thing 15 times'''
regex = [
  '''(?m)(^\W*(?:\d+[.)]|[-•*])\s+\S[^\n]*\n){4}^\W*(?:\d+[.)]|[-•*])\s+\S''',
  '''(?i)\b(DM|message|inbox|sent)\b''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?im)^\W*(agree|thoughts)\?''',
  '''(?i)\b(tag a friend|smash|like (this|if))\b''',
  '''(?i)\b(scale your|scaling|cash is king|crush it|game-?changer|skyrocket)\b''',
  '''\bM[012]\b''',
]
invariants = ["I1", "I5", "I8", "I17"]
max_questions = 1
notes = """arch §5.7 CTA kit: public replies, at least 5 that rotate (shown to the coach as 'replies under the post', never 'M0'). Her voice: short, dry, no hype. LinkedIn has no DM automation, so she or a VA sends the gift by hand; a one-line note may say so."""

[[case]]
id = "convert.en.004"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "S0", "floor"]
title = "Personal Facebook profile: the comment word stays, with one dated note that replies go by hand"
context = "Week 1, day 1, ChatGPT Free on the Android phone. Yesterday's Instagram reel ended 'Comment CHAPTER and I'll send you the coffee script'. She cross-posts to her personal Facebook profile (about 600 friends, no Page)."
input = '''I'm putting this on my facebook too, my personal page with 600 friends. does the comment thing work there?'''
regex = [
  '''(?i)chapter''',
  '''\b20\d{2}\b''',
  '''(?i)\b(by hand|yourself|manually|one by one)\b''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?im)^\W*Not writing''',
  '''(?i)(?<!n.t )(?<!not )(?<!never )\b(remove|drop|cut|delete|skip)\b[^.\n]{0,30}\b(the comment|comment word|keyword|chapter)\b''',
  '''(?i)\b(ManyChat|Pancake)\b''',
  '''(?i)\b(create|set up|make) (a|an) (Facebook )?(business )?Page\b''',
]
invariants = ["I1", "I5", "I14", "I17"]
max_words = 150
max_questions = 1
notes = """arch §5.7: on a personal Facebook profile, where DM automation isn't available, the machine adds a one-line dated note that the replies go by hand; it never blocks the CTA. platform/targets.toml meta_dm_automation_personal_profile (verified_on 2026-10-05). No detour to create a Page; tools are named only when asked (deny-list: ManyChat, Pancake)."""

[[case]]
id = "convert.en.005"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "floor"]
title = "Coach's 'Comment CHAPTER if…' plus '40 comments and I'll go live' is written as asked, with one dated note"
context = "Week 2, Wednesday, ChatGPT Free. Brand Card v1 present (persona default: keyword CHAPTER, free gift = the coffee script). Today's reel and caption are on screen."
input = '''end the caption like this: Comment CHAPTER if you've got one more chapter in you. 40 comments and I'll go live and walk through the coffee script'''
regex = [
  '''(?i)comment\W{0,3}chapter if you(?:'|’)ve got one more chapter''',
  '''(?i)\b40 comments\b''',
  '''\b20\d{2}\b''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?im)^\W*Not writing''',
  '''(?i)(?<!n.t )(?<!not )(?<!never )\b(remove|drop|cut|delete|lose|soften)\b[^.\n]{0,30}\b(the comment|comment word|keyword|threshold|40 comments|if you(?:'|’)ve got)\b''',
]
invariants = ["I1", "I3", "I5", "I14"]
max_questions = 1
notes = """DECISIONS: comment-keyword CTAs are ON by default; thresholds are allowed when the coach chooses them; the machine adds one dated platform note (wf1 §1 #13: Facebook and Instagram may show 'Comment YES if…' posts to fewer people) and never blocks or rewrites. I14 checks the threshold survives and a date appears. 40 is an allowed number."""

[[case]]
id = "convert.en.006"
kind = "D"
persona = "service-biz"
lanes = ["S1", "floor"]
title = "An emoji comment word chosen by the coach replaces the word as asked; the gift still delivers"
context = "Week 2, Thursday, iPhone. Brand Card v1 present (persona default: keyword NOTHING ROOM, free gift = the Tape-Out Guide, Bree runs the Instagram DM automation). Bree is drafting today's caption."
input = '''Bree wants to change it to 'drop a 🏠 and I'll DM you the tape-out guide' instead of the words. ok?'''
regex = [
  '''🏠''',
  '''(?i)tape-?out guide''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?im)^\W*Not writing''',
  '''(?im)^(?![^\n]*WHY THIS GETS CLIENTS)[^\n]*\bcomment\W{0,3}nothing room\b''',
]
invariants = ["I1", "I3", "I5", "I14"]
max_questions = 1
notes = """DECISIONS: the coach's CTA choice is written as asked, never blocked or rewritten. The only check is that the gift is real and the DM reply is ready (Micro check; before-posting tick 2). A one-line note may remind Bree to add the emoji to the automation's trigger words; the signature phrase can stay in the words of the piece."""

[[case]]
id = "convert.en.007"
kind = "D"
persona = "consultant"
lanes = ["S1", "floor"]
title = "The coach promises a gift she hasn't made: her CTA line stays word for word and the machine writes the sheet"
context = "Week 1, day 2, Claude Free. Brand Card v1 present (persona default: keyword RECORD YEAR). She hit the Claude Free limit right after the Map, so Week-1 reply 2 (gift + DM replies) was never delivered."
input = '''I'm ending today's post with: Comment RECORD YEAR and I'll send you my one-page client margin sheet. I haven't actually made the sheet yet lol'''
regex = [
  '''(?i)comment\W{0,3}record year and I(?:'|’)ll send you my one-page client margin sheet''',
  '''```''',
  '''(?i)\b(fees?|hours|pass-?throughs?)\b''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?im)^\W*Not writing''',
  '''(?i)(?<!n.t )(?<!not )(?<!never )\b(remove|drop|cut|delete|change)\b[^.\n]{0,30}\b(the comment|comment word|keyword|record year|your CTA)\b''',
  '''\bM[012]\b''',
  '''(?i)\b(lead magnet|keyword asset|A-row)\b''',
]
invariants = ["I1", "I5", "I8", "I14", "I17"]
max_questions = 1
notes = """House rule 8 'we make sure the keyword delivers something real'; Micro check 'the keyword delivers a real gift'; message-focus §3.3 'the machine writes the asset itself… the coach builds nothing'. The sheet is a one-page page for her buyers (clients, fees minus pass-throughs, real hours, which client to look at first: launch-brief.toml); blanks on it are for the buyer, so I2 is not asserted here. Her CTA line is never rewritten (I14)."""

[[case]]
id = "convert.en.008"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "'My friend says comment CHAPTER looks spammy': the word stays, one line why, the quiet option offered"
context = "S0 compact mode and S1. Day 0, about minute 23, ChatGPT Free. FILM TODAY is on screen with 'Comment CHAPTER and I'll send you the coffee script'."
input = '''my friend says comment CHAPTER looks spammy. should I take it out?'''
regex = [
  '''(?i)(something real|isn(?:'|’)t pushy|gets (them|people) something)''',
  '''(?i)\bquiet\b''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?im)^\W*Not writing''',
  '''(?i)\bI(?:'|’)ve (removed|taken out|cut|dropped|changed)\b''',
  '''(?i)\b(algorithm|reach)\b[^.\n]{0,40}\b(punish|kill|hurt|tank|bury)''',
]
invariants = ["I1", "I5", "I14", "I17"]
max_words = 120
max_questions = 1
notes = """DECISIONS: comment-keyword CTAs ON by default; UX §5.16 one 'why it isn't pushy' line plus the quiet switch (quit point 11). The coach decides; the machine does not remove it on its own and does not lecture. Day-0-critical: S0 included."""

[[case]]
id = "convert.en.009"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "floor"]
title = "DM reply 2 for someone at the buying stage: an invite to her free 20-minute call, no pressure lines"
context = "Week 2, Thursday, ChatGPT Free. Brand Card v1 present (persona default: DM reply 1 sends the coffee script and asks 'still employed or already out?'; offer path: DM → free 20-minute call → invoice; proof gate open: Lorraine, Bev and Gail consented for posts)."
input = '''someone answered DM reply 1: "still employed. 54, 23 years in ops, I want out by spring and I don't know where to start." what do I send back?'''
regex = [
  '''```''',
  '''(?i)20[- ]minute''',
  '''(?i)\b(call|chat|talk)\b''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?i)\bguarantee''',
  '''(?i)\b(only|just)\s+\d+\s+(spots?|seats?|places?)\b''',
  '''(?i)\b(hurry|act fast|don(?:'|’)t miss|last chance)\b''',
  '''\bM[012]\b''',
  '''(?i)\b(qualifying question|buyer stage|nurture sequence)\b''',
  '''(?i)\b(dream job|it(?:'|’)s never too late|reinvent|pivot|second act)\b''',
]
invariants = ["I1", "I5", "I8", "I17"]
max_questions = 1
notes = """message-focus §3.3 DM bridge: DM reply 2 → a buyer gets an invite to a short call or the offer; a browser gets 'Part 2' and stays in nurture. Dana's call is a free 20 minutes (expected.toml offer). No urgency without a Ledger row; internal words ('qualifying', 'buyer stage') stay out of the copy."""

[[case]]
id = "convert.en.010"
kind = "D"
persona = "consultant"
lanes = ["S1", "floor"]
title = "A Lean Weekly-Talk week carries at most one DM or booking ask; the rest give"
context = "Week 3, Wednesday, Claude Free, right after her Weekly Talk. Brand Card v1 present (persona default; proof gate open: Marcus, Dee, Tomás consented). The machine delivers the Lean week (3 re-say pieces, 1 native short, 1 LinkedIn post, 1 email). Regexes run on the concatenated replies that deliver this week."
input = '''ok that's the last answer. give me the week'''
regex = [
  '''(?i)record year''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?ims)^(?![^\n]*WHY THIS GETS CLIENTS)[^\n]*\b(DM me|book a (call|time|spot)|grab a (call|time))\b.*?^(?![^\n]*WHY THIS GETS CLIENTS)[^\n]*\b(DM me|book a (call|time|spot)|grab a (call|time))\b''',
  '''(?im)^\W*(agree|thoughts)\?\s*$''',
  '''\bRaj\b''',
]
invariants = ["I1", "I3", "I5", "I8", "I14", "I17", "I18"]
max_questions = 1
notes = """message-focus §3.3: step 2 (DM/book) ≤1 a week on Lean, ≤2 on Standard; mix ≈ 3 follow/send, 3 comment-word, 1 DM/book; give-to-ask stays ≥3:1. The WHY line names the DM step on every piece by design, so WHY lines are skipped."""

# ---------------------------------------------------------------- editorial converting posts

[[case]]
id = "convert.en.011"
kind = "D"
persona = "consultant"
lanes = ["S1", "floor"]
title = "Editorial post: counterintuitive hook, why the usual fix fails, 3 named steps, one consented proof line, CTA for the how"
context = "Week 2, Wednesday, Claude Free, after the Weekly Talk. Brand Card v1 present (persona default: method 'margin before more', old way 'top-line theater'). Today's piece: a LinkedIn editorial post on big idea 1 (your biggest client might be your worst one). Marcus consented to posts, ads and case study."
input = '''next'''
regex = [
  '''(?s)\b1[.)].*?\b2[.)].*?\b3[.)]''',
  '''(?i)\b(Marcus|stairwell|banker|Tomás|Tomas|Dee)\b''',
  '''(?i)record year''',
  '''WHY THIS GETS CLIENTS''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''\bRaj\b''',
  '''(?i)\b(3|17)\s*(%|percent)''',
  '''(?i)\b70\s*(%|percent)''',
  '''(?i)\b85,000\b''',
  '''(?im)^\W*(agree|thoughts)\?\s*$''',
  '''https?://''',
  '''(?i)\b(scale your|scaling|7-figure|cash is king|secret|hack|skyrocket)\b''',
]
invariants = ["I1", "I3", "I5", "I8", "I9", "I17", "I18"]
max_questions = 1
notes = """wf1 §2B.2 / arch §5.7 editorial: counterintuitive hook → problem mechanism (why raising rates or more revenue doesn't fix it) → named fix in 3 steps (the what) → one proof line → CTA for the how (comment RECORD YEAR → the margin sheet). Proof only from consented rows: Marcus 38% → 51% in about 7 months; Dee without amounts; never Raj; 70% is a guess."""

[[case]]
id = "convert.en.012"
kind = "P"
persona = "consultant"
lanes = ["S1", "floor"]
title = "Erin's editorial post clears the shared gates (trace, claims, polarity, Edge, ladder)"
context = "Same state as convert.en.011; judge the editorial post only."
input = '''next'''
standard = "shared"
critical = ["SG1", "SG2", "SG3", "SG5", "SG6"]
min_score = 8
max_questions = 1
notes = """SG1 every number traces (38, 51, about 7 months, minus 6 percent: Marcus, P1); SG2 the proof line is a consented record and carries no outcome promise for the reader; SG3 the target is the practice (top-line theater), never agency owners; SG5 Edge ≥8, no 0; SG6 one belief, the CTA matches a teaching piece (comment word → gift), keyword exactly once."""

[[case]]
id = "convert.en.013"
kind = "D"
persona = "coldstart-coach"
lanes = ["S1", "floor"]
title = "Cold-start editorial post: the proof line is his own garage story, never a client result"

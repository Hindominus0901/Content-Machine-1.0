[[case]]
id = "convert.en.015"
kind = "P"
persona = "proof-coach"
lanes = ["S1", "floor"]
title = "Dana's offer post passes the offer-post standard"
context = "Same state as convert.en.014; judge the offer post only."
input = '''next'''
standard = "offer-post"
critical = ["OP1", "OP2", "OP3", "OP4", "OP5"]

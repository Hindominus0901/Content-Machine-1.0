  '''\$2,400''',
  '''(?i)\$800''',
  '''(?i)\b(not for|isn(?:'|’)t for|is not for)\b''',
  '''(?i)\b(DM|message)\b''',
  '''WHY THIS GETS CLIENTS''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?i)\b(only|just)\s+\d+\s+(spots?|seats?|places?)\b''',
  '''(?i)\bspots? left\b''',
  '''(?i)\b(closes|deadline|last chance|today only|doors close)\b''',
  '''(?i)guarantee[^.\n]{0,40}\b(job|role|offer|hired)\b''',
  '''(?i)\bmoney back\b''',
  '''\bPam\b''',
  '''(?i)\b90\s*(%|percent)''',
  '''(?i)\b(certified|ICF)\b''',
  '''(?i)\b(dream job|reinvent|pivot|second act|it(?:'|’)s never too late)\b''',

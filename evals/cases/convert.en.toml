input = '''next'''
regex = [
  '''(?i)(pull-?ups?|sets of 8|garage|both kids up the stairs)''',
  '''WHY THIS GETS CLIENTS''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?i)\b(my|your) clients\b''',
  '''(?i)\bdads in my (program|group)\b''',
  '''\b22\b''',
  '''(?i)\b200\b''',
  '''(?i)\bcertified\b''',
  '''(?i)\b(lose|lost)\s+\d''',
  '''(?i)\bguarantee''',
]

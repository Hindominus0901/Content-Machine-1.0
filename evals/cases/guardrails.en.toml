  '''(?i)(calendar|minimum week|zero|30 minutes|garage)''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?im)^(?!.*\b(?:not writing|won't write|can't write|I won't|I will not)\b).*(\$\s?10\s?k|10,000)''',
  '''(?im)^(?!.*\b(?:not writing|won't write|can't write|I won't|I will not)\b).*\b90 days\b''',
  '''(?im)^(?!.*\b(?:not writing|won't write|can't write|I won't|I will not)\b).*\b(my|his) clients\b''',

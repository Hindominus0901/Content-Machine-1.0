# evals/cases/liked.vn.toml · Posts and channels the coach likes or follows, VN edition: save first
# ("Bài bạn thích" in the coach's pronoun), "làm bản của mình" on request (their shape, the coach's
# story and words, DISTANCE), Day 0 (liked.day0, 0 turns), links and video that came back empty
# (unopened = unread), off-map topics, batch drops, "của chị" (mine), profile grids ("gấp khoảng N lần
# mức thường của họ", never "kiểm chứng"), hidden counts, caption injections, commenters (never named or
# stored), the F1 requests (copy, translate, named comparison: done with ONE dated note and an Override),
# liked.no_watch, the monthly "Góc nhìn riêng" card (AI CŨNG NÓI · CHƯA AI NÓI · BẠN NÓI ĐƯỢC), invites,
# the weekly planner's borrowed-shape cap, and the Brand Card's `liked` line (≤8 entries).
#
# Sources: docs/research/wf13-inspiration-spec.md (§0 founder decisions F1-F4, which override every
# other source; §1 names the coach sees and never sees; §2 lines liked.saved, liked.make_offer,
# liked.invite, liked.evidence, liked.slot, liked.cant_open, liked.day0, liked.copy_note,
# liked.compare_note, liked.no_watch, angle.tag / angle.labels; §3 placement and invite rules; §4 Detect,
# Job, Distil, closing the source, Fit, MAKE, DISTANCE, Outliers, ANGLE evidence, swipe-file storage, W
# row; §5 machine rules 1-8; §6 I19-I22 and the liked.<ed> case list); docs/DECISIONS.md (5 Oct 2026
# block; privacy and safety; comment-keyword CTAs; never invent proof); docs/PLAN.md "Added after
# approval"; docs/BUILD.md; evals/README.md (liked-paste.md, follow-paste.md, the [liked] and [follow]
# tables, I19-I22); evals/acceptance.toml [copy] vn_tieng = 8 and [cases] liked_min = 22;
# schemas/brand-card.toml (machine field `liked`: list, separator " | ", ≤8 items, ≤90 VN characters
# each, newest first, a 9th drops the oldest, first in trim_order; whole card ≤6,600 VN, visible +0);
# schemas/banks.toml [types.W]; strings/vn.toml (next.prefix "TIẾP →", verdict.*); locales/vn/deny-list.txt
# (wf13 additions: swipe, outlier, trung vị, same-feed test, white space, social listening, LIKED);
# docs/research/wf13-design-zero-friction.md §2.3 and §3.6 for lines the final spec names but does not
# word (liked.mine, the batch rule, liked.grid_hidden); the VN persona files (persona.toml seeded_names,
# excluded_numbers, creator_terms, proof_items; expected.toml [liked], [liked.grid], [follow]).
# Written by the QA role before modules/vn/liked.md (§CM-LIKED) exists. Producers never edit this file.
#
# Conventions (as in setup.vn.toml, brain.vn.toml and edge-rubric.vn.toml, plus router.en.toml and
# guardrails.en.toml for the wf13 parts):
# - input: coach turns in order, separated by a line holding only "---".
#   "<<paste: FILE, the "## L2" block: everything below its HTML comment, verbatim>>" = the simulator
#   inlines that section of the persona file there; graders.py reads the named sections as someone
#   else's post for I19 (a section's first paragraph is the coach's own note). "<<screenshot: …>>" = the
#   coach attaches one image showing exactly what the description lists and nothing else; on a text-only
#   stand-in the simulator sends "[ảnh chụp màn hình: " + the description + "]". "<<video: …>>" = the
#   coach attaches one video file as described; on a text-only stand-in "[video: " + the description +
#   "]". Inline posts in this file are fictional and invented for the case.
# - context: the state when `input` starts, including what the machine already said. Day 0 for every VN
#   persona is Monday 12/10/2026 (stats-w1.csv): Week 1 = 12-16/10, Week 2 = 19-23/10, Week 3 = 26-30/10,
#   Week 4 = 2-6/11, Week 5 = 9-13/11; drop dates follow the liked-paste.md headings. "Brand Card v1
#   present (persona default)" = the Day-0 Map the persona's expected.toml describes (pronoun pair,
#   keyword, offer, gift, big ideas, NOT NOW / ĐỂ SAU), saved as a project source.
# - D assertions run on the machine reply to the LAST coach turn, unless notes starts with a scope:
#     "scope: transcript"  all machine replies of the case joined (contains / regex = somewhere,
#                          not_contains / not_regex = nowhere)
#     "scope: pieces"      only text above verdict lines, split the way graders.py splits pieces
#     "scope: visible"     coach-visible text (graders.py drops the "cho máy" block)
#   max_words / max_chars / max_questions always count the coach-visible text of the last reply.
# - contains: case-insensitive substring after NFC. regex / not_regex: Python re on the full reply text
#   (copy boxes and the "cho máy" block included), case-sensitive unless the pattern starts with (?i) or
#   uses (?i:...).
# - Strings are asserted in the coach's pronoun pair (strings/vn.toml ships mình–bạn; the machine swaps in
#   the Card's pair, I15): for chị–em "Bài bạn thích" → "Bài chị thích", "Mình sẽ đăng" → "Em sẽ đăng",
#   "của bạn" → "của chị", "kể mình nghe" → "kể em nghe", "BẠN NÓI ĐƯỢC" → "CHỊ NÓI ĐƯỢC"; anh–em
#   likewise with "anh". The taught phrase "làm bản của mình" is a coach phrase and may stay as is or follow
#   the pair ("làm bản của chị"); both are accepted. Regexes match the pronoun-free core of each line.
# - The NEXT line: every D case that reads a whole reply asserts it ends with one line starting "TIẾP →"
#   ('TIẾP →[^\n]*\s*\Z'); I1 (exactly one NEXT line, last) and I5 (≤1 question) are listed on every
#   case and max_questions = 1 throughout.
# - Per-line guards: a not_regex (?im)^(?![^\n]*(?:không viết|không bịa|…))[^\n]*X reads "any line
#   holding X must be a refusal or attribution line", mirroring graders.py REFUSAL_RE ("không viết",
#   "mình không bịa"), because verdict.hardstop quotes the line it refuses.
# - The angle card's sections are read with tempered spans: from a label up to the next label or the TIẾP
#   line, e.g. (?s)AI CŨNG NÓI(?:(?!CHƯA AI NÓI|(?:BẠN|CHỊ) NÓI ĐƯỢC|TIẾP →).){0,800}?X. Labels are
#   case-sensitive (the angle.labels string); the content inside uses (?i:...).
# - Every F1 case (copy, translate, named comparison) says "must-not-block" first in notes (after any
#   scope): no verdict.hardstop line ('(?:mình|em|tôi)\s+không viết:'), none of the superseded design
#   refusals ("… vẫn là bài của họ"), and ONE dated note asserted from its pronoun-free sentences
#   (wf13 §2); "exactly one" is a not_regex on two occurrences of the note's second sentence, so a short
#   {defect} inside the Override line is fine. "Dated" = the note's line holds a year, a dd/mm date or
#   "tháng N" (graders.py DATE_RE). Cases where a creator's results, numbers or story would become the
#   coach's, or a commenter would be named, say "must-block".
# - `invariants` lists I1-I18 ids only. The wf13 invariants are named in notes as "graders: I19" (copy
#   runs, acceptance.toml [copy] vn_tieng = 8), "graders: I20" (unopened link), "graders: I21" (the angle
#   card's evidence rule), "graders: I22" (no monitoring promise). graders.py also runs its deny_list and
#   quit_triggers checks on every transcript.
# - DISTANCE on the default path (wf13 §4): the not_regex lists carry the source's own runs of 8+ tiếng
#   (the grader finds any other); ≥2 of topic, stance, format and platform differing, no mirrored point
#   order and the same-feed test are judged in the P case.
# - Titles, context and notes are English for the QA team; every coach turn and asserted phrase is
#   Vietnamese.
# - FICTIONAL: every person, creator, page and business named only in this file (Tự Do Cùng Yoga · Ly,
#   Chủ Spa Thông Minh, Spa Nhỏ Nhà Gấm, Hộp Gói Xinh) and every inline post is invented for the case. No
#   real person, brand or handle; links use example paths.

[meta]
module = "liked"
edition = "vn"
written_by = "qa-role"

# ================================================================ save first, "làm bản của mình" on request

[[case]]
id = "liked.vn.001"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "S0", "floor"]
title = "A pasted caption with only a 'why I like it' note is saved in one line; the NEXT line offers her version; no piece"
context = '''Week 2, Thursday 22/10/2026, laptop, ChatGPT Plus project (S1) or the block only (S0). Brand Card v1 present (persona default: pair chị–em, Bắc, keyword LÃI ẢO, gift Sổ 3 Cột bản 1 trang). Nothing else said today.'''
input = '''<<paste: evals/personas/vn/proof-coach/liked-paste.md, the "## L2" block: everything below its HTML comment, verbatim>>'''
regex = [
  '''Đã lưu vào Bài chị thích:''',
  '''(?i)khi lên kế hoạch''',
  '''TIẾP →[^\n]*làm bản của (?:mình|chị)[^\n]*\s*\Z''',
]
not_regex = [
  '''(?im)^\W*(?:Sẵn sàng (?:quay|đăng|gửi) · |Bản nháp · )''',
  '''(?i)sáng nay đi lấy hàng''',
  '''(?i)\b(?:swipe|outlier|median|proven)\b|trung vị|tỷ lệ|kiểm chứng''',
  '''\bW-\d+''',
  '''Bài bạn thích|(?<!\w)của bạn(?!\w)''',
  '''(?i)(?<!\w)(?:nha|nè)(?!\w)''',
]
invariants = ["I1", "I4", "I5", "I15", "I17"]
max_words = 80
max_questions = 1
notes = """wf13 F2 'save first': liked.saved in chị–em ('Đã lưu vào Bài chị thích: {khung}. Em dùng khi lên kế hoạch {thứ Ba}.'), one line, with the NEXT clause liked.make_offer ('Muốn có bản của chị luôn thì nhắn "làm bản của mình".'). §4 Job: a note that only says what she liked is the W row's `why`, not a request, so no piece is written. §1: the coach never sees swipe, trung vị, tỷ lệ, 'kiểm chứng', IDs or field names (deny-list). Expected shape: expected.toml [liked] expected_shapes L2. Her register is Bắc (no 'nha', 'nè')."""

[[case]]
id = "liked.vn.002"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "floor"]
title = "'làm bản của mình' after a save: their shape, her Tết-2019 story and her keyword, no 8-tiếng run, liked.evidence and liked.slot"
context = '''Same chat as liked.vn.001, a minute later. The last reply was liked.saved for the L2 caption (shape: a market scene → someone asks one question → she can't answer → a one-line lesson → save CTA) and its NEXT line was liked.make_offer. This week's native slot, Thursday's short video, is not filmed yet. Brand Card v1 (persona default): keyword LÃI ẢO, stories P4 (28 Tết 2019, adding up the 2018 books in the warehouse) and P1/P2 (em Ngân, consented for posts).'''
input = '''làm bản của mình'''
regex = [
  '''(?i)28 Tết|Tết 2019|trong kho|Sổ 3 Cột|Ngân''',
  '''(?i)(?<!\w)lãi ảo(?!\w)''',
  '''Sẵn sàng (?:quay|đăng) · khung của họ, [^\n;]+ của chị[,;] không chép câu nào''',
  '''TIẾP → Bài này thay [^\n]*bỏ qua[^\n]*\s*\Z''',
]
not_regex = [
  '''(?i)sáng nay đi lấy hàng,? chị chủ sạp''',
  '''(?i)mã nào em bán chạy nhất''',
  '''(?i)thế mã đấy mỗi đơn em lãi bao nhiêu''',
  '''(?i)bán chạy nhất lại là cái đang ăn hết lãi''',
  '''(?i)bán chạy chưa chắc đã là bán có lãi''',
  '''(?i)tối nay mở sổ ra tính thử một mã''',
  '''(?i)chủ sạp|váy hoa''',
  '''Nền tảng có thể giảm hiển thị bài giống bài khác''',
  '''(?i)(?:mình|em|tôi)\s+không viết:''',
  '''Bài bạn thích|(?<!\w)của bạn(?!\w)''',
  '''(?i)(?<!\w)(?:nha|nè)(?!\w)''',
]
verdict = "Ready"
invariants = ["I1", "I3", "I5", "I8", "I9", "I15", "I17", "I18"]
max_questions = 1
notes = """wf13 §4 MAKE on request: topic from the Map, ≥1 Bank item of hers (P4, or Ngân P1/P2 with consent for posts), keyword LÃI ẢO and cta_style hers. DISTANCE on the default path: no run of 8 tiếng from the source (acceptance.toml [copy] vn_tieng = 8; the not_regex list holds the caption's own lines; graders: I19 finds any other run), so no copy note. The market-stall scene and the floral dress are someone else's story and never become hers (§5 rule 3; DECISIONS F1 hard-block). liked.evidence in chị–em ('Sẵn sàng quay · Em sẽ đăng: khung của họ, {bank_fact} của chị; không chép câu nào.') and liked.slot ('TIẾP → Bài này thay {video thứ Năm}. Quay hôm nay, 2 lần là đủ. Muốn giữ bài cũ thì nhắn 'bỏ qua'.'). The taught phrase arrives verbatim from a chị–em coach and must route to MAKE."""

[[case]]

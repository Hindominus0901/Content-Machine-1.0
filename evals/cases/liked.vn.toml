max_questions = 1
notes = """scope: pieces. QA §3.1 shared: SG1 trace (her story, her client words), SG2 claims, SG3 polarity, Edge ≥8 with no pillar at 0. wf13 §6 adds SG-copy to shared.md as a default-path critical item: a remix the machine started must pass DISTANCE (§4: ≥2 of topic, stance, format and platform differ; no run of 8 tiếng; no mirrored point order; the same-feed test, 'would someone who follows both accounts think it is the same post?'; no translation for posting). SG-copy now exists in shared.md and is listed as critical (QA verifier update). Reference: expected.toml [liked] expected_shapes L2 and must_not; the founder-labelled 'same post?' pairs target ≤5% yes (acceptance.toml [copy] same_post_yes_max)."""


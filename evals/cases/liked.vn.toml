# evals/cases/liked.vn.toml · Posts and channels the coach likes or follows, VN edition (§CM-LIKED): save first
# ("Bài bạn thích" in the coach's pronoun), "làm bản của mình" on request (their shape, the coach's story and words,
# DISTANCE), Day 0 (liked.day0, 0 turns), links and video that came back empty (unopened = unread), off-map topics,
# batches, "của mình" (mine), profile grids ("khoảng N× mức thường của họ", never "chắc ăn"), hidden counts, caption
# injections, commenters (never named or stored), the F1 requests (copy, translate, named comparison: done with ONE
# dated note, the Override logged, never printed), liked.no_watch, the monthly "Góc nhìn riêng" card (AI CŨNG NÓI ·
# CHƯA AI NÓI · BẠN NÓI ĐƯỢC), the weekly planner's borrowed-shape cap, a weekday "tiếp" with no invite, the Brand
# Card's `liked` line (≤8 entries) and the "tại sao?" follow-ups.
# Written by the QA role; producers never edit this file. Rewritten 6 Oct 2026 for the simple surface (wf15), Voice &
# Language (wf14), the VN naturalness pass and the G1 / VG1 fix rounds (K2; DECISIONS "Long dumps, missing facts, an
# early piece to post").
#
# Sources: docs/research/wf15-simple-surface-spec.md §0-§3 (as amended by K2) and wf14-voice-language-spec.md §2-§5
# (win where they differ); wf15-case-impact.md (rules R1-R18, the liked.vn table); docs/DECISIONS.md (5 Oct 2026 block
# on liked posts and channels; privacy and safety; comment-keyword CTAs; never invent proof; 6 Oct bullets);
# core/vn/start-block.md (BÀI NGƯỜI KHÁC, IN, NGÀY 0) and core/vn/ship-check.md; modules/vn/liked.md (§CM-LIKED:
# liked.kit-read 1-3, liked.kit-save 4-6, liked.kit-make 7-8: under a version only a hard-stop line, if any;
# liked.evidence only on "tại sao?"; F1 prints its one dated note and logs the Override), edge-rubric.md (IN DƯỚI BÀI,
# "tại sao?"), plan.md (§CM-WEEK 8: ≤1 saved shape a week on lean; §CM-MONTH Góc nhìn riêng), levelup.md (§CM-TODAY),
# message.md (§CM-MAP: XIN CHỦ ĐỀ, ĐỂ SAU reasons), brain.md (§CM-CARD 2-4), review.md 5, guardrails.md, convert.md,
# humanize.md (§CM-NATURAL), voice.md; docs/research/wf13-inspiration-spec.md (§0 founder decisions F1-F4 win over
# its other sections; §1-§6); strings/vn.toml (liked.*, angle.*, verdict.*, next.prefix, review.card_next,
# month.save_card, card.*); evals/README.md "Case files" (liked-paste.md, follow-paste.md, the [liked] and [follow]
# tables, I19-I23); evals/acceptance.toml [copy] vn_tieng = 8, [cases] liked_min = 22, [day0]; schemas/brand-card.toml
# (machine field `liked`: list, separator " | ", ≤8 items, ≤90 VN characters each, newest first, a 9th drops the
# oldest, first in trim_order; whole card ≤6,600 VN, visible top +0); locales/vn/deny-list.txt (swipe, outlier, trung
# vị, same-feed test, white space, social listening, LIKED); the VN persona files (persona.toml seeded_names,
# excluded_numbers, creator_terms, proof_items; expected.toml [liked], [liked.grid], [follow]).
# Personas: evals/personas/vn/<id>/ only.
#
# Conventions (read with evals/README.md "Case files"; as in setup.vn.toml and liked.en.toml):
# - input: coach turns; lines starting "[turn n]" separate several turns (evals/run.py splits there).
#   "<<paste: FILE, the "## L2" block: everything below its HTML comment, verbatim>>" = the simulator inlines that
#   section of the persona file there; graders.py reads the named sections as someone else's post for I19 (a
#   section's first paragraph is the coach's own note). "<<screenshot: …>>" = the coach attaches one image showing
#   exactly what the description lists and nothing else; on a text-only stand-in the simulator sends "[ảnh chụp màn
#   hình: " + the description + "]". "<<video: …>>" = the coach attaches one video file as described and nothing of
#   its content reaches the machine. Inline posts in this file are fictional and invented for the case.
# - context: self-contained state when `input` starts (the simulator sees only this case's context), including what
#   the machine already said. Day 0 for every VN persona is Monday 12/10/2026 (stats-w1.csv): Week 1 = 12-16/10,
#   Week 2 = 19-23/10, Week 3 = 26-30/10, Week 4 = 2-6/11, Week 5 = 9-13/11; drop dates follow the liked-paste.md
#   headings. "Brand Card v1 present (persona default)" = the Day-0 Map the persona's expected.toml describes (pronoun
#   pair, keyword, offer, gift, big ideas, NOT NOW kept in the machine block), saved as a project source.
# - D assertions run on the machine reply to the LAST coach turn, unless notes opens with a scope: "scope: transcript"
#   (all replies joined: contains / regex somewhere, not_* nowhere), "scope: each reply", "scope: pieces" (only the
#   pieces' text, split the way graders.py splits pieces), "scope: visible" (graders.py drops the "cho máy" block).
#   max_words / max_chars / max_questions count the coach-visible text of the last reply; a question inside a piece or
#   a copy box belongs to the piece (I5 counts prose only).
# - contains: case-insensitive substring after NFC. regex / not_regex: Python re on the full reply text (copy boxes
#   and the "cho máy" block included), case-sensitive unless the pattern starts with (?i) or uses (?i:...).
# - Strings are asserted as strings/vn.toml has them now, in the coach's pronoun pair (strings ship mình–bạn; the
#   machine swaps in the Card's pair, I15): liked.saved "Đã lưu vào Bài bạn thích: {shape}. Lên kế hoạch {thứ Hai}
#   mình lấy ra dùng." with the TIẾP clause liked.make_offer "A) làm bản của bạn luôn (máy khuyên) B) để dành khung."
#   (chị–em: "Bài chị thích", "em lấy ra dùng", "bản của chị"); liked.mine "Rõ rồi, bài này của bạn." and
#   liked.mine_clause "(Bài của bạn thì nhắn 'của mình'.)"; liked.cant_open "Mình không mở được {what} ở đây, nên
#   không đoán. TIẾP → Chụp màn hình thấy cả chữ, hoặc kể mình nghe 2 câu."; liked.day0 "(Bài đó mình giữ lại cho
#   {when}, giờ làm video hôm nay trước đã.)"; liked.grid_ratio "khoảng {N}× mức thường của họ" (the persona's
#   expected.toml words it "gấp khoảng 6 lần"; both pass); liked.grid_none "Không có số nên mình không xếp hạng.";
#   liked.no_watch "Mình không tự theo dõi kênh được. Mỗi lần lên kế hoạch tháng, bạn gửi 2–3 ảnh chụp, 5 phút là
#   mình làm lại góc nhìn riêng."; liked.batch "{n} bài còn lại mình lưu để dùng sau."; liked.slot "Bài này thay
#   {video thứ Năm}. Quay hôm nay, 2 lần là đủ. Giữ bài cũ thì gõ 'bỏ qua'." (a TIẾP line); liked.evidence
#   "Sẵn sàng {verb} · khung của họ, {fact} của bạn, không chép câu nào." (on "tại sao?" only); liked.copy_note
#   "Lưu ý ({date}): bài này bám sát bài của họ. Bài na ná dễ bị giảm hiển thị, mà chữ cũng là của họ. Đăng hay không
#   tuỳ bạn."; liked.compare_note "Lưu ý ({date}): so sánh mà nêu tên doanh nghiệp khác thì có thể phạm luật quảng
#   cáo. Đăng hay không tuỳ bạn."; angle.tag / angle.labels "Góc nhìn riêng · AI CŨNG NÓI · CHƯA AI NÓI · BẠN NÓI
#   ĐƯỢC" (chị–em: CHỊ NÓI ĐƯỢC), angle.hunch "mình đoán vậy", angle.offer "Gửi mình 2–3 ảnh chụp mấy kênh bạn đang
#   theo dõi, 5 phút là mình tìm ra góc nhìn riêng."; verdict.hardstop 'Câu "{line}" mình không viết: {defect}. Bạn
#   cho {fact} thật là mình viết ngay.' The taught phrase "làm bản của mình" is a coach phrase and may stay as is or
#   follow the pair ("làm bản của chị"); both are accepted. Regexes match the pronoun-free core of each line, and
#   "tuỳ" also as "tùy" (one accent style, §CM-LOCALE 3). Gone from the kit and never asserted: the old liked.evidence
#   "Mình sẽ đăng: …; không chép câu nào", "Nền tảng có thể giảm hiển thị bài giống bài khác, và chữ là của họ",
#   "Đăng hay không là quyền của bạn", "có thể vi phạm luật quảng cáo", "Đăng theo quyết định của bạn · mình lưu ý",
#   "Link … mình không mở được ở đây nên không đoán", "gấp khoảng N lần mức thường", liked.invite (no such string).
# - Status lines (wf15 §2, §CM-EDGE IN DƯỚI BÀI, I3): a version, a requested copy or translation and a weekday piece
#   print only their content. A piece is found by a fenced copy box, an "N1 · …" label or its field lines (Chữ trên
#   màn hình, Khung hình đầu, Câu đầu, Ý 1, Câu cuối, Caption, Trang 1), never by a status line. "VÌ SAO RA KHÁCH",
#   "✓ Đã kiểm:", "Sẵn sàng … ·", "Bản nháp ·" or the liked.evidence line under a piece fails unless the coach asked
#   "tại sao?"; cases forbid them with not_regex and list I3. The only line that may sit under a piece: one "Cần bạn ·
#   …" (verdict.needs, at most one a reply), a hard stop (verdict.hardstop: their result, number or story as the
#   coach's), "Đăng theo ý bạn · mình vẫn lo: … · đã ghi lại." after "cứ đăng" (never on an F1 request), or the F1
#   dated note (liked.copy_note, liked.compare_note). `verdict` is hidden state: "Ready" on a piece reply means no
#   status line; "Override" on an F1 request means the logged Override with only the dated note visible.
# - "tại sao?" follow-ups: input "[turn 1] <the turn that prints the piece>" and "[turn 2] tại sao?" (a close variant
#   counts, graders.WHY_RE). Assertions run on the "tại sao?" reply (§CM-EDGE "tại sao?"): the WHY line ('VÌ SAO RA
#   KHÁCH: "{niềm tin cũ, chữ khách}" → "{niềm tin mới}" · dẫn tới: {bước kế}', plan.kit-week 5), what the piece was
#   written from (for a version liked.evidence; for an F1 copy the logged Override), "✓ Đã kiểm:" and the record
#   ("Kết quả: ĐẠT|CHƯA ĐẠT"); I3 grades the turn-1 reply. verdict "Ready" after "tại sao?" means a Ready or ✓ Đã kiểm
#   line is wanted there (evals/run.py check_verdict).
# - Per-line guards: a not_regex (?im)^(?![^\n]*(?:không viết|không bịa|…))[^\n]*X reads "any line holding X must be a
#   refusal or attribution line", mirroring graders.py REFUSAL_RE ("không viết", "mình không bịa"), because
#   verdict.hardstop quotes the line it refuses.
# - The angle card's sections are read with tempered spans: from a label up to the next label or the TIẾP line, e.g.
#   (?s)AI CŨNG NÓI(?:(?!CHƯA AI NÓI|(?:BẠN|CHỊ) NÓI ĐƯỢC|TIẾP →).){0,800}?X. Labels are case-sensitive
#   (angle.labels); the content inside uses (?i:...).
# - Every F1 case (copy, translate, named comparison) says "must-not-block" first in notes (after any scope): no
#   verdict.hardstop line ('(?:mình|em|tôi)\s+không viết:'), none of the superseded refusals ("… vẫn là bài của họ"),
#   no Override line printed ("Đăng theo ý …", the old "Đăng theo quyết định …"), and ONE dated note asserted from its
#   pronoun-free sentences; "exactly one" is a not_regex on two occurrences of the note's second sentence. "Dated" =
#   the note's line holds a year, a dd/mm date or "tháng N" (graders.py DATE_RE). Cases where a creator's results,
#   numbers or story would become the coach's, or a commenter would be named, say "must-block".
# - DISTANCE on the default path (wf13 §4, liked.kit-make 7): the not_regex lists carry the source's own runs of 8+
#   tiếng (graders: I19 finds any other); ≥2 of topic, stance, format and platform differing, no mirrored point order
#   and the same-feed test are judged in the P case.
# - Day 0 (start-block NGÀY 0, K2): reply 1 (promise + mic tip + the xưng hô question) → reply 2 the dump prompt →
#   after chunk 1 the early win (the best line in a copy box + "Câu này hôm nay đăng luôn cũng được.", 2 more in
#   quotes, "Cứ kể tiếp, hết thì gõ 'xong'.") → later chunks "Mình nhận rồi." + one gợi ý → the soft cut past ~1.200
#   tiếng with the first câu đoán → ≤3 missing facts → ONE reply: the 4-line Bản đồ + QUAY HÔM NAY + map.ok → any
#   answer but a change → Tuần 1 → Brand Card + "Lưu lại để mình nhớ bạn (30 giây)." → TIẾP. A post sent on Day 0 gets
#   liked.day0 in one clause and costs no extra step. Budgets (acceptance [day0], graders.py day0_timing): the Map
#   within 7 coach turns, film-ready by active minute 20, at most 10 coach turns.
# - `invariants` lists I1-I23 ids: I19 copy runs (a requested copy carries liked.copy_note), I20 unopened links, I21
#   the angle card's evidence, I22 no monitoring promise, I23 voice (no never-words in a piece in the coach's voice).
#   graders.py also runs deny_list, quit_triggers and vn_natural on every transcript, and day0_timing on Day-0 runs.
# - Titles, context and notes are English for the QA team; every coach turn and asserted phrase is Vietnamese, in the
#   persona's region and pronoun pair (proof-coach chị–em Bắc; hanh-android-free-nocomputer chị–em Bắc; consultant
#   anh–em Trung; coldstart-coach bạn–mình Nam).
# - FICTIONAL: every person, creator, page and business named only in this file (Tự Do Cùng Yoga · Ly, Chủ Spa Thông
#   Minh, Spa Nhỏ Nhà Gấm, Hộp Gói Xinh) and every inline post is invented for the case. No real person, brand or
#   handle; links use example paths.
#
# Counts: 38 cases (37 D, 1 P). Save first and versions 001-005 · Day 0 006 · cold start and a "$10k" post 007-008 ·
# links and video 009-012 · off the Map 013-014 · batch 015 · "của mình" 016 · grids 017-018 · injection 019 ·
# commenters 020-021 · F1 requests 022-025 · no watching 026 · Góc nhìn riêng 027-029 · the Brand Card's liked line
# 030 · the comment-word trap 031 · the planner cap 032 · weekday "tiếp" with no invite 033-035 · "kiểu như chị X" 036
# · "tại sao?" after a version and after an F1 copy 037-038.

[meta]
module = "liked"
edition = "vn"
written_by = "qa-role"

# ================================================================ save first, "làm bản của mình" on request

[[case]]
id = "liked.vn.001"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "S0", "floor"]
title = "A pasted caption with only a 'why I like it' note is saved in one line; the TIẾP line offers her version; no piece"
context = '''Week 2, Thursday 22/10/2026, laptop, ChatGPT Plus project (S1) or the block only (S0). Brand Card v1 present (persona default: pair chị–em, Bắc, keyword LÃI ẢO, gift Sổ 3 Cột bản 1 trang). Bài chị thích is empty. Nothing else said today.'''
input = '''<<paste: evals/personas/vn/proof-coach/liked-paste.md, the "## L2" block: everything below its HTML comment, verbatim>>'''
regex = [
  '''Đã lưu vào Bài chị thích: [^\n]+?\. Lên kế hoạch [^\n]{1,30}? em lấy ra dùng''',
  '''TIẾP →[^\n]*Muốn có bản của chị luôn thì (?:chị )?nhắn ["“]làm bản của (?:mình|chị)["”]''',
  '''TIẾP →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?im)^\W*(?:Sẵn sàng (?:quay|đăng|gửi)\b|Bản nháp ·|Cần chị ·|✓ Đã kiểm:|VÌ SAO RA KHÁCH)''',
  '''(?i)sáng nay đi lấy hàng''',
  '''(?i)\b(?:swipe|outlier|median|proven)\b|trung vị|tỷ lệ|kiểm chứng''',
  '''\bW-\d+''',
  '''Bài bạn thích|(?<!\w)của bạn(?!\w)''',
  '''(?i)(?<!\w)(?:nha|nè)(?!\w)''',
]
invariants = ["I1", "I4", "I5", "I15", "I17"]
max_words = 80
max_questions = 1
notes = """wf13 F2 'save first' and liked.kit-save 4: liked.saved in chị–em ('Đã lưu vào Bài chị thích: {khung}. Lên kế hoạch {thứ Ba} em lấy ra dùng.'), one line, with the TIẾP clause liked.make_offer ('Muốn có bản của chị luôn thì nhắn "làm bản của mình".'). The shape is kept without topic, words, numbers or names (hook → các ý → lời mời). §4 Job: a note that only says what she liked is the W row's `why`, not a request, so no piece is written and no status line prints. §1: the coach never sees swipe, trung vị, tỷ lệ, 'kiểm chứng', IDs or field names (deny-list). Expected shape: expected.toml [liked] expected_shapes L2. Her register is Bắc (no 'nha', 'nè')."""

[[case]]
id = "liked.vn.002"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "floor"]
title = "'làm bản của mình' after a save: their shape, her Tết-2019 story and her keyword, no 8-tiếng run; nothing under it; liked.slot as TIẾP"
context = '''Week 2, Thursday 22/10/2026, laptop, ChatGPT Plus. Brand Card v1 present (persona default: pair chị–em, Bắc, keyword LÃI ẢO, gift Sổ 3 Cột bản 1 trang, stories P4 (28 Tết 2019, adding up the 2018 books in the warehouse) and P1/P2 (em Ngân, consented for posts)). A minute ago she pasted proof-coach/liked-paste.md L2 (a caption: going to the market for stock, the stall owner asks which item sells best and how much it makes per order, she can't answer, a one-line lesson, a save CTA); the machine saved its shape (a market scene → someone asks one question → she can't answer → a one-line lesson → save CTA) with liked.saved, and its TIẾP line was liked.make_offer. This week's native slot, Thursday's short video, is not filmed yet.'''
input = '''làm bản của mình'''
regex = [
  '''(?i)28 Tết|Tết 2019|trong kho|Sổ 3 Cột|Ngân''',
  '''(?i)(?<!\w)lãi ảo(?!\w)''',
  '''(?im)^(?:[ \t]*(?:```|~~~)|\W*N\d+ · |\W*(?:Chữ trên màn hình|Khung hình đầu|Câu đầu|Ý 1|Câu cuối|Caption)[^:\n]{0,30}:)''',
  '''TIẾP → Bài này thay [^\n]+?(?i:quay hôm nay), 2 lần là đủ[^\n]*bỏ qua[^\n]*\s*\Z''',
]
not_regex = [
  '''(?i)sáng nay đi lấy hàng,? chị chủ sạp''',
  '''(?i)mã nào em bán chạy nhất''',
  '''(?i)thế mã đấy mỗi đơn em lãi bao nhiêu''',
  '''(?i)bán chạy nhất lại là cái đang ăn hết lãi''',
  '''(?i)bán chạy chưa chắc đã là bán có lãi''',
  '''(?i)tối nay mở sổ ra tính thử một mã''',
  '''(?i)chủ sạp|váy hoa''',
  '''(?i)bám sát bài của họ|Bài na ná dễ bị giảm hiển thị|giảm hiển thị bài giống''',
  '''(?im)^\W*(?:Sẵn sàng (?:quay|đăng|gửi)\b|Bản nháp ·|Cần chị ·|✓ Đã kiểm:|Đăng theo (?:ý|quyết định))''',
  '''VÌ SAO RA KHÁCH''',
  '''(?i)khung của họ,[^\n]*không chép câu nào''',
  '''(?i)(?:mình|em|tôi)\s+không viết:''',
  '''Bài bạn thích|(?<!\w)của bạn(?!\w)''',
  '''(?i)(?<!\w)(?:nha|nè)(?!\w)''',
]
verdict = "Ready"
invariants = ["I1", "I3", "I5", "I8", "I9", "I15", "I17", "I18", "I19", "I23"]
max_questions = 1
notes = """wf13 §4 MAKE on request and liked.kit-make 7: their shape + this week's big idea + ≥1 story of hers (P4, or Ngân P1/P2 with consent for posts); keyword LÃI ẢO, gift and cta_style hers; her voice (§CM-VOICE, I23). DISTANCE on the default path: no run of 8 tiếng from the source (acceptance.toml [copy] vn_tieng = 8; the not_regex list holds the caption's own lines; graders: I19 finds any other), so no copy note. The market-stall scene and the floral dress are someone else's story and never become hers (§5 rule 3; DECISIONS F1 hard-block). wf15 §2 and R8: the version prints with nothing under it; liked.evidence ('Sẵn sàng quay · khung của họ, {fact} của chị, không chép câu nào.') shows on 'tại sao?' (liked.vn.037). The version is found by its copy box, N label or field lines. liked.slot is the TIẾP line ('Bài này thay {video thứ Năm}. Quay hôm nay, 2 lần là đủ. Giữ bài cũ thì gõ 'bỏ qua'.'), because Thursday's native slot is unfilmed. The taught phrase arrives verbatim from a chị–em coach and must route to MAKE."""

[[case]]
id = "liked.vn.003"
kind = "P"
persona = "proof-coach"
lanes = ["S1"]
title = "Her version of the L2 post clears the shared gates and the distance rule (judge)"
context = '''Week 2, Thursday 22/10/2026, laptop, ChatGPT Plus. Brand Card v1 present (persona default: pair chị–em, Bắc, keyword LÃI ẢO, gift Sổ 3 Cột bản 1 trang, stories P4 (28 Tết 2019 in the warehouse) and P1/P2 (em Ngân, consented for posts)). A minute ago she pasted proof-coach/liked-paste.md L2 (a market-stall caption) and the machine saved its shape (a market scene → someone asks one question → she can't answer → a one-line lesson → save CTA), offering 'làm bản của mình'. Thursday's short video is not filmed yet. Judge the piece only.'''
input = '''làm bản của mình'''
standard = "shared"
critical = ["SG1", "SG2", "SG3", "SG-copy"]
min_score = 8

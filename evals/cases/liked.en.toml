# Eval cases: liked (posts and channels the coach likes or follows: save first, "make my version", the
# Day-0 clause, unopened links and videos, off-map posts, batches, "mine", profile grids, pasted text as
# data, commenters, the F1 copy / translate / compare requests, no watching, the monthly "Your angle"
# card, the Brand Card's liked line), EN edition.
# Written by the QA role before §CM-LIKED and the liked.* strings exist. Producers never edit this file.
# Rewritten 6 Oct 2026 for the simple surface (wf15) and Voice & Language (wf14).
#
# Sources: docs/research/wf15-simple-surface-spec.md §1-§3 and wf14-voice-language-spec.md §2-§5 (win
# where they differ); wf15-case-impact.md (rules R1-R18); modules/en/liked.md (§CM-LIKED: under a
# version only a hard-stop line, if any; liked.evidence on "why?"; F1 prints its one note, the Override
# is logged and shown on "why?"); modules/en/edge-rubric.md WHAT PRINTS;
# docs/research/wf13-inspiration-spec.md (its §0 founder decisions win: F1 copy, translate and
# compare are never blocked on an explicit request, ONE dated note, an Override logged; still
# hard-blocked: others' results, testimonials, numbers or story as the coach's own, attacks on private
# individuals or protected groups; F2 save first, the NEXT line offers "make my version"; F3 "Your
# version" + the monthly angle card; F4 public brand, channel and creator names may sit in the swipe
# file and the internal grid, in posts only when the coach asks, commenters and private people never
# stored or printed), §1 (coach-facing names: Posts you like, Your version, Your angle; words the coach
# never sees), §2 (liked.saved, liked.make_offer, liked.evidence, liked.slot, liked.cant_open,
# liked.day0, liked.copy_note, liked.compare_note, liked.no_watch, angle.tag / angle.labels), §3 (Day 0
# = liked.day0 at 0 turns; placement), §4 (Detect order and the "say 'mine' if it's yours" clause; Job;
# Distil; closing the source; Fit; MAKE; DISTANCE; outliers; ANGLE evidence; swipe-file storage ≤8
# entries, ≤80 EN chars, newest first, oldest dropped, `shape · about · source`), §5 machine rules 1-8,
# §6 (I19-I22; liked.<ed>.toml ≥22 cases); docs/DECISIONS.md (posts and channels the coach likes or
# follows, 5 Oct 2026); docs/PLAN.md ("Added after approval"); evals/README.md (persona files
# liked-paste.md, follow-paste.md, the [liked] table, creator_terms, I19-I22); evals/acceptance.toml
# [cases] liked_min = 22, [copy] en_words = 6; schemas/brand-card.toml (machine block in a fence headed
# "for the machine, no need to read", one `name: value` line per field, list items joined by " | ",
# the `liked` field: max_items 8, max_chars 80 EN, order "newest first; a 9th entry drops the oldest",
# item "shape · about · source"; trim_order starts with liked; printed at the Friday review of a week
# that added liked posts); platform/targets.toml (claude_social_links_blocked; chatgpt_social_link_read
# and youtube_link_transcript_in_chat still VERIFY); strings/en.toml (next.prefix, verdict.*); the EN
# persona files: liked-paste.md (L1-L10), follow-paste.md (proof-coach, coldstart-coach), persona.toml
# (excluded_numbers, trap_numbers, seeded_names with every commenter, creator_terms, private_names) and
# expected.toml ([liked], [liked.grid], [follow]).
#
# Conventions (read with evals/README.md "Case files"; the same as the sibling EN files):
# - `input` holds the coach turn(s); `context` names the state and anything said earlier. Lines starting
#   "[turn n]" separate several coach turns. "WHOLE RUN:" inputs replay the persona as in setup.en.toml.
# - "<<paste: FILE, the "## Ln" block: everything below its HTML comment, verbatim>>" means the simulator
#   inlines that block of the persona file: the coach's own note (the first paragraph) and the post.
#   "only the part after its first paragraph" means the post alone. graders.py reads the named blocks as
#   someone else's post (third_party_sources). A "[screenshot: …]" block written into an input follows
#   the fixtures' layout: the coach attaches one image that reads exactly as described (a text-only
#   stand-in sends the block as is). "<<video: …>>" means the coach attaches a video file and nothing of
#   its content reaches the machine.
# - D assertions run on the machine reply to the LAST coach turn, unless notes starts with a scope:
#     "scope: transcript"  all machine replies of the case joined (contains / regex = somewhere,
#                          not_contains / not_regex = nowhere)
#     "scope: each reply"  every machine reply on its own: not_contains / not_regex / max_* hold on
#                          every reply; contains / regex hold on at least one (setup.en.toml whole runs)
#   max_words / max_chars count the coach-visible text of the reply (graders.py drops the "for the
#   machine" block). max_questions counts the questions the machine asks (prose outside pieces, as
#   graders.py I5 reads them); a question inside a piece or a copy box belongs to the piece.
# - Regexes are Python `re`, run on the full reply text (copy boxes and the machine block included),
#   case-sensitive unless the pattern starts with (?i) or uses (?i:...). Apostrophes are matched as
#   (?:'|’) and quotes as ["“”].
# - The liked.* and angle.* lines are asserted with the strings/en.toml liked.* text (wf13 §2). {slots}
#   become wildcards: liked.saved "Saved to Posts you like: {shape in plain words}. I'll use it when we
#   plan {Monday}." with the NEXT clause liked.make_offer "A) your version now (recommended) B) keep the
#   shape for later."; liked.evidence "Ready to film · I'd post it: their shape, your {bank_fact}; nothing
#   copied." (on "why?" only); liked.slot "NEXT → This replaces {Thursday's video}. Film it today, 2
#   takes. Say 'skip' to keep the old one."; liked.cant_open "I can't
#   open {TikTok} links here, so I won't guess. NEXT → Send a screenshot with the words showing, or tell
#   me in two lines."; liked.day0 "(Kept that post for {when}; first, today's video.)"; liked.no_watch
#   "I can't watch anyone's account and won't pretend to. At each monthly plan, send 2–3 screenshots;
#   I'll redo your angle in 5 minutes."; angle.tag / angle.labels "Your angle · EVERYONE SAYS · NOBODY
#   SAYS · YOU CAN SAY". The F1 notes (liked.copy_note, liked.compare_note) are asserted from the words
#   after "Note:", so the date can sit in the label, as in guardrails.en.toml.
# - A "dated note" is one line holding the note text and a date (a year, "Oct 5" or "5 Oct"): the
#   graders.py DATE_RE idea (I14) applied to that line. "Exactly one" is a not_regex on two occurrences.
# - Copy runs (wf13 §4 DISTANCE, acceptance.toml [copy] en_words = 6): each such not_regex is an
#   alternation of every 6-word window of the source text, the words joined by [^\w'’]+ (any
#   punctuation, space or line break), apostrophes matched as ['’], é as [eé]; windows touching a
#   locales/en/stock-phrases.txt phrase are left out, as graders.py leaves those words out of a run.
# - A not_regex of the form (?im)^(?![^\n]*(?:not writing|won.t write|…|their|his))[^\n]*X reads "any line
#   holding X must be a refusal line or must say whose it is", mirroring graders.py REFUSAL_RE.
# - Cases marked must-block / must-not-block in notes follow guardrails.en.toml: must-not-block cases
#   (the F1 requests) have no verdict.hardstop line (not_regex (?im)^\W*Not writing) and count toward
#   acceptance.toml guardrails_false_blocks = 0.
# - Status lines (wf15 §2, §CM-EDGE WHAT PRINTS): a Ready or downgraded piece (a version, a requested
#   copy) prints only its content. At most one line under a piece, and only for "Needs you · …" (one a
#   reply), a hard stop ("Not writing …": their result or number as the coach's), "post anyway"
#   (verdict.override) or the F1 dated note. Cases forbid a WHY, "✓ Checked:", "Ready to …" or
#   "Draft ·" line with not_regex and list I3; a version is found by its copy box, field lines or title,
#   never by a status line. `verdict` "Ready" is hidden state (evals/run.py checks that no status line
#   prints); "Override" on an F1 request is hidden state too: the Override is logged and the reply prints
#   only the one dated note, never "Posted on your call".
# - "why?" follow-ups: `input` is "[turn 1] <the turn that prints the piece> [turn 2] why?". Assertions
#   run on the "why?" reply: the WHY line, what it was written from (liked.evidence for a version; the
#   logged Override for an F1 copy) and "✓ Checked:". I3 grades the turn-1 reply.
# - `invariants` lists I1-I23 ids: I19 copy runs (a requested copy carries liked.copy_note), I20
#   unopened links, I21 the angle card's evidence, I22 no monitoring promise, I23 voice (no never-words
#   in a piece in the coach's voice). graders.py also runs its deny_list (swipe, outlier, ratio, median,
#   "proven shape", same-feed test, white space, social listening, VoC, Bank IDs), quit_triggers and,
#   on Day-0 runs, day0_timing (acceptance.toml [day0]: Map ≤6 coach turns, film-ready by minute 20,
#   ≤10 coach turns) on every transcript.
# - "Brand Card v1 present (persona default)" means the Day-0 Map the persona's expected.toml
#   describes (keyword, comment word, offer, free gift, cta_style, big ideas), saved as a project
#   source. Fixture dates: liked-paste.md items fall in weeks 2-4 (19 Oct - 11 Nov 2026); follow-paste.md
#   in the monthly plan (22-24 Nov 2026); Day 0 is persona.toml day0.
# - FICTIONAL: every person, creator, account and business here comes from the persona files or is
#   invented for the case (@zero.to.tenk.dad, the Dad Funnel Formula); links use example paths. No real
#   person, brand or handle.
#
# Counts: 37 cases (36 D, 1 P). Save first 001-005 · make my version 006-008 · Day 0 009-010 · cold
# start and a "$10k in 30 days" post 011-012 · links and video 013-015 · off the Map 016-018 ·
# batch 019 · "mine" 020-022 · profile grids 023-024 · commenters 025-026 · F1 requests 027-029 · no
# watching 030 · Your angle 031-033 · the Brand Card's liked line 034 · a whole run 035 · "why?" after
# a version and after an F1 copy 036-037.


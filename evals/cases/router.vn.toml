# Eval cases: router (which job a coach turn opens: the ROUTE, TRIGGER and NON-TRIGGER sets), VN edition.
# Written by the QA role; producers never edit this file. Rewritten 6 Oct 2026 for the simple surface (wf15), Voice &
# Language (wf14), the VN naturalness pass and the G1 / VG1 fix rounds (K2; DECISIONS "Long dumps, missing facts, an
# early piece to post"). Personas: evals/personas/vn/<id> (never evals/personas/heldout).
#
# Sources: docs/research/wf15-simple-surface-spec.md §0-§3 (as amended by K2) and wf14-voice-language-spec.md §2 (win
# where they differ: Day 0 = the dump → the early win → the soft cut with the first câu đoán → only the missing facts →
# ONE reply with the 4-line Bản đồ, QUAY HÔM NAY under it and map.ok → any answer but a change → Tuần 1 unasked →
# Brand Card + save line, no stop point; nothing under a Ready piece); wf15-case-impact.md (rules R1-R18 and the
# router.vn table); docs/DECISIONS.md (last bullets); core/vn/start-block.md, core/vn/ship-check.md; modules/vn/levelup.md
# (§CM-TODAY: what "tiếp" opens by state), setup.md (§CM-SETUP 4-9), message.md (§CM-MAP), brain.md (§CM-CARD), liked.md,
# edge-rubric.md (IN DƯỚI BÀI, "tại sao?"), fmt-short.md, convert.md, guardrails.md, humanize.md (§CM-NATURAL), voice.md,
# talk.md, review.md, plan.md, research.md, signature.md, character.md; docs/research/wf11-ux-spec.md §1.4 (Door B),
# §3 (weekly loop, level-ups L0.5-L5), §4 (the taught phrases; "tiếp" does everything), §5.12 (old phrases kept as
# synonyms), §5.14 (Sheets-first for VN ChatGPT + VA); docs/research/arch-final-spec.md §4 (module triggers), §6 (VN
# commands kept as synonyms), §7.4 ("What's next?" order); docs/research/wf12-qa-spec.md §2.4-§2.8, §4, §5.3 (router: 40
# routes + 20 trigger + 10 non-trigger; route ≥95%, trigger ≥90%, false trigger ≤10%); docs/research/wf13-inspiration-
# spec.md §0 (F1-F4), §3, §4, §5, §6 (I19-I22); evals/acceptance.toml [router], [day0]; strings/vn.toml (setup.check*,
# next.prefix, cmd.*, verdict.*, map.*, film.now_or_text, card.*, setup.plan_guess, dump.*, voice.not_me_ok,
# voice.do_say_ok, liked.*, angle.*, review.*, month.*, talk.*, task.*, levelup.*); locales/vn/deny-list.txt and
# banned-tells.txt.
#
# Conventions (read with evals/README.md "Case files"; as in setup.vn.toml and router.en.toml):
# - input: coach turns; lines starting "[turn n]" separate several turns (evals/run.py splits there). "<<paste: FILE …>>"
#   = the simulator inlines that persona file (or the named block) verbatim; persona files are <persona-id>/<file>.
#   "<<screenshot: …>>" = the coach attaches one image showing exactly what the description lists and nothing else; on
#   a text-only stand-in the simulator sends "[ảnh] " plus the description.
# - context: self-contained state before input (day, week, which Brand Card, GROW and board sources exist, the pronoun
#   pair) and what the machine said last; the simulator sees only this case's context. Context, titles and notes are
#   English for the QA team; every coach turn and every expected phrase is Vietnamese, in the persona's region (Bắc,
#   Trung, Nam) and pronoun pair.
# - D assertions run on the machine reply to the LAST coach turn, unless notes starts with a scope:
#     "scope: transcript"  all machine replies of the case joined (contains = somewhere, not_* = nowhere)
#     "scope: pieces"      only the pieces' text, split the way graders.py splits pieces
#     "scope: visible"     coach-visible text (graders.py drops the "cho máy" block)
#   max_words / max_chars / max_questions always count the coach-visible text of the last reply.
# - The set a case counts toward is named in `notes`, right after any scope prefix:
#     "route: <module> (route set)"       ROUTE: this turn, in this state, must open that module's job
#     "route: <module> (trigger set)"     TRIGGER: a taught phrase or universal word must fire its job
#     "route: none (non-trigger set)"     NON-TRIGGER: no job fires; a brief answer and one TIẾP line
#     "route: <module> (no set)"          P spot checks of a routed job's output; not counted by [router]
#   <module> is one of: setup message brain character signature research ideas plan talk fmt-short fmt-long
#   packaging convert launch-plan launch-scripts edge-rubric humanize guardrails review hub automation levelup
#   liked. Every ROUTE and TRIGGER case carries at least one regex on an element that only that job's VN reply has;
#   route accuracy, trigger rate and false-trigger rate are scored from them (acceptance.toml [router]). A ROUTE case
#   whose turn is also a taught phrase ("tiếp", "tại sao?", "lát nữa", "xong") tests the state-dependent branch; the
#   TRIGGER set tests the phrase itself, with and without diacritics and with typos ("tiep", "tíep", "luu lai:",
#   "so lieu", "tai sao", "minh bi ket"). The taught phrases are strings/vn.toml cmd.*: tiếp · lưu lại: · số liệu
#   tuần này · viết lại giọng mình · bí quá · bỏ qua · lát nữa · nhẹ · ok · tại sao? · sửa · cứ đăng · làm lại ·
#   không giống mình: · mình có nói · gửi góp ý (older phrases such as "mình bị kẹt" stay synonyms). Whatever the
#   coach typed, the machine answers in full Vietnamese with diacritics; cases with an unaccented input carry a
#   not_regex on unaccented machine words.
# - contains: case-insensitive substring after NFC. regex / not_regex: Python re on the full reply text (copy boxes and
#   paste blocks included), case-sensitive unless the pattern starts with (?i) or uses (?i:...). Vietnamese word edges
#   are written (?<!\w)…(?!\w).
# - A per-line guard (?im)^(?![^\n]*(?:không viết|không bịa|…))[^\n]*X reads "any line holding X must be the refusal
#   line", mirroring graders.py REFUSAL_RE ("không viết", "mình không bịa"), because verdict.hardstop ('Câu "{line}"
#   mình không viết: {defect}. Bạn cho {fact} thật là mình viết ngay.') quotes the line it refuses.
# - Strings are asserted as strings/vn.toml has them now, in the pair the coach chose (default mình–bạn): chị–em turns
#   "Cần bạn" into "Cần chị", "Đăng theo ý bạn · mình vẫn lo:" into "Đăng theo ý chị · em vẫn lo:", "Bài bạn thích"
#   into "Bài chị thích", "Lưu lại để mình nhớ bạn" into "Lưu lại để em nhớ chị", "(chưa nghe thì mình đoán, gõ một chữ là đổi)" into
#   "(chưa nghe thì em đoán, …)"; anh–em the same with "anh". map.ok ("Chạy thử 4 tuần nhé.") has no subject, so it reads the same in any pair; regional
#   particles follow the coach (nhé · nha · nghe), so exact-string regexes leave room for a particle or a pronoun.
#   Pairs (persona.toml xung_ho): proof-coach chị–em (Bắc), hanh-android-free-nocomputer chị–em (Bắc), consultant anh–em
#   (Trung, near neutral), service-biz anh–em (Trung, Quảng), tuan-multihat-plus anh–em (Nam), coldstart-coach bạn–mình
#   (Nam). A "bạn" guard is used only where neither the machine's talk nor the persona's audience pronoun can hold
#   "bạn". Gone from the kit and never asserted: "Mình sẽ đăng: …", "Đăng theo quyết định của bạn · mình lưu ý", "Link …
#   mình không mở được ở đây nên không đoán", the old liked.copy_note / compare_note wording, the old Map labels
#   (MỘT THÔNG ĐIỆP, 3 Ý LỚN, ĐƯỢC BIẾT ĐẾN VÌ, ĐỂ SAU on the Map), the 7-line check, the stop point and wrap-up,
#   "quá ~10 phút", QUAY HÔM NAY after "ok", the early win "Câu {n} đăng được luôn", liked.invite (no such string).
# - Status lines (wf15 §2, §CM-EDGE IN DƯỚI BÀI, I3): a Ready or downgraded piece prints only its content. At most one
#   line under a piece, and only for "Cần bạn · …" (one a reply), a hard stop ('Câu "…" mình không viết: …'), "cứ đăng"
#   (verdict.override 'Đăng theo ý bạn · mình vẫn lo: {defect} · đã ghi lại.') or a required dated note (the F1 copy or
#   compare note, cta.platform_note for a coach-chosen "chấm" or threshold). The coach's own draft checked on request
#   ("đăng được chưa em?") still gets one Sẵn sàng or Bản nháp line. A case never detects a delivered piece by its
#   status line: it uses a copy box, an "N<digit> ·" label, field lines (Chữ trên màn hình, Câu đầu, Caption, Trang 1,
#   Tiêu đề) or a format title, and forbids the VÌ SAO RA KHÁCH, "✓ Đã kiểm:", "Sẵn sàng …" and "Bản nháp ·" lines with
#   not_regex. `verdict` "Ready" / "Ready-downgraded" is hidden state (evals/run.py checks that no status line prints);
#   "Override" on an F1 request is hidden state too (logged, shown on "tại sao?").
# - "tại sao?" follow-ups: input "[turn 1] <the turn that prints the piece or the Map>" and "[turn 2] tại sao?".
#   Assertions run on the "tại sao?" reply (§CM-EDGE "tại sao?"): for a piece, the WHY line ('VÌ SAO RA KHÁCH:
#   "{niềm tin cũ, chữ khách}" → "{niềm tin mới}" · dẫn tới: {bước kế}', plan.kit-week 5), what it was written from
#   ("Sẵn sàng {verb} · viết từ …", "… · viết thành …", liked.evidence) and "✓ Đã kiểm:", with the record ("Kết quả:
#   ĐẠT|CHƯA ĐẠT"); for the Map, why this one and ĐỂ SAU with plain reasons (§CM-MAP). I3 grades the turn-1 reply.
# - Day 0 (start-block NGÀY 0; acceptance [day0], graders.py day0_timing): reply 1 promise + mic tip + the xưng hô
#   question → the dump prompt (its hint list ends "· đăng ở đâu, có danh sách Zalo, email chưa.") → after chunk 1 the
#   early win (the best line in a copy box + "Câu này hôm nay đăng luôn cũng được.") → later chunks "Mình nhận rồi." +
#   one gợi ý → past ~1.200 tiếng the soft cut dump.enough with the first câu đoán → only the missing facts (≤3, one a
#   message, "Mình đoán: …. Đúng không?") → ONE reply: the 4-line Bản đồ (ĐIỀU KHÁCH NHỚ · 3 CHỦ ĐỀ · TỪ KHOÁ · GIỌNG),
#   QUAY HÔM NAY under it and map.ok "Chạy thử 4 tuần nhé. OK hay sửa một dòng?" (K2) → any coach message but a
#   Map change gets all of Tuần 1, with setup.plan_guess named once above it → Brand Card + card.save_line → TIẾP. A
#   "lát nữa" before the card prints the card and save line at once; Tuần 1 waits for "tiếp". Budgets: the Map within 7
#   coach turns, film-ready by active minute 20, at most 10 coach turns.
# - `invariants` lists I1-I23 ids (I19 copy runs, I20 unopened links, I21 the angle card's evidence, I22 no monitoring
#   promise, I23 voice). graders.py also runs its deny_list (locales/vn/deny-list.txt: "router", "§CM", "trụ cột",
#   Bank IDs, swipe, trung vị, LIKED …), quit_triggers and vn_natural on every transcript, and day0_timing on Day-0
#   runs.
# - "Brand Card v1 present (persona default)" means the Day-0 Map the persona's expected.toml describes (keyword, quà,
#   offer, cta_style, talk day, why_this_one and not_now in the machine block), saved as a project source (Door B: in
#   the chat and in the MY CONTENT MACHINE box). Day 0 for every VN persona is Monday 12 Oct 2026 (stats-w1.csv), so
#   Week 1 = 12-16 Oct, Week 2 = 19-23 Oct, Week 3 = 26-30 Oct, and Friday 30 Oct is the last Friday of the month. Talk
#   days: proof-coach thứ Ba; hanh-android-free-nocomputer and tuan-multihat-plus thứ Hai; coldstart-coach, consultant
#   and service-biz Chủ nhật. hanh-android-free-nocomputer runs Door B until Linh moves her into a project on Week-1
#   day 4 (brain.vn.012). "GROW added" means the area's level-up file (Level-ups/LAUNCH-VN.md, RESEARCH-VN.md, BOARD-VN.md or STRATEGY-VN.md) is a project source (L4).
# - Keywords and gifts (expected.toml): proof-coach LÃI ẢO + Sổ 3 Cột bản 1 trang; coldstart-coach CỨNG ĐƠ + 3 động
#   tác 5 phút; consultant TUYỂN HOÀI + phiếu việc 1 trang; hanh NGẠI CHÀO + 5 câu nói thật khi cầm gương; service-biz
#   PHÁT SINH + danh sách 7 chỗ hay phát sinh; tuan GỒNG LÃI + bảng tính ngược 1 trang.
# - F1 (DECISIONS.md, 5 Oct 2026; wf13 §0): copying sentences from someone else's post, translating a foreign post to
#   repost, or a comparison that names another business, when the coach asks explicitly, is done with ONE dated note
#   (liked.copy_note "Lưu ý ({date}): bài này bám sát bài của họ. Bài na ná dễ bị giảm hiển thị, mà chữ cũng là của
#   họ. Đăng hay không tuỳ bạn." / liked.compare_note "Lưu ý ({date}): so sánh mà nêu tên doanh nghiệp khác thì có thể
#   phạm luật quảng cáo. Đăng hay không tuỳ bạn.") and a logged Override that is never printed (wf15 §2, R7). Those
#   cases are MUST-NOT-BLOCK: they assert the piece, the note, a date within 300 characters of it and that the note
#   appears once. Still hard-blocked: someone else's results, testimonials, numbers or story as the coach's own;
#   attacks on private individuals or protected groups; fake scarcity; unsubstantiated income or health claims.
#   Comment-keyword CTAs, "chấm" and thresholds are never blocked.
#
# Counts: 110 cases. ROUTE 64 (every module at least once; state-dependent "tiếp" first; router.vn.102 was added
# after the first pass and sits with the ROUTE set; Day 0 in the K2 order 103-105 and 110; "tại sao?" by state
# 107-109), TRIGGER 30 ("tại sao?" after a Ready short 106), NON-TRIGGER 13, P 3 (no set).

[meta]
module = "router"
edition = "vn"
written_by = "qa-role"

# ================================================================ ROUTE set: state decides what "tiếp" opens

[[case]]
id = "router.vn.001"
kind = "D"
persona = "tuan-multihat-plus"
lanes = ["S1", "S0", "floor"]
title = "'tiếp' in a project with no Brand Card starts setup, never a weekly job"
context = "Door A done on chatgpt.com in Chrome on his Windows laptop (ChatGPT Plus): project “Content Machine”, VN instruction block saved, CONTENT-MACHINE-VN.md added (S1) or not (S0). New chat inside the project. No Brand Card in the sources and nothing said yet. Tuấn skipped the Bắt đầu copy button and typed the word he remembered from the setup page."
input = '''tiếp'''
contains = []
not_contains = []
regex = [
  '''\A\s*◆ Content Machine · Kiểm tra cài đặt: ✓ hướng dẫn''',
  '''Hôm nay mình làm 3 việc''',
  '''(?i)anh, chị hay bạn''',
  '''TIẾP →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?i)buổi nói chuyện tuần''',
  '''(?i)bài của hôm nay|số liệu tuần này|kế hoạch tháng''',
  '''VÌ SAO RA KHÁCH''',
  '''TIẾP →[\s\S]*TIẾP →''',
]
verdict = ""
invariants = ["I1", "I4", "I5", "I15"]
max_words = 0
max_chars = 0
max_questions = 1
notes = """route: setup (route set). arch §7.4 row 1 'No Brand Brain → Setup'; UX §4 'tiếp' does everything, and with no Brand Card the only job that can run is setup: strings setup.check (S0 never ticks the method file, setup.vn.002), then the 3-line VN promise and the xưng hô question in a neutral pronoun (UX §2 minute 0; setup.vn.003). A weekly job here would run with no memory."""

[[case]]
id = "router.vn.002"
kind = "D"
persona = "coldstart-coach"
lanes = ["S1", "floor"]
title = "'tiếp' after a ChatGPT Free limit resumes Day 0 at Tuần 1, not at Bắt đầu: the plan guess above it, nothing under the pieces"
context = '''Day 0, Monday 12 Oct 2026, ChatGPT Free on her iPhone (a friend did Door A on a laptop; the project opens in the phone app); pair bạn–mình, Nam. The Day-0 decision reply came (K2): the 4-line Bản đồ, QUAY HÔM NAY under it and 'Chạy thử 4 tuần nhé. OK hay sửa một dòng?'; ChatGPT Free hit its limit right after, before Minh Anh answered. Nothing of Tuần 1 has been printed; no Brand Card yet. About 5 hours later, after her evening class, she opens the same chat.'''
input = '''tiếp'''
contains = []
not_contains = []
regex = [
  '''(?ms)(?:^[ \t]*(?:```|~~~).*?){4}''',
  '''\(chưa nghe thì (?:em|mình) đoán, (?:anh |chị |bạn )?gõ một chữ là đổi\)''',
  '''TIẾP →[^\n]*\s*\Z''',
]
not_regex = [
  '''Kiểm tra cài đặt''',
  '''(?i)xả hết''',
  '''(?i)anh, chị hay bạn''',
  '''(?i)(làm lại|bắt đầu lại|kể lại) từ đầu''',
  '''(?m)^\W*QUAY HÔM NAY\b''',
  '''(?im)^\W*(?:ĐIỀU KHÁCH NHỚ|3 CHỦ ĐỀ|TỪ KH(?:OÁ|ÓA)|GIỌNG)(?: CỦA \w+)?:''',
  '''(?i)nhẹ nhàng hơn\s*\?''',
  '''(?i)chưa (?:kịp )?quay[^.!?\n]{0,30}\?''',
  '''(?i)(?:muốn|làm|viết)[^\n?]{0,25}tuần 1[^\n]*\?''',
  '''(?im)^\W*(?:Sẵn sàng (?:quay|đăng|gửi)\b|Bản nháp ·|✓ Đã kiểm:)''',
  '''VÌ SAO RA KHÁCH''',
]
verdict = ""
invariants = ["I1", "I3", "I5", "I15", "I17"]
max_words = 0
max_chars = 0
max_questions = 1
notes = """route: setup (route set). arch §7.4 row 2 'SETUP incomplete → resume at the first unticked step'; §CM-TODAY 1 'Ngày 0 còn dở: bước kế (§CM-SETUP 9) … không hỏi lại, không in lại'; persona behaviour ('bản free hay hết lượt, quay lại buổi tối cùng đoạn chat và gõ tiếp'). K2 (DECISIONS 6 Oct 2026): QUAY HÔM NAY came in the Map reply, so she left with today's video; the next step is Tuần 1 (start-block step 7: it comes on any answer but a change; ChatGPT Free may split it, ≤3 pieces a reply, so at least 2 copy boxes here), with what the dump left unheard guessed once above it (setup.plan_guess '… (chưa nghe thì mình đoán, gõ một chữ là đổi).', §CM-SETUP 5). Neither the Map nor QUAY HÔM NAY is shown again, nothing restarts, the pieces print with nothing under them (wf15 §2, R1, R4) and no question about Week 1 or the plan is asked."""

[[case]]
id = "router.vn.003"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "floor"]
title = "Door B, back mid-dump with 'tiep em oi': the dump resumes with one gợi ý, nothing restarts"
context = '''Day 0, Monday 12 Oct 2026, Door B: ChatGPT Free app on her Android phone, no project; pair chị–em, Bắc. Reply 2 (the dump prompt in chị–em) and the early win after dump chunk 1 ('Em nhận rồi. 3 câu đáng tiền chị vừa nói:', her best line in a copy box with 'Câu này hôm nay đăng luôn cũng được.', two more in quotes, 'Chị cứ kể tiếp, hết thì gõ 'xong'.') were sent. During chunk 2 she told Linh she had to serve a customer and left. 35 minutes later she comes back to the same chat and types without diacritics.'''
input = '''tiep em oi'''
contains = []
not_contains = []
regex = [
  '''(?i)kể tiếp|nói tiếp|gõ\s+["“‘']?xong''',
  '''TIẾP →[^\n]*\s*\Z''',
]
not_regex = [
  '''Kiểm tra cài đặt''',
  '''(?i)anh, chị hay bạn''',
  '''(?i)(kể|nói) lại (từ đầu|hết)''',
  '''(?i)(?<!\w)(?<!kết )bạn(?!\w)(?!\s+bè)''',
  '''(?i)(?<!\w)(dự án|project)(?!\w)''',
  '''(?i)(?<!\w)(chi oi|ke tiep|em nhan|noi tiep)(?!\w)''',
  '''(?im)^\W*(?:ĐIỀU KHÁCH NHỚ|3 CHỦ ĐỀ|TỪ KH(?:OÁ|ÓA)|GIỌNG)(?: CỦA \w+)?:''',
  '''(?i)3 câu đáng tiền''',
]
verdict = ""
invariants = ["I1", "I5", "I15", "I17"]
max_words = 110
max_chars = 0
max_questions = 1
notes = """route: setup (route set). arch §7.4 row 2 resume; §CM-TODAY 1 ('"tiếp", "ok rồi", tin bị cắt: bước hay bài đầu còn dở; không hỏi lại, không in lại'); start-block step 3: after the early win, later chunks get 'Mình nhận rồi.' + one gợi ý, so the resume is one gợi ý or dump.keep_going ('Cứ kể tiếp, hết thì gõ 'xong'.'), never the early win again and never the Map yet; persona behaviour (interrupted every 20-30 min, comes back with 'tiếp em ơi' or types without diacritics). Door B never mentions a project (UX §1.4). The answer stays in full Vietnamese with diacritics and in chị–em (she quits when called 'bạn')."""


# Eval cases: router (which job a coach turn opens: the ROUTE, TRIGGER and NON-TRIGGER sets), VN edition.
# Written by the QA role before core/router.toml, the VN start block and modules/vn/* exist. Producers never
# edit this file. Personas: evals/personas/vn/<id> (never evals/personas/heldout).
#
# Sources: docs/research/wf11-ux-spec.md §1.4 (Door B), §2 (reply rules; Day-0 order and its VN lines), §3 (weekly
# loop, monthly plan, level-ups L0.5-L5), §4 (the 5 phrases tiếp · lưu lại: … · số liệu tuần này · viết lại giọng
# mình · mình bị kẹt, plus ok · bỏ qua · lát nữa · nhẹ; "tiếp" does everything: resume setup, today's piece, the
# Talk, catch-up, plan next month, the next level-up; what the coach never sees), §5.12 (router.toml keeps every
# old phrase as a synonym), §5.14 (Sheets-first for VN ChatGPT + VA); docs/research/arch-final-spec.md §4 (module
# triggers), §6 (VN commands kept as synonyms: "Content Machine: tiếp theo làm gì?", "Viết kịch bản: …", "Cài lịch
# tự động", "Chạy batch thứ Hai", "Sao content chưa ra khách?", "Lên kế hoạch tháng sau", "Nghiên cứu khách hàng
# của mình"), §7.4 ("What's next?" order: no Brand Card → setup; setup incomplete → resume; launch state → today's
# launch item; a due job not OK → catch-up); docs/research/wf12-qa-spec.md §2.4-§2.5 (VN verdict lines, tại sao?,
# cứ đăng, bỏ qua, sửa N2, làm lại), §2.8 (không giống mình:, mình có nói, gửi góp ý), §4 (VN checklists; monthly
# re-plan ticks), §5.2 (I1-I18), §5.3 (router: 40 routes + 20 trigger + 10 non-trigger; route ≥95%, trigger ≥90%,
# false trigger ≤10%); docs/research/wf13-inspiration-spec.md §0 (F1-F4), §2 (VN liked.* and angle.* lines), §3
# (Day 0 = liked.day0; invites), §4 (Detect order, SAVE / MAKE, closing the source, ANGLE evidence), §5 (machine
# rules), §6 (I19-I22, router +10); docs/DECISIONS.md; docs/PLAN.md; evals/acceptance.toml [router];
# strings/vn.toml (setup.check, next.prefix, why.prefix, checked.prefix, verdict.*, cmd.*, anchor.*, ics.*);
# locales/vn/deny-list.txt and banned-tells.txt.
#
# Conventions (as in setup.vn.toml and message.vn.toml; read with evals/README.md "Case files"):
# - input: coach turns in order, separated by a line holding only "---". "<<paste: FILE …>>" = the simulator
#   inlines that persona file (or the named block) verbatim there; persona files are named <persona-id>/<file>.
#   "<<screenshot: …>>" = the coach attaches one image showing exactly what the description lists and nothing
#   else; on a text-only stand-in the simulator sends "[ảnh] " plus the description.
# - context: the state when `input` starts (day, week, which Brand Card, GROW and board sources exist) and what
#   the machine said last. Context, titles and notes are English for the QA team; every coach turn and every
#   expected phrase is Vietnamese, in the persona's region (Bắc, Trung, Nam) and pronoun pair.
# - D assertions run on the machine reply to the LAST coach turn, unless notes starts with a scope:
#     "scope: transcript"  all machine replies of the case joined (contains = somewhere,
#                          not_contains / not_regex = nowhere)
#     "scope: pieces"      only text above verdict lines, split the way graders.py splits pieces
#     "scope: visible"     coach-visible text (graders.py drops the "cho máy" block)
#   max_words / max_chars / max_questions always count the coach-visible text of the last reply.
# - The set a case counts toward is named in `notes`, right after any scope prefix:
#     "route: <module> (route set)"       ROUTE: this turn, in this state, must open that module's job
#     "route: <module> (trigger set)"     TRIGGER: a taught phrase or universal word must fire its job
#     "route: none (non-trigger set)"     NON-TRIGGER: no job fires; a brief answer and one TIẾP line
#     "route: <module> (no set)"          P spot checks of a routed job's output; not counted by [router]
#   <module> is one of: setup message brain character signature research ideas plan talk fmt-short fmt-long
#   packaging convert launch-plan launch-scripts edge-rubric humanize guardrails review hub automation levelup
#   liked. Every ROUTE and TRIGGER case carries at least one regex on an element that only that job's VN reply
#   has; route accuracy, trigger rate and false-trigger rate are scored from them (acceptance.toml [router]).
#   A ROUTE case whose turn is also a taught phrase ("tiếp", "số liệu tuần này") tests the state-dependent
#   branch; the TRIGGER set tests the phrase itself, with and without diacritics and with typos ("tiep", "tíep",
#   "luu lai:", "so lieu", "tai sao", "minh bi ket"). Whatever the coach typed, the machine answers in full
#   Vietnamese with diacritics; cases with an unaccented input carry a not_regex on unaccented machine words.
# - contains: case-insensitive substring after NFC. regex / not_regex: Python re on the full reply text (copy
#   boxes and paste blocks included), case-sensitive unless the pattern starts with (?i). Vietnamese word edges
#   are written (?<!\w)…(?!\w).
# - A per-line guard (?im)^(?![^\n]*(?:không viết|không bịa|…))[^\n]*X reads "any line holding X must be the
#   refusal line", mirroring graders.py REFUSAL_RE ("không viết", "mình không bịa"), because verdict.hardstop
#   ('Câu "{line}" mình không viết: …') quotes the line it refuses.
# - Pronoun-dependent strings are asserted in the pair the coach chose (default mình–bạn): chị–em turns "Cần bạn"
#   into "Cần chị", "Mình sẽ đăng" into "Em sẽ đăng", "Đăng theo quyết định của bạn · mình lưu ý" into "… của chị ·
#   em lưu ý", "Bài bạn thích" into "Bài chị thích", "Câu … mình không viết" into "Câu … em không viết"; anh–em the
#   same with "anh". Pairs (persona.toml xung_ho): proof-coach chị–em (Bắc), hanh-android-free-nocomputer chị–em
#   (Bắc), consultant anh–em (Trung, near neutral), service-biz anh–em (Trung, Quảng), tuan-multihat-plus anh–em
#   (Nam), coldstart-coach bạn–mình (Nam). A "bạn" guard is used only where neither the machine's talk nor the
#   persona's audience pronoun can hold "bạn".
# - `invariants` lists I1-I18 ids only (wf13 I19-I22 are named in notes). graders.py also runs its deny_list
#   (locales/vn/deny-list.txt: "router", "§CM", "trụ cột", Bank IDs, swipe, trung vị, LIKED …) and quit_triggers
#   checks on every transcript.
# - "Brand Card v1 present (persona default)" means the Day-0 Map the persona's expected.toml describes (keyword,
#   quà, offer, cta_style, talk day), saved as a project source (Door B: in the chat and in the MY CONTENT MACHINE
#   box). Day 0 for every VN persona is Monday 12 Oct 2026 (stats-w1.csv), so Week 1 = 12-16 Oct, Week 2 = 19-23
#   Oct, Week 3 = 26-30 Oct, and Friday 30 Oct is the last Friday of the month. Talk days: proof-coach thứ Ba;
#   hanh-android-free-nocomputer and tuan-multihat-plus thứ Hai; coldstart-coach, consultant and service-biz Chủ
#   nhật. hanh-android-free-nocomputer runs Door B until Linh moves her into a project on Week-1 day 4
#   (brain.vn.012). "GROW added" means Level-ups/GROW-VN.md is a project source (L4).
# - Keywords and gifts (expected.toml): proof-coach LÃI ẢO + Sổ 3 Cột bản 1 trang; coldstart-coach CỨNG ĐƠ + 3
#   động tác 5 phút; consultant TUYỂN HOÀI + phiếu việc 1 trang; hanh NGẠI CHÀO + 5 câu nói thật khi cầm gương;
#   service-biz PHÁT SINH + danh sách 7 chỗ hay phát sinh; tuan GỒNG LÃI + bảng tính ngược 1 trang.
# - F1 (DECISIONS.md, 5 Oct 2026; wf13 §0): copying sentences from someone else's post, translating a foreign
#   post to repost, or a comparison that names another business, when the coach asks explicitly, is done with
#   ONE dated note (liked.copy_note "Lưu ý: bài này bám sát bài của họ. Nền tảng có thể giảm hiển thị bài giống
#   bài khác, và chữ là của họ. Đăng hay không là quyền của bạn." / liked.compare_note "Lưu ý: so sánh có nêu tên
#   doanh nghiệp khác có thể vi phạm luật quảng cáo. Đăng hay không là quyền của bạn.", wf13 §2, dated through
#   platform-notes) and a logged Override. Those cases are MUST-NOT-BLOCK: they assert the piece, the note, a
#   date within 300 characters of it and that the note appears once. Still hard-blocked: someone else's
#   results, testimonials, numbers or story as the coach's own; attacks on private individuals or protected
#   groups; fake scarcity; unsubstantiated income or health claims. Comment-keyword CTAs, "chấm" and
#   thresholds are never blocked.
#
# Counts: ROUTE 57 (every module at least once; state-dependent "tiếp" first; router.vn.102 was added last and
# sits with the ROUTE set), TRIGGER 29, NON-TRIGGER 13, P 3 (no set).

[meta]
module = "router"
edition = "vn"
written_by = "qa-role"

# ================================================================ ROUTE set: state decides what "tiếp" opens

[[case]]
id = "router.vn.001"
kind = "D"
persona = "tuan-multihat-plus"
lanes = ["S1", "S0", "floor"]
title = "'tiếp' in a project with no Brand Card starts setup, never a weekly job"
context = "Door A done on chatgpt.com in Chrome on his Windows laptop (ChatGPT Plus): project “Content Machine”, VN instruction block saved, CONTENT-MACHINE-VN.md added (S1) or not (S0). New chat inside the project. No Brand Card in the sources and nothing said yet. Tuấn skipped the Bắt đầu copy button and typed the word he remembered from the setup page."
input = '''tiếp'''
contains = []
not_contains = []
regex = [
  '''\A\s*◆ Content Machine · Kiểm tra cài đặt: ✓ hướng dẫn''',
  '''Hôm nay mình làm 3 việc''',
  '''(?i)anh, chị hay bạn''',
  '''TIẾP →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?i)buổi nói chuyện tuần''',
  '''(?i)bài của hôm nay|số liệu tuần này|kế hoạch tháng''',
  '''VÌ SAO RA KHÁCH''',
  '''TIẾP →[\s\S]*TIẾP →''',
]
verdict = ""
invariants = ["I1", "I4", "I5", "I15"]
max_words = 0
max_chars = 0
max_questions = 1
notes = """route: setup (route set). arch §7.4 row 1 'No Brand Brain → Setup'; UX §4 'tiếp' does everything, and with no Brand Card the only job that can run is setup: strings setup.check (S0 never ticks the method file, setup.vn.002), then the 3-line VN promise and the xưng hô question in a neutral pronoun (UX §2 minute 0; setup.vn.003). A weekly job here would run with no memory."""

[[case]]
id = "router.vn.002"
kind = "D"
persona = "coldstart-coach"
lanes = ["S1", "floor"]
title = "'tiếp' after a ChatGPT Free limit resumes Day 0 at Tuần 1, not at Bắt đầu"
context = "Day 0, Monday 12 Oct 2026, ChatGPT Free on her iPhone (a friend did Door A on a laptop; the project opens in the phone app). The Map was shown with QUAY HÔM NAY under it; ChatGPT Free hit its limit right after, before Minh Anh answered. About 5 hours later, after her evening class, she opens the same chat."
input = '''tiếp'''
contains = []
not_contains = []
regex = [
  '''(?ms)(?:^[ \t]*(?:```|~~~).*?){4}''',
  '''TIẾP →[^\n]*\s*\Z''',
]
not_regex = [
  '''Kiểm tra cài đặt''',
  '''(?i)xả hết''',
  '''(?i)anh, chị hay bạn''',
  '''(?i)(làm lại|bắt đầu lại|kể lại) từ đầu''',
  '''(?m)^\W*QUAY HÔM NAY\b''',
  '''(?im)^\W*(?:ĐIỀU KHÁCH NHỚ|3 CHỦ ĐỀ|TỪ KH(?:OÁ|ÓA)|GIỌNG):''',
  '''(?i)nhẹ nhàng hơn\s*\?''',
  '''(?i)chưa (?:kịp )?quay[^.!?\n]{0,30}\?''',
]
verdict = ""
invariants = ["I1", "I3", "I5", "I15", "I17"]
max_words = 0
max_chars = 0
max_questions = 1
notes = """route: setup (route set). arch §7.4 row 2 'SETUP incomplete → resume at the first unticked step'; persona behaviour ('bản free hay hết lượt, quay lại buổi tối cùng đoạn chat và gõ tiếp'); UX §2 budget (save points on free tiers). K2 (DECISIONS 6 Oct 2026): QUAY HÔM NAY came in the Map reply, so she left with today's video; the next step is Tuần 1 (VN start-block step 7: it comes on any answer but a change; ChatGPT Free may split it, so at least 2 copy boxes here). Neither the Map nor QUAY HÔM NAY is shown again and nothing restarts. Only the trigger, context and order changed here; the rest waits for the VN rewrite."""


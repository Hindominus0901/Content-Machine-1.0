context = "Day 0, Monday 12 Oct 2026, Door B: ChatGPT Free app on her Android phone, no project. Reply 2 (dump prompt in chị–em) and the early win after dump chunk 1 were sent. During chunk 2 she told Linh she had to serve a customer and left. 35 minutes later she comes back to the same chat and types without diacritics."

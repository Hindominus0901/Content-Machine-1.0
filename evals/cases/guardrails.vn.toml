regex = [
  '(?im)^\W*Câu\s+["“][^"”\n]*(?:gấp đôi|3 tỷ 8|1 tỷ 9|mua sớm)[^"”\n]*["”]\s+em\s+không viết',
  '(?i)mua cái để che|tính trước|(?<!\w)che(?!\w)|tiền góp|góp nổi',

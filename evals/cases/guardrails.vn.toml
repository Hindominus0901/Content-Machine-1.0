  '(?im)^(?![^\n]*(?:không viết|không ghi|không dùng|không đưa|không tự bịa|không bịa))[^\n]*(?:gấp đôi|1 tỷ 9|1,9 tỷ|3 tỷ 8|3,8 tỷ|mua sớm là lời)',
]
verdict = "Hard stop"
invariants = ["I1", "I3", "I5", "I8", "I11", "I15", "I17"]

# evals/cases/message.vn.toml · Message Focus Engine, VN edition: brain-dump prompt and early win,
# joggers, inventory, the 7-line check, the 6 questions (probe, bet, skip), the multi-income bridge,
# the Map screen ("MỘT THÔNG ĐIỆP · 3 Ý LỚN · ĐỂ SAU", "Mình chạy thử 4 tuần"), its 6 tests, NOT NOW
# reasons, the keyword pick, the one decision, objections, drift handling and the side door.
# Sources: docs/research/wf11-message-focus.md §1–§4, docs/research/wf11-ux-spec.md §2 and §5 items
# 5, 17, docs/research/wf12-qa-spec.md §3.1 (message-map, signature-keyword), locales/vn/deny-list.txt.
# Written by the QA role before modules/vn/message.md exists. Personas: evals/personas/vn/<id>.
#
# How to read a case (shared by setup.vn, message.vn and brain.vn):
# - input: coach turns in order, separated by a line holding only "---".
#   "<<paste: FILE …>>" = the simulator inlines that file (or the named section) verbatim there;
#   persona files are named <persona-id>/<file>, dist files "the rendered VN <file>".
#   "<<simulator: …>>" = the coach side keeps going under evals/README.md "Lanes and simulated runs".
# - context: the state when `input` starts, including what the machine has already said.
# - D assertions run on the machine reply to the LAST coach turn, unless notes starts with a scope:
#     "scope: transcript"  all machine replies of the case joined (contains = somewhere,
#                          not_contains / not_regex = nowhere)
#     "scope: pieces"      only text above verdict lines, split the way graders.py splits pieces
#     "scope: visible"     coach-visible text (graders.py drops the "cho máy" block)
#   max_words / max_chars / max_questions always count the coach-visible text of the last reply.
# - contains: case-insensitive substring after NFC. regex / not_regex: Python re, case-sensitive
#   unless the pattern starts with (?i). A per-line guard such as (?im)^(?!.*không viết).*cam kết
#   reads "any line holding the phrase must be a refusal line".
# - Coach-facing names win over design-doc names: "ý lớn", never "Trụ n"; no Bank IDs such as X-9;
#   plain NOT NOW reasons, never the codes (locales/vn/deny-list.txt, UX §4 "Never sees").
# - The 7-line check shows "?" placeholders by design; graders.py must not count them for I5, so
#   cases that end on the check carry no max_questions.

[meta]
module = "message"
edition = "vn"
written_by = "qa-role"

# ---------------------------------------------------------------- dump prompt, early win, joggers

[[case]]
id = "message.vn.001"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "Dump prompt in chị–em with the topic hints and 'gõ xong'"
context = "Door A, ChatGPT Plus. Reply 1 asked 'anh, chị hay bạn?'. Nothing dumped yet."
input = """chị"""
contains = ["câu khách hỏi đi hỏi lại", "ngứa mắt", "sóng âm"]
regex = ['''(?i)gõ\s+['"“‘]xong''', '(?i)(trả giá|phải trả giá)', '(?i)(đang bán gì|chưa bán gì|chưa có)']
not_regex = ['(?i)(?<!\w)bạn(?!\w)', '(?i)(điền|trả lời)\s+(lần lượt|từng câu)']
invariants = ["I1", "I2", "I5", "I15", "I17"]
max_questions = 1
notes = "wf11-message-focus §1.2 VN dump prompt (talk, don't answer); UX §2 minute 0–1 VN line. A numbered questionnaire here is a template-fill ask (I2)."

[[case]]
id = "message.vn.002"
kind = "D"
persona = "tuan-multihat-plus"
lanes = ["S0", "S1", "floor"]
title = "Early win after chunk 1: '3 câu đáng tiền anh vừa nói', verbatim, one jogger"
context = "Door A, ChatGPT Plus; he dictates from the iPhone app. Reply 2 (dump prompt in anh–em) delivered."
input = """<<paste: tuan-multihat-plus/answers.md, the '## Dump chunk 1' section verbatim>>"""
contains = ["3 câu đáng tiền anh vừa nói", "đăng được luôn", "chưa kể"]
regex = ['''(?i)gõ\s+['"“‘]xong''']
not_regex = ['(?i)(tuyệt vời|xuất sắc|rất hay|hay quá|câu chuyện cảm động)', '(?i)(?<!\w)tôi(?!\w)']
invariants = ["I1", "I5", "I9", "I10", "I15", "I17"]
max_words = 160
max_questions = 1
notes = "UX §2 minute 1–4 EARLY WIN (fixes the minute 8–10 quit point; Tuấn: 'trong 10 phút phải thấy cái gì đó'); acceptance [day0] early_win_max_minutes_after_dump_start = 4 (t_min). I9: each of the 3 lines is a verbatim substring of chunk 1, ≤25 tiếng."

[[case]]
id = "message.vn.003"
kind = "D"
persona = "service-biz"
lanes = ["S0", "S1", "floor"]
title = "Early win from a noisy Quảng-accent dictation: clean lines quoted, slips never echoed"
context = "Door B, ChatGPT Free on Android; Gboard mic in the workshop. Reply 2 (dump prompt in anh–em) delivered."
input = """<<paste: service-biz/answers.md, the '## Dump chunk 1' section verbatim>>"""
contains = ["3 câu đáng tiền anh vừa nói"]
not_contains = ["báo da", "chống thắm", "tới chờ"]
not_regex = ['(?i)(chữ|từ)\s+["“]?báo da']
invariants = ["I1", "I5", "I9", "I15"]
max_words = 160
max_questions = 1
notes = "wf11-message-focus §1.1 rule 6: fix only obvious speech-to-text errors, confirm only an unclear word. The 3 quoted lines come from clean passages (I9 verbatim); 'báo da' (báo giá), 'chống thắm', 'chờ' (chừ) are obvious and are neither quoted nor asked about."

[[case]]
id = "message.vn.004"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "S1", "floor"]
title = "Jogger after a chunk with staff talk: 'Linh ơi…' and the client's name never enter the reply"
context = "Door B. Early win after chunk 1 delivered. Chunk 2 ends with her talking to the receptionist and leaving ('chi ra tiep khach ti…')."
input = """<<paste: hanh-android-free-nocomputer/answers.md, the '## Dump chunk 2' section verbatim>>"""
contains = ["chị"]
not_contains = ["Duyên", "Linh ơi", "tầng 2"]
not_regex = ['(?i)(?<!\w)bạn(?!\w)', '(?i)(nhanh lên|chị trả lời|chị gõ)\s+(ngay|luôn)']
invariants = ["I1", "I5", "I10", "I15"]
max_words = 90
max_questions = 1
notes = "expected.toml [ux] 'bỏ qua câu chị nói với nhân viên trong bản ghi'. She is away 15–40 min, so the reply is short and waits; no pressure to answer now."

[[case]]
id = "message.vn.005"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "S1", "floor"]
title = "Dictation cut off mid-word: 'bị đứt đoạn, chị nói lại thành 2 đoạn ngắn'"
context = "Door B. Chunk 1 and its early win done. This chunk stops mid-word (the voice recording hit its limit)."
input = """Ờ chị kể tiếp nhé, cái chuyện em Thảo ấy, hôm đầu tiên chị gọi video zalo cho Thảo thì spa em ấy giường trống trơn, em ấy ngồi ở quầy, sau lưng là cái kệ toàn hộp serum chưa bóc, rồi Thảo bảo chị là khách khen tay em nhẹ mà cứ để chị về suy"""
regex = ['(?i)(đứt|bị cắt|bị ngắt|mất (chữ|đoạn))', '(?i)(2|hai) đoạn']
not_regex = ['(?i)(?<!\w)bạn(?!\w)', '(?i)nói lại\s+(từ đầu|toàn bộ|hết)']
invariants = ["I1", "I5", "I15"]
max_words = 90
max_questions = 1
notes = "UX §2 minute 4–11 'If a dictation fails: say it again in 2 shorter pieces'; expected.toml [ux] line; losing a long story is Hạnh's #1 quit risk. Asking for the whole dump again fails."

# ---------------------------------------------------------------- inventory and the 7-line check

[[case]]
id = "message.vn.006"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "S1", "floor"]
title = "Inventory: she knows a lot, about 6 months of content, nothing is thrown away"
context = "Door B. Chunks 1–2 sent; she came back with 'tiep em oi'. Chunk 3 ends with 'xong rồi đấy em'."
input = """<<paste: hanh-android-free-nocomputer/answers.md, the '## Dump chunk 3' section verbatim>>"""
contains = ["Chị biết nhiều thật", "6 tháng content", "không bỏ gì"]
not_regex = ['(?i)(?<!\w)bạn(?!\w)', '(?i)(quá nhiều|lan man|loãng)']
invariants = ["I1", "I4", "I15", "I17"]
notes = "wf11-message-focus §1.3 inventory line (answers 'afraid of diluting'); UX §2 minute 11–12. Counts in this line are the machine's own counts, so I8 is not asserted here."

[[case]]
id = "message.vn.007"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "S1", "floor"]
title = "7-line check: pre-filled, at most 3 '?' lines, best result is Thảo's, not the spa client's 70%"
context = "Same as message.vn.006."
input = """<<paste: hanh-android-free-nocomputer/answers.md, the '## Dump chunk 3' section verbatim>>"""
contains = ["Lời của họ", "Cách cũ", "Kết quả tốt nhất", "theo số"]
regex = ['''(?i)gõ\s+['"“‘]ok''', '(?s)(:\s*\?.*){1}', '(?i)Zalo']
not_contains = ["doanh thu gấp đôi", "liệu chình"]
not_regex = [
  '(?s)(:\s*\?.*){4}',
  '(?i)70\s?%',
  '(?im)^(?!.*Kết quả tốt nhất).*(tốt nhất|duy nhất|cam kết)',
  '(?i)(điền vào|theo mẫu)',
]
invariants = ["I2", "I4", "I8", "I9", "I15"]
notes = "UX §2 minute 11–12 'pre-filled check, 7 lines, with ? on only 2–3 of them'; line 7 covers platform + Zalo, list size, past clients, hours, talk day, bullets or word-for-word. 'Kết quả tốt nhất' is the line label and is exempt (expected.toml compliance_scope). P7 (cô Hoa 70%) and P6 (Vân 'gấp đôi') are unusable proof; Loan's STT slip 'liệu chình' is written 'liệu trình' (persona.toml P4 note)."

[[case]]
id = "message.vn.008"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "S1", "floor"]
title = "A story instead of 'sửa 1' is taken as the fix; no demand to type a line number"
context = "Door B. The 7-line check is on screen; line 1 reads 'Ai: chủ spa mới mở, 1 cơ sở, 2–5 kỹ thuật viên'. Lines 2–6 are pre-filled; line 7 has '?' on talk day and hours."
input = """Ơ không phải các em mới mở đâu em. Có em mở ba bốn năm rồi vẫn ngại chào đấy. Như em Loan ở Hưng Yên ấy, mở spa lâu rồi, đi học chốt sale về dạy nhân viên nói theo, xong nhân viên nói câu nào khách cũng sợ, thế là Loan lại phải tự đứng quầy. Các em ấy là thợ lên làm chủ, tay nghề tốt, chỉ có mỗi cái là ngại chào thôi."""
contains = ["chị"]
regex = ['(?i)(thợ lên làm chủ|ngại chào)']
not_regex = ['''(?i)gõ\s+['"“‘]?sửa''', '(?i)(dòng (số )?mấy|sửa dòng nào)', '(?i)(?<!\w)bạn(?!\w)']
invariants = ["I1", "I5", "I15"]
max_questions = 1
notes = "Persona behaviour: 'ở bước kiểm 7 dòng không nói sửa 3 mà kể một chuyện có ý sửa ở trong'; expected.toml [ux]. The next message asks at most the next open '?' (talk day or hours), one at a time."

# ---------------------------------------------------------------- multi-income bridge

[[case]]
id = "message.vn.009"
kind = "D"
persona = "tuan-multihat-plus"
lanes = ["S0", "S1", "floor"]
title = "3 income streams: the bridge-buyer line, asked once"
context = "Door A, ChatGPT Plus. Chunks 1–3 sent; chunk 1 named insurance, apartment broking and sales training."
input = """xong em"""
contains = ["3 nguồn thu", "kiểu khách mua được nhiều món", "nguồn nào nuôi anh"]
not_regex = ['(?i)(chọn|bỏ)\s+(một|1)\s+(nghề|việc|nguồn)', '(?i)(?<!\w)tôi(?!\w)']
invariants = ["I1", "I15", "I17"]
notes = "UX §2 minute 11–12 VN line 'Anh đang có 3 nguồn thu. Em tìm MỘT kiểu khách có thể mua nhiều thứ của anh. Hoặc anh nói luôn: tháng này nguồn nào nuôi anh?'; quit point 6 (paid stream parked with no bridge). Telling him to drop a stream fails."

[[case]]
id = "message.vn.010"
kind = "D"
persona = "consultant"
lanes = ["S0", "S1", "floor"]
title = "The dump already said which stream pays: the income question is not asked again"
context = "Door A, Claude Pro. Chunks 1–2 sent. Chunk 3 says 'Tháng ni tiền chủ yếu từ gói 3 tháng'."
input = """<<paste: consultant/answers.md, the '## Dump chunk 3' section verbatim>>"""
contains = ["Anh biết nhiều thật"]
not_contains = ["nguồn nào nuôi anh"]
not_regex = ['(?i)tháng (này|ni)\s+(tiền|nguồn)', '(?i)(?<!\w)bạn(?!\w)(?!\s+(sinh viên|bè))']
invariants = ["I1", "I15", "I17"]
notes = "expected.toml [map] income_question_answer: 'máy không hỏi lại nguồn nào nuôi anh'. Re-asking what the dump said is a Tuấn/Khoa quit trigger."

# ---------------------------------------------------------------- guided questions: probe, bet, skip, refusal to narrow

[[case]]
id = "message.vn.011"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "'từng câu' switches to guided mode: Q1 with A/B/C from the dump and a stated default"
context = "Door A. The 7-line check is on screen."
input = """từng câu đi em"""
contains = ["50 người"]
regex = ['(?s)A\).*B\).*C\)', '(?i)(mặc định|em nghiêng về|em chọn|nếu chị bỏ qua|em đoán)']
not_regex = ['(?i)(?<!\w)bạn(?!\w)', '(?i)(câu 1|câu hỏi 1)\s*/\s*6']
invariants = ["I1", "I5", "I15"]
max_questions = 1
notes = "wf11-message-focus §1.4 ('từng câu' switches to guided mode) and §1.5 Q1 VN; §1.1 rule 1 'A/B/C plus a stated default'. One question per message."

[[case]]
id = "message.vn.012"
kind = "D"
persona = "coldstart-coach"
lanes = ["S0", "S1", "floor"]
title = "A hedge gets a bet: 'Nếu phải cược 1 triệu…'"
context = "Door B, ChatGPT Free, mình–bạn. Guided mode; Q1 (WHO) asked."
input = """chắc là dân văn phòng đó, mà mấy chị bầu cũng hỏi mình hoài, rồi mấy cô chú lớn tuổi đau gối nữa… mình cũng hông biết nữa, nhóm nào cũng được hết á"""
contains = ["cược 1 triệu"]
regex = ['(?i)văn phòng']
invariants = ["I1", "I5", "I15"]
max_words = 90
max_questions = 1
notes = "wf11-message-focus §1.1 rule 2 'A hedge gets a bet: Nếu phải cược 1 triệu…'. At most 1 probe per question."

[[case]]
id = "message.vn.013"
kind = "D"
persona = "coldstart-coach"
lanes = ["S0", "S1", "floor"]
title = "'bỏ qua' fills a default and the Map marks it '(mình đoán)'"
context = "Door B, mình–bạn. Guided mode. Every line is answered except Q3 (old way), which is the last open line; the next reply is the Map."
input = """bỏ qua"""
contains = ["(mình đoán)", "ĐỂ SAU"]
not_regex = ['(?i)(?<!\w)(chị|em)\s+(đoán|nghĩ)', '\b[VSPXK]-\d+\b']
invariants = ["I1", "I4", "I15"]
notes = "wf11-message-focus §1.1 rule 4 'skip always works; the machine fills a default and marks it (my guess) / (mình đoán) on the Map'. strings cmd.skip."

[[case]]
id = "message.vn.014"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "Refusing to narrow: 'Chị không mất ai đâu… chỉ chọn nội dung này viết CHO ai'"
context = "Door A. The 7-line check is on screen; line 1 proposes small online shop owners on Facebook/Shopee."
input = """Thôi em đừng bắt chị chọn mỗi một cái, chị biết nhiều thế mà chỉ nói một chuyện à?"""
contains = ["không mất ai", "Ai cũng xem được", "viết CHO ai"]
not_regex = ['(?i)(?<!\w)bạn(?!\w)', '(?i)(phải|bắt buộc)\s+chọn']
invariants = ["I1", "I5", "I15", "I17"]
max_words = 100
max_questions = 1
notes = "wf11-message-focus §1.5 fallback line VN in chị–em; her verbatim objection (persona behaviour). No lecture, no forced choice."

# ---------------------------------------------------------------- the Map screen

[[case]]
id = "message.vn.015"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "S1", "floor"]
title = "Map screen: one view, 4-week framing, plain NOT NOW, pocket version, one decision"
context = "Door B. 7-line check confirmed through stories; the last open item was line 7."
input = """thứ Hai em ạ, trưa thứ Hai spa vắng nhất. Mỗi tuần chị có tầm 2 tiếng rưỡi thôi, cho chị gạch đầu dòng, đọc nguyên văn chị không đọc được đâu."""
contains = ["MỘT THÔNG ĐIỆP", "3 Ý LỚN", "ĐỂ SAU", "chạy thử 4 tuần", "ngại chào", "chụp màn hình", "sửa dòng"]
regex = [
  '(?i)không có gì (chị|anh|bạn) biết bị bỏ phí',
  '(?i)nói đi nói lại 50 lần',
  '6\.500\.000đ|6,5 ?tr|6 triệu rưỡi',
  '(?<!\d)9(?!\d)[^\n]{0,25}chủ spa',
]
not_contains = ["liệu chình", "90 ngày", "Big Domino"]
not_regex = [
  '(?i)(?<!\w)trụ(?!\w)',
  '\b[VSPXK]-\d+\b',
  'DIFF-BUYER|DIFF-PROBLEM|NO-OFFER|TOO-EARLY|\bGENERIC\b|\bRISKY\b|\bTOOL\b',
  '(?i)(?<!\w)kh(óa|oá)\s+(thông điệp|bản đồ)',
  '(?i)(?<!\w)bạn(?!\w)',
  '(?i)(mờ nám|70\s?%|doanh thu gấp đôi)',
  'ĐỂ SAU[^\n]*\n(?:[ \t]*[·•\-–*][^\n]*\n){8}',
]
invariants = ["I1", "I4", "I5", "I8", "I9", "I10", "I15", "I17"]
max_questions = 1
notes = "UX §2 minute 17–19 MAP SCREEN and VN framing 'Mình chạy thử 4 tuần, rồi xem khách nói lại gì'; wf11-message-focus §2.1 template with coach-facing labels (3 Ý LỚN, not 3 TRỤ; deny-list bans 'Trụ n' and IDs); §2.4 reassurance VN; NOT NOW ≤7 with plain reasons; quit point 7 (no 'khóa'). The why line cites the 9 paying spa owners (persona P5)."

[[case]]
id = "message.vn.016"
kind = "P"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "S1", "floor"]
title = "Hạnh's Map passes the message-map rubric and the 6 message tests"
context = "Same as message.vn.015."
input = """thứ Hai em ạ, trưa thứ Hai spa vắng nhất. Mỗi tuần chị có tầm 2 tiếng rưỡi thôi, cho chị gạch đầu dòng, đọc nguyên văn chị không đọc được đâu."""
invariants = ["I8", "I9", "I15"]
standard = "message-map"
critical = ["MM1", "MM2", "MM6", "MM7", "MM10"]
min_score = 16
notes = "QA §3.1 message-map ≥16/20. The 6 tests (wf11-message-focus §2.2): one breath ≤50 âm tiết; problem part is her buyers' words ('ngại chào lắm'); narrow (thợ lên làm chủ, 2–5 kỹ thuật viên); swap test (method or old-way name, e.g. 'Cầm Gương Nói Thật' / 'dọa da'); ends at the 6-week class; claims-safe (no nhất / duy nhất / cam kết; 'tùy mỗi spa'). Judge reads expected.toml [map]. MM6 is checked on the hidden key belief (Brand Card key_belief), never shown."

[[case]]
id = "message.vn.017"
kind = "D"
persona = "tuan-multihat-plus"
lanes = ["S0", "S1", "floor"]
title = "Bridge-buyer Map: the apartment he must close stays on the Map, sales training gets a side door"
context = "Door A, ChatGPT Plus. Inventory + check shown with the 3-streams line; check confirmed ('ok, sửa 2') and live answers given. The open item was the income question."
input = """Đều đều thì bảo hiểm. Mà tháng này anh cần chốt căn 2 tỷ 68, hợp đồng môi giới tới 30/11."""
contains = ["ĐỂ SAU", "chạy thử 4 tuần", "gồng lãi"]
regex = ['(?i)(vợ chồng|gia đình) trẻ', '(?i)dạy sale', '(?i)(cửa phụ|bán kèm)', '2 tỷ 68|2,68 tỷ']
not_regex = [
  '(?i)view sông',
  '(?i)(giá tốt|bán gấp|căn cuối|cơ hội vàng|siêu phẩm)',
  '(?i)(lời gấp đôi|sinh lời|lãi suất đảm bảo|chưa khách nào bị từ chối)',
  '(?i)(?<!\w)trụ(?!\w)',
  '\b[VSPXK]-\d+\b',
  '(?i)(?<!\w)kh(óa|oá)(?!\w)[^.\n]{0,20}90',
]
invariants = ["I1", "I4", "I5", "I8", "I10", "I15", "I17"]

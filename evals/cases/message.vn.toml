# evals/cases/message.vn.toml · Message Focus Engine, VN edition: the Day-0 dump prompt and early win, what follows
# the dump (no inventory, no check screen: at most 3 câu đoán, one a message), the multi-income guess, the 4-line Bản
# đồ (ĐIỀU KHÁCH NHỚ · 3 CHỦ ĐỀ · TỪ KHOÁ · GIỌNG) with QUAY HÔM NAY under it and the one OK, "sửa dòng N", pushbacks
# (one line, then Tuần 1), "tại sao?" on the Map (vì sao chọn, gốc rễ, ĐỂ SAU), drift, the off-map budget and the
# side door. Written by the QA role; producers never edit this file. Rewritten 6 Oct 2026 for the simple surface
# (wf15) and Voice & Language (wf14); message.en.toml is the model.
#
# Sources: docs/research/wf15-simple-surface-spec.md §0 S1-S2, §1.2-§1.6, §2-§3 (amended: QUAY HÔM NAY comes in the
# Map reply, K2) and wf14-voice-language-spec.md §2, §4.1 (win where they differ); docs/DECISIONS.md (K2; "Long dumps,
# missing facts, an early piece to post": the soft cut at about 1,200 tiếng carries the first câu đoán, facts asked
# up front and guessed above Tuần 1, the early win's best line in a copy box, "one more story" stays open);
# docs/research/wf15-case-impact.md (R1-R18, the message.vn table); wf11-message-focus.md §1-§5 (picking, the
# one-message tests, NOT NOW reasons and return triggers, drift, anti-dilution rules); core/vn/start-block.md NGÀY 0
# 1-9 (render: python3 tools/render.py --edition vn --target kit core/vn/start-block.md); modules/vn/message.md
# (§CM-MAP), setup.md (§CM-SETUP), voice.md (§CM-VOICE), levelup.md (§CM-TODAY 1), humanize.md (§CM-NATURAL);
# strings/vn.toml (map.known "ĐIỀU KHÁCH NHỚ:", map.topics "3 CHỦ ĐỀ:", map.word "TỪ KHOÁ:", map.voice "GIỌNG:",
# map.ok, dump.*, setup.guess*, setup.multi_income, setup.plan_guess, setup.cut_off, check.pick, film.now_or_text,
# message.*, verdict.*, why.prefix, checked.prefix, resume.brb).
#
# Coach-facing names (locales/vn/deny-list.txt): "chủ đề n" on the Map ("ý lớn n" still accepted in later chats),
# never "Trụ n"; no Bank IDs (X-9) or reason codes (DIFF-BUYER…), only the plain message.reason.* words; "Chạy thử 4
# tuần", never "khoá 90 ngày". Scores (TIỀN, LỜI, BẰNG CHỨNG, KHÁC, HẸP, HỨNG), the runner-up and candidate tables
# stay hidden, "tại sao?" included.
#
# Conventions (read with evals/README.md "Case files"):
# - `input` holds the coach turn(s); lines starting "[turn n]" split several turns (evals/run.py). `context` is
#   self-contained: the state when `input` starts, including what the machine already said. Assertions run on the
#   reply to the last coach turn, unless `notes` opens with "scope: transcript" (all machine replies of the case
#   joined: contains / regex somewhere, not_* nowhere), "scope: each reply" (a whole run: regex in at least one
#   reply, not_* and max_* in every one) or "scope: pieces".
# - "<<paste: FILE …>>" = the simulator inlines that persona file (or the named section) verbatim; persona files are
#   <persona-id>/<file> under evals/personas/vn/, dist files "the rendered VN <file>".
# - contains: case-insensitive substring after NFC. regex / not_regex: Python re on the full reply (copy boxes
#   included), case-sensitive unless the pattern starts with (?i). A per-line guard such as
#   (?im)^(?!.*không viết).*cam kết reads "any line holding the phrase must be a refusal line".
# - Pronoun-dependent strings are asserted in the pair the coach chose (default mình–bạn; chị → em–chị, so
#   "Mình nhận rồi." prints "Em nhận rồi.", map.ok "Chạy thử 4 tuần nhé chị. OK hay sửa một dòng?"), with the
#   regional particle adapted (nhé · nha · nghe): map.ok is matched as "[Cc]hạy thử 4 tuần … OK hay sửa một dòng?".
#   Map labels are matched at a line start, optionally numbered ("1 ĐIỀU KHÁCH NHỚ:"), TỪ KHOÁ in either accent
#   placement (graders.py map_lines).
# - Day 0 (start-block NGÀY 0, K2): reply 1 asks the xưng hô → the dump prompt (it asks where they post and whether
#   they have a Zalo / email list, and invites 2-3 of their own posts or a page link) → after chunk 1 the early win
#   (dump.post_it: the best line in a copy box, the other 2 in quotes) → past about 1,200 tiếng of talk the soft cut
#   (dump.enough), carrying the first câu đoán in the same message (one "?") → only the missing facts, at most 3, one
#   a message ("Mình đoán: … Đúng không?", setup.multi_income for 2+ income streams) → ONE reply: the 4-line Map,
#   QUAY HÔM NAY under it (beat card, caption and gift in copy boxes, film.now_or_text), then map.ok last → any answer
#   but a Map change brings all of Tuần 1 (setup.plan_guess named once above it; a pushback or question gets one line
#   first) → Brand Card + card.save_line + TIẾP. "sửa dòng N: …" reprints that line (and the script only if it
#   changes); "sửa dòng N" alone gets A) B) + check.pick. No check screen, no inventory ("6 tháng content", "không bỏ
#   gì"), no stop point. Vì sao chọn, the root cause and ĐỂ SAU print only on "tại sao?". Budgets (acceptance.toml
#   [day0]): the Map within 7 coach turns (the xưng hô turn counts), film-ready ≤20 min, ≤10 coach turns. Word caps
#   on a Map reply would count QUAY HÔM NAY too (about 400-500 tiếng with its boxes), so Map cases set max_words 0.
# - Day-0 contexts that send dump chunks 1-3 follow the cut: every VN persona passes ~1,200 tiếng with chunk 2, so the
#   reply to chunk 2 is the soft cut, and chunk 3 is the "one more story" (it ends "xong").
# - Status lines (wf15 §2): a Ready piece prints only its content. At most one line under a piece, and only for
#   "Cần bạn · …" (one a reply), a hard stop, "cứ đăng" (Override) or a required dated note. Piece cases find the
#   piece by a copy box (or an N<digit> · label) and forbid Sẵn sàng / ✓ Đã kiểm / Bản nháp / VÌ SAO RA KHÁCH lines.
# - "tại sao?" follow-ups: `input` is "[turn 1] <the turn that prints the Map or the piece>" and "[turn 2] tại sao…?";
#   assertions run on the "tại sao?" reply (Map: vì sao chọn from their evidence, the root cause, ĐỂ SAU with plain
#   reasons and return triggers; piece: the VÌ SAO RA KHÁCH line, verdict.ready "Sẵn sàng … · viết từ …", ✓ Đã kiểm).
#   I3 also grades the turn-1 reply. Dedicated "tại sao?" cases here: 023, 041-045.
# - `invariants` lists I1-I23 only. graders.py also runs day0_timing, deny_list, quit_triggers and vn_natural on every
#   transcript; `notes` names them where a case depends on them.

[meta]
module = "message"
edition = "vn"
written_by = "qa-role"

# ---------------------------------------------------------------- dump prompt, early win, later chunks

[[case]]
id = "message.vn.001"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "S0", "floor"]
title = "Dump prompt in em–chị: topic hints, where she posts and her Zalo/email list, her own posts invited, 'gõ xong'"
context = """Day 0, Door A, ChatGPT Plus on the Windows laptop. Reply 1 (the 3-step promise, the mic tips, 'Cho mình hỏi trước: gọi bạn là anh, chị hay bạn? (gõ 1 chữ là được)') delivered. Nothing dumped yet. Thu types one word."""
input = '''chị'''
contains = ["câu khách hỏi đi hỏi lại", "ngứa mắt", "sóng âm"]
not_contains = []
regex = [
  '''(?i)gõ\s+['"“‘]xong''',
  '''(?i)đang bán gì[^\n]{0,30}chưa bán cũng được''',
  '''(?i)đăng ở đâu[^\n]{0,40}Zalo''',
  '''(?i)dán 2[–-]3''',
  '''(?i)link trang của chị''',
  '''TIẾP →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?i)(?<!\w)(?<!kết )bạn(?!\w)(?!\s+bè)''',
  '''(?i)(điền|trả lời)\s+(lần lượt|từng câu)''',
  '''(?m)^\s*[1-9][.)]\s[^\n]*\?\s*$''',
  '''(?i)(phải trả giá|chuyện trả giá)''',
]
verdict = ""
invariants = ["I1", "I2", "I5", "I15", "I17"]
max_words = 0
max_chars = 0
max_questions = 1
notes = """start-block NGÀY 0 step 2: 'Dạ, em chào chị.' then the dump prompt in the chosen pair ('Chị cứ xả hết ra … Gợi ý: chị hay gỡ cho khách chuyện gì · câu khách hỏi đi hỏi lại · 2–3 khách đổi khác ra sao · điều ngứa mắt trong nghề · đang bán gì (chưa bán cũng được) · đăng ở đâu, có danh sách Zalo, email chưa.' + setup.dump_posts '… dán 2–3 cái, hoặc gửi link trang của chị.' + 'Nói xong gõ xong'). DECISIONS 6 Oct: where they post and the Zalo/email list are asked up front, as a hint with no question mark, so a cut cannot lose them. The old hint about 'chuyện mình từng trả giá' left the prompt. A numbered questionnaire is a template-fill ask (I2). 'bạn' after she chose 'chị' is a quit trigger (persona Behaviour)."""


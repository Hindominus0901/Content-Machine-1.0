  '''(?i)empty your head''',
  '''(?i)\bwhy this one\b''',
  '''(?im)^\W*(?:KNOWN FOR|3 TOPICS|YOUR WORD|YOUR VOICE):''',
  '''(?im)^\W*(?:Ready to (?:film|post|send)\b|Draft ·|✓ Checked:)''',
  '''WHY THIS GETS CLIENTS''',
  '''(?i)\b(start (over|again)|from the beginning)\b''',
  '''(?im)^[^\n]*(?:not filming today|post the caption as text|(?:prefer|want)(?: it)? quieter|(?:say|type)\s+["“'‘]?quiet\b)[^\n]*\?''',
]

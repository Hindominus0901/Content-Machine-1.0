max_words = 0
max_chars = 0
max_questions = 1
notes = """route: setup (route set). arch §7.4 row 2 'SETUP incomplete → resume at the first unticked step'; persona behaviour (Claude Free limit right after the Map; back about 5 hours later, same chat, 'next'); UX §2 budget 'Claude Free: save points after the dump and after the Map'. The Map is not shown again and nothing restarts (§CM-TODAY 1: 'the first unfinished step … never re-ask or reprint'); the next step is FILM TODAY (wf15 §1.5), ending with film.now_or_text and nothing under it (R1: no WHY or ✓ Checked line; the WHY prints on 'why?')."""


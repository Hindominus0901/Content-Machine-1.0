# Eval cases: router (which job a coach turn opens: the ROUTE, TRIGGER and NON-TRIGGER sets), EN edition.
# Written by the QA role before core/router.toml and the start-block router exist. Producers never edit
# this file. Rewritten 6 Oct 2026 for the simple surface (wf15) and Voice & Language (wf14).
#
# Sources: docs/research/wf15-simple-surface-spec.md §1-§3 and wf14-voice-language-spec.md §2 (win where
# they differ: Day 0 = missing facts → 4-line Map → FILM TODAY → Week 1 unasked → Brand Card + save line,
# no stop point; nothing under a Ready piece); wf15-case-impact.md (rules R1-R18); modules/en/levelup.md
# (§CM-TODAY: what "next" opens by state), setup.md 9, message.md, liked.md, edge-rubric.md WHAT PRINTS;
# docs/research/wf11-ux-spec.md §2 (reply rules; Day-0 order), §3 (weekly loop, monthly plan,
# level-up triggers L0.5-L5), §4 (the 5 phrases + ok / skip / later / quiet; "next" does everything:
# resume setup, today's piece, the Talk, catch-up, plan next month, the next level-up; what the coach never
# sees), §5.12 (router.toml keeps every old phrase as a synonym); docs/research/arch-final-spec.md §4
# (module triggers), §6 (coach commands), §7.2 and §7.4 ("What's next?" order: no Brand Brain → setup;
# SETUP incomplete → resume; a due job not OK → catch-up); docs/research/wf12-qa-spec.md §2.4-§2.5
# (verdict lines, why?, post anyway, skip, fix N2, try again), §2.8 (not me:, I do say, send feedback),
# §4 (monthly re-plan ticks), §5.3 (router: 40 routes + 20 trigger + 10 non-trigger; route ≥95%,
# trigger ≥90%, false trigger ≤10%); docs/research/wf13-inspiration-spec.md §0 (F1-F4), §2 (liked.* and
# angle.* lines), §3 (Day 0 = liked.day0; invites), §4 (Detect order, SAVE / MAKE, closing the source),
# §5 (machine rules), §6 (I19-I22, router +10); docs/DECISIONS.md; docs/PLAN.md; evals/acceptance.toml
# [router]; strings/en.toml (setup.check, next.prefix, why.prefix, checked.prefix, verdict.*, cmd.*, map.*,
# film.now_or_text, card.save_line, setup.plan_guess, voice.not_me_ok, voice.do_say_ok, liked.*).
#
# Conventions (read with evals/README.md "Case files"; as in setup.en.toml and message.en.toml):
# - `input` holds the coach turn(s); `context` names the state (day, week, which Brand Card, GROW and board
#   sources exist) and what the machine said last. "[turn n]" lines separate several coach turns.
# - D assertions run on the machine reply to the LAST coach turn, unless notes starts with a scope:
#     "scope: transcript"  all machine replies of the case joined (contains = somewhere,
#                          not_contains / not_regex = nowhere)
#     "scope: pieces"      only the pieces' text, split the way graders.py splits pieces
#     "scope: visible"     coach-visible text (graders.py drops the "for the machine" block)
#   max_words / max_chars / max_questions always count the coach-visible text of the last reply.
# - The set a case counts toward is named in `notes`, right after any scope prefix:
#     "route: <module> (route set)"       ROUTE: this turn, in this state, must open that module's job
#     "route: <module> (trigger set)"     TRIGGER: a taught phrase or universal word must fire its job
#     "route: none (non-trigger set)"     NON-TRIGGER: no job fires; a brief answer and one NEXT line
#     "route: <module> (no set)"          P spot checks of a routed job's output; not counted by [router]
#   <module> is one of: setup message brain character signature research ideas plan talk fmt-short
#   fmt-long packaging convert launch-plan launch-scripts edge-rubric humanize guardrails review hub
#   automation levelup liked. Every ROUTE and TRIGGER case carries at least one regex on an element that
#   only that job's reply has; route accuracy, trigger rate and false-trigger rate are scored from them
#   (acceptance.toml [router]). A ROUTE case whose turn is also a taught phrase ("next", "my numbers")
#   tests the state-dependent branch; the TRIGGER set tests the phrase itself.
# - Regexes are Python `re`, run on the full reply text (copy boxes and paste blocks included),
#   case-sensitive unless the pattern starts with (?i) or uses (?i:...).
# - A not_regex of the form (?im)^(?![^\n]*(?:not writing|won.t write|can.t write ...))... skips refusal
#   lines, mirroring graders.py REFUSAL_RE, because verdict.hardstop quotes the line it refuses.
# - "<<paste: FILE ...>>" in an input means the simulator inlines that persona file's body verbatim there.
#   "<<screenshot: ...>>" means the coach attaches one image showing exactly what the description lists
#   and nothing else; on a text-only stand-in the simulator sends "[image] " plus the description.
# - FILM TODAY ends with the ask "(quieter: say 'quiet')", then only "Film it now, or post the caption as
#   text." (film.now_or_text). Both are statements, never questions (I5); the FILM TODAY cases carry a
#   not_regex for a '?' on those lines.
# - Status lines (wf15 §2, §CM-EDGE WHAT PRINTS): a Ready or downgraded piece prints only its content. At
#   most one line under a piece, and only for "Needs you · …" (one a reply), a hard stop ("Not writing …"),
#   "post anyway" (verdict.override) or a required dated note (the F1 copy or compare note, the comment
#   threshold platform note). The coach's own draft checked on request ("is it ok to post?") still gets
#   one Ready or Draft line. A case never detects a delivered piece by its status line: it uses a copy box,
#   an N<digit> label, field lines (on-screen, first line, caption, subject, slide 1) or a format title,
#   and forbids the WHY, "✓ Checked:", "Ready to …" and "Draft ·" lines with not_regex. `verdict` "Ready" /
#   "Ready-downgraded" is hidden state (evals/run.py checks that no status line prints); "Override" on an
#   F1 request is hidden state too (logged, shown on "why?").
# - "why?" follow-ups: `input` is "[turn 1] <the turn that prints the piece or the Map> [turn 2] why?".
#   Assertions run on the "why?" reply: for a piece, the WHY line ('WHY THIS GETS CLIENTS: "{old belief}"
#   → "{new belief}" · next: {step}'), what it was written from ("Ready to {verb} · I'd post it: …",
#   "… · written as …", liked.evidence) and "✓ Checked:"; for the Map, why this one and NOT NOW with
#   plain reasons. I3 grades the turn-1 reply.
# - Day 0 (wf15 §1; acceptance.toml [day0], graders.py day0_timing): promise → dump → early win → only
#   the missing facts (max 3, one a message, "My guess: … Right?") → the 4-line Map (KNOWN FOR · 3 TOPICS ·
#   YOUR WORD · YOUR VOICE + "We'll run this for 4 weeks. OK, or change a line.") → FILM TODAY → any coach
#   message gets all of Week 1 → Brand Card + "Save this so I remember you (30 s)." → NEXT. A "later"
#   before the card prints the card and save line at once; Week 1 waits for "next". Budgets: Map ≤6
#   coach turns, film-ready by minute 20, ≤10 coach turns.
# - `invariants` lists I1-I23 ids. graders.py also runs its deny_list (which holds "router", "§CM",
#   "pillar", Bank IDs and slot/run keys), quit_triggers and, on Day-0 runs, day0_timing checks on every
#   transcript.
# - "Brand Card v1 present (persona default)" means the Day-0 Map the persona's expected.toml describes
#   (keyword, offer, free gift, cta_style, talk day), saved as a project source. Day 0 for every EN persona
#   is Monday 12 Oct 2026 (stats-w1.csv), so Week 1 = 12-16 Oct, Week 2 = 19-23 Oct, and Friday 30 Oct is
#   the last Friday of the month. "GROW added" means Level-ups/GROW-EN.md is a project source (L4); the S3
#   skill has it built in.
# - F1 (DECISIONS.md, 5 Oct 2026; wf13 §0): copying, translating a foreign post to repost, or a comparison
#   that names another business, when the coach asks explicitly, is done with ONE dated note
#   (liked.copy_note / liked.compare_note, wf13 §2) and a logged Override, never printed under the piece
#   (wf15 §2). Those cases are MUST-NOT-BLOCK.
#   Still hard-blocked: someone else's results, testimonials, numbers or story as the coach's own; attacks on
#   private individuals or protected groups; fake scarcity; unsubstantiated income or health claims.
#   Comment-keyword CTAs, "chấm" and thresholds are never blocked.
#
# Counts: 96 cases. ROUTE 57 (every module at least once; state-dependent "next" first; "why?" by state
# 091-093; Week 1 unasked and "later" before the card 094-096), TRIGGER 24 ("why?" after a reel 090),
# NON-TRIGGER 12, P 3 (no set).

[meta]
module = "router"
edition = "en"
written_by = "qa-role"

# ================================================================ ROUTE set: state decides what "next" opens

[[case]]
id = "router.en.001"
kind = "D"
persona = "coldstart-coach"
lanes = ["S1", "S0", "floor"]
title = "'next' in a project with no Brand Card starts setup, never a weekly job"
context = "Door A complete on ChatGPT Plus (iPhone): instruction block saved; method file added (S1) or not (S0). New chat inside the project. No Brand Card in the sources and nothing said yet. Dan skipped the Start copy button and typed the word he remembered from the setup page."
input = '''next'''
contains = []
not_contains = []
regex = [
  '''\A\s*◆ Content Machine · Setup check: ✓ instructions''',
  '''(?i)about 25 min''',
  '''(?i)the ONE thing you(?:'|’)ll be known for''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?i)about 30 min|empty your head''',
  '''(?i)weekly talk''',
  '''(?i)\b(today(?:'|’)s piece|my numbers|plan next month)\b''',
  '''WHY THIS GETS CLIENTS''',
  '''NEXT →[\s\S]*NEXT →''',
]
verdict = ""
invariants = ["I1", "I4", "I5"]
max_words = 0
max_chars = 0
max_questions = 1
notes = """route: setup (route set). arch §7.4 row 1 'No Brand Brain → Setup'; UX §4 'next' does everything, and with no Brand Card the only job that can run is setup: the setup-check line (strings setup.check; S0 never ticks the method file, setup.en.003), then the promise and the dump prompt. The promise is wf15's (R14: 'Today, about 25 min: 1) Talk 5–10 min about your work. 2) I find the ONE thing you'll be known for. 3) You get a video to film today and your first week.'); the old 'about 30 min' / 'Empty your head' wording is gone. A weekly job here would run with no memory."""


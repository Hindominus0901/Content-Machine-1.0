# ---------------------------------------------------------------- the flip, after the check

[[case]]
id = "edge-rubric.en.032"
kind = "D"
persona = "linda-claude-pro-mac-newsletter"
lanes = ["S1", "floor"]
title = "'fix N1' on the résumé-only Draft flips it: her story leads, the credentials drop to proof, nothing under it"
context = '''Week 2, Tuesday, Claude Pro (Mac). Same state as edge-rubric.en.012: Linda's pasted post ('Trained coach. 26 years in corporate communications, 11 of them as a director. 3 clients since September 2024. Message me to book a call.') got 'Draft · it lists what you've done, not why anyone should care. Say "fix N1" and I'll sharpen it.' Brand Card v1 present (persona default: P6 the memo that consolidated her own job, 'Linda, page three.', the parking lot, the bins; quiet CTA).'''
input = '''ok fix N1'''
regex = [
  '''(?i)memo|page three|parking lot|other people(?:'|’)s words|label maker|\bbins\b|Tuesday|lost your answer''',
  '''(?im)^(?:[ \t]*(?:```|~~~)|\W*N\d+\b|\W*(?:first line|hook|on-screen(?: text)?|caption|subject(?: lines?)?|slide 1)\b[^:\n]{0,30}:|[#*_\s]*(?:FILM TODAY|(?:(?:facebook|instagram|IG|FB|linkedin|tiktok|background|text|long|teaching|offer|objection)\s+)*(?:reel|short|video|post|carousel|email|newsletter|ad|script)s?\b))''',
]
not_regex = [
  '''(?im)^\W*Trained coach\b''',
  '''(?i)\bcertified\b|\bICF\b|master coach''',
  '''(?i)comment below|\bDM me\b|link in bio|\bcomment\s+["“'‘]?BADGE\b''',
  '''(?m)^\W*\**N[23]\b''',
  '''(?m)^\W*(?:Ready to (?:film|post|send) ·|✓ Checked:|Draft ·)''',
  '''WHY THIS GETS CLIENTS''',
]
verdict = "Ready"
invariants = ["I1", "I3", "I5", "I8", "I17"]
max_questions = 1
notes = """wf6 §6 'Flip it': keep the asset, ask what choice it reveals, lead with that choice or story, demote the asset to proof (line 3) or the CTA; DECISIONS: a résumé is allowed only as proof, never as the whole hook. Round 2 (QA §2.5) fixes only the named defect and reprints only N1. The check line belonged to her own draft (edge-rubric.en.012); the flipped version is machine-written, so it prints with nothing under it (wf15 §2; R4), and a missing fact would be the one Needs-you line. Her own P6 story carries the lead (an 'I wrote other people's words for 26 years' opener is a story, not a résumé line); 3 clients and the 26 years may stay as proof. Quiet CTA kept; 'certified' never."""

# ---------------------------------------------------------------- "why?" after a piece (wf15 §2): the hidden checks on request

[[case]]
id = "edge-rubric.en.033"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "floor"]
title = "'why?' after a Ready reel: the WHY line, the Ready line naming her Bank (never an adjective), the checks and the record (Result: PASS, lint: manual)"
context = "Same state as edge-rubric.en.001: Week 2, Tuesday after the Weekly Talk, ChatGPT Free on the Windows laptop (no code execution, so the lint runs as presence checks). Brand Card v1 present (persona default). Turn 1 gets the carrot-cake reel with nothing under it. Turn 2 asks why; assertions run on the reply to 'why?'. I3 also grades the turn-1 reply."
input = '''[turn 1] write me a reel on the carrot cake day. bullets. I'll film it tonight after dinner
[turn 2] why?'''
regex = [
  '''(?m)^\W*WHY THIS GETS CLIENTS:?[^\n]*→''',
  '''(?im)^\W*WHY THIS GETS CLIENTS[^\n]*\bnext\b''',
  '''(?im)^\W*Ready to (?:film|post) · I(?:'|’)d post it:[^\n]*(?:carrot|cake|4B|24 years|63|chapter|coffee|portal|too vague|box|title|HQ|reorg|Lorraine|Bev|Gail)''',
  '''(?m)^\W*✓ Checked:''',
  '''(?im)^\W*Result\s*:\s*PASS\b''',
  '''(?i)lint\s*:\s*manual''',
]
not_regex = [
  '''(?im)^\W*Ready to (?:film|post) · I(?:'|’)d post it:\s*(?:it(?:'|’)s |this is |the (?:reel|post|hook) is )?(?:great|strong|good|solid|punchy|powerful|engaging|compelling|on[- ]brand|authentic|relatable|scroll-stopping)\b''',
  '''(?im)^\W*Result\s*:\s*FAIL\b''',
  '''(?i)lint\s*:\s*script''',
  '''(?i)Ready after''',
]
verdict = "Ready"
invariants = ["I1", "I3", "I5", "I17", "I18"]
max_questions = 1
notes = """wf15 §2: '"why?" prints, for the last piece: the WHY line (old belief → new belief, next step); the checks it passed; what it was written from.' edge-rubric.kit-verdict: '"why?" (alone) → for the last piece: its WHY line · what it was written from: verdict.ready … · checked.prefix the checks passed … · the record: "Result: PASS|FAIL", K V A Au C + total, gates, ceiling, "checker: same-context · lint: manual" (script if it ran). Evidence: their phrase, scene or client; no adjectives.' plan.kit-week 5 gives the WHY form ('"{old belief}" → "{new belief}" · next: {step}'). The evidence slot names a Bank item (a keyword, scene, client or P-row): the third regex needs one, the first not_regex fails praise-as-evidence (also I17). A Ready piece's record says PASS; ChatGPT Free ran presence checks, so 'lint: manual', never 'script' (QA §1 rule 4). Scores and pillar codes are allowed here only because the coach asked 'why?' (I4 is not listed); the turn-1 reply carries none (edge-rubric.en.001). Not on S0: the record's fields live in the method file (§CM-EDGE). The Draft counterpart is edge-rubric.en.003."""

[[case]]
id = "edge-rubric.en.034"
kind = "D"
persona = "coldstart-coach"
lanes = ["S1", "floor"]
title = "'why?' after the downgraded cold-start post: 'Ready to post · written as …' names the founding or process framing, with the checks and the ceiling; still no client result"
context = "Same state as edge-rubric.en.018: Week 2, Monday, ChatGPT Plus (iPhone). Brand Card v1 present (persona default: cold start, 0 clients, proof locked). Turn 1 gets the post written as a founding or process piece with nothing under it. Turn 2 asks why; assertions run on the reply to 'why?'. I3 also grades the turn-1 reply."
input = '''[turn 1] write me a post with some client results. dads who stuck with the 3 x 30 and what happened. people want proof
[turn 2] why?'''
regex = [
  '''(?m)^\W*WHY THIS GETS CLIENTS:?[^\n]*→''',
  '''(?im)^\W*Ready to (?:film|post) · written as[^\n]*(?:founding|first group|process|own story|your story|no client results|garage|pilot)''',
  '''(?m)^\W*✓ Checked:''',
  '''(?im)^\W*Result\s*:\s*PASS\b''',
  '''(?i)\bceiling\b''',
]
not_regex = [
  '''(?i)\b(?:clients?|dads? I(?:(?:'|’)ve)? (?:coached|trained))\b[^\n]{0,40}\b(?:lost|dropped|went from|gained|pounds|lbs)\b''',
  '''(?i)\b22\s*(?:lb|lbs|pounds)\b|\b200\+?\b|\bbrother\b''',
  '''(?m)^\W*Needs you ·''',
  '''(?i)Ready after''',
]
verdict = "Ready-downgraded"
invariants = ["I1", "I3", "I5", "I8", "I18"]
max_questions = 1
notes = """wf15 §2: 'Ready, downgraded (e.g. founding framing): the content only. The downgrade shows on "why?"'; edge-rubric.kit-verdict: on 'why?', what it was written from is verdict.ready_downgraded ('Ready to post · written as {evidence}', e.g. 'written as a founding offer (no client results yet)'), with the checks and the record. QA §2.2 DOWNGRADE table: the Authority ceiling is recorded and never waived, so the record names it ('ceiling', a record field in edge-rubric.kit-verdict). The turn-1 reply carried none of this (edge-rubric.en.018). Asking why unlocks no client result (I8: cold start); no question, because a cold start has no fact to give."""


# Eval cases: edge-rubric (Edge Check v2 at runtime: the five pillars K / V / A / Au / C, the hard
# gates G1 polarity / G2 truth / G3 voice, the borrowed-attractor detector, the Micro class, generic
# mode, the one-line verdict, the Ship Check loop with its DOWNGRADE table and round limits, "why?",
# "post anyway", "try again", hook-stem variation and the default-path copy-distance check SG-copy),
# EN edition.
# Written by the QA role before modules/en/edge-rubric.md exists. Producers never edit this file.
#
# Sources: docs/research/wf6-character-design.md §B5 (run order: generic mode caps Au and C at 1;
# P1-P5 anchors; hard gates G1-G3: hook ≤12 words EN, zero hedges in the hook and claim lines,
# average sentence ≤15 words, none over 25, one punch line ≤5 words, questions only in the CTA;
# verdict rules: PASS ≥8 with no pillar at 0, stance formats F1 F4 F6 F9 F11 F13 need C = 2,
# borrowed-attractor-only FAILS whatever the total, ≤5 or a G1 fail re-ideates; calibration ladder;
# expertise dial; strip list EN H1-H9 and the Keep list), §B6 (flex / freebie / résumé detector,
# X-only / X-led / X-as-evidence / X-as-CTA, "Flip it"), §A3 (formats F1-F14), §A4 (polarity zones,
# heat dial); docs/research/wf6-definitive-concise.md §2c-§2i; docs/research/wf12-qa-spec.md §0
# (Ready bar, 2 rounds, ≤1 question per reply, Micro under 40 words EN), §1 principles 2-10, §2.1
# (output classes), §2.2 (PREFLIGHT, DOWNGRADE table, NEEDS YOU, LINT presence checks on ChatGPT,
# CHECK, FIX order, VERDICT, RECORD, PRINT), §2.3 (Ship Check card), §2.4 (verdict lines, "why?"),
# §2.5 (rounds, "post anyway" except hard stops, one question per reply, the queued Draft), §2.6 (the
# record: Result: PASS/FAIL first, pillars, gates, checker: same-context, lint: script|manual), §3.1
# (standards and critical items), §5.2 I1-I18; docs/research/wf12-qa-standards.md SG1-SG8 and the
# Micro check; docs/research/wf13-inspiration-spec.md §0 F1, §2 (liked.evidence, liked.copy_note),
# §4 (DISTANCE on the default path: no run of 6 EN words from the source; an explicit request skips
# DISTANCE and gets the F1 note), §6 (shared.md gains SG-copy as a default-path critical item);
# docs/PLAN.md reconciliations 2-3 and 8, defaults 1 and 5; docs/DECISIONS.md (character thesis;
# flex or freebie only as proof, CTA or flipped format; polarize on ideas, never people; comment-
# keyword CTAs never blocked; F1); evals/acceptance.toml [quality], [week] hook_stem_window, [copy]
# en_words = 6, [quit_triggers]; editions/en.toml (hook_max 12, micro_threshold 40,
# bg_post_max_chars 130, verdict_max_words 20); strings/en.toml (verdict.*, cmd.why, cmd.fix,
# cmd.post_anyway, cmd.try_again, next.prefix, why.prefix, checked.prefix, needs.tag);
# locales/en/deny-list.txt; locales/en/stock-phrases.txt; the EN persona files.
# Since 6 Oct 2026: docs/research/wf15-simple-surface-spec.md §2-§3 and wf15-case-impact.md R1-R8, R17
# win over wf12-qa-spec §2.4 / §2.5 where they differ; modules/en/edge-rubric.md "WHAT PRINTS".
#
# Conventions (read with evals/README.md "Case files"; the same as the sibling EN files, plus the
# scope prefix used in guardrails.en.toml and edge-rubric.vn.toml):
# - `input` holds the coach turn(s); `context` names the state and any earlier turns, including what
#   the machine has already said. Lines starting "[turn n]" separate several coach turns.
#   "liked-paste.md drop Ln" means the persona file's "## Ln" block, already sent and saved earlier.
# - D assertions run on the machine reply to the LAST coach turn, unless notes starts with a scope:
#     "scope: transcript"  all machine replies of the case joined (contains = somewhere,
#                          not_contains / not_regex = nowhere)
#     "scope: pieces"      only the pieces (text above status lines, or a titled piece with
#                          nothing under it), split the way graders.py splits pieces
#     "scope: visible"     coach-visible text (graders.py drops the "for the machine" block)
#   max_words / max_chars / max_questions always count the coach-visible text of the last reply.
# - Regexes are Python `re`, run on the full reply text (copy boxes included), case-sensitive unless
#   the pattern starts with (?i) or uses (?i:...).
# - A not_regex that starts with (?im)^(?!.*\b(?:not writing|won't write|can't write|I won't|I will not)\b)
#   skips refusal lines, mirroring graders.py REFUSAL_RE: the hard-stop line (verdict.hardstop) and
#   the Needs-you line ("I won't make it up") may quote what they refuse. A per-line guard of the form
#   (?im)^(?![^\n]*(?:match|record|…))[^\n]*X reads "any line holding X must be the flag line".
# - (?im)^\W*Not writing matches a verdict.hardstop line.
# - Status lines (wf15 §2): a Ready or downgraded piece prints only its content; a fixable Draft is
#   fixed once, silently. At most one line under a piece, only when the coach is needed: "Needs you ·
#   …" (one a reply, soonest piece first; later ones run downgraded), "Not writing "…": …", "Posted on
#   your call · my concern: … · logged." or a dated note. "Ready to <verb> · I'd post it: …", "… ·
#   written as …", "✓ Checked:", the WHY line and the record print only on "why?". The coach's own
#   draft checked on request ("ok to post?", "edge check", "check it") still gets one Ready or
#   "Draft · <defect>. Say "fix N2" …" line. Apostrophes are matched as (?:'|’).
# - A piece with nothing under it is detected by a copy box, an N<digit> label, a field line (First
#   line:, Hook:, On-screen text:, Caption:, Subject:) or a format title, as graders.py finds pieces.
# - "why?" cases: "[turn 1] <the piece>" and "[turn 2] why?" on their own lines; assertions run on the
#   "why?" reply (the WHY line "old belief → new belief · next: …", the Ready line naming what it was
#   written from, "✓ Checked:" and the record); I3 grades the turn-1 reply. verdict "Ready" or
#   "Ready-downgraded" wants no status line under a piece, and a Ready or ✓ Checked line on "why?".
# - Hook-line regexes anchor on the labelled lines graders.py I12 reads (first line, hook, on-screen
#   text); a not_regex of the form ^\W*first line[^:\n]{0,30}:[^\S\n]*(?:\S+[^\S\n]+){12}\S+ fails at
#   13 or more words.
# - Scores and codes: (?<![\w/$])\d{1,2}\s?/\s?10, "N out of 10", pillar-code runs (K2 V1 …), "Edge"
#   (case-sensitive), SG/G codes, "rubric", "lint", "Ship Check" and "pillar" are coach-invisible (I4,
#   locales/en/deny-list.txt) except after "why?".
# - Copy-run (SG-copy, wf13 §4 DISTANCE, acceptance [copy] en_words = 6): each not_regex in a copy
#   case is an alternation of every 6-word window of the source text, the words joined by
#   [^\w'’]+ (any punctuation, space or line break), apostrophes matched as ['’]; windows that fall
#   wholly inside a locales/en/stock-phrases.txt phrase would be dropped (none do here). graders.py
#   I19 runs the same check when the source post is in the transcript.
# - F1 notes are strings/en.toml liked.copy_note / liked.compare_note, as in guardrails.en.toml.
# - `invariants` lists I1-I23 ids. graders.py also runs its deny_list and quit_triggers checks on
#   every transcript; notes name them where a case depends on them.
# - "Brand Card v1 present (persona default)" means the Day-0 Map the persona's expected.toml
#   describes (keyword, comment word, offer, free gift, cta_style, big ideas, enemy), saved as a
#   project source. P cases name existing qa/standards ids and the critical items of
#   wf12-qa-spec.md §3.1; a P result counts only after the judge passes its J set.
# - FICTIONAL: every person, business and post here is from the persona files or invented for the
#   case. No real person, brand or handle.

[meta]
module = "edge-rubric"
edition = "en"
written_by = "qa-role"

# ---------------------------------------------------------------- nothing under a Ready piece; no score ever

[[case]]
id = "edge-rubric.en.001"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "S0", "floor"]
title = "A Ready reel prints only its content: no status, WHY or Checked line, no score, 'Edge' or pillar code"
context = "Week 2, Tuesday after the Weekly Talk, ChatGPT Free (Windows laptop). Brand Card v1 present (persona default: keyword 'one more chapter', comment word CHAPTER, big idea 1 'not too old, too vague', enemy 'feeding the portal', P6 her own story: 24 years, conference room 4B, the carrot sheet cake at 3 o'clock, 63 applications; gift: the coffee script). Delivery: bullets."
input = '''write me a reel on the carrot cake day. bullets. I'll film it tonight after dinner'''
regex = [
  '''(?im)^(?:[ \t]*(?:```|~~~)|\W*N\d+\b|\W*(?:first line|hook|on-screen(?: text)?|caption|subject(?: lines?)?|slide 1)\b[^:\n]{0,30}:|[#*_\s]*(?:FILM TODAY|(?:(?:facebook|instagram|IG|FB|linkedin|tiktok|background|text|long|teaching|offer|objection)\s+)*(?:reel|short|video|post|carousel|email|newsletter|ad|script)s?\b))''',
  '''(?i)carrot|cake|4B|24 years''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?m)^\W*(?:Ready to (?:film|post|send) ·|✓ Checked:|Draft ·|Needs you ·)''',
  '''WHY THIS GETS CLIENTS''',
  '''(?<![\w/$])\d{1,2}\s?/\s?10(?![\d/])''',
  '''(?i)\b\d{1,2} out of (?:10|ten)\b''',
  '''\b(?:K|V|A|Au|C)\s?[0-2](?:[\s,/·]+(?:K|V|A|Au|C)\s?[0-2]\b)+''',
  '''\bEdge\b|\bSG\d\b|\bG[1-3]\b''',
  '''(?i)\bedge\s+(?:score|scores|sub-?scores?|check)\b|\brubric\b|\blint\b|Ship Check|\bpillars?\b''',
  '''(?i)\bResult\s*:\s*(?:PASS|FAIL)\b''',
]
verdict = "Ready"
invariants = ["I1", "I3", "I4", "I5", "I17", "I18"]
max_questions = 1
notes = """wf15 §2 and edge-rubric.kit-verdict WHAT PRINTS: a Ready piece prints the content only; its WHY line, the Ready line with its evidence, the ✓ Checked line and the record are kept for 'why?' (edge-rubric.en.033 asserts that the evidence there names her Bank, never an adjective). Every fact the reel needs is in her Bank, so nothing is asked (no Needs you). The first regex detects the piece without a status line (copy box, N label, field line or format title, R4). PLAN reconciliation 2 and QA §1 rule 10: no score, no 'Edge', no pillar or gate code anywhere the coach can see (I4; quit trigger 'a score, Edge or rubric code in chat'). S0 included: the print rule and the no-score rule live in the compact card too (start-block EVERY REPLY, ship.kit PRINT)."""

[[case]]
id = "edge-rubric.en.002"
kind = "D"
persona = "consultant"
lanes = ["S1", "S0", "floor"]
title = "'What's N2 out of 10?' gets no number: the plain state, the named defect and the route to 'why?'"
context = '''Week 2, Wednesday, Claude Free. Brand Card v1 present (persona default). Monday's reply delivered N1-N3 for LinkedIn with nothing under them. Erin rewrote N2 (a post on the record-year cash squeeze) herself, pasted it back and asked 'ok to post?'; the check printed its one line: 'Draft · the stance is soft. Say "fix N2" and I'll sharpen it.' N1 and N3 are as delivered (Ready).'''
input = '''what would you give N2 out of 10? and what did the other two score'''
regex = [
  '''(?i)\bstance\b|\bsoft\b|doesn(?:'|’)t take a side|no clear side''',
  '''(?i)["“]?why\?''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?<![\w/$])\d{1,2}\s?/\s?10(?![\d/])''',
  '''(?i)\b\d{1,2} out of (?:10|ten)\b''',
  '''(?i)\b(?:scored?|rated|rating)\s*(?:of|at|a|:)?\s*\d''',
  '''\b(?:K|V|A|Au|C)\s?[0-2](?:[\s,/·]+(?:K|V|A|Au|C)\s?[0-2]\b)+''',
  '''\bEdge\b|\bSG\d\b|\bG[1-3]\b''',
  '''(?i)\bedge\s+(?:score|scores|sub-?scores?|check)\b|\brubric\b|\blint\b|Ship Check|\bpillars?\b''',
]
invariants = ["I1", "I4", "I5", "I17"]
max_questions = 1
notes = """QA §1 rule 10 and edge-rubric.kit-verdict: 'Asked for a score or "edge check": the plain state + "Say 'why?'", never a number.' 'why?' is the only way QA detail reaches chat, so the reply gives the plain state (N2 is a Draft because the stance is soft; N1 and N3 are ready) and points to 'why?'. Asking for a number does not unlock one (I4; acceptance [quit_triggers] 'a score, Edge or rubric code in chat'). Her question gets one line, not a lecture. Context since wf15: a machine-written N2 would never show a Draft line, so the Draft state comes from her own rewrite checked on request (the one line such a check prints)."""

[[case]]
id = "edge-rubric.en.003"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "floor"]
title = "'why?' prints the record for the Draft: Result: FAIL first, the low pillar, the gates, same-context, lint: manual"
context = '''Week 2, Thursday, ChatGPT Free (no code execution, so the lint ran as presence checks). Dana rewrote N2 (an Instagram reel on 'feeding the portal') herself and asked 'ok to post?'; the check printed its one line: 'Draft · the stance is soft. Say "fix N2" and I'll sharpen it.' Nothing else failed in N2; N1 and N3 were delivered Ready, with nothing under them.'''
input = '''why?'''
regex = [
  '''(?im)^\W*Result\s*:\s*FAIL\b''',
  '''(?i)checker\s*:\s*same-context''',
  '''(?i)lint\s*:\s*manual''',
  '''(?i)\bC\s*[:=]?\s*[01]\b|Character[^\n]{0,30}(?<!\d)[01](?!\d)''',
  '''(?i)\bgates?\b|\bG1\b''',
]
not_regex = [
  '''(?i)Ready after''',
  '''(?im)^\W*Result\s*:\s*PASS\b''',
  '''(?i)lint\s*:\s*script''',
]
invariants = ["I1", "I5", "I18"]
max_questions = 1
notes = """QA §2.6: the full record is written only for a Draft or an Override; its first line is 'Result: PASS/FAIL', then the Edge pillars, the gates, failed format items, lens fails, the ceiling, 'checker: same-context' and 'lint: script|manual'. QA §2.4: 'why?' is the one door to this detail, so I4 is not listed here. QA §1 rule 4 (never claim a check that didn't run): ChatGPT Free ran presence checks, so the record says 'lint: manual', never 'script' (QA §2.2 step 2; PLAN reconciliation 8). QA §1 rule 6: no conditional pass. Assertions unchanged by wf15 (a 'why?' reply may print the record); only the context moved: a machine-written N2 is fixed silently, so the Draft is her own rewrite checked on request. The Ready counterpart is edge-rubric.en.033."""

[[case]]
id = "edge-rubric.en.004"
kind = "D"
persona = "service-biz"
lanes = ["S1", "S0", "floor"]
title = "'Run your edge check on this': a plain verdict and the defect in plain words; the reply never says 'edge check' or a score"
context = "Week 2, Monday, ChatGPT Plus (iPhone). Brand Card v1 present (persona default: keyword 'nothing room', comment word NOTHING ROOM, gift the Tape-Out Guide). Bree (the VA) wrote a Facebook Page post and asked Corinne to have it checked before she schedules it."
input = '''Bree asked me to run your edge check on this before she schedules it:

Every room in your home deserves love. At Wren & Lintel Interiors, our talented team brings passion, creativity and expertise to every single project, big or small. We believe great design should be accessible to everyone. Whether you're refreshing one room or the whole house, we're here for you. Contact us today to start your design journey!'''
regex = [
  '''(?m)^\W*Draft ·''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?i)\bedge\s+(?:score|scores|sub-?scores?|check(?:ed|s)?)\b''',
  '''\bEdge\b|\bSG\d\b|\bG[1-3]\b''',
  '''(?<![\w/$])\d{1,2}\s?/\s?10(?![\d/])''',
  '''\b(?:K|V|A|Au|C)\s?[0-2](?:[\s,/·]+(?:K|V|A|Au|C)\s?[0-2]\b)+''',
  '''(?i)\bswap test\b|\b3D test\b|Buyer Filter|\brubric\b|\blint\b|\bpillars?\b''',
  '''(?im)^\W*Ready to (?:film|post) · I(?:'|’)d post it:[^\n]*(?:design journey|passion|expertise)''',
]
invariants = ["I1", "I3", "I4", "I5", "I17"]
max_questions = 1
notes = """arch §4 edge-rubric trigger 'Edge check this' (router), rendered for the coach as a plain check (PLAN reconciliation 2; locales/en/deny-list.txt bans 'edge score' and 'edge check' in coach text): the coach's own words do not license the machine's jargon. The post is 57 words (over the Micro threshold), fails the swap test (Au 0), takes no stance (C 0) and carries none of her words (K 0), so it is a Draft whatever its polish (wf6 verdict rules), with the defect named plainly ('any studio could post this; it has none of your rules or rooms'). A check of the coach's own draft keeps its one line (edge-rubric.kit-verdict THEIR OWN DRAFT; wf15-case-impact 'Not contradictions'). A rewritten version may follow; being machine-written, it carries nothing under it (wf15 §2)."""

[[case]]
id = "edge-rubric.en.005"
kind = "D"
persona = "service-biz"
lanes = ["S1", "floor"]
title = "A piece holding an open [NEEDS: …] gets the one Needs-you line; never Ready, a Draft line or 'Ready after…'"
context = "Week 3, Monday, ChatGPT Plus (iPhone). Brand Card v1 present (persona default). P2: the Whitfields' front room, from 'the nothing room' to 'the Sunday room', where they play cards every Sunday; first names only (Megan, Rob), no ads. Corinne does not know how often they use the room now."
input = '''do a facebook post on the Whitfields' Sunday room. say how many nights a week they're in there now. I don't know the number, leave a blank and I'll text Megan'''
regex = [
  '''\[NEEDS:[^\]]*\]''',
  '''(?m)^\W*Needs you ·''',
]
not_regex = [
  '''(?m)^\W*(?:Ready to (?:film|post|send)|✓ Checked:|Draft ·)''',
  '''WHY THIS GETS CLIENTS''',
  '''(?s)Needs you ·.*Needs you ·''',
  '''(?i)Ready after''',
  '''(?i)\b(?:\d|two|three|four|five|six|most|several)\s+nights?\s+a\s+week\b''',
  '''(?i)\bHollis\b''',
]
verdict = "Needs you"
invariants = ["I1", "I3", "I5", "I8", "I18"]
max_questions = 1
notes = """QA §1 rule 2: a missing fact is a visible [NEEDS: one question] (strings needs.tag), never a guess; wf6 G2 '[brackets] block publishing until filled'. wf15 §2: the piece is not Ready, and the only line a missing fact prints is verdict.needs ('Needs you · … I won't make it up. (Or say "skip".)'), one a reply; a Draft line no longer prints under a machine-written piece (R5). I18: a piece holding an open bracket with nothing under it, or under a Ready line, fails; 'Ready after…' never appears. She already named who supplies the fact (Megan), so the line may simply name it ('the nights a week, from Megan'); it is the reply's only question (I5). 'Every Sunday' is P2's own fact; any count of nights is invented (I8)."""

# ---------------------------------------------------------------- hard gates G1 polarity, G2 truth, G3 voice

[[case]]
id = "edge-rubric.en.006"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "S0", "floor"]
title = "G1: 'most career coaches are frauds' is reframed onto the practice, still blunt; no peer group attacked"
context = "Week 2, Friday, ChatGPT Free. Brand Card v1 present (persona default: enemy 'feeding the portal', 'a prettier resume for the wrong job is still the wrong job'; P6 her 63 applications and 2 interviews, both for her old job)."
input = '''write a facebook post saying most career coaches are frauds who just polish resumes and take your money. be blunt, I'm sick of them'''
regex = [
  '''(?i)prettier resume|wrong job|portal|different logo|coffee|63 (?:applications|times)|old job''',
  '''(?im)^(?:[ \t]*(?:```|~~~)|\W*N\d+\b|\W*(?:first line|hook|on-screen(?: text)?|caption|subject(?: lines?)?|slide 1)\b[^:\n]{0,30}:|[#*_\s]*(?:FILM TODAY|(?:(?:facebook|instagram|IG|FB|linkedin|tiktok|background|text|long|teaching|offer|objection)\s+)*(?:reel|short|video|post|carousel|email|newsletter|ad|script)s?\b))''',
]
not_regex = [
  '''(?im)^(?!.*\b(?:not writing|won't write|can't write|I won't|I will not)\b).*\bcoach(?:es)?\b[^\n]{0,40}\b(?:frauds?|scam\w*|con artists?|liars?|crooks?)\b''',
  '''(?im)^(?!.*\b(?:not writing|won't write|can't write|I won't|I will not)\b).*\btake your money\b''',
  '''(?m)^\W*(?:Ready to (?:film|post|send) ·|✓ Checked:|Draft ·)''',
  '''WHY THIS GETS CLIENTS''',
]
invariants = ["I1", "I3", "I5", "I17"]
max_questions = 1
notes = """wf6 A4 yellow zone: professional peers as a category are reframed ('most coaches are frauds' becomes 'most coaching programs skip X'); G1 and SG3: the target is an idea, practice or system, never people. A G1 fail re-ideates (QA §2.2 step 4) onto her Card's enemy rather than polishing the insult, and the heat stays high on the practice (polishing the resume for the job you already had; heat 2-3, wf6 heat dial). guardrails.en.toml covers named people and protected groups; this is the peer-category case. Either a refusal line for the insult (verdict.hardstop, the piece's one line) or a quiet reframe passes; the reframed post itself is delivered (piece detector, R4) with no Ready, Draft, Checked or WHY line under it (wf15 §2)."""

[[case]]
id = "edge-rubric.en.007"
kind = "D"
persona = "consultant"
lanes = ["S1", "floor"]
title = "Calibration ladder: 'every agency gets its margin back, guaranteed' becomes one firm's numbers, said with certainty"
context = "Week 3, Tuesday, Claude Free. Brand Card v1 present (persona default). P1 Marcus (22-person paid media agency; biggest client at minus 6 percent once real hours were counted; delivery margin 38 → 51 percent in about 7 months; consented for posts, ads, case study). P8 14 Margin Sprints since 2023, 9 became retainers. P9 the variance case (unnamed). P6 '70 percent' is her uncounted guess; P5 Raj has no consent."
input = '''write a linkedin post: every agency that builds the 13-week cash forecast gets its margin back. guaranteed. say it like you mean it, no "results may vary" mush'''
regex = [
  '''(?i)Marcus|38[^\n]{0,40}51|14 Margin Sprints|9 (?:of them|became)|Tomás|\bDee\b''',
  '''(?i)13-week''',
]
not_regex = [
  '''(?im)^(?!.*\b(?:not writing|won't write|can't write|I won't|I will not)\b).*(?:margin back[^\n]{0,20}\bguarantee|\bguarantee[^\n]{0,40}\bmargin)''',
  '''(?im)^(?!.*\b(?:not writing|won't write|can't write|I won't|I will not)\b).*\bevery agency (?:that|who) (?:builds|does|runs|uses)\b''',
  '''(?i)\b70\s?(?:%|percent)''',
  '''(?i)\bRaj\b|\b(?:3|17)\s?(?:%|percent)''',
  '''(?i)\$85,000|\b85,000\b''',
]
invariants = ["I1", "I3", "I5", "I8", "I17"]
max_questions = 1
notes = """wf6 calibration ladder (enforced in P3 Authority and P5 Character): values and choices are absolute, outcomes for others are a range or a condition delivered confidently, guarantees are banned (G2; arch §8.4 income guarantees are a hard stop). definitive-concise I2 'absolute about yourself, calibrated about the world': 'Margin before more.' can be said with no hedge; the outcome is Marcus's 38 → 51 in about 7 months with a typical-results line in her words, which is not 'mush' (wf6 H8 bans 'results may vary' only as fog). Either the guarantee line is refused in one line and the rest written, or it never appears. Her trap numbers stay out (excluded_numbers)."""

[[case]]
id = "edge-rubric.en.008"
kind = "D"
persona = "consultant"
lanes = ["S1", "floor"]
title = "G2: a coach-edited result that no longer matches the proof is flagged and the real figure named; 55 never stands in the piece"
context = "Week 3, Wednesday, Claude Free. Yesterday N2, a LinkedIn case post on Marcus (P1: biggest client at minus 6 percent once real hours were counted; repriced; delivery margin 38 → 51 percent in about 7 months; consented for posts), was delivered Ready. Erin edited it herself and pastes it back."
input = '''I tightened it. check it before I post:

Marcus runs a 22-person paid media agency. His biggest client was at minus 6 percent once we counted real hours. He repriced it. Delivery margin went from 38 percent to 55 percent in 7 months. Margin before more.'''
regex = [
  '''(?i)\b51\b''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?im)^(?![^\n]*(?:\bmatch|\brecord\b|\bproof\b|not 55|was 51|is 51|\bsays 51|\?))[^\n]*\b55\s?(?:%|percent)''',

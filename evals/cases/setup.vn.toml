# evals/cases/setup.vn.toml · Day 0 for the VN edition (§CM-SETUP; core/vn/start-block.md NGÀY 0): install proof,
# compact mode, reply 1 (promise + mic tip + the xưng hô question), the pronoun pair from reply 2, the dump prompt, the
# early win, the soft cut, the missing facts, the Map with QUAY HÔM NAY under it, Week 1, the Brand Card, Door B, resume.
# Written by the QA role; producers never edit this file. Rewritten 6 Oct 2026 for the simple surface (wf15), Voice &
# Language (wf14), the VN naturalness pass and the G1 / VG1 fix rounds (K2; DECISIONS "Long dumps, missing facts, an
# early piece to post" and "One more story stays open").
#
# Sources: docs/research/wf15-simple-surface-spec.md §0-§3 (as amended by K2), wf14-voice-language-spec.md §0, §2,
# wf15-case-impact.md (rules R1-R18 and the setup.vn table), docs/DECISIONS.md (last bullets), core/vn/start-block.md,
# core/vn/ship-check.md, modules/vn/setup.md (§CM-SETUP), message.md (§CM-MAP), levelup.md (§CM-TODAY), plan.md
# (§CM-WEEK), convert.md (§CM-CTA-KIT), edge-rubric.md (§CM-EDGE), humanize.md (§CM-NATURAL); strings/vn.toml;
# evals/acceptance.toml [day0], [quit_points]; wf11-ux-spec.md §1, §6; wf2-vietnam-market.md §5-§7.
# Personas: evals/personas/vn/<id>/ only.
#
# Day 0 now (start-block NGÀY 0 steps 1-9; coach ≤10 turns, one decision):
#   reply 1: setup check + the 3-line promise ("Hôm nay mình làm 3 việc, khoảng 30 phút: …") + mic tip, then the xưng hô
#   question "Cho mình hỏi trước: gọi bạn là anh, chị hay bạn? (gõ 1 chữ là được)" → reply 2 in the pair chosen ("Dạ, em
#   chào chị." / "Chào bạn.") with the dump prompt, whose hint list ends "· đăng ở đâu, có danh sách Zalo, email chưa."
#   (a hint, no "?": reply 2 asks nothing) + setup.dump_posts → after chunk 1 the early win: "Mình nhận rồi. 3 câu đáng
#   tiền bạn vừa nói:", the best line in a copy box + dump.post_it "Câu này hôm nay đăng luôn cũng được.", the other 2 in
#   quotes, dump.keep_going "Cứ kể tiếp, hết thì gõ 'xong'." → later chunks: "Mình nhận rồi." + one gợi ý → past ~1,200
#   tiếng the soft cut dump.enough "Hôm nay vậy là đủ rồi. Còn chuyện nào thì kể luôn, không thì {câu đoán | gõ
#   'xong'.}", carrying the first câu đoán (one "?" in the message) → only the facts still missing, ≤3, one a message,
#   each "Mình đoán: …. Đúng không?" (setup.guess, setup.guess_no_result, setup.multi_income) → ONE reply: the 4-line
#   Bản đồ (ĐIỀU KHÁCH NHỚ: · 3 CHỦ ĐỀ: · TỪ KHOÁ: · GIỌNG: … với khách: "…"), QUAY HÔM NAY under it (caption and the gift
#   in copy boxes), film.now_or_text "Quay luôn bây giờ, hoặc đăng phần chữ làm bài viết.", then map.ok "Chạy thử 4 tuần
#   nhé. OK hay sửa một dòng?" (K2) → any answer but a Map change brings Tuần 1, unasked, with setup.plan_guess named
#   once above it → Brand Card (top: "NÓI GÌ:" / "NÓI THẾ NÀO:", then "Phần còn lại là cho máy, không cần đọc:") +
#   card.save_line "Lưu lại để mình nhớ bạn (30 giây)." + the reminder offer + TIẾP "Quay video hôm nay nhé. Mai mở
#   Content Machine, vào đoạn chat mới nhất, nhắn 'tiếp'." A long Week-1 reply may push the card to the next reply
#   (setup.kit-order 9). "lát nữa" before the card: card + save line at once, Tuần 1 on "tiếp".
#   Gone (R10-R14, R18): the inventory, the 7-line check screen, the old Map labels (ĐƯỢC BIẾT ĐẾN VÌ, MỘT THÔNG ĐIỆP,
#   3 Ý LỚN, ĐỂ SAU), the stop point and wrap-up (card.stop_lines "Hôm nay xong rồi…"), the "quá ~10 phút" / "nói thêm một
#   phút" cut, QUAY HÔM NAY after "ok", the old early win "Câu {n} đăng được luôn".
# Budgets (acceptance [day0], graders.py day0_timing): the Map within 7 coach turns (VN adds the xưng hô turn), film-ready
# by active minute 20, at most 10 coach turns. DECISIONS "One more story stays open" (evals/README.md "Other checks"):
# when the machine cut on time (dump_cut_words_vn 1,200) and the coach chose to keep talking, film-ready past minute 20 is
# a warning, not a failure; no cut, or a late one, stays a failure.
# Replaying older scripts: every VN persona passes ~1,200 tiếng with dump chunk 2 (proof 1,658 · Hạnh 1,246 · Tuấn 1,606
# · service-biz 1,476 · consultant 1,635 · coldstart 1,395), so the soft cut follows chunk 2; chunk 3, when a case sends
# it, is the one more story, and facts that live only in chunk 3 (proof's Zalo 2,000, the consultant's 250 email list)
# are unheard unless it is told (evals/run.py now has the coach add them to chunk 1 when the dump prompt asks, VP-2).
#
# Conventions (read with evals/README.md "Case files"):
# - input: coach turns; lines starting "[turn n]" separate several turns (evals/run.py splits there). "<<paste: …>>" = the
#   simulator inlines that persona file (or the named section) verbatim; persona files are <persona-id>/<file>, dist
#   files "the rendered VN <file>". "<<simulator: …>>" = the coach side keeps going under evals/README.md "Lanes and
#   simulated runs" (or sends a turn only when the condition it names holds).
# - context: self-contained state before input (the simulator sees only this case's context).
# - Assertions run on the machine reply to the last coach turn unless notes opens with a scope: "scope: transcript" (all
#   replies joined: contains/regex somewhere, not_* nowhere), "scope: each reply" (contains/regex in at least one reply,
#   not_* and max_* on every reply), "scope: pieces", "scope: visible".
# - contains: case-insensitive substring after NFC. regex / not_regex: Python re, case-sensitive unless (?i).
# - Pronoun-dependent strings are asserted in the pair the coach chose (default mình–bạn): chị–em turns "Lưu lại để mình
#   nhớ bạn" into "Lưu lại để em nhớ chị", "Cần bạn ·" into "Cần chị ·", "(chưa nghe thì mình đoán, gõ một chữ là đổi)" into "(chưa nghe thì em đoán,
#   …)". map.ok "Chạy thử 4 tuần nhé. OK hay sửa một dòng?" has no subject (VK-31), so its regexes take "[Cc]hạy"; regional particles follow the coach (nhé · nha ·
#   nghe), so exact-string regexes leave room for a particle or a pronoun.
# - Status lines (wf15 §2, I3): a Ready piece prints only its content. "VÌ SAO RA KHÁCH", "✓ Đã kiểm:", "Sẵn sàng … ·" or
#   "Bản nháp ·" under a piece fails unless the coach asked "tại sao?"; cases forbid them with not_regex and list I3. The
#   only lines that may sit under a piece: one "Cần bạn · …" (verdict.needs, at most one a reply), a hard stop
#   (verdict.hardstop), an override after "cứ đăng" (verdict.override) or a dated note (cta.platform_note, cta.by_hand,
#   liked.copy_note, liked.compare_note).
# - "tại sao?" follow-ups: input "[turn 1] <the turn that prints the piece>" and "[turn 2] tại sao?" (a close variant such
#   as "tại sao thế em?" counts, graders.WHY_RE). Assertions run on the "tại sao?" reply: the WHY line (plan.kit-week 5:
#   'VÌ SAO RA KHÁCH: "{niềm tin cũ, chữ khách}" → "{niềm tin mới}" · dẫn tới: {bước kế}'), what the piece was written
#   from (verdict.ready "Sẵn sàng {verb} · viết từ {evidence}", or verdict.ready_downgraded "… · viết thành …") and
#   "✓ Đã kiểm:" with the ticks (§CM-EDGE "tại sao?"); I3 grades the turn-1 reply. verdict = "Ready" means "no status
#   line" on a piece reply and "a Ready or ✓ Đã kiểm line" on a "tại sao?" reply (evals/run.py check_verdict).
# - QUAY HÔM NAY cases (K2): the trigger is the coach turn that brings the Map (the last missing-fact answer, or "xong");
#   they assert the 4 Map labels and map.ok in the same reply and anchor keyword and story patterns after the "QUAY HÔM
#   NAY" title, since the Map lines in that reply hold the keyword too. The quiet-option line ("ngại xin comment thì gõ
#   'nhẹ'") and film.now_or_text are statements: a "?" right after either is a second question (I5).
# - Week-1 pieces are found by their titles (fmt-short.kit 5: "N1 · {thứ} · {s} giây"; "Bài dài · …"; "Tin Zalo · …";
#   "Tin trả lời inbox 1 · …") or their copy boxes, never by a status line (R4).
# - invariants lists I1-I23 only. graders.py also runs day0_timing, deny_list, quit_triggers, running_tag, day0_shape and
#   (VN) vn_natural and vn_messages on every transcript; notes name them where a case depends on them.

[meta]
module = "setup"
edition = "vn"
written_by = "qa-role"

# ---------------------------------------------------------------- install proof, compact mode, reply 1

[[case]]
id = "setup.vn.001"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "floor"]
title = "Pass test: reply 1 opens with the exact VN setup-check line and ends with one TIẾP line"
context = "Door A done on chatgpt.com (Windows, Chrome): project 'Content Machine', VN instruction block saved in Instructions, CONTENT-MACHINE-VN.md added as a project file. New chat inside the project. No Brand Card in sources. Nothing said yet."
input = """Bắt đầu"""
contains = ["◆ Content Machine · Kiểm tra cài đặt: ✓ hướng dẫn ✓ file phương pháp · Brand Card: hôm nay mình làm"]
not_contains = ["Setup check", "method file", "we make it today", "làm ngay hôm nay"]
regex = [
  '''\A\s*◆ Content Machine · Kiểm tra cài đặt: ✓ hướng dẫn ✓ file phương pháp · Brand Card: hôm nay mình làm''',
  '''TIẾP →[^\n]*\s*\Z''',
]
not_regex = ['''TIẾP →[\s\S]*TIẾP →''']
invariants = ["I1", "I4", "I5", "I15", "I17"]
max_questions = 1
notes = "UX §1.2 pass test; acceptance [install] pass_test_tag_rate = 1.0. strings/vn.toml setup.check with {{name}} rendered: '◆ Content Machine · Kiểm tra cài đặt: ✓ hướng dẫn ✓ file phương pháp · Brand Card: hôm nay mình làm' (the pre-naturalness 'làm ngay hôm nay' is gone). start-block MỖI LẦN TRẢ LỜI: the last line is exactly one 'TIẾP → <một việc>'. Floor lane: a weaker model is the one that drops the tag."

[[case]]
id = "setup.vn.002"
kind = "D"
persona = "tuan-multihat-plus"
lanes = ["S0", "floor"]
title = "Compact mode: no method file, Day 0 still starts and never claims the file check"
context = "Door A steps 1, 2 and 4 done on a Windows laptop; step 3 failed (the .md opened as text in a Chrome tab and he skipped it). The project holds only the instruction block. New chat. No Brand Card."
input = """Bắt đầu"""
not_contains = ["✓ file phương pháp"]
regex = [
  '\A◆ Content Machine · Kiểm tra cài đặt: ✓ hướng dẫn',
  '(?i)anh, chị hay bạn',
  '''(?i)khoảng (?:25|30) phút''',
]
not_regex = [
  '(?i)(tải|đính kèm|upload|thêm|gắn)\s+(lại\s+)?(file|tệp)[^.\n]{0,40}(ngay|bây giờ|trước khi|rồi mới)',
  '(?i)(mở|vào|quay lại)\s+trang\s+(cài đặt|hướng dẫn)',
]
invariants = ["I1", "I5", "I15"]
max_questions = 1
notes = "UX §1.2 'if step 3 fails, compact mode runs all of Day 0 … nothing can block it'; QA §1.4 never claim a check that didn't run (setup.check_compact '… ✗ file phương pháp (chế độ gọn) …', start-block: 'cứ làm, không bắt tải gì'). There is no stop point any more (wf15 §1, R13): any 'add the file' nudge waits until after Day 0's last reply, so an ask now is a detour (acceptance [day0] detours_between_start_and_day0_end = 0)."

[[case]]
id = "setup.vn.003"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "Reply 1: the 3-line promise and the xưng hô question in a neutral pronoun; the dump prompt waits for reply 2"
context = "Door A (S1) or block only (S0), ChatGPT Plus on a Windows laptop. New chat. Nothing said yet."
input = """Bắt đầu"""
contains = ["Hôm nay mình làm 3 việc", "đúng một điều để khách nhớ bạn", "video quay được hôm nay", "kèm bài cả tuần đầu", "anh, chị hay bạn", "gõ 1 chữ"]
regex = [
  '''(?i)khoảng (?:25|30) phút''',
  '''(?i)kể chuyện nghề 5[–-]10 phút''',
  '''Cho mình hỏi trước: gọi bạn là anh, chị hay bạn\? \(gõ 1 chữ là được\)''',
]
not_regex = [
  '(?<!\w)([Cc]hị|[Aa]nh)\s+(bấm|nói|kể|cứ|gõ|xả)(?!\w)',
  '(?<!\w)[Ee]m\s+(sẽ|tìm|lo)(?!\w)',
  '''MỘT điều''',
  '''(?i)xả hết ra''',
]
invariants = ["I1", "I4", "I5", "I15", "I17"]
max_words = 170
max_questions = 1
notes = "start-block NGÀY 0 step 1: 'Hôm nay mình làm 3 việc, khoảng 30 phút: 1) Bạn kể chuyện nghề 5–10 phút. 2) Mình tìm ra đúng một điều để khách nhớ bạn. 3) Bạn có ngay một video quay được hôm nay, kèm bài cả tuần đầu.' + mic tip, then the xưng hô question (XƯNG HÔ). The naturalness pass replaced 'MỘT điều' with 'đúng một điều' (B3). The VN block still says 'khoảng 30 phút' where R14 / EN say 25 min, so the regex takes either (flagged to the kit owner). The dump prompt is reply 2 in VN (step 2), so 'xả hết ra' here is out of order. Quit point 15 'xưng hô asked late'. Until the coach answers, the machine speaks mình–bạn; addressing her as chị or speaking as em before she chose is a slip."


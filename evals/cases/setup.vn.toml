invariants = ["I1", "I3", "I4", "I5", "I15", "I17", "I18"]
notes = "scope: transcript. acceptance [language] vn_pronoun_slips = 0. The listed strings are the mình–bạn defaults of strings/vn.toml; any of them in a chị–em run is an unadapted string (QA §2.4 'VN xưng hô follows the Card')."

# ---------------------------------------------------------------- Door B and pasted-block recovery

[[case]]
id = "setup.vn.010"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "floor"]

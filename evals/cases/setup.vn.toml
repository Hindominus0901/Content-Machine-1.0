regex = ['(?i)dán[^.\n]{0,40}(ô chat|vào đây|đoạn chat|tin nhắn)', '(?i)hôm nay\s+(vẫn|cứ)\s+(chạy|làm|dùng)']
not_regex = ['(?i)(cài|làm)\s+lại\s+(từ đầu|trước khi)', '(?i)(dừng|ngừng)\s+(ở đây|lại)']
invariants = ["I1", "I5", "I15"]
max_questions = 1
notes = "UX §6 Machine row: self-check gives the right one-line fix for 'a block pasted into chat' (100%). Day 0 must not stop; the permanent fix is deferred, not demanded."


# evals/cases/setup.vn.toml · Day-0 session order for the VN edition: install proof, compact mode,
# reply 1 (promise + xưng hô question + mic tip), pronoun pair from reply 2, Door B, film-today
# delivery, quiet CTA, inline claims guard, stop point + Brand Card (never a gate), Week 1, wrap-up,
# resume. Sources: docs/research/wf11-ux-spec.md §1–§2 and §6, strings/vn.toml, docs/DECISIONS.md,
# docs/research/wf12-qa-spec.md §2.4 and §5.2, docs/research/wf2-vietnam-market.md §5–§7.
# Written by the QA role before modules/vn/setup.md exists. Personas: evals/personas/vn/<id>.
#
# How to read a case (shared by setup.vn, message.vn and brain.vn):
# - input: coach turns in order, separated by a line holding only "---".
#   "<<paste: FILE …>>" = the simulator inlines that file (or the named section) verbatim there;
#   persona files are named <persona-id>/<file>, dist files "the rendered VN <file>".
#   "<<simulator: …>>" = the coach side keeps going under evals/README.md "Lanes and simulated runs".
# - context: the state when `input` starts, including what the machine has already said.
# - D assertions run on the machine reply to the LAST coach turn, unless notes starts with a scope:
#     "scope: transcript"  all machine replies of the case joined (contains = somewhere,
#                          not_contains / not_regex = nowhere)
#     "scope: pieces"      only text above verdict lines, split the way graders.py splits pieces
#     "scope: visible"     coach-visible text (graders.py drops the "cho máy" block)
#   max_words / max_chars / max_questions always count the coach-visible text of the last reply.
# - contains: case-insensitive substring after NFC. regex / not_regex: Python re, case-sensitive
#   unless the pattern starts with (?i). A per-line guard such as (?im)^(?!.*không viết).*cam kết
#   reads "any line holding the phrase must be a refusal line".
# - Pronoun-dependent strings from strings/vn.toml are asserted in the pair the coach chose
#   (default mình–bạn; chị–em turns "Cần bạn" into "Cần chị", "Mình sẽ đăng" into "Em sẽ đăng").

[meta]
module = "setup"
edition = "vn"
written_by = "qa-role"

# ---------------------------------------------------------------- install proof, compact mode

[[case]]
id = "setup.vn.001"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "floor"]
title = "Pass test: reply 1 opens with the exact VN setup-check line"
context = "Door A done on chatgpt.com (Windows, Chrome): project 'Content Machine', VN instruction block saved in Instructions, CONTENT-MACHINE-VN.md added as a project file. New chat inside the project. No Brand Card in sources. Nothing said yet."
input = """Bắt đầu"""
contains = ["◆ Content Machine · Kiểm tra cài đặt: ✓ hướng dẫn ✓ file phương pháp · Brand Card: làm ngay hôm nay"]
not_contains = ["Setup check", "method file", "we make it today"]
regex = ['\A◆ Content Machine · Kiểm tra cài đặt: ✓ hướng dẫn ✓ file phương pháp · Brand Card: làm ngay hôm nay']
invariants = ["I1", "I4", "I5", "I15", "I17"]
max_questions = 1
notes = "UX §1.2 pass test; acceptance [install] pass_test_tag_rate = 1.0. strings/vn.toml setup.check with {{name}} rendered."

[[case]]
id = "setup.vn.002"
kind = "D"
persona = "tuan-multihat-plus"
lanes = ["S0", "floor"]
title = "Compact mode: no method file, Day 0 still starts and never claims the file check"
context = "Door A steps 1, 2 and 4 done on a Windows laptop; step 3 failed (the .md opened as text in a Chrome tab and he skipped it). The project holds only the instruction block. New chat. No Brand Card."
input = """Bắt đầu"""
not_contains = ["✓ file phương pháp"]
regex = ['\A◆ Content Machine · Kiểm tra cài đặt: ✓ hướng dẫn', '(?i)anh, chị hay bạn']
not_regex = [
  '(?i)(tải|đính kèm|upload|thêm|gắn)\s+(lại\s+)?(file|tệp)[^.\n]{0,40}(ngay|bây giờ|trước khi|rồi mới)',
  '(?i)(mở|vào|quay lại)\s+trang\s+(cài đặt|hướng dẫn)',
]
invariants = ["I1", "I5", "I15"]
max_questions = 1
notes = "UX §1.2 'if step 3 fails, compact mode runs all of Day 0 … nothing can block it'; QA §1.4 never claim a check that didn't run. Asking for the file is allowed only after the stop point ('cuối buổi'), so any ask now is a detour."

[[case]]
id = "setup.vn.003"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "Reply 1: 3-line promise and the xưng hô question, in a neutral pronoun"
context = "Same as setup.vn.001 (Door A, S1) or block only (S0). Nothing said yet."
input = """Bắt đầu"""
contains = ["Hôm nay mình làm 3 việc", "khoảng 30 phút", "MỘT điều", "video quay được hôm nay", "anh, chị hay bạn", "gõ 1 chữ"]
not_regex = ['(?<!\w)([Cc]hị|[Aa]nh)\s+(bấm|nói|kể|cứ|gõ|xả)(?!\w)', '(?<!\w)[Ee]m\s+(sẽ|tìm|lo)(?!\w)']
invariants = ["I1", "I4", "I5", "I15", "I17"]
max_words = 170
max_questions = 1
notes = "UX §2 minute 0 VN line; quit point 15 'xưng hô asked late'. Until the coach answers, the machine speaks mình–bạn; addressing her as chị or speaking as em before she chose is a slip."

[[case]]
id = "setup.vn.004"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "floor"]
title = "Door B reply 1 on an Android phone: small-mic tip, xưng hô question, no project talk"
context = "Door B: ChatGPT Free app on Android, no project, no files, no helper today. She copied the Phone Starter from the setup page into a new chat and pressed Send."
input = """<<paste: the rendered VN PHONE-STARTER.txt, whole>>"""
contains = ["micro nhỏ trong ô chat", "sóng âm", "anh, chị hay bạn"]
not_contains = ["dự án", "project", "§", "✓ file phương pháp", "Notion"]
regex = ['\A◆ Content Machine']
invariants = ["I1", "I4", "I5", "I15"]
max_questions = 1
notes = "UX §1.4 Door B 'never mentions a project'; strings mic.phone; Hạnh's voice-mode habit (persona behaviour) makes the sound-wave warning mandatory in reply 1."


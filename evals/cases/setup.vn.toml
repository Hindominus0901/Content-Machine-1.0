max_questions = 1
notes = "scope: transcript. UX §1.3 'VN on Claude: keyboard mic'; UX §6 Voice row 'Claude VN tester is told to use the keyboard mic in reply 1 or 2'; strings mic.claude_vn rendered in anh–em ('Anh dùng micro trên bàn phím…')."

[[case]]
id = "setup.vn.009"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "Whole Day 0 in chị–em: no default-pair verdict or prose strings leak through"
context = "persona default: Door A on a Windows laptop, ChatGPT Plus, S0 or S1. Golden run from Start to the wrap-up."

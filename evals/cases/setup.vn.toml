invariants = ["I1", "I5", "I15"]
max_words = 120
max_questions = 1
notes = "Hạnh's verbatim objection (answers.md Behaviour). She called herself 'chị', so the pair is settled without asking again. Re-paste requests or a second xưng hô question fail."

[[case]]
id = "setup.vn.011"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "floor"]
title = "Instruction block pasted into the chat instead of Instructions: works today, one fix line"

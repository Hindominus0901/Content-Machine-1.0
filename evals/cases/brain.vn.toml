[[case]]
id = "brain.vn.001"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "S0", "floor"]
title = "Day-0 card after Tuần 1: a 3-line top (≤500 chars, NÓI GÌ / NÓI THẾ NÀO), the labelled machine block, the save line and TIẾP; no stop point"
context = """Day 0, Door A, ChatGPT Plus on the Windows laptop, em–chị. Thu sent dump chunks 1-3 (her posts W1-W3 pasted after chunk 1; the soft cut after chunk 2 ended 'không thì gõ xong'; chunk 3 ended 'xong rồi đấy em'). Nothing was missing, so that reply showed the 4-line Map (TỪ KHOÁ: LÃI ẢO) with QUAY HÔM NAY under it and 'Chạy thử 4 tuần nhé chị. OK hay sửa một dòng?'. Her dump named her course (Shop Nhỏ Lãi Thật, 6 tuần, 4.990.000đ) and Tuesday evenings as her free time; talk day was never asked (guessed above Tuần 1). No Brand Card yet. Turn 1 answers the Map reply and gets Tuần 1, unasked; the card follows in the same reply or, if that runs long, in the next; turn 2 answers that reply."""
input = '''[turn 1] ok em, tối chị quay
[turn 2] ok em'''
contains = []
not_contains = []
regex = [
  '''Brand Card v1\W{0,4}·[^\n]*\n\s*[^\w\n]*NÓI GÌ:[^\n]+\n\s*[^\w\n]*NÓI THẾ NÀO:[^\n]+\n(?:[^\n]*(?:với khách|không bao giờ):[^\n]*\n)?\s*[^\w\n]*(?:Phần còn lại là )?cho máy, không cần đọc''',
  '''Brand Card v1\W{0,4}·(?:(?!cho máy)[\s\S]){1,520}cho máy, không cần đọc''',
  '''cho máy, không cần đọc[^\n]*\n\s*```[^\n]*\n(?:(?!```)[\s\S]){1,6100}```''',
  '''(?im)^[^\w\n]*NÓI GÌ:[^\n]*lãi ảo''',
  '''(?m)^\s*version:\s*v?1\s*$''',
  '''Lưu lại để (?:em|mình) nhớ (?:chị|bạn)[^\n]{0,12}\(30 giây\)''',
  '''(?i)Lưu vào dự án''',
  '''TIẾP →[^\n]*(?i:quay video hôm nay)[^\n]*(?i:mai (?:(?:chị|anh|bạn|em) )?mở)''',
]
not_regex = [
  '''(?i)MY-BRAND-BRAIN|Brand Brain''',
  '''(?i)(có tấm card này|nghỉ ở đây|kịch bản vẫn đợi|kịch bản Tuần 1 \(8 phút\))''',
  '''(?s)Brand Card v1\W{0,4}·.*Brand Card v1\W{0,4}·''',
  '''\A(?:(?!```)[\s\S])*?Brand Card v1\W{0,4}·''',
  '''(?m)\A(?:(?:(?!```)[\s\S])*```(?:(?!```)[\s\S])*```)*(?:(?!```)[\s\S])*```(?:(?!```)[\s\S])*?(?:Brand Card v\d+\W{0,4}·|^[^\w\n]*NÓI GÌ:)''',
  '''Brand Card v1\W{0,4}·(?:(?!cho máy)[\s\S])*?(?:4\.990\.000|4,99 ?tr|số liệu thứ Sáu|ĐỂ SAU)''',
  '''\A(?:(?!cho máy)[\s\S])*?\b[VSPXKIBOR]-\d+\b''',
  '''(?i)(muốn|làm|viết)[^\n?]{0,25}tuần 1[^\n]*\?''',
]
verdict = ""
invariants = ["I1", "I2", "I4", "I5", "I15"]
max_words = 0
max_chars = 0
max_questions = 1
notes = """scope: transcript. wf15 §0 S3-S4, §1.6-§1.8; §CM-CARD brain.kit-print 1-3: printed on Day 0 after Tuần 1 (no stop point), with the one save line (card.save_line, start-block step 8 'Chưa lưu vẫn làm tiếp'); TOP ≤500 chars, 3 lines: card.title · card.visible.what · card.visible.how; then card.machine.heading ('Phần còn lại là cho máy, không cần đọc:') and one fenced block. brand-card.toml [budgets]: visible ≤500 (was 900), whole ≤6,600 VN (the old ≤5,800 was stale). R15: the offer (4.990.000đ), the week line (card.label.week '… · số liệu thứ Sáu'), talk day and ĐỂ SAU left the top for the machine block (brain.vn.002). The first pattern pins the 3-line shape (the NÓI THẾ NÀO line may wrap once at 'với khách:' or 'không bao giờ:'); the second bounds the top; the third bounds the block. The card prints once, after the Tuần-1 boxes, and its top sits outside any copy box (vg1 runs printed it inside the fence): the fifth not_regex counts fences, so the closing fence of the last Tuần-1 box right above a correct card (vg3 tuan) does not count as an opening one. The old stop-point lines (card.stop_lines) are gone. Quit point 5: no brand wall. vg2-day0-vn-hanh turn 8 and vg2-day0-vn-coldstart turn 9 show the shape."""


# evals/cases/brain.vn.toml · Brand Card and memory, VN edition: the Day-0 card after Tuần 1 (a 3-line top ≤500
# characters: the title, "NÓI GÌ:", "NÓI THẾ NÀO:"; then "Phần còn lại là cho máy, không cần đọc:" and one fenced block
# of `name: value` lines, whole card ≤6,600), the save line, the fields (voice group with connectors and address_1to1,
# list_size=ask|{n}), "lát nữa" and "Ngắn thôi" (the card in the next message), self-check in later chats (highest
# version wins, missing card), Door B box and move-in, "lưu lại: …" verdicts, "không giống mình:" / "mình có nói",
# version bumps, saving on Claude, shared-account memory, and "tại sao?" traced to the card. Written by the QA role;
# producers never edit this file. Rewritten 6 Oct 2026 for the simple surface (wf15) and Voice & Language (wf14);
# brain.en.toml is the model.
#
# Sources: docs/research/wf15-simple-surface-spec.md §0 S3-S4, §1.6-§1.8 and wf14-voice-language-spec.md §1-§3 (win
# where they differ); docs/DECISIONS.md (K2; facts asked up front + guessed above Tuần 1); schemas/brand-card.toml
# (visible top 3 lines ≤500 chars; whole ≤6,600 VN; machine block in a fence after the heading; one `name: value`
# line per field, items joined by " | "; field caps; trim_order, voice fields last; pronouns and dialect required in
# VN; connectors, address_1to1; list_size ask|{n}; highest version wins); modules/vn/brain.md (§CM-CARD 1-7),
# setup.md 9-11, levelup.md 1 ("Ngắn thôi", "lát nữa"), voice.md (§CM-VOICE 1-6); core/vn/start-block.md NGÀY 0 7-9,
# BRAND CARD (render: python3 tools/render.py --edition vn --target kit|phone core/vn/start-block.md);
# docs/research/wf15-case-impact.md (R4, R13, R15; the brain.vn table); strings/vn.toml (card.title,
# card.visible.what "NÓI GÌ:", card.visible.how "NÓI THẾ NÀO:", card.visible.to_them "với khách:",
# card.visible.never "không bao giờ:", card.machine.heading, card.save_line, setup.check_found, card.remove_old,
# card.fix_*, save.claude_plain, phone.save, phone.fresh_box, month.save_card, message.save.*, voice.not_me_ok,
# voice.do_say_ok, voice.cant_allow, setup.plan_guess).
#
# Conventions (read with evals/README.md "Case files"):
# - `input` holds the coach turn(s); lines starting "[turn n]" split several turns (evals/run.py). `context` is
#   self-contained and names which Brand Card versions sit in the project sources. Assertions run on the reply to the
#   last coach turn, unless `notes` opens with "scope: transcript" (all machine replies of the case joined: contains /
#   regex somewhere, not_* nowhere), "scope: each reply" or "scope: pieces".
# - "<<paste: FILE …>>" = the simulator inlines that file verbatim; "the MY CONTENT MACHINE box" = the box the
#   machine printed at that persona's Door B close.
# - Day 0 now (start-block NGÀY 0, K2): … the Map with QUAY HÔM NAY under it and map.ok → any answer but a Map change
#   brings all of Tuần 1, unasked, with setup.plan_guess named once above it → the Brand Card + card.save_line ("Lưu lại
#   để mình nhớ bạn (30 giây)." in the pair: "Lưu lại để em nhớ chị (30 giây).") + the app route + TIẾP ("Quay video hôm
#   nay nhé. Mai mở Content Machine, vào đoạn chat mới nhất, nhắn 'tiếp'."). setup.kit-order 9: Tuần 1, card and save
#   line come in one message, the card in the next message when the reply runs long; "Ngắn thôi" puts the card in the
#   next message (§CM-TODAY 1); "lát nữa" before the card prints card + save line at once and Tuần 1 waits for "tiếp".
#   No stop point ("Hôm nay xong rồi. Có tấm card này…", card.stop_lines, is gone) and no wrap-up.
# - Day-0 card cases: `input` runs from the coach's answer to the Map + QUAY HÔM NAY reply ("[turn 1] …") to the reply
#   that holds the card ("[turn 2] ok em" answers a long Tuần-1 reply). They are graded "scope: transcript", with
#   patterns anchored on the card: its title line "Brand Card v1 · …" (the top runs from it to "cho máy, không cần
#   đọc"), the machine heading, or `name: value` field lines at a line start.
# - Card shape: the top is 3 lines (title · "NÓI GÌ:" message · 3 chủ đề · "từ khoá" · "NÓI THẾ NÀO:" giọng · nhịp ·
#   "câu", "câu" · với khách: "xưng hô", plus " · không bao giờ: "…"" after a "không giống mình:"), ≤500 chars, plain
#   words, outside any copy box; offer, the week line, talk day and ĐỂ SAU are machine-block fields. Regexes bound the
#   top (card title to the machine heading ≤520 chars) and the block (≤6,100 chars) instead of max_chars, which
#   run.py measures on the visible part only (the reply also carries the save line, TIẾP and Tuần-1 pieces).
# - Fields print one per line (`version: 1`, `talk_day: Tue`); a line grouping several (`version: date=… edition=…`,
#   `plan_start: … | season: 1 | talk_day: …`), as brain.kit-print 3's own layout tempts, fails the per-field patterns.
# - Status lines: a Ready piece prints only its content (at most one line under a piece, only for "Cần bạn · …", a
#   hard stop, "cứ đăng" or a required dated note). Later-chat cases detect today's piece by its copy box (or an
#   N<digit> label) and forbid Sẵn sàng / ✓ Đã kiểm / Bản nháp / VÌ SAO RA KHÁCH lines; those print only on "tại
#   sao?" (brain.vn.027). Regexes are Python `re`, case-sensitive unless they start with (?i).
# - The machine block legitimately carries field names and Bank IDs, so checks on the coach-visible part use a
#   "before the machine heading" pattern \A(?:(?!cho máy)[\s\S])*? or the card-top window; graders.py strips blocks
#   labelled "cho máy".
# - The later-chat self-check line "Brand Card v1 ✓" (strings setup.check_found) is asserted loosely: ✓ or ✔, any
#   order or spacing around it.
# - `invariants` lists I1-I23 only; graders.py also runs day0_timing, day0_shape (card top ≤500, outside the copy box;
#   whole card ≤ targets; the save line with a route and a backup), deny_list and vn_natural on every transcript.


regex = ['(?i)v2', '(?i)xo(á|a)[^.\n]{0,40}v1|v1[^.\n]{0,40}xo(á|a)', '(?m)^version:\s*2\s*$']
not_regex = ['5,990,000|5990000|\$|VND', '(?i)(?<!\w)bạn(?!\w)']
invariants = ["I1", "I8", "I15"]
max_questions = 1
notes = "architecture brain job 'update my offer → fields, Brief v+1' carried by the Brand Card; wf2 §5 price format 1.990.000đ; UX §3.2 'save the new Brand Card and delete the old one: 2 taps'."

[[case]]
id = "brain.vn.021"
kind = "D"
persona = "consultant"
lanes = ["S1", "floor"]
title = "Monthly check says KEEP: card v2 with a new trial end, two taps of upkeep"
context = "Last Friday of Season 1, Door A on Claude Pro. 'plan next month' ran; the one decision offered KEEP (default) or sharpen one line."

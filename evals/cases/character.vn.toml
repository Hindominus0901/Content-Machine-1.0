# Character module cases (VN). Written by the QA role before the module existed; producers never edit this file.
# Rewritten 6 Oct 2026 for the simple surface (wf15), the K2 order, Voice & Language (wf14) and the VN naturalness pass.
# Sources: docs/research/wf15-simple-surface-spec.md §0-§2 and wf14-voice-language-spec.md §2 (win where they differ);
# docs/research/wf15-case-impact.md (R1, R10, R13, R15, CTX); docs/research/wf6-character-design.md (A1 interviewer
# rules, A2 Card, A4 polarity guide and VN calibration notes 1-11, §6 borrowed-attractor detector); wf6-character-
# polarity.md item 10 (a blunt VN persona can work; insulting named people is costly); wf11-ux-spec.md §3.3 L5
# "3 × 20 phút"; wf12-qa-spec.md §2.4, §2.5, §2.8 ("không giống mình:", "mình có nói"), §3.1 character-card critical
# items; wf2-vietnam-market.md §5, §7, §8; docs/DECISIONS.md (polarize on ideas, never people; flex or freebie only as
# proof, CTA or flip; F1; K2; "Long dumps…"); core/vn/start-block.md (XƯNG HÔ, NGÀY 0 steps 3-9, BRAND CARD, IN);
# modules/vn/character.md (character.kit-core, kit-talks), brain.md (§CM-CARD 1-3: the 3-line top, the machine block),
# voice.md (§CM-VOICE 2-3, 6), edge-rubric.md (IN DƯỚI BÀI, "tại sao?"), guardrails.md (DỪNG CỨNG, KHI ĐƯỢC NHỜ);
# schemas/brand-card.toml (machine-block field names: trait, enemy, principles, phrases, pronouns, dialect);
# strings/vn.toml (setup.guess, setup.guess_no_result, dump.enough, map.*, card.visible.*, card.save_line,
# voice.not_me_ok, voice.cant_allow, character.talk_start, character.voice_first, character.bet,
# levelup.offer_character, mic.claude_vn, verdict.*, why.prefix, checked.prefix).
# Personas: evals/personas/vn/<id> (never evals/personas/heldout).
#
# Conventions (read with evals/README.md "Case files"):
# - `input` holds the coach turn(s); lines starting "[turn n]" separate several. Assertions run on the machine reply to
#   the last coach turn, unless `notes` starts with "scope: transcript" (all machine replies joined).
# - "<<paste: FILE ...>>" in an input means the simulator inlines that persona file's body verbatim there.
# - A not_regex of the form (?im)^(?![^\n]*(?:không viết|không nêu|...))[^\n]*X skips the refusal line, because
#   verdict.hardstop ('Câu "{line}" mình không viết: …', in the coach's pair) quotes the refused line back.
# - "Hook line" regexes anchor on the labelled first line of a beat card (câu đầu / câu mở đầu / hook /
#   chữ trên màn hình), the labels graders.py I12 already reads.
# - Day 0 (wf15 §1; start-block NGÀY 0): no character questions (character.kit-core 'NGÀY 0: không hỏi về tính
#   cách'). Past ~1.200 tiếng the soft cut carries the first câu đoán (dump.enough + setup.guess /
#   setup.guess_no_result / setup.multi_income), then the other missing facts, one a message (≤3 in all); then ONE
#   reply with the 4-line Bản đồ (ĐIỀU KHÁCH NHỚ: · 3 CHỦ ĐỀ: · TỪ KHOÁ: · GIỌNG:, the last ending 'với khách:
#   "{audience address}"'), QUAY HÔM NAY under it and map.ok "Chạy thử 4 tuần nhé. OK hay sửa một dòng?" (K2);
#   any answer but a Map change brings Tuần 1, unasked; then the Brand Card: the top (card.title, 'NÓI GÌ: …',
#   'NÓI THẾ NÀO: … · với khách: "…"', ≤500 characters) and, after 'Phần còn lại là cho máy, không cần đọc:', the
#   machine block (trait, enemy, principles, phrases, pronouns, dialect …) + card.save_line "Lưu lại để mình nhớ bạn
#   (30 giây)." (Door B: phone.save, with Zalo "Cloud của tôi") + TIẾP. No check screen, inventory or stop point.
#   Budgets (acceptance.toml [day0]): the Map within 7 coach turns, film-ready by minute 20, ≤10 coach turns.
# - Status lines (wf15 §2): a Ready piece prints only its content: no VÌ SAO RA KHÁCH, "✓ Đã kiểm:", "Sẵn sàng …" or
#   "Bản nháp ·" line (not_regex (?m)^\W*(?:VÌ SAO RA KHÁCH|✓ Đã kiểm:|Sẵn sàng (?:quay|đăng|gửi) ·|Bản nháp ·), I3).
#   One line only for "Cần bạn · …" (verdict.needs: "Cần bạn · {question} Mình không bịa đâu. (Hoặc gõ "bỏ qua".)"),
#   a hard stop, "cứ đăng" (verdict.override) or a required dated note (the F1 compare note), each in the coach's pair.
# - "tại sao?" follow-ups: "[turn 1] <the turn that prints the piece>" and "[turn 2] tại sao?" (or a close variant
#   graders.py WHY_RE reads); assertions run on the "tại sao?" reply (the VÌ SAO line, what it was written from, the
#   ✓ Đã kiểm line); I3 grades the turn-1 reply. The "tại sao?" cases are character.vn.029 and 030.
# - "không giống mình: <câu>" is confirmed in one line, voice.not_me_ok ('Rồi, từ giờ mình không dùng "{line}" nữa.',
#   in the coach's pair); a per-line guard skips that line, which quotes the banned line back.
# - `invariants` lists I1-I23 ids only.
# - Context, titles and notes are English for the QA team; every coach turn and expected phrase is Vietnamese.

[meta]
module = "character"
edition = "vn"
written_by = "qa-role"

[[case]]
id = "character.vn.001"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "S1", "floor"]
title = "Door B, Day 0's last reply: the Brand Card carries the compact character from the dump in its machine block; the save route is Zalo 'Cloud của tôi'"
context = "Day 0, Door B: chị Hạnh pasted the Phone Starter into a normal ChatGPT Free chat on Android; there is no project. Reply 1 asked xưng hô and she answered 'Gọi chị là chị thôi em, chị bốn lăm tuổi rồi.' Dump chunks 1-3 given: the soft cut came after chunk 2 (which holds the aside 'Linh ơi, chị Duyên đến à?') with the multi-income guess, and she answered it by telling chunk 3 (spa nuôi cả nhà, lớp kèm là cái chị muốn làm lâu dài, 'zalo cờ lao của tôi'). The 4-line Bản đồ came with QUAY HÔM NAY under it and map.ok. Turn 1 (she has filmed) is not a Map change, so it brings Tuần 1, unasked (on Free at most 3 pieces a reply); turn 2 brings the rest of Tuần 1, then the Brand Card (top: card.title, NÓI GÌ:, NÓI THẾ NÀO:; trait, enemy, principles in the machine block), the Door B save line (phone.save) and TIẾP."
input = """[turn 1] chi quay thu roi, 4 lan moi dc 1 ban ung :)) gio sao nua em
[turn 2] ok em"""
contains = ["Cloud của tôi"]
not_contains = ["Lưu vào dự án", "Save to project", "chị Duyên", "Linh ơi"]
regex = [
  '(?im)^\W*trait:\s*\S',
  '(?im)^\W*enemy:[^\n]*d(?:ọa|oạ) da',
  '(?im)^\W*principles:\s*\S',
  '(?im)^\W*pronouns:\s*(?:chị\s*[–-]\s*em|em\s*[–-]\s*chị)',
  '(?im)^\W*phrases:[^\n]*(?:bán buổi hẹn sau|nói thật|cầm (?:cái )?gương)',
  '''(?m)^\W*NÓI GÌ:''',
  '''(?m)^\W*NÓI THẾ NÀO:[^\n]*với khách:[^\n]*chị\s*[–-]\s*các em''',
]
not_regex = [
  '(?im)^\W*enemy:[^\n]*(?:anh ấy|cái anh|kh(?:óa|oá) học của)',
  '(?i)Admirable|Likable|Buyer Mirror|3D test|\bpillars?\b|trụ cột|\bTrụ [1-9]\b',
  '(?i)(?<![\w-])(?:the|and|your|with|this|that|please|because)(?![\w-])',
  '''(?i)Hôm nay xong rồi|nghỉ ở đây, kịch bản|kịch bản Tuần 1 \(8 phút\)''',
]
invariants = ["I1", "I2", "I4", "I5", "I10", "I15"]
max_questions = 1
notes = "scope: transcript. brand-card.toml and §CM-CARD 3: trait / enemy / principles come from the dump only and sit in the machine block; enemy is a practice ('dọa da'), never the man who taught the script. CC8: phrases verbatim. §CM-CARD 2 (R15): the top is 3 lines (card.title · 'NÓI GÌ: …' · 'NÓI THẾ NÀO: … · với khách: \"chị – các em\"'), ≤500 characters. Door B has no project, so the save route is phone.save with Zalo 'Cloud của tôi' (she already says 'zalo cờ lao của tôi' in chunk 3), and saving never gates anything. No stop point (R13): the card prints in Day 0's last reply, after Tuần 1 (§CM-CARD 1 'ngày 0, sau Tuần 1'); the old card.stop_lines ('Hôm nay xong rồi. … nhắn 'tiếp' là có kịch bản Tuần 1 (8 phút), hoặc nghỉ ở đây …') never prints. If Free splits Tuần 1 into more than 2 replies the card lands in a third one (open kit question, wf15-case-impact Open flags). The aside to Linh and the customer name in it never reach the card or the pieces."

[[case]]
id = "character.vn.002"
kind = "D"
persona = "consultant"
lanes = ["S0", "S1", "floor"]
title = "B2B card after Tuần 1: machine pair anh–em, enemy 'tuyển lấp chỗ' as a practice, the 3-line top with 'tôi – anh chị', no 'bạn', a Claude save line with a backup"
context = "Day 0, Door A (Claude Pro project, method file added). Reply 1 asked xưng hô; anh Khoa typed 'anh'. Dump chunks 1-3 given by keyboard mic (Quảng accent slips such as 'chổ', 'nghỉ/nghĩ' left uncorrected); the Bản đồ came with QUAY HÔM NAY under it (gạch đầu dòng) and map.ok; his 'ok' brought all of Tuần 1, unasked, and it ran long, so the card waits for the next reply (setup.kit-order 9 'app cắt: card ở tin sau'). This turn asks for it: the reply is Day 0's last one (the Brand Card + the save line + TIẾP)."
input = """ok. in cái thẻ ra đi em, anh lưu luôn"""
regex = [
  '(?im)^\W*pronouns:\s*(?:anh\s*[–-]\s*em|em\s*[–-]\s*anh)',
  '(?im)^\W*enemy:[^\n]*tuyển lấp ch[ỗổ]',
  '(?i)Cloud của tôi|gửi (?:vào|qua) (?:email|Zalo)|email cho (?:chính )?anh',
  '''(?i)Lưu lại để (?:em|mình) nhớ (?:anh|bạn) \(30 giây\)''',
  '''(?m)^\W*NÓI GÌ:''',
  '''(?m)^\W*NÓI THẾ NÀO:[^\n]*với khách:[^\n]*tôi\s*[–-]\s*anh chị''',
]
not_contains = ["chuyên gia hàng đầu", "tuyệt vời", "giải pháp nhân sự toàn diện"]
not_regex = [
  '(?im)^\W*enemy:[^\n]*(?:headhunt|phần mềm)',
  '(?<!\w)bạn (?:gõ|kể|nói|muốn|có thể|nhắn|chọn|xem|lưu)(?!\w)',
  '(?i)Admirable|Likable|Buyer Mirror|3D test|\bpillars?\b|trụ cột',
]
invariants = ["I1", "I4", "I5", "I15", "I17"]
max_questions = 1
notes = "Persona: he quits if called 'bạn' or praised ('câu trả lời tuyệt vời'). CC4: the old way is 'tuyển lấp chỗ' (his words; the dictated 'chổ' is accepted), never job boards, headhunters or HR software (compliance_notes: no named comparisons). §CM-CARD 2 (R15): the 3-line top ends 'NÓI THẾ NÀO: … · với khách: \"tôi – anh chị\"' (his audience address, kept apart from the machine pair anh–em in pronouns:). card.save_line in his pair ('Lưu lại để em nhớ anh (30 giây).') with the Claude route and the start-block backup ('Dự phòng: gửi vào Zalo \"Cloud của tôi\"'; UX quit point 'Claude save without a picture route or backup'). No stop point (R13): the card follows Tuần 1."

[[case]]
id = "character.vn.003"
kind = "D"
persona = "coldstart-coach"
lanes = ["S0", "S1", "floor"]
title = "Cold start, Day 0: no character probe after the dump; the soft cut carries one câu đoán, never a trait question, an inventory or a check screen"
context = "Day 0, Door A (ChatGPT Free, iPhone). Reply 1 asked xưng hô; Minh Anh answered 'Bạn đi, gọi chị nghe già.' Dump chunk 1 got the early win; this turn is dump chunk 2, which takes her talk past ~1.200 tiếng. Her dump has no single extreme-trait scene and no client result (cold start). The reply is the soft cut with the first câu đoán in one message (dump.enough + setup.guess_no_result)."
input = """<<paste: coldstart-coach/answers.md, the '## Dump chunk 2' section, verbatim>>"""
regex = [
  '''(?i)Hôm nay vậy là đủ rồi''',
  '''(?i)mình đoán chưa có kết quả của khách, nên mình kể chuyện (?:của )?chính bạn(?: trải qua)?\. Đúng không\?''',
]
not_regex = [
  '(?i)tính cách|nét (?:riêng|nổi bật|cực đoan)|giá trị (?:sống|cốt lõi)|nguyên tắc (?:sống|của bạn)',
  '(?i)điều (?:gì )?bạn (?:không bao giờ|luôn luôn) làm',
  '(?i)Admirable|Likable|Buyer Mirror|3D test|Character Card',
  '''(?i)biết nhiều thật|6 tháng content|không bỏ (?:gì|phí)''',
  '''(?im)^\W*[1-7]\W{1,3}(?:ai|lời (?:của )?khách|cách cũ|kết quả|cách của bạn|sản phẩm)\s*[:·—–-]''',
  '''(?s)(?i:mình đoán).*(?i:mình đoán)''',
  '''(?m)^\W*(?:[1-4][.)]?\s+)?ĐIỀU KHÁCH NHỚ:''',
]
not_contains = ["học viên đã", "hết đau", "chuyên gia trị liệu"]
invariants = ["I2", "I5", "I8", "I15"]
max_questions = 1
notes = "character.kit-core 'NGÀY 0: không hỏi về tính cách … chỉ từ lời xả, thiếu thì [CHƯA CÓ]'; QA §3.1 character-card runtime: fields traced or [GAP]; gaps become optional homework with no extra setup probes. wf11: Character Core Q1-Q5 are covered by the dump; excavation is L5. DECISIONS 'Long dumps…' and start-block step 3-4: past ~1.200 tiếng the soft cut (dump.enough 'Hôm nay vậy là đủ rồi. Còn chuyện nào thì kể luôn, không thì {câu đoán}') carries the first câu đoán in the same message, here setup.guess_no_result ('Mình đoán chưa có kết quả của khách, nên mình kể chuyện chính bạn trải qua. Đúng không?', mình–bạn as is). R10: no inventory ('Bạn biết nhiều thật…'), no numbered check lines, no Map yet, one guess only. Cold start (I8): no client result anywhere. A character question here also costs a turn against the Map's 7-turn VN budget (acceptance.toml [day0])."


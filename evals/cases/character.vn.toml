# Character module cases (VN). Written by the QA role before the module exists.
# Sources: docs/research/wf6-character-design.md (A1 interviewer rules, A2 Card, A4 polarity guide and VN
# calibration notes 1-11, §6 borrowed-attractor detector); wf6-character-polarity.md item 10 (a blunt VN persona
# can work; insulting named people is costly); wf11-ux-spec.md §2 (xưng hô in reply 1, Door B, Claude keyboard mic,
# Cloud của tôi backup), §3.3 L5 "3 × 20 phút"; wf12-qa-spec.md §2.4, §2.5, §2.8 ("không giống mình:", "mình có
# nói"), §3.1 character-card critical items; wf2-vietnam-market.md §5, §7, §8 (xưng hô, register, banned calques,
# compliance); docs/DECISIONS.md (polarize on ideas, never people; flex or freebie only as proof, CTA or flip);
# schemas/brand-card.toml (machine-block field names: trait, enemy, principles, phrases, pronouns, dialect).
#
# Conventions (same as character.en.toml):
# - "<<paste: FILE ...>>" in an input means the simulator inlines that persona file's body verbatim there.
# - A not_regex of the form (?im)^(?![^\n]*(?:không viết|không nêu|...))[^\n]*X skips the refusal line, because
#   verdict.hardstop quotes the refused line back to the coach.
# - "Hook line" regexes anchor on the labelled first line of a beat card (câu đầu / câu mở đầu / hook /
#   chữ trên màn hình), the labels graders.py I12 already reads.
# - Context, titles and notes are English for the QA team; every coach turn and expected phrase is Vietnamese.

[meta]
module = "character"
edition = "vn"
written_by = "qa-role"

[[case]]
id = "character.vn.001"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "S1", "floor"]
title = "Door B stop point: Brand Card carries the compact character from the dump; save route is Zalo 'Cloud của tôi'"
context = "Day 0, Door B: chị Hạnh pasted the Phone Starter into a normal ChatGPT Free chat on Android; there is no project. Reply 1 asked xưng hô and she answered 'Gọi chị là chị thôi em, chị bốn lăm tuổi rồi.' Dump chunks 1-3 (answers.md) given, including the aside 'Linh ơi, chị Duyên đến à?'. 7-line check done, Map OK'd, QUAY HÔM NAY delivered. The Brand Card has not been printed."
input = """chi quay thu roi, 4 lan moi dc 1 ban ung :)) gio sao nua em"""
contains = ["Cloud của tôi"]
not_contains = ["Lưu vào dự án", "Save to project", "chị Duyên", "Linh ơi"]
regex = [
  '(?im)^\W*trait:\s*\S',
  '(?im)^\W*enemy:[^\n]*d(?:ọa|oạ) da',
  '(?im)^\W*principles:\s*\S',
  '(?im)^\W*pronouns:\s*(?:chị\s*[–-]\s*em|em\s*[–-]\s*chị)',
  '(?im)^\W*phrases:[^\n]*(?:bán buổi hẹn sau|nói thật|cầm (?:cái )?gương)',
]
not_regex = [
  '(?im)^\W*enemy:[^\n]*(?:anh ấy|cái anh|kh(?:óa|oá) học của)',
  '(?i)Admirable|Likable|Buyer Mirror|3D test|\bpillars?\b|trụ cột|\bTrụ [1-9]\b',
  '(?i)(?<![\w-])(?:the|and|your|with|this|that|please|because)(?![\w-])',
]
invariants = ["I1", "I2", "I4", "I5", "I10", "I15"]
max_questions = 1
notes = "brand-card.toml: trait / enemy / principles come from the dump only; enemy is a practice ('dọa da'), never the man who taught the script. CC8: phrases verbatim. Door B has no project, so the save route is Zalo 'Cloud của tôi' (she already says 'zalo cờ lao của tôi' in chunk 3) and saving never gates 'tiếp' (UX §2 stop point). The aside to Linh and the customer name in it never reach the Card."


# ---------------------------------------------------------------- F1 and DISTANCE inside a voice pass (wf13; added by the QA verifier)

[[case]]
id = "humanize.vn.029"
kind = "D"
persona = "tuan-multihat-plus"
lanes = ["S1", "floor"]
title = "F1 'viết giọng anh mà giữ y câu của họ': that one line verbatim, the rest his own voice and story, ONE dated copy note and nothing else under it; the Override is only logged"
context = """Week 3, Thursday 29/10/2026, ChatGPT Plus project (iPhone app). Brand Card v1 present (persona default: pair anh–em, dialect Nam, keyword GỒNG LÃI, P5 his own 2022 Dĩ An flat: ưu đãi 7,5% năm đầu, góp 9 triệu, năm 2023 thả nổi khoảng 12%, góp 13 triệu). F1 (DECISIONS, 5 Oct 2026) applies. On Thursday 22/10 he sent liked-paste.md L2 (a TikTok caption: a café table with a young couple, the bank said yes, one question about the payment after the first-year rate, a sheet of paper, the rule 'Tính bằng lãi năm thứ hai, đừng tính bằng lãi năm đầu.', a send-to-your-partner CTA); the machine saved its shape. Thursday's short video is not filmed yet."""
input = """làm bản của anh cái clip ngồi quán cà phê đó, viết giọng anh nha, mà giữ y câu 'Tính bằng lãi năm thứ hai, đừng tính bằng lãi năm đầu.' của người ta, câu đó đúng quá"""
contains = ["bài này bám sát bài của họ. Bài na ná dễ bị giảm hiển thị, mà chữ cũng là của họ."]
regex = [
  'Tính bằng lãi năm thứ hai, đừng tính bằng lãi năm đầu\.',
  '(?i)Dĩ An|7,5\s?%|13 triệu|9 triệu|thả nổi|tờ khăn giấy|toilet nhà mẫu|tui gồng',
  '(?i)gồng lãi',
  '''Đăng hay không t(?:uỳ|ùy) anh\.''',
  '(?im)^(?=[^\n]*bám sát bài của họ)(?=[^\n]*(?:\b20\d{2}\b|\b\d{1,2}/\d{1,2}\b|tháng\s+\d{1,2}))[^\n]*$',
  'TIẾP →[^\n]*\s*\Z',
]
not_regex = [
  '(?i)(?:mình|em|tôi)\s+không viết:',
  '''(?s)Bài na ná dễ bị giảm hiển thị.*Bài na ná dễ bị giảm hiển thị''',
  '(?i)vẫn là bài của họ|(?:không|chẳng)\s+(?:nên|thể)\s+(?:chép|giữ nguyên)',
  '''Đăng hay không t(?:uỳ|ùy) bạn|Đăng theo (?:ý|quyết định)''',
  '''(?m)^\W*(?:VÌ SAO RA KHÁCH|✓ Đã kiểm:|Sẵn sàng (?:quay|đăng|gửi) ·|Bản nháp ·)''',
  '(?i)nâng tầm|bứt phá|hành trình|sinh lời|lãi suất đảm bảo|chắc chắn vay được',
  '''(?i)(?<!\w)(?:Tối[^\w]+qua[^\w]+ngồi[^\w]+với[^\w]+hai[^\w]+vợ[^\w]+chồng[^\w]+trẻ|qua[^\w]+ngồi[^\w]+với[^\w]+hai[^\w]+vợ[^\w]+chồng[^\w]+trẻ[^\w]+ở|ngồi[^\w]+với[^\w]+hai[^\w]+vợ[^\w]+chồng[^\w]+trẻ[^\w]+ở[^\w]+quán|với[^\w]+hai[^\w]+vợ[^\w]+chồng[^\w]+trẻ[^\w]+ở[^\w]+quán[^\w]+cà|hai[^\w]+vợ[^\w]+chồng[^\w]+trẻ[^\w]+ở[^\w]+quán[^\w]+cà[^\w]+phê|vợ[^\w]+chồng[^\w]+trẻ[^\w]+ở[^\w]+quán[^\w]+cà[^\w]+phê[^\w]+Ngân)(?!\w)''',
  '''(?i)(?<!\w)(?:chồng[^\w]+trẻ[^\w]+ở[^\w]+quán[^\w]+cà[^\w]+phê[^\w]+Ngân[^\w]+hàng|trẻ[^\w]+ở[^\w]+quán[^\w]+cà[^\w]+phê[^\w]+Ngân[^\w]+hàng[^\w]+duyệt|ở[^\w]+quán[^\w]+cà[^\w]+phê[^\w]+Ngân[^\w]+hàng[^\w]+duyệt[^\w]+cho|quán[^\w]+cà[^\w]+phê[^\w]+Ngân[^\w]+hàng[^\w]+duyệt[^\w]+cho[^\w]+vay|cà[^\w]+phê[^\w]+Ngân[^\w]+hàng[^\w]+duyệt[^\w]+cho[^\w]+vay[^\w]+hai|phê[^\w]+Ngân[^\w]+hàng[^\w]+duyệt[^\w]+cho[^\w]+vay[^\w]+hai[^\w]+bạn)(?!\w)''',
  '''(?i)(?<!\w)(?:Ngân[^\w]+hàng[^\w]+duyệt[^\w]+cho[^\w]+vay[^\w]+hai[^\w]+bạn[^\w]+mừng|hàng[^\w]+duyệt[^\w]+cho[^\w]+vay[^\w]+hai[^\w]+bạn[^\w]+mừng[^\w]+lắm|duyệt[^\w]+cho[^\w]+vay[^\w]+hai[^\w]+bạn[^\w]+mừng[^\w]+lắm[^\w]+Mình|cho[^\w]+vay[^\w]+hai[^\w]+bạn[^\w]+mừng[^\w]+lắm[^\w]+Mình[^\w]+hỏi|vay[^\w]+hai[^\w]+bạn[^\w]+mừng[^\w]+lắm[^\w]+Mình[^\w]+hỏi[^\w]+đúng|hai[^\w]+bạn[^\w]+mừng[^\w]+lắm[^\w]+Mình[^\w]+hỏi[^\w]+đúng[^\w]+một)(?!\w)''',
  '''(?i)(?<!\w)(?:bạn[^\w]+mừng[^\w]+lắm[^\w]+Mình[^\w]+hỏi[^\w]+đúng[^\w]+một[^\w]+câu|mừng[^\w]+lắm[^\w]+Mình[^\w]+hỏi[^\w]+đúng[^\w]+một[^\w]+câu[^\w]+Hết|lắm[^\w]+Mình[^\w]+hỏi[^\w]+đúng[^\w]+một[^\w]+câu[^\w]+Hết[^\w]+ưu|Mình[^\w]+hỏi[^\w]+đúng[^\w]+một[^\w]+câu[^\w]+Hết[^\w]+ưu[^\w]+đãi|hỏi[^\w]+đúng[^\w]+một[^\w]+câu[^\w]+Hết[^\w]+ưu[^\w]+đãi[^\w]+năm|đúng[^\w]+một[^\w]+câu[^\w]+Hết[^\w]+ưu[^\w]+đãi[^\w]+năm[^\w]+đầu)(?!\w)''',
  '''(?i)(?<!\w)(?:một[^\w]+câu[^\w]+Hết[^\w]+ưu[^\w]+đãi[^\w]+năm[^\w]+đầu[^\w]+thì|câu[^\w]+Hết[^\w]+ưu[^\w]+đãi[^\w]+năm[^\w]+đầu[^\w]+thì[^\w]+mỗi|Hết[^\w]+ưu[^\w]+đãi[^\w]+năm[^\w]+đầu[^\w]+thì[^\w]+mỗi[^\w]+tháng|ưu[^\w]+đãi[^\w]+năm[^\w]+đầu[^\w]+thì[^\w]+mỗi[^\w]+tháng[^\w]+góp|đãi[^\w]+năm[^\w]+đầu[^\w]+thì[^\w]+mỗi[^\w]+tháng[^\w]+góp[^\w]+bao|năm[^\w]+đầu[^\w]+thì[^\w]+mỗi[^\w]+tháng[^\w]+góp[^\w]+bao[^\w]+nhiêu)(?!\w)''',

[[case]]
id = "humanize.vn.037"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "S1", "floor"]
title = "Post in a 45-year-old Northern voice: no 'Tuy nhiên / Hãy cùng / việc + V / điều này', no 'nha, nè, á', at most 2 emoji, no Gen Z slang"
context = "Week 2, Door A project on ChatGPT Free (Android). Brand Card v1 present (persona default: machine pair chị–em; audience chị – các em; dialect Bắc; age 45; written voice: short lines, ':))', 'nhé', 'đấy', 'ạ'; enemy 'dọa da'). P8 (posts, no name, no skin results): in 2022 a student's mother wanted to buy her a 30-session card; chị Hạnh handed the girl the mirror, said it was a dermatologist's job and sold nothing; two years later the student came back as a regular and brought her mother and sister."
input = """viết giúp chị bài cho nhóm chủ spa về chuyện em sinh viên năm 2022 ấy, chị không bán thẻ mà 2 năm sau em ấy quay lại. Viết cho các em đọc thấy nói thật thì không mất khách"""
regex = [
  '(?i)2022|2 năm|hai năm',
  '(?i)gương|bác sĩ',
]
not_regex = [
  '(?i)(?<!\w)(?:tuy nhiên|bên cạnh đó|do đó|vì vậy|ngoài ra|hơn nữa|điều này|hãy cùng|hãy)(?!\w)',
  '(?im)(?:^|[.!?…,:;]\s*)việc\s+(?!(?:nhà|gì|đó|này|của|làm|học)(?!\w))[^\W\d_]+|(?<!\w)(?:trong|cho|về|đến|với|qua|bằng) việc\s+(?!(?:nhà|gì|đó|này|của|làm|học)(?!\w))[^\W\d_]+',
  '(?i)một cách\s+(?!đơn giản để)[^\W\d_]+',
  '(?i)(?<!\w)(?:nha|nè|á|hông|nghen|hen)(?!\w)',
  '(?i)(?<!\w)(?:khum|xỉu|chằm zn|u là trời|đỉnh nóc|kịch trần|ét o ét|keo lỳ|slay|xịn xò)(?!\w)',
  '(?s)(?:[\U0001F300-\U0001FAFF☀-➿].*){3}',
]
invariants = ["I1", "I3", "I8", "I10", "I15", "I17", "I23"]
max_questions = 1
notes = """scope: pieces. §CM-NATURAL 2, 4, 7 (Tuy nhiên / Bên cạnh đó / Do đó → mà, với lại, nên; việc + V, một cách + tính từ → a straight verb; Hãy / Hãy cùng → thử, cứ, nhớ; a coach over 40 uses no young slang); guide §2.2 C1, C2, §2.3 N1, N12; §4.6 ('nha' from a Northern coach over 40 reads borrowed); §4.9 (40+: few emoji); §10.2 item 6 ('coach Bắc 45+'). P8: unnamed, no skin results (persona note). graders: vn_natural counts the same patterns per 100 tiếng."""

[[case]]
id = "humanize.vn.038"
kind = "D"
persona = "tuan-multihat-plus"
lanes = ["S1", "floor"]
title = "F1 translate-to-post: L9 carried over for its meaning in his Southern voice, not word for word; one dated copy note; no calques"
context = "Monday 09/11/2026, ChatGPT Plus project (iPhone app). Brand Card v1 present (persona default: machine pair anh–em; public posts mình – bạn; dialect Nam: nha, nè, á, hen, thiệt, coi, kêu; code_mix sale, chốt, booking, OK, free, inbox). F1 (DECISIONS, 5 Oct 2026): a foreign post translated on the coach's explicit request runs with ONE dated liked.copy_note and a logged Override. L9 is an English post by another adviser (approval is the bank's comfort, not yours; work back from a monthly payment you can live with if rates rise; six months of payments set aside; protect the person whose name is on the loan; the show flat later, the math first); it carries no rate, price-growth or return claim."
input = """<<paste: tuan-multihat-plus/liked-paste.md, the '## L9' section: everything below its HTML comment (his note, then the screenshot), verbatim>>"""
regex = [
  '(?i)ngân hàng',
  '(?i)(?<!\w)góp(?!\w)|trả góp|mỗi tháng',
  '(?i)(?:6|sáu) tháng',
  '(?i)đứng tên',
  '(?i)nhà mẫu|căn mẫu|căn hộ mẫu',
]
not_regex = [
  '(?i)mức độ thoải mái|sự chấp thuận|sự phê duyệt|làm việc ngược|tính toán ngược lại|những gì bạn (?:có thể|CÓ THỂ)|sống (?:cùng|với) (?:được )?(?:khoản|số)|người có tên trên khoản vay|(?<!\w)hãy(?!\w)|(?<!\w)yêu (?:căn|nhà) (?:hộ )?mẫu',
  '(?i)(?<!\w)(?:điều này|tuy nhiên|chúng ta|bên cạnh đó)(?!\w)',
  '(?i)(?<!\w)(?:nhé|nhỉ|đấy|cơ)(?!\w)',
  '(?i)@firsthome|Carla|Benning|Austin',
]
verdict = "Override"
invariants = ["I1", "I3", "I8", "I10", "I11", "I15", "I17", "I19", "I23"]
max_questions = 1
notes = """must-not-block. guide §1 item 2 ('Coach nhờ dịch một bài nước ngoài để đăng lại … thì cũng dịch ý, kể lại bằng giọng coach, không dịch từng chữ') and §9.2 (back-translation: a sentence that goes word for word into smooth English is a translated sentence); §CM-NATURAL 1. DECISIONS F1: translated on his explicit request ('đăng nguyên văn' here means post the translation as is), with ONE dated liked.copy_note and an Override (I19 needs the note); never blocked, never silently rewritten into a different post. The meaning of each source line survives (regex), the English frame does not (not_regex: 'mức độ thoải mái', 'những gì bạn có thể…', 'người có tên trên khoản vay' for 'người đứng tên vay', 'Hãy…'). '6 tháng' is also his own rule (allowed_numbers). The creator's name and handle stay out of the post unless he asks (creator_terms). graders: vn_natural keeps a translation in scope, unlike a verbatim copy."""

[[case]]
id = "humanize.vn.039"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "'tại sao?' after a post: the WHY and what it was written from, in plain Vietnamese; no score, code, framework name or assistant filler"
context = "Week 2, Wednesday, ChatGPT Plus project. Brand Card v1 present (persona default: machine pair chị–em; public posts mình – các chị em; keyword LÃI ẢO; P4 her own story: 28 Tết 2019 in the storeroom, adding up 2018 in her son's squared notebook, revenue about 1,2 tỷ, real profit about 40 triệu, stock about 300 triệu). The previous reply delivered N1, a Facebook post built on P4 that ends on one small step for tonight, with nothing under it (it passed every check)."
input = """tại sao?"""
regex = [
  '(?i)28 Tết|(?<!\w)kho(?!\w)|(?<!\w)vở(?!\w)|(?<!\w)sổ(?!\w)|40 triệu|lãi ảo',
]
not_regex = [
  '(?i)\b(?:Edge|RMBC|AIDA|PAS|StoryBrand|rubric|lint|Ship Check)\b|§\s*CM|CM-[A-Z]',
  '\b(?:VN|SG|NS|TP|EM|CC|SK|K|V|A|C|H)[0-9]{1,2}\b',
  '(?i)(?<!\w)(?:chấm điểm|điểm số|thang điểm|tiêu chí)(?!\w)|\d+\s*(?:/|trên)\s*(?:5|10|16|100)(?!\d)|\d+\s*điểm(?!\w)',
  '(?i)dưới đây là|chắc chắn rồi|câu hỏi (?:rất )?hay|hy vọng (?:điều này|những|phần)|bạn có muốn tôi|(?<!\w)(?:tôi|bạn)(?!\w)',
]
verdict = "Ready"
invariants = ["I1", "I3", "I4", "I5", "I17", "I23"]
max_questions = 1
notes = """wf15 §2 ('"why?" prints, for the last piece: the WHY line, the checks it passed, what it was written from'); DECISIONS (6 Oct 2026): scores and checks run silently, WHY and checks show only on 'why?', and the coach never sees framework names, scores or codes, here either (I4). §CM-NATURAL ('Mọi câu, cả lời nói với coach'): guide §4.5, no 'Chắc chắn rồi!', 'Dưới đây là', 'Câu hỏi hay!', 'Hy vọng điều này hữu ích', 'Bạn có muốn tôi…'; the machine says em and calls her chị. The reply names what N1 was written from in plain words (her storeroom, the notebook, the 40 triệu, her word). verdict Ready: evals/run.py wants a Ready or ✓ line on a 'tại sao?' reply; that line's wording comes from strings/vn.toml and is not pinned here."""

[[case]]
id = "humanize.vn.040"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "Comment 'Học phí bao nhiêu vậy c': the price right there, chị – em because the commenter said 'c', never 'bạn' or a bare 'check ib'"
context = "Week 3, ChatGPT Plus project. Brand Card v1 present (persona default: machine pair chị–em; public posts mình – các chị em; offer: Khóa Shop Nhỏ Lãi Thật, 6 tuần, Zoom tối thứ Tư 20h, 90 phút, nhóm Zalo; 4.990.000đ). Under her post a stranger commented 'Học phí bao nhiêu vậy c'."
input = """có người hỏi dưới bài 'Học phí bao nhiêu vậy c', em viết giúp chị câu trả lời bình luận nhé"""
regex = [
  '4\.990\.000\s?đ|4,99\s?(?:tr|triệu)',
  '(?i)(?<!\w)em(?!\w)',
]
not_regex = [
  '(?i)(?<!\w)(?:bạn|các bạn|quý khách)(?!\w)',
  '(?i)(?<!\w)(?:check (?:ib|inbox)|giá ib)(?!\w)|inbox (?:để|nhận) (?:báo )?giá',
  '(?i)cảm ơn (?:em|bạn) đã (?:quan tâm|hỏi)|trong thời gian sớm nhất|vui lòng',
  '[📩🚀✨💡]',
]
invariants = ["I1", "I3", "I8", "I15", "I17", "I23"]
max_questions = 1
notes = """scope: pieces. guide §4.4 rule 5 (the commenter set the relation with 'c', so she answers as chị to 'em'; 'bạn' pushes them away) and §8 H1; §5.3 and wf2 §6 (the price in public under a price question, never a bare 'check ib'); §2.4 X7 call-centre phrases. A line saying she sent the schedule by message is fine after the price. Price from her offer (I8)."""

[[case]]
id = "humanize.vn.041"
kind = "D"
persona = "hanh-android-free-nocomputer"

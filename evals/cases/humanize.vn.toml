  '(?i)đây là lý do tại sao|ở cuối ngày|điều đó nói rằng|bạn có biết rằng|ưu tiên hàng đầu|bị áp lực bởi',
  '(?i)(?<!\w)(?:nhỉ|đấy|cơ|nhé)(?!\w)',
]
invariants = ["I1", "I3", "I8", "I15", "I17"]
max_questions = 1
notes = """scope: pieces. wf2 §8 item 2 banned calques ('Đây là lý do tại sao…', 'Ở cuối ngày…', 'Điều đó nói rằng…', 'Bạn có biết rằng…?', passive 'được / bị… bởi'); wf2 §5 code-switching: 'sale' is natural for him and stays (do not over-translate); his phrases are kept verbatim (CC8 'never AI-polished'). 'sale' is on graders.py EN_ALLOW (I15)."""


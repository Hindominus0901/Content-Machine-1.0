notes = """guide §4.5 ('em xem cái này' → the machine says em, calls her chị; 'Dạ' when it answers a question, not 'ạ' on every line; the translated assistant phrases are cut) and §8 J1; §CM-NATURAL ('Mọi câu, cả lời nói với coach'); DECISIONS: the pair asked in reply 1 is held. Her own check on her own draft gets one Ready or Draft line (wf15 §2), in her pair, with no score (I4). Her caption already reads like her, so the reply stays short (max_words)."""

[[case]]
id = "humanize.vn.044"
kind = "D"
persona = "tuan-multihat-plus"
lanes = ["S0", "S1", "floor"]
title = "Coach types like a close friend ('m viết lại t cái caption'): the pair from reply 1 holds, no tao – mày, no stiff 'Dạ… ạ', short and straight"
context = "Week 3, ChatGPT Plus project (iPhone app). Brand Card v1 present (persona default: machine pair anh–em, from his reply 1 'anh'; public posts mình – bạn; dialect Nam). Late at night he types in a hurry, the way he texts friends."
input = """m viết lại t cái caption này coi, đọc sượng quá: Hôm nay mình sẽ chia sẻ với các bạn 3 điều cần biết trước khi đặt cọc mua nhà. Hãy cùng theo dõi nhé!"""
not_regex = [
  '(?i)(?<!\w)(?:tao|mày|tau)(?!\w)',
  '(?im)^\W*Dạ(?!\w)[^\n]*(?<!\w)ạ(?!\w)',
  '(?i)chắc chắn rồi|tuyệt vời|câu hỏi (?:rất )?hay|dưới đây là|hy vọng|bạn có muốn tôi|(?<!\w)tôi(?!\w)',
  '(?i)hãy cùng|chia sẻ với các bạn|điều cần biết|(?<!\w)(?:nhé|nhỉ|đấy|cơ)(?!\w)',
]
invariants = ["I1", "I3", "I5", "I15", "I17", "I23"]
max_questions = 1
notes = """guide §4.5 (the 't / m' row: never tao – mày; keep the closeness, short and straight, no khách sáo, no 'Dạ… ạ'; drop the pronoun rather than switch) and §8 J2; DECISIONS: xưng hô is asked in reply 1 and held, a one-off 't / m' does not reset it (persona: machine pair anh–em; I15 grades the pair in the machine's prose). The rewritten caption drops 'Hôm nay mình sẽ chia sẻ', 'Hãy cùng theo dõi', the listicle '3 điều cần biết' and the Northern 'nhé' for his Southern voice in 'mình – bạn'. Assertions read the whole reply: his line and the caption."""

[[case]]
id = "humanize.vn.045"
kind = "D"
persona = "consultant"
lanes = ["S0", "S1", "floor"]
title = "LinkedIn post: no chat particles, at most one emoji, numbered steps in plain speech, no 'Hãy / chúng ta / điều này'"
context = "Week 3, Claude Pro project (Mac). Brand Card v1 present (persona default: machine pair anh–em; audience tôi – anh chị; on LinkedIn he writes for HR people, 'JD' and 'KPI' allowed there; numbered steps, no emoji, signs 'Khoa'; method: phiếu việc 1 trang, làm thử 2 tiếng việc thật có trả công, người kèm chọn trước, 15 phút mỗi thứ Sáu)."

  '(?i)trong (?:thời đại|bối cảnh|thế giới)|ngày nay,|như chúng ta đã biết|không thể phủ nhận|đóng vai trò',
  '(?i)(?<!\w)(?:nè|á|hen|nghen|nhỉ|đấy|cơ)(?!\w)',

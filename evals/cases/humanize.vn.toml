  '(?i)làm thử|2 tiếng|hai tiếng',
  '(?m)^\s*(?:1[.)]|Một là)',
]
not_regex = [
  '(?i)(?<!\w)(?:nha|nè|á|hen|nghen|nhỉ|đấy|nhé|ha)(?!\w)',
  '(?s)[\U0001F300-\U0001FAFF☀-➿].*[\U0001F300-\U0001FAFF☀-➿]',
  '(?i)(?<!\w)(?:hãy|chúng ta|điều này|bên cạnh đó|ngoài ra|thêm vào đó)(?!\w)',
  '(?i)(?<!\w)(?:các |mấy )?bạn(?!\s+(?:bè|hàng|đời|thân))(?!\w)',
]
invariants = ["I1", "I3", "I8", "I15", "I17", "I23"]
max_questions = 1
notes = """scope: pieces. guide §4.6 dose (LinkedIn: 0-2 particles a post, none of the chat ones), §4.9 (LinkedIn 0-1 emoji; his written voice has none), §10.2 item 6 ('bài LinkedIn → không tiểu từ chat, ≤1 emoji'); §3.11 (a numbered list suits LinkedIn, but each step is a spoken sentence, not an abstract noun). A single 'Do đó' is tolerated on LinkedIn (guide §10.1: kept out of lint on purpose), so it is not asserted. Audience 'anh chị' (I15)."""


title = "His own connectors link the story ('rồi mới', 'xong', 'từ bữa đó', 'rứa'), never 'Sau đó, / Tiếp theo, / Kể từ đó / Do đó' opening sentences"
context = "Week 2, ChatGPT Free on the old Android. Brand Card v1 present (persona default: machine pair anh–em; posts xưng Đức / tụi em, gọi anh chị; dialect Trung, written gentler; keyword PHÁT SINH; Voice Card connectors from his dump and posts: 'rồi mới', 'xong', 'từ bữa đó', 'rứa', 'tới chừ'). P11 his own 2019 story: he quoted by the metre for an uncle in Liên Chiểu; the wall opened on rotten wood and rusty pipes; the uncle pointed the broom at him: 'Mi báo giá rứa là để gạt tau hả'; he paid 9 triệu out of pocket and dropped per-metre quotes."
input = """viết anh bài trên Trang chuyện năm 2019 ông chú bên Liên Chiểu nghe, kể như anh kể ngoài công trình, đừng như văn báo"""
regex = [
  '(?i)(?<!\w)(?:rồi mới|từ bữa đó|xong|rứa|tới chừ)(?!\w)',
  '(?i)Liên Chiểu|2019|mét dài|9 triệu',
]
not_regex = [
  '(?im)(?:^|[.!?…]\s+)(?:Sau đó|Tiếp theo|Kể từ đó|Do đó|Vì vậy|Tuy nhiên|Bên cạnh đó|Ngoài ra|Hơn nữa|Thêm vào đó)(?!\w)',
  '(?i)tua nhanh|đó là lúc|khoảnh khắc (?:ấy|đó)|chợt nhận ra rằng',
  '(?i)(?<!\w)(?:bạn|các bạn|chúng tôi|chúng ta|quý khách)(?!\w)',
  '(?i)(?<!\w)(?:nhỉ|đấy|cơ|nè|hen|nghen)(?!\w)',
]
invariants = ["I1", "I3", "I8", "I9", "I15", "I17", "I23"]
max_questions = 1
notes = """scope: pieces. §CM-NATURAL 3 ('Nối bằng chữ nói, chữ của họ (connectors) trước'); schemas/brand-card.toml connectors; guide §3.2 (Then → rồi, xong; Since then → từ bữa đó; To this day → tới chừ) and §3.3 (Trung 'rứa là', 'rứa nên'; 'Sau đó,' opening every step of a chain is the translated form, 'sau đó' inside a sentence is fine). The uncle's line is his Bank (P11) and may be quoted verbatim (I9). Particles of his region only (nghe, rứa)."""


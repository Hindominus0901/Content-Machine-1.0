lanes = ["S0", "S1", "floor"]
title = "Facebook story post: no Unicode 'bold' letters that break diacritics, at most 3 emoji, no skin claim"
context = "Week 2, Door A project on ChatGPT Free (Android). Brand Card v1 (pair chị–em; audience chị – các em; P1 her own 2018 rainy-night story, never repeating the old melasma promise)."
input = """viết chị bài Facebook kể chuyện đêm mưa năm 2018 nhé, chị đăng trang cá nhân"""
regex = ['2018']
not_regex = [
  '[\U0001D400-\U0001D7FF]',
  '(?s)(?:[\U0001F300-\U0001FAFF].*?){4,}',
  '(?i)hết nám|trị dứt điểm|trắng da',
]
invariants = ["I1", "I3", "I8", "I11", "I15", "I17"]
max_questions = 1
notes = """scope: pieces. wf2 §5 Emojis and formatting: Unicode 'bold' fonts break Vietnamese diacritics; premium personal brands use few emojis; her voice-samples.md 'không emoji dày, thỉnh thoảng :))'. P1 note: retelling never repeats the old staff promise about melasma (expected.toml compliance_notes, I11)."""

[[case]]
id = "humanize.vn.021"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "floor"]
title = "Mixed tone-mark styles in her draft ('khoá / khóa', 'hoà / hòa') come back in one style"
context = "Week 4, ChatGPT Plus project. Brand Card v1 (pair chị–em). She typed the draft on her phone and on the laptop, so the tone-mark placement differs."
input = """em sửa giúp chị bài này cho gọn, chị gõ lộn xộn dấu quá:

Khoá 4 khai giảng tối thứ Tư. Ai học khóa trước rồi thì biết, hoà vốn chưa phải là lãi. Chị em nào muốn hòa vốn sớm thì đăng ký khoá này nhé."""
regex = ['(?i)(?<!\w)kh(?:óa|oá)(?!\w)', '(?i)(?<!\w)h(?:òa|oà) vốn(?!\w)']
not_regex = [
  '(?s)(?:(?<!\w)[Kk]hoá(?!\w).*(?<!\w)[Kk]hóa(?!\w)|(?<!\w)[Kk]hóa(?!\w).*(?<!\w)[Kk]hoá(?!\w))',
  '(?s)(?:(?<!\w)[Hh]oà(?!\w).*(?<!\w)[Hh]òa(?!\w)|(?<!\w)[Hh]òa(?!\w).*(?<!\w)[Hh]oà(?!\w))',
]
invariants = ["I1", "I3", "I8", "I15", "I17"]
max_questions = 1
notes = """scope: pieces. wf2 §8 item 4: pick one tone-mark style (hòa/thủy vs hoà/thuỷ) and use it consistently; normalise to NFC (decomposed text breaks fonts in Canva and CapCut). Either style passes; mixing fails. graders read text after NFC, so the two spellings stay distinct."""

[[case]]
id = "humanize.vn.022"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "S1", "floor"]
title = "Dictated slips ('giành thời gian', 'chuẩn đoán', 'sáng lạn') are fixed without changing what she said"
context = "Week 3, Door B (ChatGPT Free, Android). Brand Card pasted at the top of the chat. She dictated the paragraph with the Gboard mic."
input = """em sửa chính tả với giọng cho chị đoạn chị nói bằng giọng này nhé:

Các em giành thời gian nói thật với khách đi. Chuyện chuẩn đoán da là việc của bác sĩ, mình không làm thay được. Làm thế thì tương lai spa mình mới sáng lạn."""
regex = ['(?i)bác sĩ', '(?i)nói thật']
not_regex = ['(?i)giành thời gian|chuẩn đoán|sáng lạn']
invariants = ["I1", "I3", "I15", "I17"]
max_questions = 1
notes = """scope: pieces. wf2 §8 item 4 common confusions (dành/giành, chẩn đoán, xán lạn); wf11-message-focus rule 6 (fix obvious speech-to-text slips, ask only about an unclear word). Her referral line to the dermatologist is kept (expected.toml compliance_notes: 'đi bác sĩ da liễu' is kept)."""

[[case]]
id = "humanize.vn.023"
kind = "D"
persona = "service-biz"
lanes = ["S0", "S1", "floor"]
title = "Zalo reply to a customer asking the price: opens with 'Dạ', em – chị, a public starting price, never 'giá ib'"
context = "Week 2, ChatGPT Free. Brand Card v1 (Zalo with customers opens with 'Dạ', xưng em). Offer facts: an L-shaped kitchen of about 5 m of base cabinets with wall units, moisture-proof MDF with melamine, granite top, appliances not included, from 85.000.000đ; most jobs 95-140 triệu; 3D drawing 2.000.000đ, deducted on signing; survey and two test holes before the fixed quote. Thảo sends it."
input = """viết giùm anh tin Zalo trả lời chị khách hỏi bếp chữ L chừng nhiêu tiền, Thảo gửi cho chị"""
regex = ['(?m)^\W*Dạ', '85(?:\.000\.000\s?đ| triệu)', '(?i)bản vẽ|khảo sát|đục thử']
not_regex = [
  '(?i)giá ib|(?<!\w)ib (?:em|mình)(?!\w)|inbox (?:em|mình) báo giá|liên hệ để (?:biết|nhận) giá',
  '(?i)(?<!\w)(?:đấy|nhỉ|cơ)(?!\w)',
  '(?i)rẻ nhất|không phát sinh một đồng|cam kết không phát sinh',
]
invariants = ["I1", "I3", "I8", "I11", "I15", "I17"]
max_questions = 1
notes = """scope: pieces. wf2 §5 'In sales DMs, open with Dạ and end with ạ'; wf2 §6 '"Giá ib" annoys buyers. Public prices build trust'; his voice-samples.md Zalo paragraph (Dạ chị, em Đức đây ạ … nghe / nha). The price is a 'from' price with what it includes, from his offer facts (I8)."""

[[case]]
id = "humanize.vn.024"
kind = "D"
persona = "tuan-multihat-plus"
lanes = ["S0", "S1", "floor"]
title = "Calques out ('Đây là lý do tại sao', 'Ở cuối ngày', 'Bạn có biết rằng'), his own phrases and natural 'sale' kept"
context = "Week 2, ChatGPT Plus project. Brand Card v1 (pair anh–em; dialect Nam; he code-switches like a salesperson: 'sale', 'chốt', 'OK'; phrases 'Tính trước rồi hẵng cọc nha.', 'Bên sale dí cọc quá')."
input = """viết lại giọng anh, giữ câu 'Tính trước rồi hẵng cọc nha' với chữ 'bên sale dí cọc' của anh:

Đây là lý do tại sao bạn cần cân nhắc kỹ trước khi đặt cọc. Ở cuối ngày, điều đó nói rằng tài chính gia đình là ưu tiên hàng đầu. Bạn có biết rằng nhiều cặp vợ chồng bị áp lực bởi bên sale dí cọc? Tính trước rồi hẵng cọc nha."""
regex = ['(?i)Tính trước rồi hẵng cọc nha', '(?i)bên sale dí cọc']

title = "'Để em suy nghĩ thêm chị ạ' gets an easy way out, not a same-day deadline or 'Tuy nhiên… nhanh chóng'; singular em, Northern particles"
context = "Week 3, Door A project on ChatGPT Free (Android). Brand Card v1 present (persona default: machine pair chị–em; 1:1 with spa owners chị – em; dialect Bắc; offer: lớp kèm chủ spa nhỏ 6 tuần, tối đa 6 người, gọi video nhóm Zalo tối thứ Hai 21h, nghe chữa 2 đoạn ghi âm tư vấn mỗi tuần, 1 ngày đứng quầy; 6.500.000đ; no intake date or discount in the Bank)."
input = """có em chủ spa ở Hải Dương hỏi lớp xong nhắn 'để em suy nghĩ thêm chị ạ'. Em trả lời giúp chị nhé"""
regex = [
  '(?i)(?<!\w)em(?!\w)',
  '(?i)cứ (?:từ từ|thong thả|suy nghĩ)|chưa cần (?:quyết|trả lời)|lúc nào (?:tiện|rảnh)|không sao',
]
not_regex = [
  '(?i)(?<!\w)(?:tuy nhiên|nhanh chóng|nhanh tay|kẻo lỡ|không bỏ lỡ|ưu đãi)(?!\w)|chỉ (?:còn )?(?:hôm nay|trong hôm nay)|hết (?:ngày )?hôm nay',
  '(?i)(?<!\w)(?:các em|mọi người|bạn|quý khách)(?!\w)',
  '(?i)(?<!\w)(?:nha|nè|hông|nghen)(?!\w)',
  '(?i)thấy em đã xem|sao chưa (?:trả lời|phản hồi)',
]
invariants = ["I1", "I3", "I8", "I15", "I17", "I23"]
max_questions = 1
notes = """scope: pieces. guide §8 F3 and §10.2 item 6 ('để chị suy nghĩ' → no fake same-day deadline, no 'tuy nhiên… nhanh chóng'); DECISIONS: never invent scarcity (her Bank has no intake date and no discount, so no deadline at all; the real cap of 6 may be said plainly); §CM-NATURAL 4 (1:1 singular; Northern particles, 'nhé', 'ạ') and 6. A small real next step (a recording she can send, the Monday call time) is fine."""

[[case]]
id = "humanize.vn.042"
kind = "D"
persona = "service-biz"
lanes = ["S0", "S1", "floor"]
title = "Zalo bad news to a customer: 'Dạ chị', the real reason, the new day, what is done already, 'Em xin lỗi chị'; no 'sự bất tiện', 'chúng tôi', 'Kính gửi'"

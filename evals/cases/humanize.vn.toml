regex = [
  '(?m)^\W*Dạ(?!\w)',
  '(?i)xin lỗi chị',
  '(?i)thứ Hai',
  '(?i)MDF|(?<!\w)ván(?!\w)',
  '(?i)(?<!\w)(?:ảnh|hình)(?!\w)',
]
not_regex = [
  '(?i)sự bất tiện|rất tiếc phải thông báo|thông cảm cho sự|kính gửi|quý khách|trân trọng|rất mong',
  '(?i)(?<!\w)(?:chúng tôi|chúng ta|bạn|anh/chị)(?!\w)',

# evals/cases/humanize.vn.toml · "Viết đúng giọng coach" (§CM-HUMANIZE) and "Viết như người Việt nói" (§CM-NATURAL),
# VN edition: "viết lại giọng mình", the VN strip list (V1 rào đón, V3 ý kiến rỗng, V4 từ đệm, V5 xin phép / tự hạ,
# V6 đuôi xin xác nhận, V7 mùi AI, V8 câu dài kiểu Tây, V9 danh từ hóa), spoken register over written Sino-Vietnamese,
# one xưng hô pair per piece, dialect particles that match the speaker, warmth particles kept, the read-aloud loop
# ("Vấp dòng 2": only that line; still off → voice.match), the film-list opener (film.list_open), "không giống
# mình:" / "mình có nói", specifics only from the Bank, the coach's CTA left untouched, spelling and tone-mark
# consistency, formatting norms; F1 copy and the remix distance inside a voice pass.
# Written by the QA role before modules/vn/humanize.md existed. Producers never edit this file.
# Rewritten 6 Oct 2026 for the simple surface (wf15) and Voice & Language (wf14); the §CM-NATURAL cases
# (humanize.vn.031-046) came with the VN naturalness pass the same day.
#
# Sources: docs/research/wf15-simple-surface-spec.md §2 (nothing under a Ready piece; WHY and checks on "why?") and
# wf14-voice-language-spec.md §2, §4 (the "không giống mình:" / "mình có nói" confirmations) win where they differ;
# docs/research/wf15-case-impact.md (R1, R7, R8); docs/research/arch-final-spec.md §8.1 (HUMANIZE line of the Ship
# Check) and §8.3 (the 6-step pass); docs/research/wf6-character-design.md §B5 (G3 Voice Lint; "Strip list: VN"
# V1-V9 and "Giữ lại"), VN notes 9-13; docs/research/wf6-definitive-concise.md §2b-§2k; docs/research/
# wf2-vietnam-market.md §5 (xưng hô, register, dialect, code-switching, emojis and Unicode bold, numbers, humility)
# and §8 (banned calques and buzzwords, pronoun drift, "đọc to", diacritics and NFC, common confusions);
# docs/research/vn-language-guide.md (§CM-NATURAL's source); docs/research/wf12-qa-spec.md §2.2, §2.5, §2.8;
# docs/research/wf12-qa-standards.md SG4, SG8; core/vn/ship-check.md (ship.kit 4 GIỌNG + NGƯỜI MUA; IN line);
# modules/vn/humanize.md (kit-pass, kit-lists, kit-natural), voice.md (§CM-VOICE 6-9), edge-rubric.md (IN DƯỚI
# BÀI, "tại sao?"), liked.md (§CM-LIKED 7-8), fmt-short.md (film list); locales/vn/banned-tells.txt; strings/vn.toml
# (cmd.voice, cmd.not_me, cmd.i_do_say, voice.not_me_ok, voice.do_say_ok, voice.cant_allow, voice.match,
# film.list_open, liked.copy_note, liked.evidence, verdict.*, why.prefix, checked.prefix); the VN persona files
# (voice-samples.md "Câu … hay nói" and "Từ … không bao giờ dùng", written-posts.md, expected.toml [voice]).
# Personas: evals/personas/vn/<id> (never evals/personas/heldout).
#
# Conventions (read with evals/README.md "Case files"):
# - input: coach turns in order; lines starting "[turn n]" separate several turns. "<<paste: FILE …>>" = the
#   simulator inlines that file (or the named section) verbatim there.
# - context: the state when `input` starts, including what the machine has already said; self-contained.
# - D assertions run on the machine reply to the LAST coach turn, unless notes starts with a scope:
#     "scope: transcript"  all machine replies of the case joined (contains = somewhere,
#                          not_contains / not_regex = nowhere)
#     "scope: pieces"      only piece bodies, split the way graders.py splits pieces (of the last reply; prose
#                          to the coach is left out)
#     "scope: visible"     coach-visible text (graders.py drops the "cho máy" block)
#   max_words / max_chars / max_questions count the coach-visible text of the last reply, copy boxes included.
# - contains: case-insensitive substring after NFC. regex / not_regex: Python re, case-sensitive unless the pattern
#   starts with (?i). Vietnamese whole words are fenced with (?<!\w)…(?!\w).
# - Pronoun-dependent strings are asserted in the pair the coach chose (default mình–bạn): voice.match "Bạn gửi
#   voice nói câu đó như bạn hay nói, mình viết y vậy." is "Chị gửi voice nói câu đó như chị hay nói, em viết y
#   vậy." for chị–em; film.list_open "… Câu nào bạn không nói với khách thì mình cắt." is "… Câu nào anh không nói
#   với khách thì em cắt." for anh–em.
# - Strip cases read pieces only ("scope: pieces"): §CM-HUMANIZE reprints only the reworked piece ('Chỉ in lại bài
#   đã sửa'; "Sửa gì vậy?" gets 2-3 plain lines), and a chat line may still name what was cut, which the piece itself
#   may not keep. graders.py finds a piece by an N<digit> label or a format title ("Bài Facebook", "Tin Zalo"); a
#   reworked caption in an untitled copy box is not a piece yet (wf15-case-impact Open flags [graders.py]).
# - Status lines (wf15 §2; start-block IN; §CM-EDGE IN DƯỚI BÀI): a reworked piece prints only its content: no VÌ
#   SAO RA KHÁCH, "✓ Đã kiểm:", "Sẵn sàng …" or "Bản nháp ·" line under it (not_regex
#   (?m)^\W*(?:VÌ SAO RA KHÁCH|✓ Đã kiểm:|Sẵn sàng (?:quay|đăng|gửi) ·|Bản nháp ·), I3). One line only for "Cần
#   bạn · …", a hard stop, "cứ đăng" (verdict.override) or a required dated note; an F1 copy prints only its one
#   liked.copy_note ("Lưu ý ({date}): bài này bám sát bài của họ. Bài na ná dễ bị giảm hiển thị, mà chữ cũng là của
#   họ. Đăng hay không tuỳ bạn.", in the coach's pair) and its Override is logged, shown on "tại sao?" (R7); the
#   remix evidence liked.evidence ("Sẵn sàng {verb} · khung của họ, {fact} của bạn, không chép câu nào.") prints only
#   on "tại sao?" (R8; §CM-LIKED 7). A check the coach asks for on their own draft ("đăng được chưa?") still gets one
#   Sẵn sàng or Bản nháp line. `verdict` is hidden state, as in fmt-short.vn.toml.
# - "tại sao?" follow-ups: "[turn 1] <the turn that prints the piece>" and "[turn 2] tại sao?"; assertions run on
#   the "tại sao?" reply (the VÌ SAO line, what it was written from, "✓ Đã kiểm:" with the voice check); I3 grades the
#   turn-1 reply. The "tại sao?" cases are humanize.vn.039, 047 and 048.
# - "Long sentence" uses a token run: 40 or more space-separated tiếng with no . ! ? … between them is a sentence
#   over the V8 limit (wf6: "Câu trên 25 từ"; about 25 words ≈ 40 tiếng).
# - `invariants` lists I1-I23 ids only. graders.py also runs deny_list, quit_triggers and (VN) vn_natural on every
#   transcript (translationese density, Markdown bold, emoji lines, em dashes, the end-particle share against
#   written-posts.md; acceptance.toml [vn_natural]); notes name them where a case depends on them.
# - P cases name an existing qa/standards id with its §3.1 critical items; they count only after the judge passes
#   its J set.
# - Context, titles and notes are English for the QA team; every coach turn and expected phrase is Vietnamese.
#   Every person and business here is fictional (persona folders).

[meta]
module = "humanize"
edition = "vn"
written_by = "qa-role"

# ---------------------------------------------------------------- "viết lại giọng mình": AI fog out, the coach's voice in

[[case]]
id = "humanize.vn.001"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "'viết lại giọng mình' on an AI-fog caption: every V7 tell out, 'các chị em', Northern warmth particles kept"
context = "Week 2, Tuesday, ChatGPT Plus project with method file (S1) or instruction block only (S0). Brand Card v1: pair chị–em; public posts mình – các chị em; dialect Bắc; keyword 'lãi ảo'; P4 her own 28 Tết 2019 storeroom story; phrases 'Doanh thu là để khoe, lãi mới là để tiêu.'"
input = """viết lại giọng mình cho chị cái caption này, con cháu chị nhờ máy viết mà đọc sượng quá:

Trong thời đại ngày nay, quản lý tài chính đóng vai trò vô cùng quan trọng đối với mỗi chủ shop online. Hãy cùng khám phá hành trình giúp các bạn nâng tầm lợi nhuận và bứt phá doanh số. Sổ sách không chỉ giúp bạn hiểu rõ dòng tiền mà còn mang lại giá trị bền vững cho việc kinh doanh. Tóm lại, hãy bắt đầu ghi chép ngay hôm nay. Hy vọng bài viết hữu ích!"""
contains = ["các chị em"]
regex = ['(?i)(?<!\w)(?:nhé|đấy|thế|nhỉ|cơ|chứ|ạ)(?!\w)']
not_regex = [
  '(?i)thời đại ngày nay|bối cảnh|đóng vai trò|vô cùng|hãy cùng khám phá|hành trình|nâng tầm|bứt phá|mang lại giá trị|tóm lại|hy vọng bài viết hữu ích',
  '(?i)không chỉ[^.!?\n]{1,80}mà còn',
  '(?i)(?<!\w)(?:các bạn|nha|nè|hông|tui)(?!\w)',
]
invariants = ["I1", "I3", "I8", "I15", "I17"]
max_questions = 1
notes = """scope: pieces. arch §8.3 step 3 (strip AI tells from the locale list) and step 2 (register, VN pair); wf6 VN strip list V7 and wf2 §8 banned calques; locales/vn/banned-tells.txt. Her public register is 'mình – các chị em' (voice-samples.md), never 'các bạn'; Northern particles stay (wf6 'Giữ lại: tiểu từ tạo quan hệ'), Southern ones never appear in her voice. Any number added comes from her Bank (I8)."""

[[case]]
id = "humanize.vn.002"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "S1", "floor"]
title = "'Kính gửi Quý chủ spa' AI post rewritten as chị Hạnh talking to 'các em': no honorific stiffness, no sales buzzwords"
context = "Week 2, Door A project on ChatGPT Free (Android). Brand Card v1: pair chị–em; audience chị – các em; dialect Bắc; keyword 'ngại chào'; enemy 'dọa da'. Linh (receptionist) asked a chatbot for a post and chị Hạnh pastes it."
input = """Linh nhờ máy viết bài này, em sửa lại cho giống chị nói nhé, đọc lên chị thấy như người khác:

Kính gửi Quý chủ spa! Trong bối cảnh ngành làm đẹp ngày càng cạnh tranh, kỹ năng tư vấn đóng vai trò then chốt giúp spa nâng tầm doanh thu. Hãy cùng khám phá bí quyết chốt sale thần tốc, biến mỗi khách hàng thành khách trung thành trong hành trình nhan sắc của họ!"""
contains = ["các em"]
not_regex = [
  '(?i)kính gửi|(?<!\w)quý (?:chủ|khách|anh|chị)(?!\w)|chốt sale thần tốc|nâng tầm|đóng vai trò|hãy cùng khám phá|bối cảnh|hành trình',
  '(?i)(?<!\w)(?:nha|nè|hông|dzậy|tui)(?!\w)',
  '(?i)trị dứt điểm|trắng da|hết nám|thần dược|lột xác',
]
invariants = ["I1", "I3", "I11", "I15", "I17"]
max_questions = 1
notes = """scope: pieces. wf2 §8 item 3 (over-formality: 'Quý khách', 'Kính gửi' on social media) and item 2 (buzzwords); wf6 V7; her never-say list (voice-samples.md: chốt sale thần tốc, hành trình nhan sắc, Quý khách, Kính gửi; giọng Nam). The rewrite talks to spa owners as 'các em' in her Northern voice and adds no skin claim (expected.toml compliance, I11)."""

[[case]]
id = "humanize.vn.003"
kind = "D"
persona = "service-biz"
lanes = ["S0", "S1", "floor"]
title = "Showroom caption becomes Đức's workshop voice: 'Đức / tụi em', 'anh chị', Central particles, no 'nhé / đấy / nhỉ'"
context = "Week 2, ChatGPT Free on an old Android. Brand Card v1: pair anh–em; public posts xưng 'Đức' or 'tụi em', gọi 'anh chị'; dialect Trung ('nghe', 'rứa', 'hỉ' kept light); keyword 'phát sinh'. Thảo (VA) found a caption online."
input = """Thảo lấy trên mạng cái caption ni, em viết lại giọng anh nghe, đọc như showroom:

Kiến tạo không gian sống đẳng cấp cùng giải pháp tủ bếp sang trọng, tinh tế chuẩn châu Âu. Chúng tôi tự hào mang đến tổ ấm hoàn hảo cho gia đình bạn. Liên hệ ngay để được tư vấn nhé!"""
regex = ['(?i)anh chị', '(?<!\w)(?:Đức|[Tt]ụi em)(?!\w)']
not_regex = [
  '(?i)kiến tạo|đẳng cấp|sang trọng|tinh tế|chuẩn châu âu|tổ ấm|hoàn hảo|chúng tôi',
  '(?i)(?<!\w)(?:đấy|nhỉ|cơ|nhé)(?!\w)',
  '(?i)gia đình bạn|(?<!\w)các bạn(?!\w)',
  '(?i)rẻ nhất|tốt nhất|uy tín nhất|không phát sinh một đồng',
]
invariants = ["I1", "I3", "I8", "I11", "I15", "I17"]
max_questions = 1
notes = """scope: pieces. wf2 §5 regional dialect ('Scripts must match the speaker's own accent') and xưng hô; his voice-samples.md never-say list (showroom words, 'các bạn', 'đấy, nhỉ, cơ', 'nhé'). The rewrite adds no superlative or no-extra-cost promise (expected.toml compliance, I11)."""

[[case]]
id = "humanize.vn.004"
kind = "D"
persona = "coldstart-coach"
lanes = ["S0", "S1", "floor"]
title = "Written Sino-Vietnamese register and Northern particles become Minh Anh's spoken Southern voice, 'mấy bạn'"
context = "Week 2, ChatGPT Free (iPhone). Brand Card v0: pair bạn–mình; audience mình – mấy bạn; dialect Nam; keyword 'cứng đơ'. Cold start (0 clients)."
input = """viết lại giùm mình đoạn này cho giống mình nói, đọc lên cứng quá à:

Các bạn văn phòng thân mến, do đó việc ngồi lâu sẽ gây ra những tác động tiêu cực tới cột sống, tuy nhiên chúng ta hoàn toàn có thể cải thiện nhằm nâng cao sức khỏe bởi lẽ cơ thể vô cùng thông minh. Hãy tập ngay nhé, đấy là bí quyết đấy!"""
regex = ['(?i)mấy bạn']
not_regex = [
  '(?i)(?<!\w)(?:do đó|tuy nhiên|nhằm|bởi lẽ|vô cùng|thân mến)(?!\w)',
  '(?i)(?<!\w)(?:nhé|nhỉ|đấy)(?!\w)',
  '(?i)trị dứt điểm|chữa khỏi|hết đau|chữa lành',
]
invariants = ["I1", "I3", "I8", "I15", "I17"]
max_questions = 1
notes = """scope: pieces. wf2 §5 Register: AI defaults to written Sino-Vietnamese ('do đó, tuy nhiên, nhằm, bởi lẽ, vô cùng'); scripts need spoken wording ('nên, nhưng mà, để, vì, cực kỳ'). Her dialect is Nam ('nha, nè, á, hông'); 'nhé, nhỉ, đấy' are on her never list (voice-samples.md). Cold start: no outcome claim is added (I8)."""

[[case]]
id = "humanize.vn.005"
kind = "D"
persona = "consultant"
lanes = ["S0", "S1", "floor"]
title = "HR English jargon for owners ('onboarding', 'talent', 'employer branding') becomes 'kèm người mới'; tôi – anh chị"
context = "Week 2, Claude Pro project with method file (S1) or block only (S0); anh Khoa on the laptop. Brand Card v1: pair anh–em; audience tôi – anh chị (owners of 20-100-person firms, not HR people); dialect Trung, near-neutral in writing; keyword 'tuyển hoài'."
input = """bài ni đứa cháu viết cho anh, em viết lại giọng anh, cho chủ doanh nghiệp đọc chứ không phải dân nhân sự:

Onboarding hiệu quả là chìa khóa để giữ chân talent. Một chương trình employer branding mạnh giúp doanh nghiệp thu hút nhân tài. Các bạn ơi, hãy đầu tư vào văn hóa doanh nghiệp vững mạnh ngay hôm nay!"""
regex = ['(?i)anh chị', '(?i)kèm|phiếu việc|làm thử']
not_regex = [
  '(?i)\b(?:onboarding|talent|employer branding|HRBP)\b',
  '(?i)chìa khóa|chìa khoá|giữ chân nhân tài|văn hóa doanh nghiệp vững mạnh|nhân tài',
  '(?i)(?<!\w)(?:các bạn|bạn ơi|cả nhà)(?!\w)',
  '(?i)(?<!\w)(?:nha|nè|hông|nhỉ|đấy)(?!\w)',
]
invariants = ["I1", "I3", "I8", "I15", "I17"]
max_questions = 1
notes = """scope: pieces. wf2 §5 English code-switching: natural for urban professionals, stiff or opaque for owners; his voice-samples.md: 'onboarding, talent, employer branding, HRBP (với chủ doanh nghiệp; anh nói kèm người mới)', 'giữ chân nhân tài', 'bạn ơi, các bạn ơi'. Register tôi – anh chị; Southern and Northern particles are not his."""

[[case]]
id = "humanize.vn.006"
kind = "D"
persona = "tuan-multihat-plus"
lanes = ["S1", "floor"]
title = "Stiff Zalo message to a young couple opens with 'Dạ', drops listing-ad words, and never keeps the false 'view sông'"
context = "Week 3, ChatGPT Plus project. Brand Card v1: pair anh–em; dialect Nam; Zalo with clients opens with 'Dạ'. The flat he must close this month: 2 phòng ngủ, 68 m², 2 tỷ 68, sổ hồng có sẵn, looks over the inner pool (NOT a river view; persona must_close_this_month)."
input = """viết lại giọng anh cái tin Zalo này, anh gửi cho cặp vợ chồng hỏi căn 2 phòng ngủ ở Thủ Đức:

Kính gửi Quý khách hàng, chúng tôi xin trân trọng giới thiệu căn hộ siêu phẩm view sông, cơ hội vàng để an cư và sinh lời. Quý khách vui lòng liên hệ để được tư vấn chi tiết."""
regex = ['(?m)^\W*Dạ', 'Tuấn']
not_regex = [
  '(?i)kính gửi|quý khách|siêu phẩm|view sông|cơ hội vàng|sinh lời|an cư|trân trọng',
  '(?i)(?<!\w)(?:nhỉ|đấy|cơ|nhé)(?!\w)',
]
invariants = ["I1", "I3", "I8", "I11", "I15", "I17"]
max_questions = 1
notes = """scope: pieces. wf2 §5 'In sales DMs, open with Dạ and end with ạ'; §8 item 3 over-formality; his never-say list (giọng rao nhà: cơ hội vàng, siêu phẩm; chữ hứa tiền: sinh lời; Quý khách, Kính gửi; 'nhé' is not his word). 'view sông' is a fabrication trap and a compliance phrase (expected.toml, I11): humanize never keeps a false specific."""

# ---------------------------------------------------------------- the strip list, one rule at a time

[[case]]
id = "humanize.vn.007"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "V8: one 60-tiếng Western sentence chained with 'mà / trong đó / nhằm' is split into short sentences with a punch line"
context = "Week 2, ChatGPT Plus project. Brand Card v1 (pair chị–em; public posts mình – các chị em; Bắc)."
input = """câu chữ dài quá em ạ, chị đọc hết hơi, em viết lại giọng chị cho gọn:

Việc ghi chép sổ sách hằng ngày là điều mà nhiều chị em chủ shop thường bỏ qua mà không biết rằng chính điều đó khiến cho lợi nhuận thực tế của shop bị bào mòn dần dần trong đó có cả tiền ship hoàn, voucher sàn, quà tặng kèm và chi phí quảng cáo nhằm giúp mình hiểu rõ hơn về tình hình kinh doanh."""
regex = ['(?m)(?:^|[.!?…]["”]?[ \t]+)(?:[^\s.!?…:]+[ \t]+){0,4}[^\s.!?…:]+[.!?…]']
not_regex = [
  '(?:[^\s.!?…]+[ \t]+){39,}[^\s.!?…]+',
  '(?i)(?<!\w)(?:nhằm|trong đó|việc ghi chép|điều mà)(?!\w)',
]
invariants = ["I1", "I3", "I15", "I17"]
max_questions = 1
notes = """scope: pieces. wf6 V8 'Câu trên 25 từ; chuỗi mà, trong đó, nhằm → tách câu, mỗi câu một ý' and V9 ('việc ghi chép'); wf12-qa-standards SG4 (none over 25 words, at least one punch line of 5 words or fewer); definitive-concise §2d rhythm. The regex asks for one sentence of 1-5 tiếng; the not_regex fails a run of 40+ tiếng with no sentence end."""

[[case]]
id = "humanize.vn.008"
kind = "D"
persona = "consultant"
lanes = ["S1", "floor"]
title = "V9: 'tiến hành thực hiện việc đánh giá', 'công tác tuyển dụng' become plain verbs; 'đảm bảo' leaves with them"
context = "Week 3, Claude Pro project. Brand Card v1 (pair anh–em; audience tôi – anh chị; method: phiếu việc 1 trang, làm thử 2 tiếng, kèm người mới 60 ngày)."
input = """em sửa câu chữ bài ni giọng anh, anh đọc thấy như công văn:


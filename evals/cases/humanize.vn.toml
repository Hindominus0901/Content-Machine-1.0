invariants = ["I1", "I3", "I8", "I15", "I17", "I23"]
max_questions = 1
notes = """scope: pieces. guide §8 G3 and §10.2 item 6 (bad news on Zalo: the real reason, the new time, something made good at once, 'Em xin lỗi anh / chị' in place of 'sự bất tiện này'); §2.4 X7, X8 (call-centre and official-letter Vietnamese); §CM-NATURAL 4 ('Nhắn khách… Dạ… ạ'). Every fact comes from his turn (I8: numbers the coach said are allowed)."""

[[case]]
id = "humanize.vn.043"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "S1", "floor"]
title = "Coach writes 'em xem giúp chị': the machine answers as em to chị, short, no assistant voice ('Chắc chắn rồi', 'Dưới đây là', 'Bạn có muốn tôi')"
context = "Week 2, Door A project on ChatGPT Free (Android). Brand Card v1 present (persona default: machine pair chị–em, asked in reply 1 and held; dialect Bắc). She pastes a caption she typed herself and asks whether it can go up."
input = """em xem giúp chị cái này đăng được chưa:

Các em ạ, khách không cần mình nói hay đâu, khách cần mình nói thật. Tối nay em nào thử chào một khách mà không nhắc tới thẻ, xong nhắn chị kể nhé :))"""
regex = [
  '(?i)(?<!\w)chị(?!\w)',
]
not_regex = [
  '(?i)chắc chắn rồi|tuyệt vời|câu hỏi (?:rất )?hay|dưới đây là|hy vọng|bạn có muốn tôi|rất sẵn lòng|hãy cho (?:tôi|em) biết|lưu ý:|kết luận:',
  '(?i)(?<!\w)(?:tôi|bạn)(?!\w)',

# evals/cases/voice.vn.toml · Voice & Language ("nói thế nào"), VN edition: the Voice Card built silently on Day 0
# from the dump and the coach's pasted posts; the Bản đồ's GIỌNG line and "sửa dòng 4"; the Brand Card's NÓI THẾ NÀO
# line; how the coach addresses the audience (audience_address), kept apart from the machine–coach pair and held
# across a week; the one-to-one pair in Zalo, inbox and Messenger (address_1to1); connectors and particles from the
# coach's own words and posts (region); code-mix (only the English they really use); "không giống mình:" / "mình có
# nói"; never-words and banned tells; platform shifts; the no-samples path; the Weekly Talk refreshing phrases;
# "viết lại giọng mình"; "tại sao?" on the voice a piece used.
# Written by the QA role, 6 Oct 2026, after modules/vn/voice.md; evals/cases/voice.en.toml is the model of the
# conventions. Producers never edit this file.
#
# Sources (wf14 / wf15 win over older specs): docs/research/wf14-voice-language-spec.md §0 V1-V4, §2-§5;
# wf15-simple-surface-spec.md §0-§3 (amended: QUAY HÔM NAY comes in the Map reply, K2); docs/DECISIONS.md (K2; "Long
# dumps, missing facts, an early piece to post": the soft cut at about 1,200 tiếng carries the first câu đoán, facts
# asked up front and guessed above Tuần 1, the early win's best line in a copy box, "one more story" stays open);
# docs/research/wf15-case-impact.md (R1-R18); core/vn/start-block.md NGÀY 0 1-9 and BRAND CARD (render: python3
# tools/render.py --edition vn --target kit core/vn/start-block.md); core/vn/ship-check.md (ship.kit 4 GIỌNG + NGƯỜI
# MUA; IN line); modules/vn/voice.md (§CM-VOICE 1-9), humanize.md (§CM-HUMANIZE; §CM-NATURAL 1-9), message.md (§CM-MAP
# SỬA), brain.md (§CM-CARD 2-4), fmt-short.md (§CM-FORMATS, §CM-POSTS, §CM-MESSAGES), talk.md, review.md 3,
# edge-rubric.md (IN DƯỚI BÀI, "tại sao?"), locale.md 1; schemas/brand-card.toml (group "voice" with connectors and
# address_1to1; visible voice_line ≤130 VN); evals/acceptance.toml [day0], [voice], [vn_natural]; qa/standards/shared.md
# SG4, SG8 and vn-naturalness.md VN3-VN7; strings/vn.toml (map.voice "GIỌNG:", map.ok, check.pick, setup.dump_posts,
# setup.link_unread, dump.post_it, dump.enough, film.now_or_text, card.title, card.visible.how "NÓI THẾ NÀO:",
# card.visible.to_them "với khách:", card.visible.never "không bao giờ:", card.machine.heading, card.save_line,
# cmd.voice, cmd.not_me, cmd.i_do_say, voice.not_me_ok, voice.do_say_ok, voice.cant_allow, review.labels,
# review.card_next, month.save_card, verdict.*, why.prefix, checked.prefix); each persona's voice-samples.md,
# written-posts.md, answers.md, pillar-transcript.md and expected.toml [voice]. Every phrase quoted as the coach's
# appears in those fixture files. Personas: evals/personas/vn/<id> only (never evals/personas/heldout).
#
# Day 0 now (start-block NGÀY 0, K2): reply 1 asks the xưng hô ('Cho mình hỏi trước: gọi bạn là anh, chị hay bạn? (gõ
# 1 chữ là được)') → the dump prompt (where they post, the Zalo/email list, and setup.dump_posts 'Có bài, tin nhắn bạn
# từng viết thì dán 2–3 cái, hoặc gửi link trang của bạn.') → after chunk 1 the early win ('3 câu đáng tiền …', the best
# line in a copy box + dump.post_it) → past about 1,200 tiếng the soft cut (dump.enough) carrying the first câu đoán →
# only the missing facts, at most 3, one a message ('Mình đoán: … Đúng không?') → ONE reply: the 4-line Bản đồ
# (ĐIỀU KHÁCH NHỚ · 3 CHỦ ĐỀ · TỪ KHOÁ · GIỌNG: {3 chữ} · {nhịp câu} · hay nói "{câu}" · với khách: "{xưng hô với
# khách}"), QUAY HÔM NAY under it, map.ok last ('Chạy thử 4 tuần nhé. OK hay sửa một dòng?') → any answer but a Map
# change brings all of Tuần 1 (setup.plan_guess once above it) → Brand Card (top ≤500: card.title · 'NÓI GÌ: …' ·
# 'NÓI THẾ NÀO: … · với khách: "…"'; then card.machine.heading and the machine block) + card.save_line → TIẾP. The voice
# is built silently: never a question about it; "sửa dòng 4" changes it inside the one decision. No check screen, no
# stop point. Budgets (acceptance [day0]): the Map within 7 coach turns (the xưng hô turn counts), film-ready ≤20
# minutes, ≤10 coach turns.
#
# Conventions (read with evals/README.md "Case files"; as in message.vn.toml and humanize.vn.toml):
# - `input` holds the coach turn(s); lines starting "[turn n]" split several turns (a turn may run over several lines).
#   "<<paste: <persona-id>/<file>, …>>" = the simulator inlines that persona file (or the named section) verbatim.
#   "WHOLE RUN: …" scripts a whole Day 0 (voice.vn.028; run.py sends it as one turn today, wf15-case-impact Open flags).
# - `context` is self-contained: the state when `input` starts, including what the machine already said.
# - D assertions run on the reply to the LAST coach turn, unless `notes` opens with a scope: "scope: transcript" (all
#   machine replies of the case joined: regex somewhere, not_* nowhere) or "scope: each reply" (a whole run: regex in
#   at least one reply, not_* and max_* in every reply). max_words / max_questions count the last reply's coach-visible
#   text.
# - contains: case-insensitive substring after NFC. regex / not_regex: Python re, case-sensitive unless (?i);
#   Vietnamese whole words are fenced with (?<!\w)…(?!\w).
# - Inside a copy box: patterns opening (?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n
#   (?!\s*(?:version|date|edition)\b)(?:(?!```).)*? find X inside a fenced box, never in the prose around it and never
#   in the card's machine block (it opens "version …"). Script field lines ("Câu đầu:", "Chữ trên màn hình:", "Ý 1:")
#   print outside the box (fmt-short.kit-video-short 5) and are read line by line.
# - Map lines: (?im)^[^\w\n]*(?:[1-4][.)]?[ \t]+)?GIỌNG: (possibly numbered; map.voice is "GIỌNG:" as built, not
#   wf14 §2's draft "GIỌNG CỦA BẠN:"). Card fields: (?im)(?:^|\|)\s*<field>\s*: reads a `name: value` entry of the
#   machine block (on its own line or after " | "); field names never print in coach text.
# - Pronoun-dependent strings are asserted in the pair the coach chose, with the regional particle adapted (nhé · nha
#   · nghe): voice.not_me_ok 'Rồi, từ giờ mình không dùng "{line}" nữa.' is 'Dạ, từ giờ em không dùng "{line}" nữa.' in
#   em–chị / em–anh and is matched as 'từ giờ (em|mình) không dùng "…" nữa'; voice.do_say_ok 'Rồi, "{word}" mình giữ
#   lại.' as '"…" (mình|em) giữ lại'; map.ok (no subject since f22d32e) as '[Cc]hạy thử 4 tuần … OK hay sửa một dòng?'; check.pick 'Mình chọn
#   {option}, vì {reason}.' as '(Mình|Em) chọn …, vì …'; card.save_line 'Lưu lại để mình nhớ bạn (30 giây).' as 'Lưu lại
#   để em nhớ anh (30 giây).' for anh–em.
# - A per-line guard (?im)^(?![^\n]*không dùng)[^\n]*X reads "any line holding X is the voice.not_me_ok confirmation".
# - Two pairs, kept apart (wf14 V4; start-block XƯNG HÔ): the machine–coach pair (pronouns, asked in reply 1) and the
#   coach–audience pair (audience_address: Minh Anh "mình – mấy bạn", Khoa "tôi – anh chị", Hạnh "chị – các em", Thu
#   "mình – các chị em", Đức "Đức (tụi em) – anh chị", Tuấn "mình – bạn" or "anh – em"), the same in every piece of
#   the week. One-to-one messages address one person the way the coach addresses clients (address_1to1: Thu "chị –
#   em", Đức and Tuấn "Dạ … em"), never a group form (§CM-NATURAL 4 'tin riêng gọi một người, như coach gọi khách').
# - Particles follow the coach's posts, else their region (Bắc nhé, nhỉ, đấy · Nam nha, nè, á · Trung nghe, rứa, hỉ),
#   as dense as in their posts, in pieces and in the machine's own lines (start-block TIẾNG VIỆT 'tiểu từ dày như bài coach … cả câu mẫu, không trộn'): Southern cases forbid
#   'nhé', 'nhỉ', 'đấy' anywhere; Bắc and Trung cases forbid the other region's particles in pieces.
# - Status lines (wf15 §2; start-block IN): a Ready piece prints only its content. A line matching
#   (?m)^[^\w\n]*(?:Sẵn sàng (?:quay|đăng|gửi) ·|✓ Đã kiểm:|Bản nháp ·|VÌ SAO RA KHÁCH) under a piece fails unless the
#   coach asked "tại sao?" (I3). At most one coach-facing line otherwise: "Cần bạn · …" (one a reply), a hard stop, an
#   override after "cứ đăng", or a dated note. One confirmation line answers "không giống mình:" (voice.not_me_ok) and
#   "mình có nói" (voice.do_say_ok); a plain-words "chị không nói thế bao giờ" counts the same (§CM-VOICE 5-6).
# - "tại sao?" follow-ups: "[turn 1] <the turn that prints the piece>" and "[turn 2] tại sao?"; assertions run on the
#   "tại sao?" reply: the VÌ SAO RA KHÁCH line (niềm tin cũ → niềm tin mới · dẫn tới), verdict.ready 'Sẵn sàng {verb} ·
#   viết từ {evidence}', '✓ Đã kiểm:' with the voice check (ship.kit 4 GIỌNG + NGƯỜI MUA), and the voice it used in
#   plain words (their line, their way of calling the audience, no never-words), no field names; the piece is not
#   reprinted. I3 grades turn 1. `verdict = "Ready"` on a "tại sao?" reply wants a Sẵn sàng or ✓ Đã kiểm line
#   (evals/run.py). The "tại sao?" cases here: 026, 027.
# - `invariants` lists I1-I23 only. I15 (VN): one machine–coach pair; one audience address in pieces and across the
#   week, theirs and apart from that pair (one-to-one messages left out); no English outside the allowlist. I23: never
#   their never-words (incl. the coach's "không giống mình:" lines) or never-particles in pieces, no banned tell in any
#   machine text, the phrase-share proxy. graders.py also runs day0_timing, deny_list, quit_triggers and vn_natural
#   (translationese density, Markdown bold, emoji lines, em dashes, the end-particle share against written-posts.md)
#   on every transcript; `notes` names them where a case depends on them.
# - P cases score against qa/standards/vn-naturalness.md (VN3 connectors, VN4 xưng hô, VN6 no translationese, VN7
#   sounds like this coach are critical) or shared.md (SG4 sounds like the coach, SG8 read-aloud); they count only after
#   the judge passes its J set.
# - Lanes: S0 (the start block or Phone Starter, no method file) only where the start block alone carries the rule
#   (the Map format, the pair kept all week, particles by region, "không chữ cấm"); §CM-VOICE, §CM-NATURAL, §CM-MAP SỬA
#   A) B), the script labels and the "tại sao?" record live in the method file, so those cases run on S1 and floor.
# - Context, titles and notes are English for the QA team; every coach turn and expected phrase is Vietnamese.
#   FICTIONAL: every person, business and draft comes from the persona files or is invented for the case.

[meta]
module = "voice"
edition = "vn"
written_by = "qa-role"

# ---------------------------------------------------------------- the Bản đồ's GIỌNG line (wf14 V1, V4; start-block 5; §CM-VOICE 2-3)

[[case]]
id = "voice.vn.001"
kind = "D"
persona = "coldstart-coach"
lanes = ["S1", "floor"]
title = "GIỌNG for a cold-start yoga teacher on her phone: her own tone words, a short rhythm, one line of hers verbatim, 'với khách: mình – mấy bạn'; Southern OK line"
context = """Day 0, ChatGPT Free on her iPhone, mình–bạn (reply 1 got 'Bạn đi, gọi chị nghe già.'). Dump chunks 1-2 told; when the dump prompt invited them she pasted her posts W1-W2 below chunk 1. The soft cut after chunk 2 carried the result guess (setup.guess_no_result) and she typed 'ừa'; the last câu đoán was what she sells ('Mình đoán: bạn chưa bán gì, mới tính một lớp nhỏ. Đúng không?'). She answers it; this reply shows the 4-line Bản đồ (TỪ KHOÁ: CỨNG ĐƠ) with QUAY HÔM NAY under it. Her talk is the spoken voice (ờ, á, nè, hông, thiệt, run-ons); W1-W2 the written one (lowercase line starts, 'dc', ':))')."""
input = '''ừa đúng rồi. lớp online buổi trưa, 30 phút, nhóm nhỏ thôi, 10 người là mình nhìn kịp camera từng bạn'''
contains = []
not_contains = []
regex = [
  '''(?im)^[^\w\n]*(?:[1-4][.)]?[ \t]+)?GIỌNG:[^\n]*·[^\n]*·''',
  '''(?im)^[^\w\n]*(?:[1-4][.)]?[ \t]+)?GIỌNG:[^\n]*(?:thân thiện|nhanh|vui|gần gũi|thẳng|thật|mộc|dí dỏm|tếu|lém|hồn nhiên|đời thường|dễ gần)''',
  '''(?im)^[^\w\n]*(?:[1-4][.)]?[ \t]+)?GIỌNG:[^\n]*["“][^"”\n]*(?:nói thiệt|đứng dậy cái đã|hông cần thảm|đâu lại vô đó|tư thế kế tiếp|chữa cháy|ngồi thẳng tưng|ghế xịn|cần mỗi ngày|hông có lỗi gì)''',
  '''(?im)^[^\w\n]*(?:[1-4][.)]?[ \t]+)?GIỌNG:[^\n]*với khách:\s*["“]?mình\s*[–-]\s*(?:mấy\s+)?bạn''',
  '''[Cc]hạy thử 4 tuần[^\n]{0,24}OK hay sửa một dòng\?''',
  '''(?m)^[^\w\n]*QUAY HÔM NAY\b''',
]
not_regex = [
  '''(?im)^[^\w\n]*(?:[1-4][.)]?[ \t]+)?GIỌNG:[^\n]*(?:truyền cảm hứng|cuốn hút|chuyên nghiệp|tuyệt vời|lôi cuốn|ấn tượng|đầy năng lượng|tích cực|thu hút|hấp dẫn|duyên dáng|tràn đầy)''',
  '''(?im)^[^\w\n]*(?:[1-4][.)]?[ \t]+)?GIỌNG:[^\n]*(?:audience_address|code_mix|openers_closers|written_vs_spoken|connectors|dialect|tone|rhythm)''',
  '''(?im)^[^\w\n]*(?:[1-4][.)]?[ \t]+)?GIỌNG:[^\n]*với khách:[^\n]*(?:chị em|cả nhà|anh chị|các mom|quý khách|(?<!\w)em\s*[–-])''',
  '''(?im)^[^\w\n]*(?:[1-4][.)]?[ \t]+)?GIỌNG:[^\n]*(?:chữa lành|nâng tầm|bứt phá|hành trình|detox|thanh lọc|chuyên gia|bác sĩ yoga)''',
  '''(?im)^[^\w\n]*(?:[1-4][.)]?[ \t]+)?GIỌNG:[^·\n]*·[^\S\n]*(?:[^\s·]+[^\S\n]+){5,}[^\s·]+[^\S\n]*·''',
  '''(?im)^[^\w\n]*(?:[1-4][.)]?[ \t]+)?GIỌNG:(?:[^\S\n]+\S+){46,}''',
  '''(?i)(?:giọng (?:của )?bạn (?:thế nào|ra sao)|tả giọng|bạn (?:muốn|thích) giọng|chọn giọng|giọng nào)[^\n]*\?''',
  '''(?i)(?<!\w)(?:nhé|nhỉ|đấy)(?!\w)''',
  '''(?i)(?<!\w)(?:3 tuần|4 viên)(?!\w)''',
]
verdict = ""
invariants = ["I1", "I4", "I5", "I8", "I15", "I17", "I23"]
max_words = 0
max_chars = 0
max_questions = 1
notes = """start-block NGÀY 0 step 5 ('GIỌNG: {3 chữ} · {nhịp câu} · hay nói "{câu}" · với khách: "{xưng hô với khách}"'); §CM-VOICE 2-3 (tone in words she would use about herself, no praise; rhythm ≤5 tiếng; her most repeated line verbatim; the audience pair as heard). expected.toml [voice]: tone 'thân thiện · nhanh · vui', audience_address 'mình – mấy bạn'. Every phrase in the pattern is hers (answers.md chunks 1-2: 'Nói thiệt cái này là gia vị thôi', 'đâu lại vô đó', 'tư thế tốt nhất là tư thế kế tiếp', 'chữa cháy', 'ghế xịn không cứu được cái lưng ngồi yên', 'Cái lưng nó cần mỗi ngày'; W1-W2: 'đứng dậy cái đã', 'hông cần thảm', 'cái lưng hông có lỗi gì hết á'). The machine–coach pair is mình–bạn too; the line still comes from how she talks to buyers ('mấy bạn văn phòng ơi'), never from the pair, and never a group form she does not use. No praise (I17), no field names (I4), the rhythm segment ≤5 tiếng, the line ≤45 tiếng. Southern: map.ok and every other line in 'nha', never 'nhé' (start-block TIẾNG VIỆT 'cả câu mẫu, không trộn'). K2: QUAY HÔM NAY prints under the Map in this reply, so max_words stays 0. Cold start: no result number, and her friend's '3 tuần' / '4 viên' never appear (I8, persona trap_numbers). Not on S0: the rhythm and line bounds live in §CM-VOICE 2 (voice.vn.002 is the S0 Map case). Complements message.vn.047 (Khoa) and character.vn's undecided pair (Tuấn)."""


context = """Day 0, Door B: chị Hạnh pasted the Phone Starter into a normal ChatGPT Free chat on Android; em–chị from reply 2 ('Gọi chị là chị thôi em, chị bốn lăm tuổi rồi.'). She pasted her posts W1-W3 below dump chunk 1 (W1 opens 'Các em ạ, chị nói thật nhé'). The soft cut came after chunk 2 (which ends with her going out to a client) and carried the multi-income câu đoán (setup.multi_income: spa, lớp kèm, mỹ phẩm). She came back and answers it by telling chunk 3, which ends 'xong rồi đấy em'; nothing else is missing, so this reply shows the 4-line Bản đồ (TỪ KHOÁ: NGẠI CHÀO) with QUAY HÔM NAY under it."""

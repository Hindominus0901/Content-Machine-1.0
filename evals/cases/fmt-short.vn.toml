notes = """K2 (DECISIONS 6 Oct 2026; VN start-block NGÀY 0 steps 5-7): QUAY HÔM NAY prints under the Map in the reply that brings it, then map.ok ('… chạy thử 4 tuần nhé. OK hay sửa một dòng?', pair and regional particle adapted); keyword and story patterns are anchored after the QUAY HÔM NAY title because the Map holds the keyword too. Only the trigger, context and order changed here; the rest predates wf15 and waits for the VN rewrite. UX §2 minute 20–24 VN, the whole QUAY HÔM NAY shape in one reply: chữ trên màn hình ≤6 tiếng, câu đầu nguyên văn ≤18 tiếng (hook_max), 3 ý ≤18 tiếng each, câu cuối nguyên văn; caption in a copy box; keyword CTA with the 'nhẹ' switch (quit point 11); VÌ SAO RA KHÁCH in the message-focus §3.1 VN form; '✓ Đã kiểm:' naming her own storeroom story (UX §6 Trust row; PLAN reconciliation 2: the Day-0 plain form of Ready); before-filming ticks ('đọc to câu đầu 2 lần · từ khoá đã có · nói chậm câu cuối'); the text fallback. The option lines are statements (header rule). Template labels stay internal (UX §4). Traps from persona.toml: Trang's 50 triệu (no consent), Khải's 'gấp 3', the 1 tỷ rumour. Her Northern voice never takes nha / nè / hông / tui (expected.toml banned_particles_whole_word). S0 included: Day-0-critical."""


# evals/cases/fmt-short.vn.toml · native shorts, QUAY HÔM NAY, Week-1 short pieces, the platform mix
# (short-video / text-first / email-first, Zalo in place of email), text posts ("chia sẻ thật"), carousels,
# background-text posts, VN native formats (Phần 1/2/3, TikTok góc nhìn, hỏi nhanh đáp gọn, sự thật về
# nghề, livestream hot seat, Zalo Nhật ký), delivery modes, F1 copy/translate on request, VN edition.
# Written by the QA role before modules/vn/fmt-short.md existed. Producers never edit this file.
# Rewritten 6 Oct 2026 for the simple surface (wf15), the K2 order and the VN naturalness pass.
#
# Sources: docs/research/wf15-simple-surface-spec.md §1-§3 and wf14-voice-language-spec.md §3 (win where they
# differ); docs/research/wf15-case-impact.md (rules R1-R18); docs/DECISIONS.md (K2: QUAY HÔM NAY in the Map
# reply; long dumps: the soft cut at ~1.200 tiếng carries the first câu đoán; platform and the Zalo/email list
# asked in the dump prompt, the rest guessed in one line above Tuần 1; the early win's best line in a copy box;
# "one more story" stays open; scripts only, no shot lists; no templates; comment-keyword CTAs, 'chấm' and
# thresholds never blocked, one dated note; polarity on ideas, never people; F1); core/vn/start-block.md
# (NGÀY 0 steps 3-9, IN line) and core/vn/ship-check.md (ship.kit IN); modules/vn/fmt-short.md
# (kit-video-short, kit-video-delivery, kit-post, kit-message), edge-rubric.md (IN DƯỚI BÀI, "tại sao?"),
# plan.md (§CM-WEEK 2, 4, 5, 9, 10), convert.md (§CM-CTA-KIT 2, 5-7), liked.md (§CM-LIKED 7-8), levelup.md
# (§CM-TODAY 1), humanize.md (§CM-NATURAL); docs/research/wf11-ux-spec.md §3 (re-film, don't edit; one
# device), §4 (never sees), §6 quit points; docs/research/wf2-vietnam-market.md §1-§3, §5-§8;
# docs/research/wf12-qa-spec.md §2.1 (Micro under 60 tiếng; claims triggers), §2.5, §3.1;
# docs/research/wf5-vietnam-launch.md A6 (background-text posts ≤130 characters), B10 ('chấm', 'ib');
# editions/vn.toml (platform_mix, hook_max 18 tiếng, micro_threshold 60, bg_post_max_chars 130);
# strings/vn.toml (map.*, film.now_or_text, film.onscreen_reason, cta.default, cmd.quiet, dump.keep_going,
# dump.post_it, claims.individual, verdict.*, tick.client_ok, liked.copy_note, cta.platform_note,
# why.prefix, checked.prefix, next.prefix). Personas: evals/personas/vn/<id> (never evals/personas/heldout).
#
# Conventions (read with evals/README.md "Case files"):
# - input: coach turns in order; lines starting "[turn n]" separate several turns. "<<paste: FILE …>>" = the
#   simulator inlines that file (or the named section) verbatim there; persona files are <persona-id>/<file>.
# - context: the state when `input` starts, including what the machine has already said. It is
#   self-contained: the simulator sees only this case's context.
# - D assertions run on the machine reply to the LAST coach turn, unless notes starts with a scope:
#     "scope: transcript"  all machine replies of the case joined (contains = somewhere,
#                          not_contains / not_regex = nowhere)
#     "scope: pieces"      only piece bodies, split the way graders.py splits pieces
#     "scope: visible"     coach-visible text (graders.py drops the "cho máy" block)
#   max_words / max_chars / max_questions count the coach-visible text of the last reply, copy boxes included.
# - contains: case-insensitive substring after NFC. regex / not_regex: Python re on the full reply text
#   (copy boxes included), case-sensitive unless the pattern starts with (?i) or uses (?i:…).
# - max_questions counts like I5: question marks in coach-facing prose and status lines only. Questions
#   inside a piece (a Thảo interview list, a hỏi-nhanh-đáp-gọn script, a quoted buyer line) or inside a
#   copy box do not count.
# - Refusal-line skip: a not_regex that starts with
#   (?im)^(?![^\n]*(?:không viết|không ghi|không dùng|không đưa|không tự bịa|không bịa))[^\n]*X
#   reads "any line holding X must be a refusal line", mirroring graders.py REFUSAL_RE ("không viết",
#   "mình không bịa") plus the refusal verbs the VN siblings use. Other per-line guards skip negated lines
#   with (?![^\n]*(?:không|khỏi|đừng|…)…), so "không cần tải app" is not a detour.
# - Status lines (wf15 §2; start-block IN "bài xong → chỉ in bài"; §CM-EDGE IN DƯỚI BÀI): a Ready or
#   downgraded piece prints only its content. At most one line under a piece, and only for: verdict.needs
#   "Cần bạn · {question} Mình không bịa đâu. (Hoặc gõ "bỏ qua".)" (one a reply, the soonest piece),
#   verdict.hardstop 'Câu "{line}" mình không viết: {defect}. Bạn cho {fact} thật là mình viết ngay.',
#   verdict.override after "cứ đăng" ("Đăng theo ý bạn · mình vẫn lo: {defect} · đã ghi lại."), or one
#   dated note (liked.copy_note, liked.compare_note, cta.platform_note with cta.by_hand). Each prints in the
#   coach's pair (chị–em: "Cần chị · … Em không bịa đâu.", 'Câu "…" em không viết: … Chị cho … thật là em
#   viết ngay.', "Đăng theo ý chị · em vẫn lo: …"). Cases forbid a VÌ SAO RA KHÁCH, "✓ Đã kiểm:",
#   "Sẵn sàng …" or "Bản nháp ·" line with the not_regex
#   (?m)^\W*(?:VÌ SAO RA KHÁCH|✓ Đã kiểm:|Sẵn sàng (?:quay|đăng|gửi) ·|Bản nháp ·) and list I3. Pieces are
#   found by a copy box, an N<digit> label, field lines or a format title (QUAY HÔM NAY), never by a status
#   line. `verdict` "Ready" / "Ready-downgraded" is hidden state: evals/run.py checks that no status line
#   prints (and wants a Ready or ✓ Đã kiểm line on a "tại sao?" reply); "Override" on an F1 request is
#   hidden state too (logged, shown on "tại sao?"), and only the one dated note prints. A check the coach
#   asks for on their own draft ("đăng được chưa?") still gets one Sẵn sàng or Bản nháp line.
# - "tại sao?" follow-ups: "[turn 1] <the turn that prints the piece>" and "[turn 2] tại sao?" (or a close
#   variant graders.py WHY_RE reads: "tại sao thế em?", "tại sao vậy?"). Assertions run on the "tại sao?"
#   reply: the VÌ SAO line ('VÌ SAO RA KHÁCH: "{niềm tin cũ, chữ khách}" → "{niềm tin mới}" · dẫn tới:
#   {bước kế}', plan.kit-week 5), what it was written from (verdict.ready "Sẵn sàng {verb} · viết từ
#   {evidence}", or verdict.ready_downgraded "… · viết thành …"), "✓ Đã kiểm:" with the checks passed and
#   the ticks (tick.client_ok …), then the record. I3 grades the turn-1 reply. The "tại sao?" cases are
#   fmt-short.vn.047-051.
# - Day 0 (wf15 §1; start-block NGÀY 0; K2 and "Long dumps…", DECISIONS 6 Oct 2026): reply 1 asks xưng hô
#   → the dump (the prompt asks where they post and whether they have a Zalo or email list, and invites 2–3
#   written posts or a page link) → after chunk 1 the early win ("Mình nhận rồi. 3 câu đáng tiền bạn vừa
#   nói:", the best line in a copy box + "Câu này hôm nay đăng luôn cũng được.", the other 2 in quotes,
#   "Cứ kể tiếp, hết thì gõ 'xong'.") → past ~1.200 tiếng of talk the soft cut, which carries the first câu
#   đoán ("Hôm nay vậy là đủ rồi. Còn chuyện nào thì kể luôn, không thì {câu đoán | gõ 'xong'.}"; every
#   VN persona's chunks 1-2 pass 1.200, so the cut comes after chunk 2; one more story stays open) → the
#   other missing facts (≤3 in all, one a message, "Mình đoán: {guess}. Đúng không?") → ONE reply: the
#   4-line Bản đồ (ĐIỀU KHÁCH NHỚ: · 3 CHỦ ĐỀ: · TỪ KHOÁ: · GIỌNG:, possibly numbered), QUAY HÔM NAY right
#   under it, then map.ok "Chạy thử 4 tuần nhé. OK hay sửa một dòng?" → any coach message but a Map
#   change brings Tuần 1, unasked (a question in it answered in one line first; setup.plan_guess above it
#   for what was guessed; on Free at most 3 pieces a reply, as in the EN cases) → the Brand Card + "Lưu lại
#   để mình nhớ bạn (30 giây)." → TIẾP. No check screen, inventory, stop point or wrap-up. Budgets
#   (acceptance.toml [day0]): the Map within 7 coach turns (VN adds the xưng hô turn), film-ready by
#   active minute 20 (a warning only when the coach chose one more story after an on-time cut), at most 10
#   coach turns.
# - QUAY HÔM NAY (start-block step 6, fmt-short.kit-video-short 1-7): "QUAY HÔM NAY · dưới 30 giây, nhớ ý
#   rồi nói"; chữ trên màn hình ≤6 tiếng (ck.ON_SCREEN_MAX_WORDS); khung hình đầu; câu đầu nguyên văn
#   ≤{{hook_max}} = 18 tiếng; 3 ý ≤18 tiếng each; câu cuối nguyên văn; the caption in a copy box; the ask
#   cta.default "Comment {KEYWORD} hay nhắn riêng, mình gửi {payoff}." in the coach's audience address,
#   with "(ngại xin comment thì gõ 'nhẹ')"; the quà itself (one inbox message long, written in full) in
#   its own copy box under the caption; then film.now_or_text "Quay luôn bây giờ, hoặc đăng phần chữ làm
#   bài viết." The keyword sits once in the words, plus the ask (§CM-WEEK 4 "Từ khoá 1 lần trong bài + lời
#   mời"). Nothing under it: no dòng kiểm, tick or VÌ SAO (fmt-short.kit-video-short 7), no "đọc to câu
#   đầu", "từ khoá đã có", "không có câu hứa rủi ro" or "ai comment cũng nhận quà" line (R9), no old
#   fallback wording ("đăng caption dạng chữ"). The quiet ask and film.now_or_text are statements: cases
#   forbid a "?" in their sentence (I5: map.ok is the reply's one question). QUAY HÔM NAY cases assert the
#   4 Map labels and map.ok in the same reply and anchor keyword and story patterns after the QUAY HÔM NAY
#   title, since the Map's TỪ KHOÁ line holds the keyword too. One phone screen ≈ 330 tiếng of talk (EN 220
#   words at the edition's ratio); copy boxes come on top.
# - Coach-facing names: chữ trên màn hình, khung hình đầu, câu đầu, ý, câu cuối, caption, quà, tin trả lời
#   inbox 1/2, chủ đề. TITLE HOOK / VISUAL HOOK / VERBAL HOOK / LOCK-IN / LINK-FORWARD / Mode A-B-C, "trụ",
#   Bank IDs and rungs stay internal (UX §4; locales/vn/deny-list.txt).
# - A "dated note" is one line holding the note text and a date (a year, dd/mm or "tháng N"): the graders.py
#   DATE_RE idea (I14) applied to that line. F1 notes are strings liked.copy_note ("Lưu ý ({date}): bài này
#   bám sát bài của họ. Bài na ná dễ bị giảm hiển thị, mà chữ cũng là của họ. Đăng hay không tuỳ bạn.") and
#   liked.compare_note, in the coach's pair.
# - `invariants` lists I1-I23 ids only. graders.py also runs deny_list, quit_triggers, running_tag,
#   day0_timing, day0_shape and (VN) vn_natural on every transcript; notes name them where a case depends
#   on them.
# - "Brand Card v1 present (persona default)" means the Day-0 card the persona's expected.toml describes
#   (keyword, quà, pair, audience address, cta_style), saved as a project source or pasted at the top of a
#   Door B chat.
# - Context, titles and notes are English for the QA team; every coach turn and expected phrase is
#   Vietnamese, in the persona's own register and dialect.
# - FICTIONAL: chị Lam (fmt-short.vn.009) is invented for the case. The bank and insurer names in
#   fmt-short.vn.018 not_regex are real brands listed only so that none may appear.

[meta]
module = "fmt-short"
edition = "vn"
written_by = "qa-role"


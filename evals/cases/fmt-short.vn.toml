# evals/cases/fmt-short.vn.toml · native shorts, QUAY HÔM NAY, Week-1 short pieces, the platform mix
# (short-video / text-first / email-first, Zalo in place of email), text posts ("chia sẻ thật"), carousels,
# background-text posts, VN native formats (Phần 1/2/3, TikTok góc nhìn, hỏi nhanh đáp gọn, sự thật về
# nghề, livestream hot seat, Zalo Nhật ký), delivery modes, F1 copy/translate on request, VN edition.
# Written by the QA role before modules/vn/fmt-short.md exists. Producers never edit this file.
#
# Sources: docs/research/wf11-ux-spec.md §2 (QUAY HÔM NAY minute 20–24: chữ trên màn hình ≤6, câu đầu
# nguyên văn, 3 ý, câu cuối nguyên văn, caption in a copy box, keyword CTA + 'nhẹ', VÌ SAO RA KHÁCH,
# '✓ Đã kiểm:', before-filming ticks, 'chưa quay thì đăng caption dạng chữ'; Week 1 minute 26–34 platform
# mix; stop point never a gate), §3 (re-film, don't edit; one device), §4 (never sees), §6 quit points;
# docs/research/wf2-vietnam-market.md §1–§3 (Facebook trust, TikTok reach, Zalo closes; Zalo, not email;
# 'chia sẻ thật' long post with the hook before 'Xem thêm'; TikTok góc nhìn; Phần 1/2/3; hỏi nhanh đáp
# gọn; sự thật về nghề; livestream hot seat; Zalo Nhật ký), §5 (xưng hô, dialect), §6 (public prices),
# §7 (Advertising Law Art. 8, PDP Law), §8 (banned calques); docs/research/wf12-qa-spec.md §0 and §2.1
# (Micro under 60 tiếng VN; claims triggers triệu / tr / k / đ, suất, chỉ còn, hạn chót), §2.4 (VN verdict
# lines), §2.5 ('cứ đăng', 'sửa N2', one question), §3.1 (native-short, text-post, carousel, micro,
# shared), §4 (VN ticks), §5.2 I1–I18; docs/research/wf12-qa-standards.md §8–§10 VN notes;
# docs/research/wf5-vietnam-launch.md A6 (background-text posts ≤130 characters), B10 ('chấm', 'ib',
# 'đủ 100 comment'); docs/research/wf13-inspiration-spec.md §0 and §2 (F1, liked.copy_note);
# editions/vn.toml (platform_mix, hook_max 18 tiếng, micro_threshold 60, bg_post_max_chars 130);
# strings/vn.toml (next.prefix 'TIẾP →', why.prefix 'VÌ SAO RA KHÁCH', checked.prefix '✓ Đã kiểm:',
# verdict.*); docs/DECISIONS.md (scripts only, no shot lists; no templates; comment-keyword CTAs, 'chấm'
# and thresholds never blocked, one dated note; polarity on ideas, never people; F1, 5 Oct 2026).
# Personas: evals/personas/vn/<id> (never evals/personas/heldout).
#
# How to read a case (shared with setup.vn, message.vn, brain.vn and guardrails.vn):
# - input: coach turns in order, separated by a line holding only "---".
#   "<<paste: FILE …>>" = the simulator inlines that file (or the named section) verbatim there;
#   persona files are named <persona-id>/<file>.
# - context: the state when `input` starts, including what the machine has already said.
# - D assertions run on the machine reply to the LAST coach turn, unless notes starts with a scope:
#     "scope: transcript"  all machine replies of the case joined (contains = somewhere,
#                          not_contains / not_regex = nowhere)
#     "scope: pieces"      only text above verdict lines, split the way graders.py splits pieces
#     "scope: visible"     coach-visible text (graders.py drops the "cho máy" block)
#   max_words / max_chars / max_questions always count the coach-visible text of the last reply.
# - contains: case-insensitive substring after NFC. regex / not_regex: Python re on the full reply text
#   (copy boxes included), case-sensitive unless the pattern starts with (?i).
# - max_questions counts like I5: question marks in coach-facing prose and verdict lines only. Questions
#   inside a piece (a Thảo interview list, a hỏi-nhanh-đáp-gọn script, a quoted buyer line) or inside a
#   copy box do not count.
# - Refusal-line skip: a not_regex that starts with
#   (?im)^(?![^\n]*(?:không viết|không ghi|không dùng|không đưa|không tự bịa|không bịa))[^\n]*X
#   reads "any line holding X must be a refusal line", mirroring graders.py REFUSAL_RE ("không viết",
#   "mình không bịa") plus the refusal verbs the VN siblings use. Other per-line guards skip negated lines
#   with (?![^\n]*(?:không|khỏi|đừng|…)…), so "không cần tải app" is not a detour.
# - The hard-stop line is strings verdict.hardstop in the coach's pair: 'Câu "{line}" mình không viết: …'
#   (mình–bạn) or 'Câu "{line}" em không viết: …' (chị–em, anh–em). Must-not-block cases carry
#   (?im)^\W*Câu\s+["“][^\n]*["”]\s+(?:mình|em)\s+không viết in not_regex.
# - Pronoun-dependent strings are asserted in the coach's pair: verdict.ready 'Sẵn sàng quay · Em sẽ đăng:'
#   for chị–em / anh–em (the default 'Mình sẽ đăng' there is an unadapted string); verdict.needs
#   'Cần chị · … Em không tự bịa phần này.'; verdict.override 'Đăng theo quyết định của chị · em lưu ý: …'.
# - QUAY HÔM NAY budgets in VN: chữ trên màn hình ≤6 tiếng (ck.ON_SCREEN_MAX_WORDS), câu đầu ≤18 tiếng
#   (editions/vn.toml hook_max), each ý ≤18 tiếng (the EN 12-word beat cap read at the edition's
#   hook ratio, 18 tiếng for 12 words). One phone screen ≈ 330 tiếng (EN 220 words at the same ratio).
# - QUAY HÔM NAY option-line rule: the UX lines 'Muốn nhẹ nhàng hơn? Gõ nhẹ…' and 'Chưa quay hôm nay?
#   Đăng caption dạng chữ.' end in '?'. Lines offering options must not end in '?' when the reply already
#   has a question (I5); both together already make two. Producers write them as statements; cases
#   assert it with not_regex on those lines (same decision as fmt-short.en.001).
# - A "dated note" is one line holding the note text and a date (a year, dd/mm or "tháng N"): the
#   graders.py DATE_RE idea (I14) applied to that line. F1 notes use the wf13-inspiration-spec §2 VN text
#   of liked.copy_note (strings/vn.toml gains the liked.* keys in the P2 patch).
# - Coach-facing names: chữ trên màn hình, câu đầu, ý, câu cuối, caption, quà, tin trả lời inbox 1/2,
#   ý lớn. The template labels TITLE HOOK / VISUAL HOOK / VERBAL HOOK / LOCK-IN / LINK-FORWARD / Mode A-B-C,
#   'trụ', Bank IDs and rungs are internal (UX §4; locales/vn/deny-list.txt).
# - `invariants` lists I1–I18 ids only. wf13 I19–I22 are named in notes only. graders.py also runs its
#   deny_list, day0_timing and quit_triggers checks on every transcript.
# - "Brand Card v1 present (persona default)" means the Day-0 Map the persona's expected.toml describes
#   (keyword, quà, pair, cta_style), saved as a project source or pasted at the top of a Door B chat.
# - Context, titles and notes are English for the QA team; every coach turn and expected phrase is
#   Vietnamese, in the persona's own register and dialect.
# - FICTIONAL: chị Lam (fmt-short.vn.009) is invented for the case. The bank and insurer names in
#   fmt-short.vn.018 not_regex are real brands listed only so that none may appear.

[meta]
module = "fmt-short"
edition = "vn"
written_by = "qa-role"


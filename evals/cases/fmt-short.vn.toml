  '(?i)\b(?:title hook|visual hook|verbal hook|lock-?in|link-?forward|delivery mode|mode [ABC]|buyer filter)\b',
  '\b[VOSBPRKICAWX]-\d+\b',
  '(?i)(?<!\w)trụ(?!\w)',
  '(?i)(?<!\w)(?:nha|nè|hông|tui)(?!\w)',

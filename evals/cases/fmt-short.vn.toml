notes = """K2 (DECISIONS 6 Oct 2026; VN start-block NGÀY 0 steps 5-6): QUAY HÔM NAY prints right under the 4-line Bản đồ in the reply that brings it, then map.ok ('… chạy thử 4 tuần nhé. OK hay sửa một dòng?'); keyword and story patterns are anchored after the QUAY HÔM NAY title because the Map's TỪ KHOÁ line holds the keyword too. Start-block step 6 and fmt-short.kit-video-short 1-7, the whole shape in one reply: 'QUAY HÔM NAY · dưới 30 giây, nhớ ý rồi nói'; chữ trên màn hình ≤6 tiếng; câu đầu nguyên văn ≤18 tiếng (hook_max); 3 ý ≤18 tiếng each; câu cuối nguyên văn; the caption in a copy box; cta.default 'Comment LÃI ẢO hay nhắn riêng, mình gửi …' in her audience address with '(ngại xin comment thì gõ 'nhẹ')' (quit point 11); the quà (Sổ 3 Cột bản 1 trang, written in full, one inbox message long) in its own copy box under the caption (at least two boxes after the title); then film.now_or_text 'Quay luôn bây giờ, hoặc đăng phần chữ làm bài viết.' The keyword sits once in the words, outside the ask (§CM-WEEK 4); the {5} bound after the title is a loose upper limit (graders.py day0_shape reads the Week-1 pieces). Nothing under the piece (wf15 §2; R1, R2, R9): no VÌ SAO line, no '✓ Đã kiểm:' line, no before-filming ticks ('đọc to câu đầu', 'từ khoá đã có'), no Ready line; the storeroom story the old Checked line named (28 Tết 2019, the kho, the notebook) is asserted in the piece itself, and the VÌ SAO line, the checks and what it was written from print on 'tại sao?' (fmt-short.vn.047). The two option sentences are statements (header rule): map.ok is the reply's one question. Template labels stay internal (UX §4). Traps from persona.toml: Trang's 50 triệu (no consent), Khải's 'gấp 3', the 1 tỷ rumour. Her Northern voice never takes nha / nè / hông / tui (expected.toml banned_particles_whole_word). verdict Ready is hidden state (evals/run.py: no status line). S0 included: Day-0-critical."""


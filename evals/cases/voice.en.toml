# ---------------------------------------------------------------- written posts vs the spoken dump (wf14 V3, §3 written_vs_spoken, §4.5)

[[case]]
id = "voice.en.005"
kind = "D"
persona = "consultant"
lanes = ["S1", "floor"]
title = "Her pasted posts set the written voice: the card's rhythm and written_vs_spoken come from them, and her email signs off like her posts"
context = "Day 0, Claude Free on the Windows laptop. Erin dictated chunks 1-3 and pasted her own posts after chunk 1 (written-posts.md W1-W3: a LinkedIn post, the opening of a Monday Number issue signed 'Erin', an email to Dee signed 'E.'). The one missing fact (the multi-income line) is answered; the Map OK'd (YOUR WORD: record year; LinkedIn + the Monday Number, 380 subscribers); FILM TODAY (a LinkedIn native video, word-for-word) delivered. Turn 1 answers it and gets Week 1, unasked, the email first (list 300+); turn 2 answers the next reply; Day 0's last reply prints the card."
input = '''[turn 1] I'll post it as text today. no camera at my desk this week.
[turn 2] ok'''
contains = []
not_contains = []
regex = [
  '''(?im)^\s*written_vs_spoken:[^\n]*\b(?:tidier|tighter|shorter|cleaner|neater|line per|one (?:sentence|line) (?:a|per) line|no fillers?|no emoji|signs?|sign-?off)\b''',
  '''(?im)^\s*rhythm:[^\n]*\b(?:short|declaratives?|one (?:per|a) line|lines?|numbered|steps|digits)\b''',
  '''(?im)^\s*openers_closers:[^\n]*(?:here(?:'|’)s the math|margin before more|on purpose|by accident|bank app)''',
  '''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?!\s*(?:version|date|edition)\b)(?:(?!```).)*?\n[^\S\n]*(?:—[^\S\n]*)?(?:Erin|E\.)[^\S\n]*(?:\n|$)''',
]
not_regex = [
  '''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?!\s*(?:version|date|edition)\b)(?:(?!```).)*?(?:\bum+\b|\buh+\b|\blike I said\b|\bI mean,|\byou know\?)''',
  '''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?!\s*(?:version|date|edition)\b)(?:(?!```).)*?[\U0001F300-\U0001FAFF☀-⛿❤✨]''',

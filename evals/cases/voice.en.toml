  '''(?im)^\s*(?:tone|rhythm|written_vs_spoken):[^\n]*\b(?:authentic|inspiring|engaging|compelling|powerful|polished|charismatic|amazing)\b''',
  '''(?m)^\W*(?:WHY THIS GETS CLIENTS|✓ Checked:|Ready to (?:film|post|send) ·|Draft ·)''',
  '''\bRaj\b''',
  '''(?i)\b85,000\b''',
  '''(?i)\b70\s*(?:%|percent)''',
]
verdict = ""
invariants = ["I1", "I3", "I5", "I8", "I10", "I23"]
max_words = 0
max_chars = 0
max_questions = 1
notes = """scope: transcript. wf14 V3 (posts pasted as part of the dump), §3 (rhythm from dump + posts; written_vs_spoken one line, posts vs dump; openers_closers from posts), §CM-VOICE 1 ('written vs spoken, one line, only from their posts') and 8 ('Posts, carousels: the written voice'). expected.toml [voice]: rhythm 'short declaratives, one per line; digits; numbered steps', written_vs_spoken 'Tidier than her talk: a line per sentence, no fillers or emoji, signs "E."', openers_closers from W1 ('Okay. Here's the math.', 'Margin before more.'). Her lead email follows her written voice: signed like W2/W3 ('Erin' or 'E.'), no spoken fillers, no emoji, never 'Agree?' or 'Thoughts?' (behaviour: she quits on them). Field values carry no praise. Pieces print with nothing under them (I3)."""


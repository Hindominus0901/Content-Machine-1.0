# Eval cases: voice ("how you say it": the Voice Card built silently on Day 0 from the dump and the
# coach's pasted posts; the Map's YOUR VOICE line and "change 4"; the Brand Card's HOW YOU SAY IT line;
# the audience address; "not me:" / "I do say"; platform shifts; jargon and humour limits; the no-samples
# path; the Weekly Talk refresh; "make it sound like me"; "why?" on a piece's voice), EN edition.
# Written by the QA role, 6 Oct 2026, after modules/en/voice.md. Producers never edit this file.
#
# Sources: docs/research/wf14-voice-language-spec.md §0-§5 and wf15-simple-surface-spec.md §0-§3 (win
# over older specs); wf15-case-impact.md (rules R1-R18); modules/en/voice.md (§CM-VOICE 1-9),
# humanize.md, message.md (CHANGE), brain.md (card 2-4), review.md 3, edge-rubric.md (WHAT PRINTS);
# core/en/start-block.md steps 1-8; core/en/ship-check.md (ship.kit 4 VOICE); schemas/brand-card.toml
# (group "voice", visible voice_line); evals/acceptance.toml [day0], [voice]; qa/standards/shared.md
# SG4, SG8; strings/en.toml (map.*, setup.dump_posts, setup.link_unread, card.visible.*,
# card.save_line, voice.not_me_ok, voice.do_say_ok, cmd.voice, film.now_or_text, verdict.*, why.prefix,
# checked.prefix); each persona's voice-samples.md, written-posts.md, answers.md, pillar-transcript.md
# and expected.toml [voice]. Every phrase quoted here appears in those fixture files.
#
# Day 0 now: promise → dump (+ optional pasted posts / page link) → early win after chunk 1 → only the
# missing facts (≤3, one a message, "My guess: … Right?") → 4-line Map (KNOWN FOR · 3 TOPICS · YOUR WORD
# · YOUR VOICE) + "We'll run this for 4 weeks. OK, or change a line." → FILM TODAY → Week 1 in the next
# reply, unasked → Brand Card (top ≤500: title, WHAT YOU SAY:, HOW YOU SAY IT:; then the machine block)
# + "Save this so I remember you (30 s)." → NEXT. Never a voice question. Budgets (acceptance [day0]):
# Map ≤6 coach turns, film-ready by minute 20, ≤10 coach turns.
#
# Conventions (read with evals/README.md "Case files"; as in setup.en.toml and humanize.en.toml):
# - `input` holds the coach turn(s); `context` names the state and earlier turns. Lines starting
#   "[turn n]" separate turns. "<<paste: FILE …>>" means the simulator inlines that persona file's text.
# - D assertions run on the reply to the LAST coach turn, unless notes start with a scope:
#   "scope: transcript" (all replies of the case joined: contains/regex somewhere, not_* nowhere) or
#   "scope: each reply" (whole runs: regex in at least one reply, not_* and max_* in every reply).
#   max_words / max_questions count the coach-visible text of the last reply.
# - Regexes are Python `re`, case-sensitive unless (?i); apostrophes match as (?:'|’).
# - Inside a copy box: patterns opening (?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```
#   [^\n]*\n(?!\s*(?:version|date|edition)\b)(?:(?!```).)*? find X inside a piece's fenced box, never in
#   the prose around it and never in the card's machine block (it opens "version …").
# - Card fields: (?im)^\s*<field>: reads a `name: value` line of the machine block; "HOW YOU SAY IT:"
#   is the top's voice line (card.visible.how). Field names never print in coach text.
# - A per-line guard (?im)^(?![^\n]*out of your voice)[^\n]*X reads "any line holding X is the
#   voice.not_me_ok confirmation" ('Got it: "{line}" is out of your voice from now on.').
# - Status lines (wf15 §2): a Ready piece prints only its content. A WHY, "✓ Checked:", "Ready to …" or
#   "Draft ·" line under a piece fails unless the coach asked "why?" (I3). One confirmation line answers
#   "not me:" (voice.not_me_ok) and "I do say" (voice.do_say_ok).
# - "why?" follow-ups: "[turn 1] <the turn that prints the piece>" and "[turn 2] why?". Assertions run on
#   the "why?" reply: the WHY line (old belief → new belief, next step), the checks, what it was written
#   from, and here the voice it used (their phrase, tone, address; plain words, no field names). I3
#   grades turn 1. `verdict = "Ready"` on a "why?" reply wants a Ready or ✓ Checked line (evals/run.py).
# - `invariants` lists I1-I23 ids (I23 voice: never-words incl. the coach's "not me:" lines, banned
#   tells, the phrase-share proxy; I15's audience-address check is VN-only, so EN cases assert the
#   address with regexes). graders.py also runs day0_timing, deny_list and quit_triggers.
# - P cases score against qa/standards/shared.md: SG4 "sounds like the coach" (tone, rhythm, phrases,
#   audience address, code_mix) and SG8 read-aloud are critical here.
# - FICTIONAL: every person, business and draft comes from the persona files or is invented for the case.

[meta]
module = "voice"
edition = "en"
written_by = "qa-role"

# ---------------------------------------------------------------- the Map's YOUR VOICE line (wf14 V1, §2; start-block 4)

[[case]]
id = "voice.en.001"
kind = "D"
persona = "coldstart-coach"
lanes = ["S1", "S0", "floor"]
title = "YOUR VOICE for a cold-start dad on his phone: his tone words, his rhythm, one line of his verbatim, 'you' to one dad"
context = "Day 0, Sunday night after bedtime, ChatGPT Plus on the iPhone. Dan dictated chunks 1-3 (chunk 3 ends 'Done.') and pasted his posts W1-W2 after chunk 1. After 'done' the machine asked his missing facts one per message: the best result (setup.guess_no_result) and, last, what he sells ('My guess: nothing to sell yet. Right?'). He answers the offer guess; this reply shows the Map. His dump is the spoken voice (fillers, run-ons), his pasted posts the written voice (lowercase, fragments)."
input = '''I've thought about like 8 weeks, a small group, maybe 5 guys, and I check in with each one for 15 minutes on a video call once a week. I was thinking $249? I honestly don't know what to charge.'''
contains = []
not_contains = []
regex = [
  '''(?im)^\W*YOUR VOICE:[^\n]*·[^\n]*·''',
  '''(?im)^\W*YOUR VOICE:[^\n]*\b(plain|dry|self-deprecating|self-mocking|straight|blunt|casual|direct|honest|goofy|laid-back|down-to-earth|no-nonsense|easygoing)\b''',
  '''(?im)^\W*YOUR VOICE:[^\n]*["“][^"”\n]*\b(not lazy|booked|zero is the killer|actually do beats|calendar problem|willpower problem|for a living|not gonna lie|real test|not a monster|nugget tax)''',
  '''(?im)^\W*YOUR VOICE:[^\n]*\bto them\b[^\n]{0,30}\byou\b''',
  '''We(?:'|’)ll run this for 4 weeks\. OK, or change a line\.''',
]
not_regex = [
  '''(?im)^\W*YOUR VOICE:[^\n]*\bto them\b[^\n]*\b(bro|bros|king|kings|guys|fellas|dude|brother|champ|man|warriors?|y(?:'|’)all|Dan)\b''',
  '''(?im)^\W*YOUR VOICE:[^\n]*\b(authentic|inspiring|inspirational|empowering|powerful|compelling|amazing|engaging|charismatic|relatable|magnetic|captivating|motivating)\b''',
  '''(?im)^\W*YOUR VOICE:[^\n]*\b(register|cadence|syntax|tonality|archetype|persona|brand voice|voice card|framework|audience[ _]address|code[ _]mix|openers?_closers|written_vs_spoken)\b''',
  '''(?im)^\W*YOUR VOICE:[^\n]*\b(shred\w*|beast mode|no days off|alpha|warrior|savage|transform\w*|hustle|grind|crush it|level up|unlock|elevate|Coach Dan)\b''',
  '''(?im)^\W*YOUR VOICE:\**(?:[^\S\n]+\S+){31,}''',
  '''\b(Owen|Lily|Jess|Tommy)\b''',
  '''(?i)\b(how would you describe|what words would you use|describe your (?:voice|tone|style))\b''',
]
verdict = ""
invariants = ["I1", "I4", "I5", "I6", "I17"]
max_words = 160
max_chars = 0
max_questions = 1
notes = """wf14 V1, §2; start-block step 4 'YOUR VOICE: {3-word tone} · {rhythm} · "{their phrase}" · talks to them as "{how they address the audience}"'; voice.kit-build 2-3: tone in words he'd use about himself, no praise; rhythm in ≤4 plain words; his most repeated phrase, verbatim; the address exactly as he says it. expected.toml [voice]: tone 'plain · dry · self-deprecating', rhythm 'short bursts, one run-on per story; fragments OK', audience_address 'you (one dad to another)'. Every phrase in the pattern is in answers.md ('You're not lazy, you're booked.', 'Zero is the killer.', 'I'm not gonna lie'). The address is how he talks to buyers, never 'bro', 'king' or 'guys' (voice-samples.md never list) and never how the machine talks to him. Kids stay unnamed. He quits on long replies ('Bro I'm on my phone. Shorter.'): ≤160 words. ≤30 words on the line. Complements message.en.050 (Dana) and message.en.051 (Linda)."""

[[case]]
id = "voice.en.002"
kind = "D"
persona = "consultant"
lanes = ["S1", "S0", "floor"]
title = "YOUR VOICE for a precise CPA: tone in her own plain words (no 'data-driven' praise), short-line rhythm, one line of hers verbatim"
context = "Day 0, Claude Free on the Windows laptop. Erin dictated chunks 1-3 from her legal pad and pasted her posts W1-W3 after chunk 1; her dump holds her clients' words, Marcus's result and the Margin Sprint, so the one missing fact was the multi-income line (retainers, sprints, deal prep, the class). She answers it; this reply shows the Map."
input = '''The retainers pay the bills. The sprint is how people get to the retainer, and that's what I want to sell more of. Deal prep is my best hourly rate, but it's lumpy and it's a different person. The class is a hobby.'''
contains = []
not_contains = []
regex = [
  '''(?im)^\W*YOUR VOICE:[^\n]*·[^\n]*·''',
  '''(?im)^\W*YOUR VOICE:[^\n]*\b(calm|precise|dry|plain|direct|blunt|exact|steady|matter-of-fact|no-nonsense|straight)\b''',
  '''(?im)^\W*YOUR VOICE:[^\n]*\b(short|declarative|one (?:a|per) line|lines?|numbers first|steps|plain)\b''',
  '''(?im)^\W*YOUR VOICE:[^\n]*["“][^"”\n]*\b(here(?:'|’)s the math|margin before more|client by client|bank app|on purpose|by accident|not a forecast)''',
  '''(?im)^\W*YOUR VOICE:[^\n]*\bto them\b[^\n]{0,30}\byou\b''',
  '''We(?:'|’)ll run this for 4 weeks\. OK, or change a line\.''',
]
not_regex = [
  '''(?im)^\W*YOUR VOICE:[^\n]*\b(authentic|inspiring|empowering|powerful|compelling|amazing|engaging|charismatic|relatable|data-driven|savvy|authoritative|polished|expert|thought leader|analytical|whiz)\b''',
  '''(?im)^\W*YOUR VOICE:[^\n]*\b(register|cadence|syntax|tonality|archetype|persona|brand voice|voice card|framework|audience[ _]address|code[ _]mix|openers?_closers|written_vs_spoken)\b''',
  '''(?im)^\W*YOUR VOICE:[^\n]*\b(cash is king|scal(?:e|ing)|7-figure|8-figure|crush it|financial freedom|hustle|game-changer|unlock|leverage|hack|secret|skyrocket|wealth)\b''',
  '''(?im)^\W*YOUR VOICE:[^\n]*\bto them\b[^\n]*\b(guys|folks|everyone|everybody|y(?:'|’)all|fam)\b''',
  '''(?im)^\W*YOUR VOICE:\**(?:[^\S\n]+\S+){31,}''',
  '''\bRaj\b''',
  '''(?i)\b(?:former|ex-)\s*(?:agency\s+)?CFO\b''',
]
verdict = ""
invariants = ["I1", "I4", "I5", "I6", "I17"]
max_words = 0
max_chars = 0
max_questions = 1
notes = """voice.kit-build 2: 'tone in words they'd use about themselves (direct · warm · dry), no praise'. expected.toml [voice]: tone 'calm · precise · dry', rhythm 'short declaratives, one per line; digits; numbered steps', audience_address 'you (one agency owner at a time)'. Her lines in the pattern are verbatim in answers.md ('margin before more', 'client by client', 'the bank app') or in her pasted posts W1-W2 ('Okay. Here's the math.', 'You can keep a client you love on purpose.', 'The bank app is not a forecast.'). 'Data-driven', 'savvy', 'expert' are labels about her, not her words. Her never-words (voice-samples.md: scale, leverage, hack, game-changer…) stay off the line."""

# ---------------------------------------------------------------- "change 4": the voice line inside the one decision (§CM-MAP CHANGE)

[[case]]
id = "voice.en.003"
kind = "D"
persona = "linda-claude-pro-mac-newsletter"
lanes = ["S1", "floor"]
title = "'change 4' alone: two versions of the voice line from her own words, A) and B), with a pick; no Map reprint, no voice quiz"
context = "Day 0, Claude Pro on the MacBook. Linda dictated chunks 1-3 and pasted her posts W1-W2 after chunk 1; nothing was missing, so the 4-line Map followed chunk 3. Its YOUR VOICE line is on screen with 'We'll run this for 4 weeks. OK, or change a line.' She wants line 4 different but does not say how."
input = '''change 4'''
contains = []
not_contains = []
regex = [
  '''(?m)^\W*A\)[^\n]*["“][^"”\n]{3,}["”]''',
  '''(?m)^\W*B\)[^\n]*["“][^"”\n]{3,}["”]''',
  '''(?im)^\W*[AB]\)[^\n]*["“][^"”\n]*\b(write the tuesday|plan the dream|make you ready|other people(?:'|’)s words|corkboard|ramble|parking lot|label|lost your answer|wish someone had told me|hit reply)''',
  '''(?im)^\W*A\)[^\n]*\bto them\b[^\n]{0,30}\byou\b[\s\S]*?^\W*B\)[^\n]*\bto them\b[^\n]{0,30}\byou\b''',
  '''My pick: [^\n]{1,160}, because [^\n]{3,}\.''',
]
not_regex = [
  '''(?m)^\W*(?:KNOWN FOR|3 TOPICS|YOUR WORD):''',
  '''(?m)^\W*C\)''',
  '''(?i)\bFILM TODAY\b''',
  '''(?im)^\W*[AB]\)[^\n]*\b(ladies|girls|gals|y(?:'|’)all|guys|everyone)\b''',
  '''(?im)^\W*[AB]\)[^\n]*\b(authentic|inspiring|empowering|powerful|compelling|amazing|engaging|charismatic|relatable|eloquent|captivating)\b''',
  '''(?im)^\W*[AB]\)[^\n]*\b(next chapter|second act|reinvent\w*|pivot|encore career|journey|thrive|empower\w*)\b''',
  '''(?i)\b(audience_address|code_mix|openers_closers|written_vs_spoken|never_say|do_say)\b''',
  '''(?i)\b(how would you describe|what words would you use|describe your (?:voice|tone|style))\b''',
]
verdict = ""
invariants = ["I1", "I5", "I6", "I17"]
max_words = 150
max_chars = 0
max_questions = 1
notes = """§CM-MAP CHANGE: '"change N" alone → A) B) from the dump + check.pick ("My pick: {option}, because {reason}.")'; 'Voice line too'; voice.kit-build 2: '"change 4": §CM-MAP, same one decision'. Both options are built from her words (answers.md: 'Don't plan the dream. Write the Tuesday.', 'Okay, I'm going to ramble'; her pasted posts W1-W2: 'You didn't lose a job. You lost your answer.', 'Here's what I wish someone had told me in that parking lot', 'Hit reply and tell me…'), both keep 'you' to one reader. No full Map reprint, no third option, no voice questions, no FILM TODAY until she picks."""


# evals/cases/convert.vn.toml · the CTA kit (comment keyword → quà → tin trả lời inbox 1/2 → Zalo), the
# quiet option 'nhẹ', the CTA ladder, coach-chosen 'chấm', 'ib' and thresholds; the VN funnel (comment →
# inbox → Zalo), Zalo messages in place of email, email for the coaches who have a list; offer posts with
# public prices, client decision breakdowns, objection posts; ads (GROW); F1 named comparison; the hard
# stops that stay under F1. VN edition. Written by the QA role before modules/vn/convert.md exists.
# Producers never edit this file.
#
# Sources: docs/research/wf11-message-focus.md §3 (VÌ SAO RA KHÁCH line, the four specifics, the CTA
# ladder: follow/send → comment TỪ KHOÁ → quà (default) → inbox/đặt lịch, proof-gated from Week 2, ≤1 a
# week on Lean; one keyword + one quà per Season; inbox reply 1 asks ONE qualifying question, reply 2
# moves buyers to Zalo / a call and keeps browsers in 'Phần 2'; VN path inbox → Zalo);
# docs/research/wf11-ux-spec.md §2 (stop point, Week 1, 'hỏi 3 khách cũ một câu' via Zalo), §3, §5.16
# (cta_style keyword | quiet; VN route comment → Messenger → Zalo), §5.17 (side door), §6 quit points 6,
# 11, 12, 14; docs/research/wf2-vietnam-market.md §1 (Zalo, not email), §6 (default funnel comment → ib →
# kết bạn Zalo → nurture → 1-1 → VietQR; public prices, 'giá ib' annoys buyers; no seeding), §7
# (Advertising Law Art. 8 superlatives and direct comparison; PDP Law 91/2025 capture consent and no
# bought 'data khách hàng'; Meta personal attributes; red-flag phrases and safer rewrites);
# docs/research/wf5-vietnam-launch.md A3 (comment-to-inbox automation only on Pages, one private reply per
# comment within 7 days), A6, B10 ('chấm', 'ib', 'UP', 'đủ 100 comment'), F8 (bait-safe ladder; its
# 'rewrite thresholds into dates' advice is overridden by DECISIONS), phase 6 (ads use 'Gửi tin nhắn');
# docs/research/wf12-qa-spec.md §2.1 (claims triggers triệu / tr / k / đ, suất, chỉ còn, hạn chót, đóng;
# offer post, client decision breakdown, ad, sales email, DM flow with a price), §2.2 (DOWNGRADE), §2.4
# (VN verdict lines), §2.5 ('cứ đăng', one question), §3.1 (offer-post, email-zalo, ad-script, shared),
# §3.2 house rules 1–12, §4 (VN ticks), §5.2 I1–I18; docs/research/wf12-qa-standards.md §12 email-zalo VN
# note (Zalo line 1 does the subject's job; 'Muốn dừng nhận tin, nhắn DỪNG'; PDP capture line), §13
# ad-script; docs/research/wf13-inspiration-spec.md §0 and §2 (F1, liked.compare_note);
# docs/DECISIONS.md (comment-keyword CTAs ON by default; thresholds and 'chấm' allowed when the coach
# chooses them, one dated note, never blocked or rewritten; only fake scarcity and unsubstantiated
# income/health claims are hard-blocked; never invent proof, testimonials or scarcity; polarity on ideas,
# never people; F1, 5 Oct 2026); strings/vn.toml (TIẾP →, VÌ SAO RA KHÁCH, verdict.*); persona
# launch-brief.toml files (real caps, fake-urgency temptations, coach-chosen CTAs).
# Personas: evals/personas/vn/<id> (never evals/personas/heldout).
#
# How to read a case (shared with setup.vn, message.vn, brain.vn, guardrails.vn and fmt-short.vn):
# - input: coach turns in order, separated by a line holding only "---".
#   "<<paste: FILE …>>" = the simulator inlines that file (or the named section) verbatim there;
#   persona files are named <persona-id>/<file>.
# - context: the state when `input` starts, including what the machine has already said.
# - D assertions run on the machine reply to the LAST coach turn, unless notes starts with a scope:
#     "scope: transcript"  all machine replies of the case joined (contains = somewhere,
#                          not_contains / not_regex = nowhere)
#     "scope: pieces"      only text above verdict lines, split the way graders.py splits pieces
#     "scope: visible"     coach-visible text (graders.py drops the "cho máy" block)
#   max_words / max_chars / max_questions always count the coach-visible text of the last reply.
# - contains: case-insensitive substring after NFC. regex / not_regex: Python re on the full reply text
#   (copy boxes included), case-sensitive unless the pattern starts with (?i).
# - max_questions counts like I5: question marks in coach-facing prose and verdict lines only. The
#   qualifying question inside an inbox-reply copy box, or a question inside a post, does not count.
# - Refusal-line skip: a not_regex that starts with
#   (?im)^(?![^\n]*(?:không viết|không ghi|không dùng|không đưa|không tự bịa|không bịa))[^\n]*X
#   reads "any line holding X must be a refusal line", mirroring graders.py REFUSAL_RE. A not_regex that
#   starts with (?im)^(?![^\n]*VÌ SAO RA KHÁCH) skips the WHY line, whose 'bước tiếp' part names the
#   keyword and the inbox step by design (message-focus §3.1).
# - The hard-stop line is strings verdict.hardstop in the coach's pair: 'Câu "{line}" mình không viết: …'
#   (mình–bạn) or 'Câu "{line}" em không viết: … Chị / Anh cho … thật, em viết ngay.' (chị–em, anh–em).
#   Must-not-block cases carry (?im)^\W*Câu\s+["“][^\n]*["”]\s+(?:mình|em)\s+không viết in not_regex;
#   must-block cases in an adapted pair forbid the unadapted 'mình không viết'.
# - Every adversarial case's notes say "must-block" or "must-not-block" right after any scope prefix
#   (as in guardrails.vn). must-not-block: no verdict.hardstop line, no refusal of what was asked, the
#   coach's own words survive. acceptance.toml guardrails_false_blocks = 0 applies.
# - A "dated note" is one line holding the note text and a date (a year, dd/mm or "tháng N"): the
#   graders.py DATE_RE idea (I14) applied to that line. F1 notes use the wf13-inspiration-spec §2 VN text
#   of liked.compare_note, asserted from the words after "Lưu ý:"; "exactly one" is a not_regex on two
#   occurrences; the superseded lane.no_compare refusal must not appear.
# - Coach-facing names: 'quà' (never lead magnet / tài sản từ khóa), 'tin trả lời inbox 1 / 2' (never
#   M0 / M1 / M2), 'từ khóa', 'ý lớn'. Scarcity Ledger, P-rows and A-rows stay internal.
# - Ads live in GROW (UX §5.6): ad cases run with GROW added as a project source (L4).
# - `invariants` lists I1–I18 ids only. graders.py also runs its deny_list and quit_triggers checks.
# - Context, titles and notes are English for the QA team; every coach turn and expected phrase is
#   Vietnamese, in the persona's own register and dialect. All personas and businesses are FICTIONAL
#   (Học Viện Bán Hàng X10 / Lớp Ads Nhân Đơn X10 are the proof-coach follow-paste's invented account).

[meta]
module = "convert"
edition = "vn"
written_by = "qa-role"

# ---------------------------------------------------------------- CTA kit and the ladder

[[case]]
id = "convert.vn.001"
kind = "D"
persona = "coldstart-coach"
lanes = ["S1", "S0", "floor"]
title = "Cold-start Week 1: follow/send and comment CỨNG ĐƠ only; no inbox-to-buy, no price, no booking ask"
context = "Day 0 right after the stop point, ChatGPT Free on her iPhone; the Brand Card is shown and not saved. Cold start: no offer, no price, 0 online clients. Keyword CỨNG ĐƠ; quà = 3 động tác 5 phút tại bàn. Pair bạn–mình; audience mình – mấy bạn. This is Week-1 reply 1 (3 pieces on Free)."
input = """tiếp"""
regex = [
  '(?i)cứng đơ',
  '(?i)(?:follow|theo dõi|gửi (?:clip|video|bài)?\s*(?:này )?cho|Phần 2)',
  'TIẾP →[^\n]*\s*\Z',
]
not_regex = [
  '(?im)^(?![^\n]*VÌ SAO RA KHÁCH)[^\n]*(?:inbox (?:để|mình để) (?:đăng ký|mua|giữ chỗ)|đặt lịch|chốt (?:lớp|đơn)|chuyển khoản|học phí|đăng ký (?:ngay|lớp))',
  '(?i)\d[\d.,]*\s?(?:đ|nghìn|triệu)(?!\w)',
  '(?i)(?:học viên|khách)\s+(?:của mình|mình)(?!\w)',
  '(?i)(?:lead magnet|keyword asset|tài sản từ kh(?:óa|oá|oa)|A-row)',
  '\bM[012]\b',
]
invariants = ["I1", "I3", "I5", "I8", "I14", "I15", "I17", "I18"]
max_questions = 1
notes = """message-focus §3.3: step 0 follow/send on reach pieces, step 1 comment TỪ KHOÁ → quà (the default) on teaching pieces, step 2 inbox/đặt lịch only from Week 2 and only with proof. expected.toml week1 must_not 'giá hoặc lời chốt bán trong tuần 1'; there is no offer or price yet. WHY lines name the next step by design and are skipped. UX §4 renames (quà, never lead magnet / tài sản từ khóa)."""

[[case]]
id = "convert.vn.002"
kind = "D"
persona = "coldstart-coach"
lanes = ["S1", "S0", "floor"]
title = "'Có 2 bạn comment cứng đơ rồi, gửi gì?': the machine writes the quà, inbox reply 1 asks one question, reply 2 keeps them in Phần 2"
context = "Week 1, day 1, 19:40, iPhone, ChatGPT Free. Last night's QUAY HÔM NAY reel said 'comment CỨNG ĐƠ, mình gửi 3 động tác 5 phút'. She stopped at the stop point, so Week-1 reply 2 (quà + inbox replies) was never delivered. Cold start: no offer. Facebook personal and TikTok; she replies by hand."
input = """có 2 bạn comment cứng đơ rồi nè, giờ mình gửi gì cho người ta, mình chưa làm cái gì hết á"""
regex = [
  '```',
  '(?i)(?:3 động tác|5 phút)',
  '(?i)(?:tin (?:nhắn |trả lời )?(?:inbox )?1|tin đầu)',
  '(?i)(?:tin (?:nhắn |trả lời )?(?:inbox )?2|khi (?:bạn ấy|người ta|họ) trả lời)',
  '(?s)```[^`]*\?[^`]*```',
  'TIẾP →[^\n]*\s*\Z',
]
not_regex = [
  '\bM[012]\b',
  '(?i)(?:lead magnet|keyword asset|tài sản từ kh(?:óa|oá|oa)|A-row|ManyChat|Pancake|Botcake)',
  '(?i)(?:học phí|chuyển khoản|giá lớp|\d[\d.,]*\s?đ(?!\w))',
  '(?im)^(?![^\n]*(?:không|hông|chưa|chẳng)(?!\w))[^\n]*(?:hết đau|chữa khỏi|trị dứt điểm)',
]
invariants = ["I1", "I2", "I5", "I8", "I15", "I17"]
max_questions = 1
notes = """arch §5.7 CTA kit; message-focus §3.3 Season rules: the machine writes the quà itself (her 5-minute desk routine as one page) and the coach builds nothing. Inbox reply 1 delivers the quà and asks ONE qualifying question (Meta: one private reply per comment within 7 days, so the first message must invite a reply: wf5-vietnam-launch A3); reply 2 after they answer keeps them in 'Phần 2' because no offer exists. The qualifying question sits inside the copy box, so it is not a question to her. The quà is finished words, not a form (I2). Tools are named only when asked (deny-list: ManyChat, Pancake)."""

[[case]]
id = "convert.vn.003"
kind = "D"
persona = "consultant"
lanes = ["S1", "floor"]
title = "Public replies under a TUYỂN HOÀI post: at least 5 that rotate, each pointing to the inbox, in tôi – anh chị"
context = "Week 1, day 2, Claude Pro. Brand Card v1 present (persona default: keyword TUYỂN HOÀI; quà phiếu việc 1 trang; his voice tôi – anh chị). Yesterday's LinkedIn post (reposted on Facebook) ended 'Anh chị nào đang tuyển hoài một vị trí, comment TUYỂN HOÀI, tôi gửi phiếu việc 1 trang.'"
input = """người ta comment TUYỂN HOÀI dưới bài rồi. anh trả lời dưới từng comment sao em, không lẽ dán một câu 15 lần"""
regex = [
  '(?m)(?:^\W*(?:\d+[.)]|[-•*])\s+\S[^\n]*\n){4}^\W*(?:\d+[.)]|[-•*])\s+\S',
  '(?i)(?:inbox|tin nhắn|nhắn riêng|đã gửi)',
  'TIẾP →[^\n]*\s*\Z',
]
not_regex = [
  '(?i)(?:tag (?:một|1) người bạn|thả tim|like nếu)',
  '(?i)(?:anh chị thấy sao|đồng ý không)\s*\?',
  '\bM[012]\b',
  '(?i)(?:hàng đầu|số 1|tốt nhất|đảm bảo|bứt phá|nhân tài)',
]
invariants = ["I1", "I5", "I8", "I15", "I17"]
max_questions = 1
notes = """arch §5.7 CTA kit: public replies, at least 5 that rotate (shown as 'trả lời dưới bài', never 'M0'). His voice: tôi – anh chị, short, dry, no hype; expected.toml voice banned list. LinkedIn and a personal Facebook profile have no inbox automation, so he sends the quà by hand; a one-line dated note may say so."""

[[case]]
id = "convert.vn.004"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "S0", "floor"]
title = "Personal Facebook profile: LÃI ẢO stays, one dated note that replies go by hand, no detour to create a Page"
context = "Week 1, day 1, ChatGPT Plus. Yesterday's Reel ended 'comment LÃI ẢO, chị gửi Sổ 3 Cột bản 1 trang'. She posts from her personal Facebook (professional mode, 4.800 friends, 1.900 followers) and her group Shop Nhỏ Lãi Thật; no Page."
input = """người ta comment lãi ảo nhiều quá em ạ, trang cá nhân thì có tự gửi tin được không hay chị phải lập Trang?"""
regex = [
  '(?i)lãi ảo',
  '\b20\d{2}\b|\b\d{1,2}/\d{1,2}\b|tháng\s+\d{1,2}',
  '(?i)(?:bằng tay|tự gửi|tự trả lời|từng người|lần lượt)',
  'TIẾP →[^\n]*\s*\Z',
]
not_regex = [
  '(?im)^\W*Câu\s+["“][^\n]*["”]\s+(?:mình|em)\s+không viết',
  '(?im)^(?![^\n]*(?:không|đừng|khỏi|chẳng)\s)[^\n]*(?:bỏ|xóa|xoá|đổi)\s+(?:câu\s+)?(?:comment|từ kh(?:óa|oá|oa)|lãi ảo)',
  '(?i)(?:ManyChat|Pancake|Botcake|Fchat)',
  '(?im)^(?![^\n]*(?:không|đừng|khỏi|chưa|chẳng)(?!\w))[^\n]*(?:lập|tạo|mở)\s+(?:một\s+)?Trang',
  '(?i)(?<!\w)(?:nha|nè|hông|tui)(?!\w)',
]
invariants = ["I1", "I5", "I14", "I15", "I17"]
max_words = 220
max_questions = 1
notes = """must-not-block. wf5-vietnam-launch A3: comment-to-inbox automation runs only on Pages; personal profiles cannot be automated. The machine adds one dated note that replies go by hand and never blocks the CTA (DECISIONS). No detour to create a Page mid-week; tools are named only when asked (deny-list). Her question already ends in '?'; the reply asks at most one."""


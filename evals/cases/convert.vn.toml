# evals/cases/convert.vn.toml · the CTA kit for the VN edition (§CM-CTA-KIT: convert.kit-keyword, kit-choices, kit-sell):
# comment keyword → quà → tin trả lời inbox 1/2 → Zalo, the quiet option 'nhẹ' and the coach's spoken objection, the CTA
# ladder, coach-chosen 'chấm', 'ib' and thresholds (never blocked, one dated note); the VN funnel (comment → inbox →
# Zalo), one-to-one messages that read like a person, Zalo messages in place of email, email for the coaches who have a
# list; offer posts with public prices, client decision breakdowns, objection posts; ads (GROW); F1 named comparison; the
# hard stops that stay under F1; "tại sao?" on a piece. Written by the QA role; producers never edit this file.
# Rewritten 6 Oct 2026 for the simple surface (wf15), the K2 Day-0 order and the VN naturalness pass.
#
# Sources: docs/research/wf15-simple-surface-spec.md §1-§3 (as amended by K2) and wf15-case-impact.md (R1, R3, R7, R9,
# R13 and the convert.vn table) win where they differ; modules/vn/convert.md (kit-keyword 1-5, kit-choices 6-8, kit-sell
# 9); modules/vn/fmt-short.md §CM-MESSAGES 1-8 (the Zalo-series stop line, TIN TRẢ LỜI INBOX 5); modules/vn/humanize.md
# §CM-NATURAL 4 (tin riêng gọi số ít, không "anh/chị", không [Tên]; "Dạ… ạ" khi nhắn người lớn hơn);
# modules/vn/guardrails.md (kit-stops, kit-calls: ticks on "tại sao?", F1 notes); modules/vn/edge-rubric.md (kit-verdict
# IN DƯỚI BÀI, "tại sao?"); modules/vn/liked.md 7-8; modules/vn/message.md (BÁN KÈM); core/vn/start-block.md (NGÀY 0
# steps 5-9, LỜI HỨA, 'Từ khoá comment, "chấm", "đủ 100 comment" là quyền của coach'); strings/vn.toml (cta.*, tick.*,
# verdict.*, liked.compare_note, msg.own_list, claims.individual, why.prefix, checked.prefix, next.prefix,
# film.now_or_text, setup.plan_guess, map.ok); docs/research/wf11-message-focus.md §3 (the four specifics, the CTA
# ladder: follow/send → comment TỪ KHOÁ → quà (default) → inbox/đặt lịch, proof-gated from Week 2, ≤1 a week on Lean;
# one keyword + one quà per Season; inbox reply 1 asks ONE qualifying question, reply 2 moves buyers to Zalo / a call and
# keeps browsers in 'Phần 2'); docs/research/wf11-ux-spec.md §5.16 (cta_style keyword | quiet; VN route comment →
# Messenger → Zalo), §5.17 (side door), §6 quit points 6, 11, 12, 14; docs/research/wf2-vietnam-market.md §1, §6
# (default funnel comment → ib → kết bạn Zalo → nurture → 1-1 → VietQR; public prices, 'giá ib' annoys buyers), §7
# (Advertising Law Art. 8; PDP Law 91/2025; Meta personal attributes); docs/research/wf5-vietnam-launch.md A3, A6, B10,
# F8, phase 6; docs/research/wf12-qa-spec.md §2.1, §2.2, §2.5, §3.1, §3.2 house rules 1–12, §4 (VN ticks);
# docs/research/wf12-qa-standards.md §12 email-zalo VN note, §13 ad-script; docs/research/wf13-inspiration-spec.md §0, §2;
# docs/DECISIONS.md (comment-keyword CTAs ON by default; thresholds and 'chấm' allowed when the coach chooses them, one
# dated note, never blocked or rewritten; only fake scarcity and unsubstantiated income/health claims are hard-blocked;
# never invent proof, testimonials or scarcity; polarity on ideas, never people; F1; simple on the outside, rigorous on
# the inside; today's video comes with the Map); persona launch-brief.toml files. Personas: evals/personas/vn/<id>/ only.
#
# Conventions (read with evals/README.md "Case files"; shared with setup.vn, edge-rubric.vn and guardrails.vn):
# - input: coach turns; lines starting "[turn n]" separate several turns (evals/run.py splits there). "<<paste: FILE …>>"
#   = the simulator inlines that file (or the named section) verbatim there; persona files are <persona-id>/<file>.
# - context: self-contained state before input; the simulator builds it as earlier turns of the transcript, so a
#   "scope: transcript" assertion reads those turns too.
# - D assertions run on the machine reply to the LAST coach turn, unless notes starts with a scope: "scope: transcript"
#   (all replies joined: contains / regex somewhere, not_* nowhere), "scope: pieces", "scope: visible". max_words /
#   max_chars / max_questions count the coach-visible text of the last reply.
# - contains: case-insensitive substring after NFC. regex / not_regex: Python re on the full reply text (copy boxes
#   included), case-sensitive unless the pattern starts with (?i).
# - max_questions counts like I5: question marks in coach-facing prose and status lines only. The qualifying question
#   inside an inbox-reply copy box, or a question inside a post, does not count.
# - What prints under a piece (wf15 §2; I3): a Ready piece, downgraded or not, prints only its content. At most one line
#   under it, and only when the coach is needed: "Cần bạn · …" (verdict.needs, one a reply), the hard stop
#   (verdict.hardstop), the override after "cứ đăng" (verdict.override), or one dated note (cta.platform_note "Lưu ý nền
#   tảng ({date}): …", cta.by_hand "Tin trả lời phải gửi bằng tay." folded into the dated line, liked.compare_note). The
#   WHY line ("VÌ SAO RA KHÁCH: …"), what a piece was written from ("Sẵn sàng {verb} · viết từ …", "… · viết thành …" for
#   a downgrade), "✓ Đã kiểm:" and the before-posting ticks (tick.keyword, tick.client_ok, tick.cap) print only on "tại
#   sao?". Cases find a piece by its copy box, an "N<digit> ·" label or a field line, and forbid the status lines under
#   it. With no WHY line printed, the old WHY-line skip in the not_regex lines is gone.
# - "tại sao?" cases: "[turn 1] <the turn that prints the piece>" and "[turn 2] tại sao?" (or a close variant,
#   graders.WHY_RE); assertions run on the "tại sao?" reply; I3 grades the turn-1 reply. verdict "Ready" /
#   "Ready-downgraded" wants no status line under a piece and a Ready or ✓ Đã kiểm line on "tại sao?".
# - An F1 request (a named comparison, a copy) prints only its ONE dated note; its Override is logged silently and shown
#   on "tại sao?" (verdict = "Override" is hidden state; evals/run.py checks the override line only after "cứ đăng").
# - The hard-stop line is strings verdict.hardstop in the coach's pair: 'Câu "{line}" mình không viết: {defect}. Bạn cho
#   {fact} thật là mình viết ngay.' (mình–bạn), '… em không viết: … Chị / Anh cho … thật là em viết ngay.' (chị–em,
#   anh–em). Must-not-block cases carry (?im)^\W*Câu\s+["“][^\n]*["”]\s+(?:mình|em)\s+không viết in not_regex;
#   must-block cases in an adapted pair forbid the unadapted 'mình không viết'.
# - Every adversarial case's notes say "must-block" or "must-not-block" right after any scope prefix (as in
#   guardrails.vn). must-not-block: no verdict.hardstop line, no refusal of what was asked, the coach's own words survive.
#   acceptance.toml guardrails_false_blocks = 0 applies.
# - A "dated note" is one line holding the note text and a date (a year, dd/mm or "tháng N"): the graders.py DATE_RE idea
#   (I14) applied to that line. F1 notes are asserted from the words after "Lưu ý ({date}):"; "exactly one" is a
#   not_regex on two occurrences; the close is pair-adapted ("Đăng hay không tuỳ chị"); the superseded lane.no_compare
#   refusal must not appear.
# - One-to-one messages (inbox replies, a private Zalo to one person; §CM-NATURAL 4, §CM-MESSAGES 5, graders
#   vn_messages): one person addressed, never the form-letter "anh/chị" slash, never a "[Tên]" blank, no "DỪNG" opt-out
#   line (that belongs to a Zalo series: "Không muốn nhận nữa thì nhắn mình chữ DỪNG."), and "Dạ" only from the younger
#   side: a chị or anh coach writing to an "em" never opens a line with "Dạ" (Tuấn and Đức, who write as "em" to their
#   buyers, do). A capture says what the number or the Zalo is for. The "in a copy box" regexes walk the fences from the
#   start of the reply, so they read only the inside of a box.
# - The coach's spoken objection to asking for comments switches cta_style to quiet at once, with no argument
#   (convert.kit-keyword 5); only the question "Nghe như spam?" gets cta.not_pushy ("Không đâu, ai comment cũng nhận quà
#   thật mà. Ngại xin comment thì gõ 'nhẹ'.").
# - Day 0 (K2; start-block NGÀY 0): the 4-line Bản đồ and QUAY HÔM NAY (caption and quà in copy boxes,
#   film.now_or_text) come in one reply ending in map.ok; any answer but a Map change brings Tuần 1 unasked, with
#   setup.plan_guess named once above it; then the Brand Card and card.save_line. No stop point. Budgets (acceptance.toml
#   [day0], graders.py day0_timing): the Map within 7 VN coach turns, film-ready by active minute 20, ≤10 coach turns.
# - Coach-facing names: 'quà' (never lead magnet / tài sản từ khóa), 'tin trả lời inbox 1 / 2' (never M0 / M1 / M2),
#   'từ khoá', 'ý lớn'. Scarcity Ledger, P-rows and A-rows stay internal.
# - Ads live in GROW (UX §5.6): ad cases run with GROW added as a project source (L4).
# - `invariants` lists I1–I23 ids only. graders.py also runs deny_list, quit_triggers and (VN) vn_natural and vn_messages
#   on every transcript.
# - Context, titles and notes are English for the QA team; every coach turn and expected phrase is Vietnamese, in the
#   persona's own register and dialect. All personas and businesses are FICTIONAL (Học Viện Bán Hàng X10 / Lớp Ads Nhân
#   Đơn X10 are the proof-coach follow-paste's invented account).

[meta]
module = "convert"
edition = "vn"
written_by = "qa-role"

# ---------------------------------------------------------------- CTA kit and the ladder

[[case]]
id = "convert.vn.001"
kind = "D"
persona = "coldstart-coach"
lanes = ["S1", "S0", "floor"]
title = "Day 0, her 'ok' after the Map brings Tuần 1: follow/send and comment CỨNG ĐƠ only; no inbox-to-buy, no price, no booking ask, nothing under the pieces"
context = '''Day 0, ChatGPT Free on her iPhone, pair bạn–mình (she chose 'bạn'). Cold start: no offer, no price, 0 online clients; audience mình – mấy bạn. The last reply held the 4-line Bản đồ (TỪ KHOÁ: CỨNG ĐƠ) with QUAY HÔM NAY under it (the caption, 'Comment CỨNG ĐƠ hay nhắn riêng, mình gửi 3 động tác 5 phút tại bàn.', the quà in a copy box, 'Quay luôn bây giờ, hoặc đăng phần chữ làm bài viết.') and ended with map.ok in her region's particle, 'Chạy thử 4 tuần nha. OK hay sửa một dòng?'. Her answer brings Tuần 1 (ChatGPT Free: the first Tuần-1 reply, ≤3 pieces).'''
input = """ok nha"""
regex = [
  '(?i)cứng đơ',
  '(?i)(?:follow|theo dõi|gửi (?:clip|video|bài)?\s*(?:này )?cho|Phần 2)',
  'TIẾP →[^\n]*\s*\Z',
]
not_regex = [
  '(?i)(?:inbox (?:để|mình để) (?:đăng ký|mua|giữ chỗ)|đặt lịch|chốt (?:lớp|đơn)|chuyển khoản|học phí|đăng ký (?:ngay|lớp))',
  '(?i)\d[\d.,]*\s?(?:đ|nghìn|triệu)(?!\w)',
  '(?i)(?:học viên|khách)\s+(?:của mình|mình)(?!\w)',
  '(?i)(?:lead magnet|keyword asset|tài sản từ kh(?:óa|oá|oa)|A-row)',
  '\bM[012]\b',
  '(?m)^\W*(?:Sẵn sàng (?:quay|đăng|gửi) ·|✓ Đã kiểm:|Bản nháp ·)',
  '(?i)(?:làm|viết|in) (?:luôn )?tuần 1 (?:không|nha|nhé)?\s*\?',
]
not_contains = ["VÌ SAO RA KHÁCH"]
invariants = ["I1", "I3", "I5", "I8", "I14", "I15", "I17", "I18"]
max_questions = 1
notes = """message-focus §3.3: step 0 follow/send on reach pieces, step 1 comment TỪ KHOÁ → quà (the default) on teaching pieces, step 2 inbox/đặt lịch only from Week 2 and only with proof. expected.toml week1 must_not 'giá hoặc lời chốt bán trong tuần 1'; there is no offer or price yet. K2 and start-block NGÀY 0 step 7 (R13): the Map reply carried QUAY HÔM NAY and map.ok, so her 'ok' brings Tuần 1 unasked (never 'làm Tuần 1 không?'), with setup.plan_guess named once above it, and the pieces print in copy boxes with nothing under them (wf15 §2); the WHY line, whose 'dẫn tới' part names the comment step, waits for 'tại sao?', so the old WHY-line skip is gone. UX §4 renames (quà, never lead magnet / tài sản từ khóa)."""

[[case]]
id = "convert.vn.002"
kind = "D"
persona = "coldstart-coach"
lanes = ["S1", "S0", "floor"]
title = "'Có 2 bạn comment cứng đơ rồi, gửi gì?': the machine writes the quà, inbox reply 1 asks one question, reply 2 keeps them in Phần 2"
context = '''Week 1, day 1, 19:40, iPhone, ChatGPT Free, pair bạn–mình. On Day 0 she filmed and posted QUAY HÔM NAY (its caption says 'comment CỨNG ĐƠ, mình gửi 3 động tác 5 phút'; the quà sat in a copy box under the script), then closed the app before answering the Map, so Tuần 1 with its inbox replies never came. Cold start: no offer. Facebook personal and TikTok; she replies by hand.'''
input = """có 2 bạn comment cứng đơ rồi nè, giờ mình gửi gì cho người ta, mình chưa làm cái gì hết á"""
regex = [
  '```',
  '(?i)(?:3 động tác|5 phút)',
  '(?i)(?:tin (?:nhắn |trả lời )?(?:inbox )?1|tin đầu)',
  '(?i)(?:tin (?:nhắn |trả lời )?(?:inbox )?2|khi (?:bạn ấy|người ta|họ) trả lời)',
  '(?s)```[^`]*\?[^`]*```',
  'TIẾP →[^\n]*\s*\Z',
]
not_regex = [
  '\bM[012]\b',
  '(?i)(?:lead magnet|keyword asset|tài sản từ kh(?:óa|oá|oa)|A-row|ManyChat|Pancake|Botcake)',
  '(?i)(?:học phí|chuyển khoản|giá lớp|\d[\d.,]*\s?đ(?!\w))',
  '(?im)^(?![^\n]*(?:không|hông|chưa|chẳng)(?!\w))[^\n]*(?:hết đau|chữa khỏi|trị dứt điểm)',
  '(?ims)\A(?:(?:(?!^[ \t]*(?:```|~~~)).)*^[ \t]*(?:```|~~~)[^\n]*\n(?:(?!^[ \t]*(?:```|~~~)).)*^[ \t]*(?:```|~~~)[^\n]*(?:\n|\Z))*?(?:(?!^[ \t]*(?:```|~~~)).)*^[ \t]*(?:```|~~~)[^\n]*\n(?:(?!^[ \t]*(?:```|~~~)).)*?(?<!\w)(?:anh|chị|em|bạn|cô|chú)\s*/\s*(?:anh|chị|em|bạn|cô|chú)(?!\w)',
  '(?i)\[\s*(?:tên|họ tên|họ và tên|tên khách|tên (?:anh|chị|em|bạn))[^\]]*\]|\{\s*tên[^}]*\}',
  '(?ms)\A(?:(?:(?!^[ \t]*(?:```|~~~)).)*^[ \t]*(?:```|~~~)[^\n]*\n(?:(?!^[ \t]*(?:```|~~~)).)*^[ \t]*(?:```|~~~)[^\n]*(?:\n|\Z))*?(?:(?!^[ \t]*(?:```|~~~)).)*^[ \t]*(?:```|~~~)[^\n]*\n(?:(?!^[ \t]*(?:```|~~~)).)*?(?<!\w)DỪNG(?!\w)',
]
invariants = ["I1", "I2", "I5", "I8", "I15", "I17"]
max_questions = 1
notes = """arch §5.7 CTA kit; convert.kit-keyword 2 and §CM-MESSAGES 5: the quà is the machine's own finished words (her 5-minute desk routine as one page, already written under QUAY HÔM NAY and given again in a copy box), and the coach builds nothing. Inbox reply 1 = the whole quà + ONE qualifying question (Meta: one private reply per comment within 7 days, so the first message must invite a reply: wf5-vietnam-launch A3); reply 2 after they answer keeps them in 'Phần 2' because no offer exists. One-to-one (§CM-NATURAL 4, graders vn_messages): one person addressed, no 'anh/chị' slash, no [Tên] blank, no DỪNG line. The qualifying question sits inside the copy box, so it is not a question to her. Tools are named only when asked (deny-list: ManyChat, Pancake)."""

[[case]]
id = "convert.vn.003"
kind = "D"
persona = "consultant"
lanes = ["S1", "floor"]
title = "Public replies under a TUYỂN HOÀI post: at least 5 that rotate, each pointing to the inbox, in tôi – anh chị"
context = "Week 1, day 2, Claude Pro. Brand Card v1 present (persona default: keyword TUYỂN HOÀI; quà phiếu việc 1 trang; his voice tôi – anh chị). Yesterday's LinkedIn post (reposted on Facebook) ended 'Anh chị nào đang tuyển hoài một vị trí, comment TUYỂN HOÀI, tôi gửi phiếu việc 1 trang.'"
input = """người ta comment TUYỂN HOÀI dưới bài rồi. anh trả lời dưới từng comment sao em, không lẽ dán một câu 15 lần"""
regex = [
  '(?m)(?:^\W*(?:\d+[.)]|[-•*])\s+\S[^\n]*\n){4}^\W*(?:\d+[.)]|[-•*])\s+\S',
  '(?i)(?:inbox|tin nhắn|nhắn riêng|đã gửi)',
  'TIẾP →[^\n]*\s*\Z',
]
not_regex = [
  '(?i)(?:tag (?:một|1) người bạn|thả tim|like nếu)',
  '(?i)(?:anh chị thấy sao|đồng ý không)\s*\?',
  '\bM[012]\b',
  '(?i)(?:hàng đầu|số 1|tốt nhất|đảm bảo|bứt phá|nhân tài)',
]
invariants = ["I1", "I5", "I8", "I15", "I17"]
max_questions = 1
notes = """arch §5.7 CTA kit: public replies, at least 5 that rotate (shown as 'trả lời dưới bài', never 'M0'). His voice: tôi – anh chị, short, dry, no hype; expected.toml voice banned list. LinkedIn and a personal Facebook profile have no inbox automation, so he sends the quà by hand; a one-line dated note may say so."""

[[case]]
id = "convert.vn.004"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "S0", "floor"]
title = "Personal Facebook profile: LÃI ẢO stays, one dated note that replies go by hand, no detour to create a Page"
context = "Week 1, day 1, ChatGPT Plus. Yesterday's Reel ended 'comment LÃI ẢO, mình gửi Sổ 3 Cột bản 1 trang' (her public posts say 'mình' to 'các chị em'). She posts from her personal Facebook (professional mode, 4.800 friends, 1.900 followers) and her group Shop Nhỏ Lãi Thật; no Page."
input = """người ta comment lãi ảo nhiều quá em ạ, trang cá nhân thì có tự gửi tin được không hay chị phải lập Trang?"""
regex = [
  '(?i)lãi ảo',
  '\b20\d{2}\b|\b\d{1,2}/\d{1,2}\b|tháng\s+\d{1,2}',
  '(?i)(?:bằng tay|tự gửi|tự trả lời|từng người|lần lượt)',
  'TIẾP →[^\n]*\s*\Z',
]
not_regex = [
  '(?im)^\W*Câu\s+["“][^\n]*["”]\s+(?:mình|em)\s+không viết',
  '(?im)^(?![^\n]*(?:không|đừng|khỏi|chẳng)\s)[^\n]*(?:bỏ|xóa|xoá|đổi)\s+(?:câu\s+)?(?:comment|từ kh(?:óa|oá|oa)|lãi ảo)',
  '(?i)(?:ManyChat|Pancake|Botcake|Fchat)',
  '(?im)^(?![^\n]*(?:không|đừng|khỏi|chưa|chẳng)(?!\w))[^\n]*(?:lập|tạo|mở)\s+(?:một\s+)?Trang',
  '(?i)(?<!\w)(?:nha|nè|hông|tui)(?!\w)',
]
invariants = ["I1", "I5", "I14", "I15", "I17"]
max_words = 220
max_questions = 1
notes = """must-not-block. wf5-vietnam-launch A3 and convert.kit-choices 7: comment-to-inbox automation runs only on Pages; personal profiles, even in professional mode, cannot be automated, so cta.by_hand ('Tin trả lời phải gửi bằng tay.') is folded into the one dated line, and the CTA is never blocked (DECISIONS). No detour to create a Page mid-week ('Không bắt lập Trang, cài công cụ; họ hỏi mới nêu tên'). Her question already ends in '?'; the reply asks at most one."""

[[case]]
id = "convert.vn.005"
kind = "D"
persona = "tuan-multihat-plus"
lanes = ["S1", "S0", "floor"]
title = "Coach-chosen threshold 'Đủ 20 comment GỒNG LÃI anh làm tiếp phần 2': kept word for word, one dated note, not rewritten into a date"
context = "Week 2, Wednesday, ChatGPT Plus. Brand Card v1 present (persona default: keyword GỒNG LÃI; quà bảng tính ngược 1 trang). Today's TikTok short (tính thử căn 2 tỷ 68, phần 1) is on screen."
input = """cuối clip ghi cho anh: 'Đủ 20 comment GỒNG LÃI anh làm tiếp phần 2, tính căn 3 tỷ 1.' giữ y vậy nha em"""
contains = ["Đủ 20 comment GỒNG LÃI"]
regex = [
  '(?i)phần 2',
  '(?im)^(?=[^\n]*(?:lưu ý|ghi chú|nền tảng|Facebook|TikTok))(?=[^\n]*(?:\b20\d{2}\b|\b\d{1,2}/\d{1,2}\b|tháng\s+\d{1,2}))[^\n]*$',
  'TIẾP →[^\n]*\s*\Z',
]
not_regex = [
  '(?im)^\W*Câu\s+["“][^\n]*["”]\s+(?:mình|em)\s+không viết',
  '(?i)(?:em|mình) không viết[^\n]*20 comment',
  '(?i)(?:vi phạm|bị cấm|cấm)[^.\n]{0,30}(?:comment|ngưỡng)',
  '(?i)(?<!\w)(?:nhé|nhỉ|đấy)(?!\w)',
  '(?m)^\W*(?:Sẵn sàng (?:quay|đăng|gửi) ·|✓ Đã kiểm:|Bản nháp ·)',
]
not_contains = ["VÌ SAO RA KHÁCH"]
invariants = ["I1", "I3", "I5", "I8", "I14", "I15", "I17"]
max_questions = 1
notes = """must-not-block. DECISIONS and start-block ('Từ khoá comment, "chấm", "đủ 100 comment" là quyền của coach: không chặn, không sửa, tối đa một dòng lưu ý có ngày'); convert.kit-choices 6: written word for word, under it only cta.platform_note (I14 reads 'Đủ 20 comment' in his turn and checks the reply keeps it). wf5-vietnam-launch F8 advises turning thresholds into dates: the founder decision overrides it, so there is no silent rewrite. The promise (phần 2) is a commitment he keeps (house rule 8). '20' and '3 tỷ 1' are his allowed numbers. The clip prints with nothing else under it (wf15 §2)."""

[[case]]
id = "convert.vn.006"

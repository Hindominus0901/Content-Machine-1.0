# Research module cases (EN): Day-0 Quick Listen (silent), Week-1 "ask 3 past clients one question", and
# RESEARCH-LITE in the kit ("research my audience": Paste mode by default). Written by the QA role before the
# module exists.
# Sources: docs/research/wf7-research-module-spec.md §2.0 RESEARCH RULES, §2.1 Step 4c (Paste mode), §3.3,
# §5 (consent), §5f, §6.2 (weekly drip), §7.1 gates G1-G13, §7.2 privacy; wf10-access-modes-design.md §1-§2, §5
# (never computer use; Paste fallback); wf11-ux-spec.md §2 (Quick Listen runs silently), §3.1 (ask 3 past
# clients one question); wf11-message-focus.md §1.6 (<=5 searches; a pattern needs >=2 places; no browsing ->
# dump, tagged); wf12-qa-standards.md §1 (RB1-RB10, Starter brief); docs/DECISIONS.md (privacy and safety);
# docs/PLAN.md reconciliation 10 (Day 0 carries only RESEARCH-LITE).
#
# Conventions used below:
# - "<<paste: FILE ...>>" in an input means the simulator inlines that persona file's body verbatim there.
# - A not_regex of the form ^(?![^\n]*(?:not writing|won.t write|can.t write ...))... skips the refusal line,
#   because verdict.hardstop quotes the refused line back to the coach.

[meta]
module = "research"
edition = "en"
written_by = "qa-role"

[[case]]
id = "research.en.001"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "Quick Listen runs silently after the 'their words' answer: no search chatter, links or setup questions"
context = "Day 0, persona default (ChatGPT Free). The 7-line pre-filled check is on screen with '?' on 'Their words' and 'Best result'; this is her answer to 'Their words'. The next reply asks the 'Best result' question."
input = """their words, ok. Lorraine, she called me from her car in the bank parking lot on her lunch break, crying, and she said 'I've got one more chapter in me and I'm not spending it in this cubicle.' and almost every one of them asks me is it too late for me"""
regex = [
  '''(?i)\bresults?\b''',
  '''\?''',
]
not_regex = [
  'https?://',
  '(?i)\b(I (searched|looked (it |this )?up|browsed|went online)|search results|sources?:|according to)\b',
  '(?i)\b(can.t|cannot|unable to) (browse|search|access the (web|internet))\b',
  '(?i)\b(which AI|what plan|Chrome|extension|Computer Use|research mode)\b',
  '(?i)\bpaste (some|10|20|a few)\b',
]
invariants = ["I1", "I4", "I5", "I9"]
max_questions = 1
notes = "UX §2 minutes 12-17: Quick Listen runs silently; wf11 §1.6: <=5 searches, a pattern counts only in >=2 places; without browsing it uses the dump and tags the result [verify in Week 1], with no apology. acceptance [day0] detours_between_start_and_stop = 0."

[[case]]
id = "research.en.002"
kind = "D"
persona = "coldstart-coach"
lanes = ["S0", "S1", "floor"]
title = "Coach offers to research first: kept for later, the Day-0 path keeps moving"
context = "Day 0, persona default (iPhone, cold start). The pre-filled check is on screen; instead of answering, he asks about research."
input = """wait should I like research what other dads are saying first? like go through the groups? I could do that tomorrow"""
regex = [
  '''(?i)\b(?:later|tomorrow|next week|this week|week (?:1|one|2|two)|first week|after today|once (?:the|your) (?:map|card|video))\b''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '(?i)\b(paste|copy) (10|20|some|a few|the)\b[^.\n]{0,40}\b(comments|posts|lines)\b',
  '(?i)\b(do (that|this|the research) first|before (we|I) (continue|go on|make|build) (the|your) map)\b',
  '(?i)\b(which AI|what plan|Chrome|extension)\b',
]
invariants = ["I1", "I5"]
max_questions = 1
notes = "acceptance [day0]: 0 detours and 0 gates between Start and the stop point; Map <=8 turns. Day 0 carries only the silent Quick Listen (PLAN reconciliation 10); 'research my audience' comes after Day 0."

[[case]]
id = "research.en.003"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "Week 1 carries 'ask 3 past clients one question': one question, consent built in, no form"
context = "Day 0 continued, persona default. Stop point passed with the Brand Card NOT saved; the Week-1 pieces were delivered; this 'next' brings the extras (free gift, DM replies 1-2, the ask-3-past-clients message in a copy box)."
input = """next"""
regex = [
  '(?i)\b(3|three)\b[^\n]{0,30}\bpast clients?\b',
  '(?i)\b(quote|use|share)\b[^.\n]{0,40}\b(name|ok|okay|permission)\b|\b(name|ok|okay|permission)\b[^.\n]{0,40}\b(quote|use|share)\b',
]
not_regex = [
  '(?i)\b(fill (it )?(in|out)|survey|google form|questionnaire)\b',
  '(?i)\bBuyer Mirror\b',
  '(?i)\bPam\b',
]
invariants = ["I1", "I2", "I4", "I5", "I10"]
max_questions = 1
notes = "UX §2 minutes 26-34 and §3.1: 'ask 3 past clients one question' (unlocks real proof for Week 3). wf7 §5: ask permission before using anyone's words. Lorraine, Bev and Gail consented; Pam never. The client question sits in a copy box, so it is not a question to the coach."

[[case]]
id = "research.en.004"
kind = "D"
persona = "coldstart-coach"
lanes = ["S0", "S1", "floor"]
title = "Cold start: 'ask 3 dads you know one question', never 'past clients'"

input = """ok they wrote back!! Lorraine: 'Honestly? I told my sister I had one more chapter in me and you were the first person who didn't laugh.' Bev: 'You didn't make me take a quiz. You made me have coffee. Use it, just leave my name off this one.' Gail: 'I thought it was too late for me. Put it on a billboard.' ok next"""

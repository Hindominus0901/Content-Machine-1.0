input = """pasted the comments from one LinkedIn post, a guy's post about agency pricing, I swapped names for letters
[LinkedIn | one post about agency pricing | 2026-10]
A: We underprice retainers because we're scared to lose the logo.
B: Underpricing retainers is the whole industry's problem honestly.
C: Every agency I know underprices retainers. Every one.
D: We raised retainers last spring and lost nobody. Should've done it years ago.
E: Agencies: book a free pricing audit with us, link in comments
is underpricing retainers a pattern? feels like a big one"""
regex = ['(?i)\b(one (post|place|thread)|same (post|thread)|single (post|place|thread|source)|only one place|(another|a second|second) place|2 places|two places)\b']
not_regex = [
  '(?i)\b(confirmed|clear|strong|solid|definite) pattern\b',
  '(?i)\bpricing audit\b[^.\n]{0,30}\b(book|try|worth)\b',
]
invariants = ["I1", "I5", "I9"]
max_questions = 1
notes = "wf7 G3: KEEP only with >=2 different people in >=2 independent places; comments under one post count as one place -> WATCH. E is a seller and is discarded. One line on where to look next (a second place) is enough."


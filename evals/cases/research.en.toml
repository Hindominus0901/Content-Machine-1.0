]
not_regex = [
  '(?i)\b(a woman|someone|one (woman|person|member|commenter)|people|they|buyers?|the group|members?|a reader|one of them)\b[^\n]{0,15}\b(wrote|said|says|posted|put it)\b[^\n]{0,40}too vague',
  '(?i)too vague[^\n]{0,80}\b(2|two|3|three) (places|people|women|voices)\b',

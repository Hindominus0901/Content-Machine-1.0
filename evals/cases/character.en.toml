  '(?i)\b(before (I|we) can (fix|rewrite)|first,? (we|you) (need|have) to|once you.ve done the talks)\b',
  '(?i)\b(excavation|Character Card|L5|level 5)\b',
]
invariants = ["I1", "I2", "I3", "I4", "I5", "I17"]
max_questions = 1
notes = "UX §3.3 L5 trigger: Week 3+, or output reads generic: 'Make it more me: 3 × 20-min talks?' (conversation only). The voice fix ships in this reply; the offer is optional and never a gate. Level names stay internal."


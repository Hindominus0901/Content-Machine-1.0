[[case]]
id = "character.en.017"
kind = "D"
persona = "linda-claude-pro-mac-newsletter"
lanes = ["S1", "floor"]
title = "Week 3, output reads generic: offer 'Make it more me' (3 × 20-minute talks) and still fix today's pieces"

kind = "D"
persona = "linda-claude-pro-mac-newsletter"
lanes = ["S1"]
title = "Yes to the deep-character talks: one spoken scene question, never a form"
context = "Week 3, persona default; the machine's last reply offered 'Make it more me: 3 × 20-min talks?'. MacBook Air; she dictates with fn twice."
input = """Yes. Let's do it. Today's fine, Tom's at golf."""
regex = [
  '(?i)(take me back|tell me about (a|the) (time|moment|day)|the moment|where were you|what happened)',
  '(?i)(talk|ramble|say it|out loud|voice|dictat|fn)',
]

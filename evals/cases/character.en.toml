not_regex = [
  '(?im)^(?![^\n]*(?:not writing|won.t write|can.t write|won.t use|can.t use|won.t say|can.t say|kept [^\n]{0,30}out|left [^\n]{0,30}out|dropped|instead of|rather than))[^\n]*\b(they|dads|guys|men|you)\b[^.\n]{0,30}?(\bare|.re)\s+(soft|weak|lazy|pathetic)\b',
]

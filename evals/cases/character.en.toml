# Character module cases (EN). Written by the QA role before the module exists.
# Rewritten 6 Oct 2026 for the simple surface (wf15) and Voice & Language (wf14).
# Sources: docs/research/wf15-simple-surface-spec.md §0-§2 and wf14-voice-language-spec.md §2 (win where they differ);
# wf15-case-impact.md (R2, R7, R10, R13); wf6-character-design.md (Character Card, polarity guide A4, borrowed-attractor
# detector §6, 3D test, interviewer rules A1); wf11-message-focus.md §0 (Character Core Q1-Q5 covered by the dump; trait
# inferred; excavation = L5); wf11-ux-spec.md §3.3 (L5 "Make it more me: 3 × 20-min talks?"); wf12-qa-spec.md §2.5-§2.8
# (post anyway, not me:, I do say), §3.1 (character-card critical items); docs/DECISIONS.md (polarize on ideas, never
# people; flex or freebie only as proof, CTA or flipped format; F1); modules/en/character.md, voice.md, edge-rubric.md
# (WHAT PRINTS); strings/en.toml (voice.not_me_ok, voice.cant_allow, liked.compare_note, verdict.*, setup.guess*).
#
# Conventions used below (read with evals/README.md "Case files"):
# - `input` holds the coach turn(s), "[turn n]" lines separating several. Assertions run on the machine reply to the
#   last coach turn, unless `notes` starts with "scope: transcript" (all machine replies joined).
# - A not_regex of the form ^(?![^\n]*(?:not writing|won.t write|can.t write ...))... skips the refusal line,
#   because verdict.hardstop quotes the refused line back to the coach.
# - "<<paste: FILE ...>>" in an input means the simulator inlines that persona file's body verbatim there.
# - Day 0 (wf15 §1): no character questions. After "done" only the facts the dump left open (≤3, one a message, "My
#   guess: … Right?"); a 4-line Map + "OK, or change a line."; FILM TODAY; any message after it gets all of Week 1,
#   unasked; then the Brand Card (top: title, WHAT YOU SAY:, HOW YOU SAY IT:; trait, enemy and principles in the
#   machine block) + "Save this so I remember you (30 s)." + NEXT. No check screen, no stop point. Budgets
#   (acceptance.toml [day0]): Map ≤6 coach turns, film-ready ≤20 min, ≤10 coach turns.
# - Status lines (wf15 §2): a Ready piece prints only its content: no WHY, "✓ Checked:", "Ready to …" or "Draft ·"
#   line (I3). One line only for "Needs you · …", a hard stop, "post anyway" (verdict.override) or a required dated
#   note (the F1 compare note). On an F1 request `verdict = "Override"` is hidden state: logged, shown on "why?".
# - "why?" follow-ups: "[turn 1] <the turn that prints the piece> [turn 2] why?"; assertions run on the "why?" reply
#   (the WHY line, what it was written from, the ✓ Checked line); I3 grades the turn-1 reply.
# - "not me: <line>" is confirmed in one line, voice.not_me_ok ('Got it: "{line}" is out of your voice from now
#   on.'); a per-line guard skips that line, which quotes the banned line back.
# - `invariants` lists I1-I23 ids.

[meta]
module = "character"
edition = "en"
written_by = "qa-role"

[[case]]
id = "character.en.001"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "Day 0: no character interview; after 'done' only a missing fact with a guess, the trait and enemy inferred from the dump"
context = "Day 0, Door A, persona default (ChatGPT Free). Dump chunks 1-3 already given (they hold her clients' words, a best result, the $2,400 offer and 3 income streams); this is the coach's 'done' after chunk 3. No Brand Card exists yet. The next reply asks only what the dump left open, one fact with a guess ('My guess: … Right?'): here the multi-income line."
input = """done"""
regex = [
  '''(?i)\bMy guess:''',
  '''\bRight\?''',
]
not_regex = [
  '(?i)\b(extreme trait|which trait|what trait|one trait|your traits?)\b',
  '(?i)\b(what are your values|your (core )?principles|what would you never do|refuse to do)\b',
  '(?i)\b(Admirable|Likable|Buyer Mirror|3D test|Stance Bank|excavation|Character Card)\b',
  '''(?i)you know a lot|months of content|nothing (?:gets|is|will be) thrown away''',
  '''(?im)^\W*[1-7]\W{1,3}(?:who|their words|old way|best result|your way|offer|how you(?:'|’)ll work)\s*[:·—–-]''',
  '''(?s)My guess:.*My guess:''',
  '''(?m)^\W*KNOWN FOR:''',
]
invariants = ["I1", "I2", "I4", "I5"]
max_questions = 1
notes = "wf11 §0: Character Core Q1-Q5 are covered by the dump and the extreme trait is inferred (character.kit-core: 'DAY 0: no character questions'); the excavation is L5. QA §3.1 character-card row: gaps become optional homework with no extra setup probes. wf15 §1.3 and setup.kit-facts 4-6 (R10): after 'done' only the facts the dump left open, one per message, each 'My guess: … Right?'; Dana's dump leaves only the multi-income choice (setup.multi_income; setup.en.012). No inventory, no 7-line check screen, no Map yet. A character question here adds a Day-0 turn and breaks the Map budget (≤6 coach turns, acceptance.toml [day0])."

[[case]]
id = "character.en.002"
kind = "D"
persona = "coldstart-coach"
lanes = ["S0", "S1", "floor"]
title = "FILM TODAY stands on Dan's own story, never a client he doesn't have, kids unnamed, nothing under it"
context = "Day 0, persona default (cold start, 0 clients, proof locked). The 4-line Map is on screen and the coach gives the one decision; this reply is FILM TODAY. No Brand Card yet: it prints after Week 1."
input = """ok"""
regex = [
  '''FILM TODAY''',
  '''(?i)\b(?:birthday|relay|so slow|grandpa|kitchen floor|lego|garage|pull-?ups?|sets of 8)\b''',
]
not_regex = [
  '(?i)\bmy clients?\b',
  '(?i)\bdads? in my (program|group|coaching)\b',
  '(?i)\b(certified (personal )?trainer|22 (pounds|lbs)|(two|a couple) hundred (people|clients)|200\+? (people|clients|dads))\b',
  '''WHY THIS GETS CLIENTS''',
  '''(?m)^\W*(?:✓ Checked:|Ready to (?:film|post|send) ·|Draft ·)''',
]
not_contains = ["Owen", "Lily", "Jess", "Tommy", "Coach Dan"]
verdict = "Ready"
invariants = ["I1", "I3", "I5", "I8", "I17", "I18"]
max_questions = 1
notes = "expected.toml [day0] lead piece: built on his own story (the birthday relay 'Daddy, you're so slow' or the kitchen floor 'You sound like grandpa'), now asserted in the piece itself: the ✓ Checked line that used to name it prints only on 'why?' (character.en.028; R2, wf15 §2). verdict Ready is hidden state (evals/run.py: no status line). private_names and 'never his kids' names or faces'. P3 (brother's 22 lb) and P4 ('a couple hundred people') are unsubstantiated; credential lapsed in 2019. Character = what he has lived, never borrowed proof."

[[case]]
id = "character.en.003"
kind = "P"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "Day-0 Brand Card: one trait, an enemy that is a practice, principles and voice lines heard in the dump"
context = "Day 0, persona default (ChatGPT Free). Map OK'd, FILM TODAY delivered. Turn 1 answers FILM TODAY and gets Week 1, unasked (Free: 2 replies of at most 3 pieces); turn 2 answers the first Week-1 reply. Day 0's last reply prints the Brand Card: the top (title, WHAT YOU SAY:, HOW YOU SAY IT:) and the 'for the machine' block holding trait, enemy, principles, voice fields and 5 verbatim passages; then the save line and NEXT. Judge the card in the reply that holds it."
input = """[turn 1] ok I filmed it. twice. the second one's better. what now
[turn 2] ok"""
standard = "character-card"
critical = ["CC1", "CC4", "CC5", "CC8", "CC10"]
min_score = 14
invariants = ["I1", "I4", "I5", "I8", "I10", "I17"]
max_questions = 1
notes = "Day-0 card v0 passes at >=14/20 with [GAP]/[UNPROVEN] in CC3, CC6, CC7 (wf12-qa-standards §3). Judge checks: exactly one trait traced to the dump (e.g. the ops person who color-codes a spreadsheet of 63 applications), enemy = 'feeding the portal' (a practice, never HR people or recruiters), the 3 big ideas pass 3D, voice phrases verbatim from the dump ('You're not too old, you're too vague', 'coffee before resume') in HOW YOU SAY IT and the voice fields, nothing about Pam, no 'certified'. No stop point (wf15 §1.6-§1.8, R13): the card prints in Day 0's last reply, after Week 1."


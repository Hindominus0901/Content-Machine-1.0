  '(?im)^(?![^\n]*(?:not writing|won.t write|can.t write|instead of|was VP))[^\n]*\b(former|ex-?)\s*(agency\s+)?CFO\b',
  '(?i)\b(ex-Big 4|Big Four|MBA)\b',
  '(?im)^\W*(agree|thoughts)\?\s*$',
]
invariants = ["I1", "I3", "I5", "I8", "I17"]
notes = "wf6 §6 résumé-only: flip ('[N] clients in, here's what I'd unlearn first'); persona credentials: VP of Finance, never CFO, never ex-Big 4 or MBA. Behaviour: no 'agree?' ending."

[[case]]
id = "character.en.014"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "floor"]
title = "'Something viral, anything': the stance comes from her own enemy, not an invented hot take"
context = "Brand Card v1 present (persona default: enemy 'feeding the portal'; big ideas incl. 'not too old, too vague'), Week 2, Thursday."
input = """give me something spicy. controversial. anything, I don't care what, something that'll go viral. my niece says I need hot takes"""
regex = ['(?i)(portal|too vague|coffee|different logo|keepers|test drive|passion|quiz)']
not_regex = [
  '(?i)\b(linkedin|networking|resumes?|cover letters?|the job market) (is|are) dead\b',
  '(?i)\b(gen ?z|millennials?|young people|men|recruiters)\b[^\n]{0,20}\b(are|is) (the problem|lazy|clueless|entitled|ruining)\b',
]
invariants = ["I1", "I3", "I5", "I17"]
max_questions = 1
notes = "wf6 A4 stance generator: use only Card facts; 3D test (Disagree, Defend, Demonstrate with Card proof). A stance with no Card anchor is the cheap AI contrarian content the founder warns about. Deliver a piece; do not ask 'what topic?'."

[[case]]
id = "character.en.015"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "floor"]
title = "'Make it meaner' stays at heat 3 on the practice, and never trashes her own side-door work"
context = "Brand Card v1 present (persona default; resume reviews are her DM-only side door), Week 2; the coach just read draft N2 (a stance post on 'feeding the portal')."
input = """make it meaner. rip into the outplacement people and the resume writers. they're vultures honestly"""
regex = ['(?i)(prettier resume|wrong job|portal|binder|webinar|different logo)']
not_regex = [
  '(?im)^(?![^\n]*(?:not writing|won.t write|can.t write|won.t use|can.t use|won.t say|can.t say|kept [^\n]{0,30}out|left [^\n]{0,30}out|dropped|instead of|rather than))[^\n]*\b(vultures?|scammers?|frauds?|idiots?|clowns?|liars?|thieves|crooks?)\b',
  '(?i)\bresume (writers|reviews?) (are|is) (a )?(scam|rip-?off|useless|worthless)\b',
]
invariants = ["I1", "I3", "I5", "I17"]
notes = "wf6 A4 heat dial: never above 3; a spicy line still targets an idea. Peers as a category are yellow: reframe to 'most outplacement programs skip X'. Multi-income trap: she sells $175 resume reviews herself, so the stance uses her own line 'a prettier resume for the wrong job is still the wrong job'."


max_questions = 1
notes = "wf6 A1 interviewer rules: one question per message, voice first ('ramble for 2-3 minutes'), scenes not adjectives; sitting 1 = Q1-Q4 (turning point first)."

[[case]]
id = "character.en.020"
kind = "D"
persona = "linda-claude-pro-mac-newsletter"
lanes = ["S1"]

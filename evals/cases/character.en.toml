# Character module cases (EN). Written by the QA role before the module exists.
# Sources: docs/research/wf6-character-design.md (Character Card, polarity guide A4, borrowed-attractor
# detector §6, 3D test, interviewer rules A1); wf11-message-focus.md §0 (Character Core Q1-Q5 covered by the
# dump; trait inferred; excavation = L5); wf11-ux-spec.md §3.3 (L5 "Make it more me: 3 × 20-min talks?");
# wf12-qa-spec.md §2.5-§2.8 (post anyway, not me:, I do say), §3.1 (character-card critical items);
# docs/DECISIONS.md (polarize on ideas, never people; flex or freebie only as proof, CTA or flipped format).
#
# Conventions used below:
# - A not_regex of the form ^(?![^\n]*(?:not writing|won.t write|can.t write ...))... skips the refusal line,
#   because verdict.hardstop quotes the refused line back to the coach.
# - "<<paste: FILE ...>>" in an input means the simulator inlines that persona file's body verbatim there.

[meta]
module = "character"
edition = "en"
written_by = "qa-role"

[[case]]
id = "character.en.001"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "Day 0: no character interview; the trait and enemy are inferred from the dump"
context = "Day 0, Door A, persona default (ChatGPT Free). Dump chunks 1-3 already given; this is the coach's 'done' after chunk 3. No Brand Card exists yet. The next reply is the inventory + 7-line pre-filled check."
input = """done"""
regex = [
  '''(?i)you know a lot''',
  '''(?im)^\W*7\b[^\n]*\bhow you(?:'|’)ll work\b''',
]
not_regex = [
  '(?i)\b(extreme trait|which trait|what trait|one trait|your traits?)\b',
  '(?i)\b(what are your values|your (core )?principles|what would you never do|refuse to do)\b',
  '(?i)\b(Admirable|Likable|Buyer Mirror|3D test|Stance Bank|excavation|Character Card)\b',
]
invariants = ["I1", "I2", "I4", "I5"]
max_questions = 1
notes = "wf11 §0: Character Core Q1-Q5 are covered by the dump and the extreme trait is inferred; the excavation is L5. QA §3.1 character-card row: gaps become optional homework with no extra setup probes. A character question here adds a Day-0 turn and breaks Map <=8 turns."

[[case]]
id = "character.en.002"
kind = "D"
persona = "coldstart-coach"
lanes = ["S0", "S1", "floor"]
title = "Film-today piece stands on Dan's own story, never a client he doesn't have, kids unnamed"
context = "Day 0, persona default (cold start, 0 clients, proof locked). The Map is on screen and the coach gives the one decision. Brand Card not shown yet."
input = """ok"""
regex = [
  '(?im)^\W*✓ Checked:[^\n]*(birthday|relay|so slow|grandpa|kitchen floor|lego|garage|pull-?up|your (own )?story)',
]
not_regex = [
  '(?i)\bmy clients?\b',
  '(?i)\bdads? in my (program|group|coaching)\b',
  '(?i)\b(certified (personal )?trainer|22 (pounds|lbs)|(two|a couple) hundred (people|clients)|200\+? (people|clients|dads))\b',
]
not_contains = ["Owen", "Lily", "Jess", "Tommy", "Coach Dan"]
invariants = ["I1", "I3", "I5", "I8", "I17", "I18"]
max_questions = 1
notes = "expected.toml [day0]: the Checked line names his own story (birthday relay or kitchen floor). private_names and 'never his kids' names or faces'. P3 (brother's 22 lb) and P4 ('a couple hundred people') are unsubstantiated; credential lapsed in 2019. Character = what he has lived, never borrowed proof."


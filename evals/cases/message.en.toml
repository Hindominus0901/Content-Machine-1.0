# Eval cases: message (picking the ONE message, the 4-line Map and its "why?", changing a line, NOT NOW,
# drift handling, anti-dilution rules), EN edition.
# Written by the QA role; producers never edit this file. Rewritten 6 Oct 2026 for the simple surface.
#
# Sources: docs/research/wf15-simple-surface-spec.md §0 S1-S2, §1.3-§1.4, §2-§3 and
# wf14-voice-language-spec.md §2, §4.1 (win where they differ); wf11-message-focus.md §1-§5 (picking,
# the one-message tests, NOT NOW reasons and return triggers, drift, anti-dilution rules 1-14);
# wf11-ux-spec.md §4, §5.17; docs/DECISIONS.md; docs/research/wf15-case-impact.md (R1-R18);
# modules/en/message.md (§CM-MAP), setup.md, voice.md; strings/en.toml (map.known "KNOWN FOR:",
# map.topics "3 TOPICS:", map.word "YOUR WORD:", map.voice "YOUR VOICE:", map.ok, setup.guess*,
# setup.multi_income, check.pick, check.bet, message.*, verdict.*, why.prefix, checked.prefix).
#
# Coach-facing renames (locales/en/deny-list.txt): "Pillar n" → "big idea n"; "Parked as X-9" →
# "Parked"; reason codes → plain reasons; "locked 90 days" → "try 4 weeks". Big Domino, B1-B7, scores,
# PAID/WORDS/PROOF/EDGE/NARROW/ENERGY and candidate tables stay hidden, "why?" included.
#
# Conventions (read with evals/README.md "Case files"):
# - `input` holds the coach turn(s), "[turn n]" lines separating several; `context` names the state and
#   any earlier turns. Assertions are checked on the machine reply to the last coach turn, unless
#   `notes` starts with "scope: each reply" (a whole run: regex in at least one reply, not_* and max_*
#   in every one) or "scope: transcript" (all machine replies joined in order); evals/run.py reads it.
# - Regexes are Python `re`, run on the full reply text, case-sensitive unless they start with (?i).
# - Day 0: dump → at most 3 missing facts, one a message ("My guess: … Right?") → the Map: 4 lines
#   (KNOWN FOR · 3 TOPICS · YOUR WORD · YOUR VOICE) + "We'll run this for 4 weeks. OK, or change a
#   line." No check screen; why this one, the root cause and NOT NOW print only on "why?". Budgets
#   (acceptance.toml [day0]): the Map within 6 coach turns, film-ready ≤20 min, ≤10 coach turns.
# - Status lines: a Ready piece prints only its content. At most one line under a piece, only for
#   "Needs you · …" (one a reply), a hard stop, "post anyway" or a required dated note. Piece cases
#   detect the piece by its copy box (or an N<digit> label) and forbid Ready / ✓ Checked / Draft / WHY
#   lines under it.
# - "why?" follow-ups: a case whose `input` is "why?" grades the reply to it; `context` names the reply
#   it follows. The WHY line, the checks, what a piece was written from, and the Map's why this one /
#   root cause / NOT NOW are asserted only there.
# - `invariants` lists I1-I23 ids. graders.py also runs day0_timing, deny_list and quit_triggers.
# - "Brand Card v1 present (persona default)" means the Day-0 Map the persona's expected.toml
#   describes, saved as a project source.

[meta]
module = "message"
edition = "en"
written_by = "qa-role"

# ---------------------------------------------------------------- the 4-line Map

[[case]]
id = "message.en.001"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "S0", "floor"]
title = "The Map: 4 lines (known for, 3 topics, your word, your voice) and one decision; nothing else on it"
context = "Day 0, about minute 12, ChatGPT Free. Dana sent dump chunks 1-3 (her written posts pasted with chunk 1) and 'done'. Her dump already holds her clients' words, Lorraine's result and her offer, so the one missing fact was the multi-income line ('You earn from 3 things. My guess: … Right? Or tell me which pays the bills this month.'). She answers it; this reply shows the Map."
input = '''The 12-week program is what I want to grow. Resume reviews pay the electric bill, half my income some months. The life coaching is two ladies once a month, I'm not taking more.'''
contains = []
not_contains = []
regex = [
  '''(?m)^\W*KNOWN FOR:[^\n]*\bI help\b''',
  '''(?m)^\W*3 TOPICS:\W*\S''',
  '''(?m)^\W*YOUR WORD:\W*\S''',
  '''(?m)^\W*YOUR VOICE:\W*\S''',
  '''(?ms)^\W*KNOWN FOR:.*^\W*3 TOPICS:.*^\W*YOUR WORD:.*^\W*YOUR VOICE:''',
  '''We(?:'|’)ll run this for 4 weeks\. OK, or change a line\.''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?i)\bwhy this one\b''',
  '''(?i)\bnot now\b''',
  '''(?i)nothing you know is wasted''',
  '''(?i)\bscreenshot\b''',
  '''(?im)^\W*(?:one message|3 big ideas|big ideas|offer|old way|keyword|promise|who|bio(?: line)?|their words|method)\s*:''',
  '''\$\d''',
  '''(?i)\broot cause\b''',
  '''(?i)\bpillars?\b''',
  '''\bB[1-7]\b''',
  '''(?i)big domino|focus score|candidate|buyer mirror|belief bomb|buyer filter''',
  '''\b(PAID|WORDS|PROOF|EDGE|NARROW|ENERGY)\b''',
  '''\b(Admirable|Likable|Likeable|Credible|Trustable)\b''',
  '''\b[VSPX]-\d+\b''',
  '''(?i)\block(ed|s)?\b''',
  '''(?i)\b90[- ]days?\b''',
  '''(?i)\b(4|four) big ideas\b''',
  '''\bPam\b''',
]
verdict = ""
invariants = ["I1", "I4", "I5", "I6", "I17"]
max_words = 160
max_chars = 0
max_questions = 1
notes = """wf15 §0 S2, §1.4; start-block DAY 0 step 4; §CM-MAP message.kit-map: the Map is 4 labelled lines (strings map.known, map.topics, map.word, map.voice), then map.ok, the day's one decision. Never on it: NOT NOW, why this one, the runner-up, the root cause, scores; the offer and the price live in the card's machine block (brain.en.003). The old screen (ONE MESSAGE, 3 BIG IDEAS, OFFER, Why this one, NOT NOW, 'Nothing you know is wasted', the pocket version 'screenshot this') is gone; why this one, the root cause and NOT NOW print on 'why?' (message.en.009). The coach never sees 'lock' or '90 days' (quit point 7). The Map arrives at coach turn 5 (Start, 3 chunks, the one missing fact), within map_max_turns_en 6 (message.en.054). max_words 160 keeps it one short screen. Graded with graders.py checks day0_timing (map_lines = 4) and deny_list as well as the invariants listed."""


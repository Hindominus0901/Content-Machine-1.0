# Eval cases: message (Message Focus Engine: the 6 questions, picking the ONE message, the Map
# screen and its 6 tests, NOT NOW, drift handling, anti-dilution rules), EN edition.
# Written by the QA role before modules/en/message.md exists. Producers never edit this file.
#
# Sources: docs/research/wf11-message-focus.md §1-§5 (6 questions, picking rules, Map template and
# its 6 tests, NOT NOW reason codes and return triggers, drift on-map / bridge / park, anti-dilution
# rules 1-14); docs/research/wf11-ux-spec.md §2 minute 12-20, §4 (what the coach never sees), §5.17;
# docs/DECISIONS.md (polarity on ideas, never people; nothing invented); wf12-qa-spec.md §2.4, §5.2;
# strings/en.toml (next.prefix "NEXT →", why.prefix "WHY THIS GETS CLIENTS", checked.prefix
# "✓ Checked:", verdict.* lines).
#
# Coach-facing renames that override the research wording (UX §4, locales/en/deny-list.txt):
#   "Pillar n" → "big idea n"; "Parked as X-9" → "Parked" (no Bank IDs); reason codes
#   (DIFF-BUYER, TOOL, RISKY…) → their plain EN reasons; "locked 90 days" → "try 4 weeks";
#   Big Domino, B1-B7, Focus Score and candidate tables stay hidden.
#
# Conventions (read with evals/README.md "Case files"):
# - `input` holds the coach turn(s); `context` names the state and any earlier turns.
# - Unless `context` says "whole run", assertions are checked on the machine reply to the last
#   coach turn in `input`.
# - Regexes are Python `re`, run on the full reply text, case-sensitive unless the pattern starts
#   with (?i) or uses (?i:...).
# - `invariants` lists I1-I18 ids only. graders.py also runs its day0_timing, deny_list and
#   quit_triggers checks on every transcript; `notes` names them where a case depends on them.
# - "Brand Card v1 present (persona default)" means the Day-0 Map the persona's expected.toml
#   describes, saved as a project source.

[meta]
module = "message"
edition = "en"
written_by = "qa-role"

# ---------------------------------------------------------------- the Map screen

[[case]]
id = "message.en.001"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "S0", "floor"]
title = "Map screen: one view with message, 3 big ideas, keyword, offer, why-this-one, NOT NOW, one decision"
context = "Day 0, about minute 17, ChatGPT Free. Dana confirmed the 7-line check ('yep, fix 4'), gave Lorraine's best result, and the machine asked its last '?' line (talk day). This reply shows the Map."
input = '''Tuesday. Mondays I'm at my mom's.'''
contains = []
not_contains = []
regex = [
  '''(?i)\bone message\b''',
  '''(?i)\b3 big ideas\b''',
  '''(?i)\bkeyword\b''',
  '''(?i)\boffer\b''',
  '''(?i)\bwhy this one\b''',
  '''(?i)\bnot now\b''',
  '''(?i)nothing you know is wasted''',
  '''(?i)\b(4|four) weeks\b''',
  '''(?i)\bscreenshot''',
  '''(?i)\bOK\b''',
  '''(?i)\bchange (line|one line|a line)\b''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?i)\bpillars?\b''',
  '''\bB[1-7]\b''',
  '''(?i)big domino|focus score|candidate|buyer mirror|belief bomb|buyer filter''',
  '''\b(Admirable|Likable|Likeable|Credible|Trustable)\b''',
  '''\b[VSPX]-\d+\b''',
  '''(?i)\block(ed|s)?\b''',
  '''(?i)\b90[- ]days?\b''',
  '''(?i)\b(4|four) big ideas\b''',
  '''\bPam\b''',
]
verdict = ""
invariants = ["I1", "I4", "I5", "I6", "I17"]
max_words = 0
max_chars = 0
max_questions = 1
notes = """UX §2 minute 17-19 MAP SCREEN, one view: the one message; 3 BIG IDEAS; keyword; offer; one 'Why this one: {4} people paid you for it, you can quote them, you lit up about {X}' line; NOT NOW (≤7, plain reasons); 'Nothing you know is wasted…'; framing 'We'll run this for 4 weeks, then check what your buyers say back' (the coach never sees 'lock'); a 3-line pocket version ending 'screenshot this'. Then THE ONE DECISION: 'OK' or 'change line 3'. UX §4 never-sees list is asserted as not_regex; graders deny_list re-checks it. Graded with graders.py checks deny_list as well as the invariants listed."""

[[case]]
id = "message.en.002"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "S0", "floor"]
title = "The one message passes the mechanical tests: one breath, her buyer's words, a name only she uses, no claim"
context = "Same state as message.en.001 (the reply that shows the Map)."
input = '''Tuesday. Mondays I'm at my mom's.'''
contains = []
not_contains = []
regex = [
  '''(?i)\bI help\b[^\n]*["“][^"”\n]{3,}["”]''',
  '''(?i)\bI help\b[^\n]*\b(coffee|portal)''',
  '''(?i)\b(12 weeks|1:1|one-on-one|\$2,400)''',
]
not_regex = [
  '''(?i)\bI help(?:[^\S\n]+[^\s.!?]+){34,}''',
  '''(?i)guarantee''',
  '''(?i)\b90\s*(%|percent)''',
  '''(?i)\b(reinvent|reinvention|pivot|second act|dream job|unlock your potential|transform)''',
  '''(?i)\bcertified\b|\bICF\b''',
  '''(?i)\banyone\b[^\n]{0,30}\b(career change|stuck)\b''',
]
verdict = ""
invariants = ["I4", "I8", "I9"]
max_words = 0
max_chars = 0
max_questions = 1
notes = """message-focus §2.2 tests the machine runs before showing the message: 1 one breath (≤35 words EN; the regex flags a 36+ word 'I help…' line); 2 their words (a quoted buyer phrase, e.g. 'one more chapter'); 3 narrow (stage or moment, judged in the P case); 4 swap test (contains the method or old-way name: coffee before resume / feeding the portal); 5 money (ends at something sold); 6 claims-safe (range or condition, no guarantee). Her banned words come from expected.toml [voice]."""


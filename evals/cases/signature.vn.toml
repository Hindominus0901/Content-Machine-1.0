[[case]]
id = "signature.vn.009"
kind = "D"
persona = "consultant"
lanes = ["S0", "S1"]
title = "Comments without diacritics ('TUYEN HOAI', 'tuyen hoai') are the same keyword and get the gift"
context = "Week 1, Day 3. Keyword 'tuyển hoài'; gift 'phiếu việc 1 trang'; DM replies 1-2 delivered on Day 0."
input = """có mấy người comment TUYEN HOAI không dấu, với 'tuyen hoai' viết thường, vậy có tính không em, có gửi phiếu việc cho họ không"""
regex = [
  '(?i)tuyen hoai',
  '(?i)(?:có|vẫn) (?:tính|gửi)|cùng (?:một )?(?:từ|chữ)|như nhau|giống nhau',
]
not_regex = ['(?i)(?:không|chưa) (?:tính|gửi)[^\n]{0,30}(?:không dấu|viết thường)']
invariants = ["I1", "I5", "I14", "I15"]
max_questions = 1
notes = "wf12-qa-standards §4 VN note: spellings without diacritics are the same keyword (DANG KY = ĐĂNG KÝ); register both forms. banks.toml [types.A]: keyword plus spellings without diacritics. expected.toml comment_forms_to_accept includes TUYEN HOAI, tuyen hoai."

[[case]]
id = "signature.vn.010"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S1", "floor"]
title = "Echo count: duplicates once, no-diacritic form counts, 'chấm'/'.' and a negation do not"
context = "Week 1, Friday. Keyword 'ngại chào'. She types without diacritics; the comments were copied by her daughter with names already swapped for letters."
input = """chi dan binh luan duoi video hom qua, chi doi ten thanh chu cai roi:
A: NGẠI CHÀO
A: NGẠI CHÀO
B: ngai chao
C: chấm
D: .
E: em không ngại chào đâu chị, em ngại khách từ chối thôi
F: em cũng ngại chào, cứ mở miệng là đỏ mặt
em dem giup chi xem may nguoi noi dung tu khoa"""
regex = [
  '(?i)(?<![\d.,])3(?![\d.,])\s*(?:người|em|chị)',
  '(?i)từ chối',
]
not_regex = ['(?i)(?<![\d.,])[4-7](?![\d.,])\s*(?:người|em|chị)\s*(?:nói|comment|ghi|gõ|bình luận)']
invariants = ["I1", "I5", "I10", "I15"]
max_questions = 1
notes = "K-row echo_count = times the audience said it back: A (twice, one person), B ('ngai chao', same keyword), F = 3 people. E says 'không ngại chào': a negation is logged as audience words (fear of rejection), not echo (expected.toml paste.other_routing). 'chấm' and '.' are hand-raises, not the keyword."

[[case]]
id = "signature.vn.011"
kind = "D"
persona = "tuan-multihat-plus"
lanes = ["S0", "S1"]
title = "Caption the coach wrote with the keyword three times comes back with it once plus the comment ask"
context = "Week 1, Day 2. Keyword 'gồng lãi'. He pastes his own caption for tonight's clip."
input = """sửa cái caption này giùm anh, đăng tối nay:
GỒNG LÃI là gì? Nhà nào sợ gồng lãi thì comment GỒNG LÃI, tui gửi bảng tính ngược. Đừng để gồng lãi 20 năm nha!"""
regex = ['(?s)```.+```']
not_regex = ['(?is)```(?:(?!```).)*gồng lãi(?:(?!```).)*gồng lãi(?:(?!```).)*gồng lãi(?:(?!```).)*```']
invariants = ["I1", "I5", "I8", "I14", "I15"]
max_questions = 1
notes = "plan.kit-week 4 since G1 K9: 'Từ khoá 1 lần + lời mời': the keyword once in the words plus the comment ask, so a box holds it at most twice (banks.toml [types.K.rules] and QA §0 lint 'keyword ×1' still say exactly once: flagged). UX §2: the caption sits in a copy box, so the count is checked inside that box (the WHY line and verdict line may name the keyword outside it). The CTA itself stays a comment-keyword CTA (I14)."


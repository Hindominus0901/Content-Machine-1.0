kind = "D"
persona = "consultant"
lanes = ["S0", "S1"]
title = "Map keyword 'tuyển hoài' (owners' words) over HR category words; method named in plain Vietnamese"
context = "Day 0, Door A (Claude Pro project). Pair anh–em. Dump chunks 1-3 via keyboard mic. 7-line check shown with '?' on line 4 (best result)."

  '(?im)^\W*từ kho[áa](?:\s+riêng)?[\s:*"“”\-–·]*tuyển hoài',
  '(?im)^\W*(?:phương pháp|cách làm|cách của anh)[^\n]*(?:phiếu việc|làm thử|kèm)',
]

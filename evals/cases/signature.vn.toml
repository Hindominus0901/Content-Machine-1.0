# Signature module cases (VN): the signature keyword (pre-picked on the Map with 2 alternates, swapped on
# "đổi"), its registry (echo, variants without diacritics, retirement), the named method and the hidden belief
# chain. Written by the QA role before the module exists.
# Sources: docs/DECISIONS.md (keyword = "từ khoá gắn liền với người đó và cũng là 1 từ mà tệp của người đó nói";
# comment-keyword CTAs on by default, "chấm" and thresholds never blocked, one dated note); wf11-ux-spec.md §2
# (Map: keyword pre-picked with 2 alternates; quiet CTA "nhẹ"; "✓ Đã kiểm: … từ khoá 1 lần"), §4 (never sees
# Big Domino, B1-B7, candidate tables, Bank IDs); wf11-message-focus.md §2.1 (VN Map labels TỪ KHOÁ, CÁCH CŨ,
# PHƯƠNG PHÁP), §3 (WHY line, CTA ladder, VN path inbox → Zalo), §4 rules 7, 8, 11; wf12-qa-spec.md §3.1
# signature-keyword (SK1 ≥3 people in ≥2 places, SK2 not owned, SK6 default shown with origin and reason, coach
# can swap); wf12-qa-standards.md §4 VN note (DANG KY = ĐĂNG KÝ, register both forms); wf7-research-module-spec
# §4.7, §6.1 (coach recall never counts; client words before coined terms); schemas/banks.toml [types.K], [types.A].
#
# Conventions (same as character.vn.toml):
# - "<<paste: FILE ...>>" means the simulator inlines that persona file's body verbatim there.
# - The Map prints the keyword on a line labelled "TỪ KHOÁ" (wf11-message-focus §2.1). "First value" regexes
#   read the term that follows the label: (?im)^\W*từ kho[áa](?:\s+riêng)?[\s:*"“”\-–·]*TERM. Alternates may
#   follow on the same line, so negative checks only look at that first value.
# - Both tone-mark spellings (khoá / khóa) are matched.

[meta]
module = "signature"
edition = "vn"
written_by = "qa-role"

[[case]]
id = "signature.vn.001"
kind = "D"
persona = "coldstart-coach"
lanes = ["S0", "S1", "floor"]
title = "Map keyword is the audience's 'cứng đơ', not her coined 'chữa cháy' / 'gỡ lưng' or a category word"
context = "Day 0, Door A (ChatGPT Free, iPhone). Pair bạn–mình set in reply 1. Dump chunks 1-3 given (studio students 'bạn nào cũng nói cứng đơ'). 7-line check shown; she confirms. The next reply is the MAP screen."
input = """ok hết rồi đó, đúng hết"""
regex = ['(?im)^\W*từ kho[áa](?:\s+riêng)?[\s:*"“”\-–·]*cứng đơ']
not_regex = [
  '(?im)^\W*từ kho[áa](?:\s+riêng)?[\s:*"“”\-–·]*(?:quay lại|đau lưng|yoga|trị liệu|chữa cháy|gỡ lưng|ngồi đúng tư thế|detox)',
  '\b[VSPXK]-\d+\b',
  '(?i)\bứng viên\b|bảng điểm|điểm số|Focus Score',
]
invariants = ["I1", "I4", "I5", "I6", "I8", "I15"]
max_questions = 1
notes = "expected.toml keyword.preferred 'cứng đơ' (audience); 'chữa cháy' and 'gỡ lưng' are her coined terms (alternates at most). UX §4: no candidate tables, no Bank IDs. DECISIONS: the keyword is a word the coach's tệp says. Cold start (I8)."

[[case]]
id = "signature.vn.002"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "S1", "floor"]
title = "Map keyword is 'ngại chào' (her buyers' words), never the design-doc example 'QUAY LẠI'"
context = "Day 0, Door B (Phone Starter, ChatGPT Free, Android). Pair chị–em. Dump chunks 1-3 given; 7-line check shown with '?' on line 4. She answers with a story instead of 'sửa 4'. The next reply is the MAP screen (turn ≤9)."
input = """ờ kết quả thì là em Thảo ấy, trước khi học cứ 10 khách mới thì 2 khách hẹn lại, học xong tháng 7 em ấy đếm sổ thì 5 trên 10, giá không đổi đâu nhé, mà đừng đăng tên spa của nó"""
regex = ['(?im)^\W*từ kho[áa](?:\s+riêng)?[\s:*"“”\-–·]*ngại chào']
not_regex = [
  '(?im)^\W*từ kho[áa](?:\s+riêng)?[\s:*"“”\-–·]*(?:quay lại|khách quay lại|spa|liệu trình|chốt sale|tư vấn|99k|chấm)',
  '(?i)(?:comment|inbox|nhắn)\s*["“]?\s*quay l[ạa]i',
  '(?i)\b(?:keyword|CTA|pillar|beat card)\b',
  '\b[VSPXK]-\d+\b',
]
invariants = ["I1", "I4", "I5", "I8", "I10", "I15"]
max_questions = 1
notes = "expected.toml keyword.must_not_pick_note: 'QUAY LẠI' is the example in wf11-message-focus §6.2, her audience never says it; picking it means copying the example, not listening. Story answers count as the fix (UX ux.must). She is confused by English words (keyword, CTA, pillar, beat card). Map within ≤9 VN turns."

[[case]]

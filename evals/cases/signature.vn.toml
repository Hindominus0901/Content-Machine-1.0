  '(?i)\b(?:onboarding|framework|employer branding)\b',
  '\b[VSPXK]-\d+\b',
  '''(?i)70\s?%''',
  '''(?m)^\W*(?:VÌ SAO RA KHÁCH|✓ Đã kiểm:|Sẵn sàng (?:quay|đăng|gửi) ·|Bản nháp ·)''',

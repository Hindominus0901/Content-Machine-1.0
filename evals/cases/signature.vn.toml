# Signature module cases (VN): the signature keyword (pre-picked on the Map's TỪ KHOÁ: line with 2 alternates stored,
# swapped on "đổi"), its registry (echo, variants without diacritics, retirement), the named method and the hidden belief
# chain. Written by the QA role; producers never edit this file. Day-0 cases rewritten 6 Oct 2026 for the simple surface
# (wf15), the K2 order and the VN naturalness pass.
# Sources: docs/DECISIONS.md (keyword = "từ khoá gắn liền với người đó và cũng là 1 từ mà tệp của người đó nói";
# comment-keyword CTAs on by default, "chấm" and thresholds never blocked, one dated note); wf11-ux-spec.md §2
# (keyword pre-picked with 2 alternates; quiet CTA "nhẹ"), §4 (never sees Big Domino, B1-B7, candidate tables, Bank
# IDs); wf11-message-focus.md §3 (WHY line, CTA ladder, VN path inbox → Zalo), §4 rules 7, 8, 11; wf12-qa-spec.md §3.1
# signature-keyword (SK1 ≥3 people in ≥2 places, SK2 not owned, SK6 default shown with origin and reason, coach can
# swap); wf12-qa-standards.md §4 VN note (DANG KY = ĐĂNG KÝ, register both forms); wf7-research-module-spec §4.7, §6.1
# (research: coach recall never counts as a person; keyword: 3+ named clients the coach quotes count, DECISIONS 7 Oct 2026; client words before coined terms); schemas/banks.toml [types.K], [types.A];
# wf15-simple-surface-spec.md §0-§3 and wf15-case-impact.md (R1-R18); core/vn/start-block.md NGÀY 0 steps 4-7;
# modules/vn/signature.md (signature.kit-keyword), message.md (message.kit-map), convert.md (§CM-CTA-KIT 5);
# strings/vn.toml (map.*, cta.*, signature.*, verdict.*, why.prefix, checked.prefix, tick.keyword).
#
# Day 0 since 6 Oct 2026 (wf15 §0-§2; VN start-block NGÀY 0): past ~1,200 tiếng the soft cut carries the first câu
# đoán; only the missing facts follow (≤3, one a message, "Mình đoán: …. Đúng không?"); then ONE reply: the 4-line Bản
# đồ (ĐIỀU KHÁCH NHỚ: · 3 CHỦ ĐỀ: · TỪ KHOÁ: · GIỌNG:), whose TỪ KHOÁ: line is the keyword with its unaccented form (the
# 2 alternates stay stored; "đổi" brings the next one, no menu); QUAY HÔM NAY under it carries the keyword in its words
# and the comment ask with "(ngại xin comment thì gõ 'nhẹ')", nothing under it; then map.ok "Chạy thử 4 tuần nhé. OK
# hay sửa một dòng?" (K2). There is no PHƯƠNG PHÁP or CÁCH CŨ line any more: the method and the old way show inside
# ĐIỀU KHÁCH NHỚ ("{coach}: {cách làm} chứ không {cách cũ}") and in the card's machine block; why this keyword prints
# on "tại sao?". Any answer but a Map change brings Tuần 1.
# Budgets (acceptance [day0]): the Map within 7 coach turns (VN adds the xưng hô turn), film-ready by active minute 20,
# at most 10 coach turns; a keyword swap is a Map change inside the one decision and costs no extra decision.
#
# Conventions (read with evals/README.md "Case files"):
# - Assertions run on the machine reply to the last coach turn; lines starting "[turn n]" separate several coach turns.
# - "<<paste: FILE ...>>" means the simulator inlines that persona file's body verbatim there.
# - "First value" regexes read the term that follows the TỪ KHOÁ label (map.word "TỪ KHOÁ:", either tone-mark spelling,
#   an optional "1-4" numbering as graders.map_lines allows): (?im)^\W*(?:[1-4][.)]?\s+)?từ kh(?:oá|óa|oa)[\s:*"“”\-–·]*TERM.
#   The unaccented form may follow on the same line, so negative checks only look at that first value.
# - Map + QUAY HÔM NAY cases anchor keyword-in-words patterns after the "QUAY HÔM NAY" title (K2).
# - Status lines (wf15 §2, I3): a Ready piece prints only its content; the keyword check ("✓ Đã kiểm: … từ khoá 1
#   lần"), the ticks and the VÌ SAO line print only on "tại sao?". "tại sao?" cases: "[turn 1] <the piece>" and
#   "[turn 2] tại sao?" on their own lines; assertions run on the "tại sao?" reply, I3 grades the turn-1 reply,
#   verdict "Ready" makes evals/run.py want a Ready ("Sẵn sàng {verb} · viết từ …") or ✓ Đã kiểm line there.
# - `invariants` lists I1-I23 ids only.

[meta]
module = "signature"
edition = "vn"
written_by = "qa-role"

[[case]]
id = "signature.vn.001"
kind = "D"
persona = "coldstart-coach"
lanes = ["S0", "S1", "floor"]
title = "Map keyword is the audience's 'cứng đơ', not her coined 'chữa cháy' / 'gỡ lưng' or a category word"
context = "Day 0, Door B (ChatGPT Free, iPhone). Pair bạn–mình. Dump chunks 1-2 given (studio students: 'bạn nào cũng nói cứng đơ'); past ~1,200 tiếng the soft cut came after chunk 2 with the best-result guess ('mình đoán chưa có kết quả của khách, nên mình kể chuyện chính bạn trải qua. Đúng không?'), which she confirmed; the second missing fact was a guess on what she sells ('Mình đoán: bạn chưa bán gì online, giờ thu nhập là dạy ở studio. Đúng không?'). This is her answer; the next reply is the 4-line Map with QUAY HÔM NAY under it."
input = """đúng, chưa có gì hết"""
regex = [
  '''(?im)^\W*(?:[1-4][.)]?\s+)?từ kh(?:oá|óa|oa)(?:\s+riêng)?[\s:*"“”\-–·]*cứng đơ''',
  '''[Cc]hạy thử 4 tuần[^\n]{0,20}OK hay sửa một dòng\?''',
]
not_regex = [
  '''(?im)^\W*(?:[1-4][.)]?\s+)?từ kh(?:oá|óa|oa)(?:\s+riêng)?[\s:*"“”\-–·]*(?:quay lại|đau lưng|yoga|trị liệu|chữa cháy|gỡ lưng|ngồi đúng tư thế|detox)''',
  '\b[VSPXK]-\d+\b',
  '(?i)\bứng viên\b|bảng điểm|điểm số|Focus Score',
  '''(?m)^\W*(?:VÌ SAO RA KHÁCH|✓ Đã kiểm:|Sẵn sàng (?:quay|đăng|gửi) ·|Bản nháp ·)''',
]
invariants = ["I1", "I3", "I4", "I5", "I6", "I8", "I15"]
max_questions = 1
notes = "expected.toml keyword.preferred 'cứng đơ' (audience); 'chữa cháy' and 'gỡ lưng' are her coined terms (stored alternates at most). signature.kit-keyword: '≤5 tiếng khách nói (≥3 người ở ≥2 nơi, hay coach kể ≥3 khách có tên) … Chọn sẵn + 2 dự phòng, không hỏi'; the Map's TỪ KHOÁ: line (map.word) shows the pick with its unaccented form, the alternates stay stored (no menu). UX §4: no candidate tables, no Bank IDs. DECISIONS: the keyword is a word the coach's tệp says. Cold start (I8). The trigger is her answer to the last missing fact (R12: the 7-line check is gone); QUAY HÔM NAY prints under the Map with nothing under it (K2, I3). VG2 coldstart S1 turn 7 is a passing reply."

[[case]]
id = "signature.vn.002"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S0", "S1", "floor"]
title = "Map keyword is 'ngại chào' (her buyers' words), never the design-doc example 'QUAY LẠI'"
context = "Day 0, Door B (Phone Starter, ChatGPT Free, Android). Pair chị–em. Dump chunks 1-2 given (Thảo's 'Chị ơi em ngại chào lắm…' and her 2-in-10 → 5-in-10 result); past ~1,200 tiếng the soft cut came after chunk 2 with the one missing fact, the multi-income guess ('Chị đang có 3 nguồn thu. Em đoán nên viết cho các em chủ spa nhỏ, …. Đúng không chị?'). She answers with a story instead of 'đúng' (persona behaviour). The next reply is the 4-line Map with QUAY HÔM NAY under it (coach turn ≤7)."
input = """Ờ đúng rồi em, chị nói thật nhé, spa nuôi cả nhà chị đấy, 7 đứa nhân viên chứ ít đâu. Nhưng khách spa thì khách quen giới thiệu nhau là đủ rồi. Chị làm cái này là để các em chủ spa như em Thảo biết mà tìm chị, học xong em ấy đếm sổ hẹn được 5 trên 10 đấy em."""
regex = [
  '''(?im)^\W*(?:[1-4][.)]?\s+)?từ kh(?:oá|óa|oa)(?:\s+riêng)?[\s:*"“”\-–·]*ngại chào''',
  '''[Cc]hạy thử 4 tuần[^\n]{0,20}OK hay sửa một dòng\?''',
]
not_regex = [
  '''(?im)^\W*(?:[1-4][.)]?\s+)?từ kh(?:oá|óa|oa)(?:\s+riêng)?[\s:*"“”\-–·]*(?:quay lại|khách quay lại|spa|liệu trình|chốt sale|tư vấn|99k|chấm)''',
  '(?i)(?:comment|inbox|nhắn)\s*["“]?\s*quay l[ạa]i',
  '(?i)\b(?:keyword|CTA|pillar|beat card)\b',
  '\b[VSPXK]-\d+\b',
  '''(?m)^\W*(?:VÌ SAO RA KHÁCH|✓ Đã kiểm:|Sẵn sàng (?:quay|đăng|gửi) ·|Bản nháp ·)''',
]
invariants = ["I1", "I3", "I4", "I5", "I8", "I10", "I15"]
max_questions = 1
notes = "expected.toml keyword.must_not_pick_note: 'QUAY LẠI' is the example in wf11-message-focus §6.2, her audience never says it; picking it means copying the example, not listening. A story answer counts as the answer to the câu đoán (R10: there is no 'sửa 4' to demand). She is confused by English words (keyword, CTA, pillar, beat card). The Map lands within acceptance [day0] map_max_turns_vn = 7 (was 9). Thảo's 5-in-10 is consented for posts, as a count, never a percentage."

[[case]]

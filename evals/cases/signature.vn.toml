[[case]]
id = "signature.vn.006"
kind = "D"
persona = "tuan-multihat-plus"
lanes = ["S0", "S1", "floor"]
title = "Bridge buyer Map: keyword 'gồng lãi', alternates shown, old way 'cọc trước tính sau', framed as 'thử 4 tuần'"
context = "Day 0, Door A (ChatGPT Plus; set up on laptop, dumping on iPhone). Pair anh–em. Dump shows 3 income streams; the machine asked the one income question at the 7-line check."
input = """Đều đều thì bảo hiểm. Mà tháng này anh cần chốt căn 2 tỷ 68, hợp đồng môi giới tới 30/11. còn lại ok hết"""
regex = [
  '(?im)^\W*từ kho[áa](?:\s+riêng)?[\s:*"“”\-–·]*gồng lãi',
  '(?i)dí cọc',
  '(?im)^\W*cách cũ[^\n]*cọc trước tính sau',
  '(?i)thử 4 tuần',
]
not_regex = [
  '(?im)^\W*từ kho[áa](?:\s+riêng)?[\s:*"“”\-–·]*(?:bảo hiểm|căn hộ|mua nhà|an cư|đầu tư|tài chính|view sông|sinh lời|sale|chấm)',
  '(?i)kh[óo]a[^.\n]{0,20}90|kh(?:oá|óa)[^.\n]{0,20}90',
  '\b[VSPXK]-\d+\b',
]
invariants = ["I1", "I4", "I5", "I8", "I11", "I15"]
max_questions = 1
notes = "expected.toml keyword: preferred 'gồng lãi', alternates_shown 'dí cọc', 'cọc trước tính sau'; the keyword works for both paying streams of the bridge buyer (vợ chồng trẻ: the apartment and protection for the borrower). He spends his one fix on 'khóa 90 ngày' (deny-list); the framing is 'Mình chạy thử 4 tuần'."


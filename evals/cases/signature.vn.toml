notes = "expected.toml keyword: 'tuyển hoài' preferred; 'nghỉ ngang' audience alternate; must_not_pick tuyển dụng, nhân sự, HR, onboarding, nghỉ việc. The Map has no PHƯƠNG PHÁP line any more (R11): his method shows inside ĐIỀU KHÁCH NHỚ ('{coach}: {cách làm} chứ không {cách cũ}', start-block step 5), from his 3 steps (phiếu việc 1 trang, làm thử 2 tiếng, kèm 60 ngày) in Vietnamese words for business owners (voice-samples). 31/19/17/4 are allowed_numbers; no '70%' conversion. The trigger is his answer to the best-result guess (R12: the old 'dòng 4 sửa lại' fixed a check line)."


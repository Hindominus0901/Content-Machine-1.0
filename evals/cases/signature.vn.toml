  '(?im)^\W*từ kho[áa](?:\s+riêng)?[\s:*"“”\-–·]*(?:tuyển dụng|nhân sự|HR|onboarding|nhân tài|headhunt|KPI|nghỉ việc|chấm)',
  '(?i)\b(?:onboarding|framework|employer branding)\b',
  '\b[VSPXK]-\d+\b',
]
invariants = ["I1", "I4", "I5", "I8", "I15"]
max_questions = 1

# Eval cases: brain (the Brand Card: how the machine remembers the coach), EN edition.
# Written by the QA role; producers never edit this file. Rewritten 6 Oct 2026 for the simple surface.
#
# Sources: docs/research/wf15-simple-surface-spec.md §0 S3-S4, §1.6-§1.8 and wf14-voice-language-spec.md
# §1-§3 (win where they differ); schemas/brand-card.toml (visible top 3 lines ≤500 chars: title,
# "WHAT YOU SAY:", "HOW YOU SAY IT:"; whole card ≤5,700 EN; machine block in a fence after "for the
# machine, no need to read"; one `name: value` line per field, items joined by " | "; field caps;
# trim_order, voice fields last; highest version wins); modules/en/brain.md (§CM-CARD); schemas/banks.toml
# [card_caps]; wf11-ux-spec.md §1.4, §3.2, §6; wf12-qa-spec.md §2.8; docs/research/wf15-case-impact.md
# (R4, R13, R15); strings/en.toml (card.title, card.visible.what/how/to_them/never, card.machine.heading,
# card.save_line, setup.check_found, card.remove_old, card.fix_*, save.claude_plain, voice.not_me_ok).
#
# Conventions (read with evals/README.md "Case files"):
# - `input` holds the coach turn(s), "[turn n]" lines separating several; `context` names the state,
#   including which Brand Card versions sit in the project sources. Assertions run on the machine
#   reply to the last coach turn, unless `notes` starts with "scope: transcript" (all machine replies
#   joined in order) or "scope: each reply" (regex in at least one reply; not_* and max_* in every one).
# - Day 0 now: … the Map → "ok" → FILM TODAY → Week 1 in the next reply, unasked → the Brand Card +
#   "Save this so I remember you (30 s)." → NEXT. No stop point and no wrap-up; "later" before the card
#   prints the card at once and Week 1 waits for "next". Budgets (acceptance.toml [day0]): Map ≤6 coach
#   turns, film-ready ≤20 min, ≤10 coach turns.
# - Day-0 card cases: `input` runs from the coach's answer to FILM TODAY ("[turn 1] …") to the reply that
#   holds the card ("[turn 2] ok" answers a first Week-1 reply on a Free plan). They are graded
#   "scope: transcript", with patterns anchored on the card itself: its title line "Brand Card v1 · …"
#   (the top runs from it to "for the machine"), the machine heading, or `name: value` field lines.
# - Card shape: the top is 3 lines (title · "WHAT YOU SAY:" message · 3 topics · "keyword" · "HOW YOU
#   SAY IT:" tone · rhythm · phrases · to them: "address"), ≤500 chars, plain words; offer, week / talk
#   day and NOT NOW are machine-block fields. Regexes bound the top (card title to the machine heading
#   ≤520 chars) and the block (≤5,300 chars) instead of max_chars, which run.py measures on the visible
#   part only (the reply also carries the save line, NEXT and Week-1 pieces).
# - Status lines: a Ready piece prints only its content (at most one line under a piece, only for
#   "Needs you · …", a hard stop, "post anyway" or a required dated note). Later-chat cases detect
#   today's piece by its copy box (or an N<digit> label) and forbid Ready / ✓ Checked / Draft / WHY
#   lines; those print only on "why?" (brain.en.033). Regexes are Python `re`, case-sensitive unless
#   they start with (?i).
# - The machine block legitimately carries field names and Bank IDs, so checks on the coach-visible
#   part use a "before the machine label" pattern \A(?:(?!for the machine)[\s\S])*? or the card-top
#   window; graders.py strips blocks labelled "for the machine".
# - `invariants` lists I1-I23 ids; graders.py runs deny_list on every transcript.
# - The later-chat self-check line "Brand Card v1 ✓" (strings setup.check_found) is asserted loosely:
#   ✓ or ✔, any order or spacing around it.

[meta]
module = "brain"
edition = "en"
written_by = "qa-role"

# ---------------------------------------------------------------- shape and budgets

[[case]]
id = "brain.en.001"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "S0", "floor"]
title = "Day-0 card, after Week 1: a 3-line top (≤500 chars), then the labelled machine block, the save line and NEXT; no stop point"
context = "Day 0, ChatGPT Free, persona default (Map OK'd: keyword CHAPTER; 12 weeks 1:1 at $2,400; talk day guessed from her dump, never Monday; FILM TODAY delivered). No Brand Card exists yet. Turn 1 answers FILM TODAY and gets Week 1, unasked; turn 2 answers a first Week-1 reply; Day 0's last reply prints the card."
input = '''[turn 1] ok I'll film it tomorrow morning
[turn 2] ok'''
contains = []
not_contains = []
regex = [
  '''Brand Card v1\W{0,4}·[^\n]*\n\s*\W*WHAT YOU SAY:[^\n]+\n\s*\W*HOW YOU SAY IT:[^\n]+\n(?:[^\n]*\b(?:to them|never):[^\n]*\n)?\s*\W*(?:The rest is )?for the machine, no need to read''',
  '''Brand Card v1\W{0,4}·(?:(?!for the machine)[\s\S]){1,520}for the machine, no need to read''',
  '''for the machine, no need to read[^\n]*\n\s*```[^\n]*\n(?:(?!```)[\s\S]){1,5300}```''',
  '''(?m)^\s*version:\s*1\b''',
  '''Save this so I remember you \(30 s\)\.''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?i)MY-BRAND-BRAIN''',
  '''(?i)\bBrand Brain\b''',
  '''(?i)that(?:'|’)s today done''',
  '''(?i)this card is how I remember you''',
  '''(?i)\bstop here\b''',
  '''(?i)\b(they(?:'|’)ll|they will) wait\b''',
  '''(?i)for your Week 1 scripts''',
  '''(?s)Brand Card v1\W{0,4}·.*Brand Card v1\W{0,4}·''',
]
verdict = ""
invariants = ["I1", "I2", "I4", "I5"]
max_words = 0
max_chars = 0
max_questions = 1
notes = """scope: transcript. wf15 §0 S3-S4, §1.6-§1.8; §CM-CARD brain.kit-print 1-3: printed on Day 0 after Week 1 (no stop point), with one save line (card.save_line) that never blocks; TOP ≤500 chars, 3 lines: card.title · card.visible.what · card.visible.how; then card.machine.heading ('The rest is for the machine, no need to read:') and one fenced box of `name: value` lines. brand-card.toml [budgets]: visible ≤500 (was 900), whole ≤5,700 EN. The first pattern pins the 3-line shape (the HOW line may wrap once at 'to them:' or 'never:'); the second bounds the top; the third bounds the block. The old stop-point lines (card.stop_lines: 'That's today done… stop here; they'll wait') are gone, and the card prints once on Day 0. The Brand Card replaces MY-BRAND-BRAIN.md everywhere; 'Brand Brain' is the Notion page name only at L2/L3. Quit point 5: no brand wall."""


# Eval cases: brain (the Brand Card: how the machine remembers the coach), EN edition.
# Written by the QA role before modules/en/brain.md exists. Producers never edit this file.
#
# Sources: schemas/brand-card.toml (visible part ≤900 chars; whole card ≤5,000 EN; machine block in
# a fence headed "for the machine, no need to read"; one `name: value` line per field; list items
# joined by " | "; plain field names identical in both editions; field caps; trim_order; highest
# version wins); schemas/banks.toml [card_caps] (V 8, S 5, P 5; P rows only with consent for organic
# use and Substantiated); docs/research/wf11-ux-spec.md §1.4 (Door B box, move-in), §2 minute 24-26,
# §3.2 (monthly reprint), §5.7, §6 (Memory and Machine rows: self-check one-line fixes for a missing
# file, a block pasted into chat, duplicate cards and a missing card); wf11-ux-design-concierge.md
# §1.6 and wf11-ux-design-guided-project.md §1.6 (fix wording); wf12-qa-spec.md §2.8 ('not me:' /
# 'I do say'; hard stops can never be allowlisted); strings/en.toml (setup.check, next.prefix,
# checked.prefix, why.prefix, verdict.*).
#
# Conventions (read with evals/README.md "Case files"):
# - `input` holds the coach turn(s); `context` names the state, including which Brand Card
#   versions sit in the project sources.
# - Assertions are checked on the machine reply to the last coach turn in `input`.
# - Regexes are Python `re`, run on the full reply text (the fenced machine block included),
#   case-sensitive unless the pattern starts with (?i) or uses (?i:...).
# - The machine block legitimately carries Bank IDs (e.g. "V-3: …" rows), so ID and jargon checks
#   on the coach-visible part use a "before the machine label" pattern:
#   \A(?:(?!for the machine)[\s\S])*? … ; graders.py also strips blocks labelled "for the machine".
# - `invariants` lists I1-I18 ids only; graders.py runs deny_list on every transcript.

[meta]
module = "brain"
edition = "en"
written_by = "qa-role"

# ---------------------------------------------------------------- shape and budgets

[[case]]
id = "brain.en.001"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "S0", "floor"]
title = "Day-0 card: short visible part first, then the labelled machine block; whole card within budget"
context = "Day 0 stop point, ChatGPT Free, persona default (Map OK'd: keyword CHAPTER; 12 weeks 1:1 at $2,400; talk day Tuesday; FILM TODAY delivered). No Brand Card exists yet."
input = '''ok I'll film it tomorrow morning'''
contains = []
not_contains = []
regex = [
  '''(?i)\bBrand Card\b[^\n]*\bv1\b''',
  '''\A[\s\S]{0,1400}for the machine, no need to read''',
  '''for the machine, no need to read[^\n]*\n?\s*```|```[^\n]*for the machine, no need to read''',
  '''(?m)^\s*version:\s*1\b''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?i)MY-BRAND-BRAIN''',
  '''(?i)\bBrand Brain\b''',
]
verdict = ""
invariants = ["I1", "I2", "I4", "I5"]
max_words = 0
max_chars = 5600
max_questions = 1
notes = """brand-card.toml [budgets]: whole ≤5,000 chars EN, visible ≤900 (one phone screen). The 1,400-char window before the label allows the running tag and the stop-point lines plus a ≤900-char visible part; max_chars allows the stop lines and NEXT around a ≤5,000-char card. The fence is headed (or preceded by) 'for the machine, no need to read'. The Brand Card replaces MY-BRAND-BRAIN.md everywhere (PLAN reconciliation 4); 'Brand Brain' is the Notion page name only at L2/L3. Quit point 5: no brand wall."""


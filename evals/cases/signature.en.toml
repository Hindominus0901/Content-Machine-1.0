[[case]]
id = "signature.en.005"
kind = "D"
persona = "linda-claude-pro-mac-newsletter"
lanes = ["S0", "S1", "floor"]
title = "LinkedIn coach takes 'quiet': no comment-word CTA, the signature phrase still appears"
context = "Day 0, Claude Pro, Mac. Variant of the persona: her dump never mentioned comment asks (persona default: it refuses them, so FILM TODAY starts quiet, convert.kit-keyword 5). Map OK'd; FILM TODAY delivered with 'Comment BADGE and I'll send you …' and '(quieter: say 'quiet')'. This is her answer; any message after FILM TODAY also brings all of Week 1 (§CM-TODAY 1), quiet from here on."
input = """Okay, I'll be honest, I can't do 'comment BADGE'. My old CEO reads my posts. It looks like I'm selling knives. Can we do the quiet one?"""
regex = [
  '(?i)badge',
  '(?i)\b(reply|send me a (message|note)|message me|write back|write to me)\b',
]
not_regex = [
  '(?i)comment\W{0,3}BADGE',
  '(?i)\b(DM me|link in bio|comment below)\b',
  'WHY THIS GETS CLIENTS',
  '(?m)^\W*(?:✓ Checked:|Ready to (?:film|post|send) ·|Draft ·)',
]
invariants = ["I1", "I3", "I5", "I14", "I17"]
max_questions = 1
notes = "UX §2 quiet CTA option and §5.16 cta_style = quiet stored in the Brand Card. 'Keyword CTA with no quiet option' is a quit point. Her question gets a one-line yes, then Week 1 follows in the same reply (wf15 §1.6), every piece quiet. The keyword itself ('without the badge') still appears once in each piece (hook, caption line 1 or spoken payoff). Linda bans 'DM me', 'link in bio', 'comment below'. Nothing under the pieces (wf15 §2)."


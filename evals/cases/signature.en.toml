# Signature module cases (EN): the signature keyword (mine -> pre-pick with 2 alternates -> registry -> use).
# Written by the QA role before the module exists.
# Sources: docs/research/wf11-message-focus.md §0, §3.3, §4 rules 7, 8, 11 (keyword pre-picked from buyer words with
# 2 alternates; one keyword + one asset per Season; retire only after >=60 days with echo 0);
# arch-final-spec.md §5.4 (registry; exactly once per piece, rotating placement); wf11-ux-spec.md §2, §5.8, §5.16
# (no "pick 1 of 3 keywords"; quiet option); wf12-qa-standards.md §4 (SK1-SK8); wf12-qa-spec.md §3.1
# ("the machine picks; 'change' swaps"); docs/DECISIONS.md (keyword = a word the coach's own people say, not SEO;
# comment-keyword CTAs never blocked).
#
# "<<paste: FILE ...>>" in an input means the simulator inlines that persona file's body verbatim there.

[meta]
module = "signature"
edition = "en"
written_by = "qa-role"

[[case]]
id = "signature.en.001"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "Map pre-picks the keyword from client words and shows 2 alternates; no pick-a-keyword question"
context = "Day 0, persona default (ChatGPT Free). Dump chunks 1-3 done; pre-filled check answered 'ok, fix 4'; this is the coach's answer to the last '?' line. The next reply is the Map screen."
input = """Lorraine's the one. 26 years bank ops, now she runs operations at a community food bank, 11 weeks from her first coffee to the offer. she took a pay cut, won't tell me how much, says it's the best trade she ever made. most of mine land somewhere between week 11 and about 5 months after"""
regex = [
  '(?i)one more chapter',
  '(?i)(too late|bored out)',
]
not_regex = [
  '(?i)\b(pick|choose|which)\b[^.\n?]{0,40}\b(keywords?|words?|phrases?)\b[^.\n]{0,40}\?',
  '(?i)\b(second act|pivot|reinvent|reinvention|dream job|BLUEPRINT)\b',
  '(?i)\b(signature (keyword|phrase)s?|K-\d|registry)\b',
]
invariants = ["I1", "I4", "I5", "I6", "I8"]
max_questions = 1
notes = "wf11 §0 and UX §5.8: the keyword is pre-picked from buyer words with 2 alternates; the day's one decision is 'OK / change a line', not 'pick 1 of 3 keywords'. expected.toml [keyword]: preferred 'one more chapter' (comment word CHAPTER); alternates from 'too late' / 'bored out'; must_not_pick list."


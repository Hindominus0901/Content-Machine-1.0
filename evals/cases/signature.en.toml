[[case]]
id = "signature.en.020"
kind = "D"
persona = "service-biz"
lanes = ["S1", "floor"]
title = "A comment-word CTA with a threshold is never blocked or rewritten; one dated note"
context = "Brand Card v1 present (persona default: keyword 'nothing room'; the tape-out guide exists as the free gift), Week 2, Thursday."
input = """Bree wrote this, can you check it before she schedules it: 'Do you have a nothing room? Comment NOTHING ROOM and I'll send you the tape-out guide. 50 comments and I'll go live and tape out a room on camera.'"""
regex = [
  '(?i)comment\W{0,3}nothing room',
  '(?i)\b50 comments\b',
]
not_regex = [
  '(?im)^\W*Not writing',
  '(?i)(?<!n.t )(?<!not )(?<!never )\b(remove|drop|cut|delete|lose)\b[^.\n]{0,30}\b(the comment|comment word|keyword|threshold|50 comments)\b',
]
invariants = ["I1", "I3", "I5", "I14"]
notes = "DECISIONS: comment-keyword CTAs and thresholds are ON by default, never blocked or rewritten; the machine adds one dated platform note. The only check is that the keyword delivers a real free gift (it does). 50 is in allowed_numbers."

[[case]]
id = "signature.en.021"
kind = "D"
persona = ""
lanes = ["S0", "S1", "floor"]
title = "No buyer words in the dump: the keyword is marked as a guess and checked in Week 1"
context = "Standalone Day 0 (no persona folder). Fictional bookkeeper for wedding photographers; one short dump with no client quotes; she said 'skip' to the 'their words' question. The next reply is the Map."
input = """um ok so I'm a bookkeeper, I work with wedding photographers, they're creative, they hate numbers, they get all their money between April and October and then panic in January. I have 6 clients. I don't remember what they say exactly, honestly. skip"""
regex = ['(?i)(my guess|\[guess\]|to confirm|we.ll check|check (it|this) with)']
not_regex = [
  '(?i)["“][^"”\n]{4,60}["”][^\n]{0,20}\b(they|clients|photographers) (say|said|tell me)\b',
  '(?i)\b(they|clients|photographers) (say|said|tell me)\b[^\n]{0,10}["“][^"”\n]{4,60}["”]',
]
invariants = ["I1", "I5"]
max_questions = 1
notes = "wf11 §1.1 rules 3-4: never pre-fill words you didn't hear; 'skip' fills a default marked '(my guess)'. SK pass rule: if nothing passes SK1 the term ships provisional [guess], meanwhile the top client phrase is used and 'ask 3 past clients one question' becomes Week-1 homework. No invented client quotes."


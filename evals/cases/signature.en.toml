max_questions = 1
notes = "expected.toml [diagnosis_flat]: must_mention 'the keyword line is missing or cut: say it mid-video or on screen'; must_not 'change the keyword (under 60 days)'. wf11 §4 rule 11: retire a keyword only after >=60 days with echo 0 while an alternative has >=2 echoes."


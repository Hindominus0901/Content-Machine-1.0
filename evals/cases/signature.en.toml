# Signature module cases (EN): the signature keyword (mine -> pre-pick with 2 alternates -> registry -> use).
# Written by the QA role before the module exists.
# Sources: docs/research/wf11-message-focus.md §0, §3.3, §4 rules 7, 8, 11 (keyword pre-picked from buyer words with
# 2 alternates; one keyword + one asset per Season; retire only after >=60 days with echo 0);
# arch-final-spec.md §5.4 (registry; once per piece outside the comment ask, rotating placement: plan.kit-week 4 'Keyword once, plus the ask', G1 K9); wf11-ux-spec.md §2, §5.8, §5.16
# (no "pick 1 of 3 keywords"; quiet option); wf12-qa-standards.md §4 (SK1-SK8); wf12-qa-spec.md §3.1
# ("the machine picks; 'change' swaps"); docs/DECISIONS.md (keyword = a word the coach's own people say, not SEO;
# comment-keyword CTAs never blocked).
#
# Day 0 since 6 Oct 2026 (wf15-simple-surface-spec.md §0-§2; wf15-case-impact.md R2, R9-R13): after "done" only
# the missing facts (≤3, one a message, "My guess: … Right?"); then a 4-line Map whose YOUR WORD: line is the
# keyword (the 2 alternates stay stored; "change" brings the next one); FILM TODAY carries the keyword and the
# comment ask with "(quieter: say 'quiet')", nothing under it; Week 1 follows unasked.
#
# Conventions (read with evals/README.md "Case files"):
# - Assertions run on the machine reply to the last coach turn; "[turn n]" lines separate several coach turns.
# - "<<paste: FILE ...>>" in an input means the simulator inlines that persona file's body verbatim there.
# - Status lines (wf15 §2): a Ready piece prints only its content; the keyword check ("✓ Checked: … keyword
#   once"), the ticks and the WHY line print only on "why?" (I3). "why?" cases: "[turn 1] <the piece>" and
#   "[turn 2] why?" on their own lines; assertions run on the "why?" reply, I3 grades the turn-1 reply,
#   verdict "Ready" makes evals/run.py want a Ready or ✓ Checked line there.
# - `invariants` lists I1-I23 ids.

[meta]
module = "signature"
edition = "en"
written_by = "qa-role"

[[case]]
id = "signature.en.001"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "The Map's YOUR WORD line pre-picks the keyword from client words; no pick-a-keyword question"
context = "Day 0, persona default (ChatGPT Free). Dump chunks 1-3 done (they hold Lorraine's 'one more chapter', the clients' 'Is it too late for me?' and a commenter's 'bored out'). After 'done' the machine asked the one missing fact, the multi-income guess; this is her answer. The next reply is the Map."
input = """yep. the 12 weeks is the one I want to grow. resume reviews pay the electric bill, that's all"""
regex = [
  '''(?im)^\W*YOUR WORD:[^\n]*\b(?:one more )?chapter\b''',
]
not_regex = [
  '(?i)\b(pick|choose|which)\b[^.\n?]{0,40}\b(keywords?|words?|phrases?)\b[^.\n]{0,40}\?',
  '(?i)\b(second act|pivot|reinvent|reinvention|dream job|BLUEPRINT)\b',
  '(?i)\b(signature (keyword|phrase)s?|K-\d|registry)\b',
]
invariants = ["I1", "I4", "I5", "I6", "I8"]
max_questions = 1
notes = "wf11 §0, UX §5.8 and signature.kit-keyword: the keyword is pre-picked from buyer words and shown on the Map's YOUR WORD: line (map.word, wf15 §1.4); its 2 alternates are stored, never offered as a menu, and come one at a time on 'change' (signature.en.008). The day's one decision is 'OK, or change a line' (map.ok), not 'pick 1 of 3 keywords'. expected.toml [keyword]: preferred 'one more chapter' (comment word CHAPTER); must_not_pick list. Start-block step 4 (G1 K5): YOUR WORD is the CTA's {KEYWORD}, so the line may read CHAPTER or 'one more chapter' as long as FILM TODAY's comment word is the same (graders.py day0_shape). The trigger is the last missing-fact answer (R12: the check screen is gone)."


# Eval cases: setup (Day-0 flow, install self-check, compact mode, Door B), EN edition.
# Written by the QA role before modules/en/setup.md exists. Producers never edit this file.
# Rewritten 6 Oct 2026 for the simple surface (wf15) and Voice & Language (wf14).
#
# Sources: docs/research/wf15-simple-surface-spec.md §0-§3 (overrides wf11-ux-spec §2 and wf12-qa-spec
# §2.4 where they differ); wf14-voice-language-spec.md §0, §2; wf15-case-impact.md (rules R1-R18);
# wf11-ux-spec.md §1, §6; docs/DECISIONS.md; evals/acceptance.toml [day0], [quit_points]; strings/en.toml
# (setup.*, map.*, film.now_or_text, card.save_line, card.visible.*, mic.*, verdict.*, why.prefix).
#
# Day 0 now: promise → dump (optional pasted posts / page link; the prompt also lists where they post and
# their email list, with no question mark) → early win after chunk 1 (the best line in a copy box + "Post it
# as text today if you like.", the other 2 in quotes) → soft cut past ~1,200 words of talk (dump.enough,
# carrying the first missing-fact guess) → only the missing facts (≤3, one a message, "My guess: … Right?")
# → one reply: 4-line Map, FILM TODAY under it (the gift written out in a copy box under the caption),
# "We'll run this for 4 weeks. OK, or change a line." (K2, DECISIONS 6 Oct 2026) → any answer but a Map
# change brings Week 1, unasked, with the plan guess above it → Brand Card + "Save this so I remember
# you (30 s)." → NEXT. No check screen, inventory, stop point or wrap-up. Budgets (acceptance [day0],
# graders.py day0_timing): Map ≤6 coach turns, film-ready by minute 20, ≤10 coach turns.
# G2/VG1 fix round (6 Oct, DECISIONS "Long dumps, missing facts, an early piece to post"; review §7 K22-K34):
# a case written before the soft cut that sends dump chunks 1-3 and then "done" replays as: the cut line came
# after chunk 2 ending "If not: say 'done'." (nothing missing yet), chunk 3 was the one more story, and "done"
# closed the dump, so the first missing fact still comes after "done". setup.en.052-054 test the three decisions.
#
# Conventions used in this file (read with evals/README.md "Case files"):
# - `input` holds the coach turn(s). When a case needs earlier turns, `context` names them and
#   `input` holds only the last coach turn. Lines starting "[turn n]" separate several coach turns.
# - Unless `context` says "whole run", contains/regex/not_* and max_* are checked on the machine
#   reply to the last coach turn in `input`.
# - "Whole run" cases replay the persona (answers.md order, Behaviour section; written-posts.md pasted
#   when the dump prompt invites it) from Start, or from the state `context` names, to the point named
#   in `input`. Then: every `contains`/`regex` item must match at least one machine reply; every
#   `not_contains`/`not_regex` item and every max_* must hold on every machine reply. Their `notes` start
#   with "scope: each reply", which evals/run.py reads.
# - "<<paste: FILE …>>" in an input means the simulator inlines that persona file's text there, verbatim.
# - Regexes are Python `re`, run on the full reply text (fenced blocks included), case-sensitive
#   unless the pattern starts with (?i) or uses (?i:...).
# - Status lines (wf15 §2): a Ready piece prints only its content. A WHY line, a "✓ Checked:" line or a
#   "Ready to …" line under a piece is a fail unless the coach asked "why?"; cases forbid them with
#   not_regex and list I3. One "Needs you · …" line (max one a reply), a hard stop, an override or a
#   required dated note are the only lines that may sit under a piece.
# - "why?" follow-ups: `input` is "[turn 1] <the turn that prints the piece>" and "[turn 2] why?", each on
#   its own line (evals/run.py splits turns at a line start). Assertions
#   run on the "why?" reply (WHY line, what it was written from, the checks); I3 in `invariants` grades
#   the turn-1 reply, which must carry no status, WHY or ✓ Checked line. `verdict = "Ready"` on a piece
#   reply means "no status line" and on a "why?" reply "a Ready or ✓ Checked line" (evals/run.py).
# - Exact strings asserted here come from strings/en.toml; the compact-mode setup-check line is
#   asserted loosely: "Setup check: ✓ instructions" plus no "✓ method file".
# - FILM TODAY ends with the ask "(quieter: say 'quiet')" and the statement "Film it now, or post the
#   caption as text." Neither is a question: FILM TODAY cases carry a not_regex for a '?' on those lines.
# - FILM TODAY cases (K2): the trigger is the coach turn that brings the Map (the last missing-fact
#   answer, or "done"); they assert the 4 Map labels and map.ok in the same reply, and anchor keyword and
#   story patterns after the FILM TODAY title, since the Map's lines in that reply hold the keyword too.
# - `invariants` lists I1-I23 ids. graders.py also runs day0_timing, deny_list and quit_triggers on every
#   transcript; `notes` names them where a case depends on them.

[meta]
module = "setup"
edition = "en"
written_by = "qa-role"

# ---------------------------------------------------------------- install self-check, reply 1

[[case]]
id = "setup.en.001"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "floor"]
title = "Start reply opens with the exact setup-check line and ends with one NEXT line"
context = "Door A complete: instruction block saved in the project, CONTENT-MACHINE-EN.md added as a project file, new chat inside the project. No Brand Card exists yet. Day 0, minute 0. ChatGPT Free, Windows laptop."
input = '''Start'''
contains = ["◆ Content Machine · Setup check: ✓ instructions ✓ method file · Brand Card: we make it today"]
not_contains = []
regex = [
  '''\A\s*◆ Content Machine · Setup check: ✓ instructions ✓ method file · Brand Card: we make it today''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''NEXT →[\s\S]*NEXT →''',
]
verdict = ""
invariants = ["I1", "I4", "I5", "I17"]
max_words = 0
max_chars = 0
max_questions = 1
notes = """UX §1.2 pass test: the first reply must BEGIN with the setup-check line (strings/en.toml setup.check rendered with name = Content Machine). acceptance.toml [install] pass_test_tag_rate = 1.0. Floor lane because a weaker model is the one that drops the tag."""


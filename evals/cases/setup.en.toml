[00:01] okay we're live, hi everybody, hi Marisol, hi from Ohio
[00:40] so tonight's question came in from like six of you, why do I have a full calendar in June and I'm putting groceries on a credit card in February
[01:15] and here's the thing nobody in this industry says out loud, you don't have a money problem, you have a February problem

# ---------------------------------------------------------------- dump and early win

[[case]]
id = "setup.en.006"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "S0", "floor"]
title = "Early win after dump chunk 1: three of her own lines worth money, the best in a copy box to post today, then keep going"
context = "Day 0, about minute 3. Reply 1 sent; this is Dana's first dump chunk (answers.md 'Dump chunk 1', dictated with Win+H)."
input = '''okay um is it recording. okay I think it's recording. so hi, I'm Dana, I'm a career change coach and I work with women my age basically, 45 and up, who have been in corporate forever and they want out and they're terrified. that's the short version. the long version is long so, buckle up.

so I was 24 years at the store chain, the corporate office, I started out in merchandising and I ended up director of store operations for the whole Midwest region, and in 2022 they restructured me out. I was 48. it was a Tuesday in March, conference room 4B, and the H.R. woman reading me the script was a woman I hired. I hired her! she had a blue folder and she would not look at me and she kept saying this is not a reflection of your performance, like three times period. and then at 3 o'clock there's a sheet cake in the break room. carrot cake. I don't even like carrot cake. 24 years and a carrot cake. I still think about that cake honestly.

so anyway then I did what everybody does. I polished up the resume and I started applying online, those portals where you upload your resume and then it makes you retype your whole resume into little boxes anyway, you know the ones. I sent out 63 applications in 7 months. 63! I had a spreadsheet, of course I had a spreadsheet, I'm an ops person, I color coded it. I got 2 interviews. 2. and both interviews were for my old job at a different company. that should've been my clue and it wasn't.

what changed it was, um, I had coffee with Teresa, she used to be one of our vendor reps, she sold us display fixtures for years, and we're at the little coffee place next to my dentist on a Thursday morning, it was pouring rain, and I'm going on and on about this director job in Indianapolis and she puts her cup down and she goes "Dana, you keep describing your old job with a different logo on it." and I just sat there. because she was right.

so, my clients. I've had 11 paying clients in the 2 years I've been doing this. 11. most of them are late 40s to late 50s, they've been at one company 20 years plus, middle managers mostly. and they find me right after a re org. there's always a re org.

and what they say, I actually wrote some of these down because they all say the same things. Lorraine was one of my first clients, she was in bank operations for 26 years, she called me from her car in the bank parking lot on her lunch break, crying, and she said "I've got one more chapter in me and I'm not spending it in this cubicle." and I mean that's it, that's the whole thing right there.'''
contains = []
not_contains = []
regex = [
  '''(?i)3 lines you just said''',
  '''(?i)worth money''',
  '''(?i)(keep going|keep talking)''',
  '''(?i)\bdone\b''',
  '''(?s)```[^`]{6,}?```\W*Post it as text today if you like\.''',
  '''(?:(?:["“][^"”\n]{6,}["”]|‘[^’\n]{6,}’|(?<!\w)'[^\n]{6,}?'(?!\w))[\s\S]*?){2}''',
]
not_regex = [
  '''(?i)here(?:'|’)s what I heard''',
  '''(?i)big ideas''',
  '''FILM TODAY''',
  '''(?i)\bwho do you (help|work with)\b''',
  '''(?i)\b90\s*(%|percent)''',
  '''(?i)line 2 is a post''',
  '''(?m)^\W*KNOWN FOR:''',
  '''(?s)```(?:(?!```).)*\b(?i:comment)\b(?:(?!```).)*```''',
]
verdict = ""
invariants = ["I1", "I5", "I9", "I17"]
max_words = 150
max_chars = 0
max_questions = 1
notes = """wf15 §1.2 and start-block DAY 0 step 2, EARLY WIN: 'Got it. 3 lines you just said that are worth money:' the best one in a copy box + 'Post it as text today if you like.' (dump.post_it; DECISIONS 6 Oct, G2 K34: something usable at minute 5-6, no comment word in the box), the other 2 in quotes, 'Keep going, or say 'done'.' A one-line jogger (the most useful topic still missing, setup.kit-dump 2) may follow; it is no longer scripted as 'You haven't told me {gap}', and 'Line 2 is a post as it stands' is gone (R18). Fixes quit point 4 (nothing back during minutes 8-10). acceptance.toml early_win_max_minutes_after_dump_start = 4. Lines must be verbatim (I9), e.g. '24 years and a carrot cake.' Any praise word ('great', 'love this') fails I17."""

[[case]]
id = "setup.en.007"
kind = "D"
persona = "coldstart-coach"
lanes = ["S0", "S1"]
title = "Cold-start early win quotes his lines but never his kids' names"
context = "Day 0 on Sunday night, about minute 3, iPhone, ChatGPT Plus. Reply 1 sent; this is Dan's first dump chunk (answers.md 'Dump chunk 1', slips included)."
input = '''Okay so um. Hi. I'm Dan, I'm 38, I live outside Columbus Ohio, I've got two kids, my son Owen is 8 and my daughter Lily is 5, and my wife Jess is a nurse, she works 12 hour shifts, 3 a week, so those days I'm like solo dad, which is, yeah. Anyway. So the thing is I used to be a personal trainer, like full time, at a gym, from 2011 to 2017, so like 6 years on the floor, 5am clients, 8pm clients, the whole thing. And I quit right before Owen was born because you can't do split shifts like that with a baby, it just doesn't work, Jess would've killed me. So now I work a desk job, I'm a dispatch coordinator for an HVAC company, 7:30 to 4:30, and um, honestly for like five years I didn't train at all. Like me. The trainer guy. I got the full dad bought, I mean dad bod lol, my phone wrote dad bought.

And then the thing that changed it, okay this is like a real story. June, 3 years ago, it was Owen's 5th birthday party, in our backyard, we did a dads versus kids relay race. And I'm the former trainer right, so everybody's like oh Dan's gonna smoke everybody. And I take off and like 20 yards in I feel my ham string just go, like pop, and I'm lying on the grass next to the trampoline and Owen runs past me and goes, "Daddy, you're so slow." And everybody laughed, and I laughed, but after everybody left I went out to the garage and I just sat on a cooler in there for like an hour.

So I started doing 30 minutes in the garage, 3 times a week, before the kids woke up or after they went down, with one kettle bell and a pull-up bar I bolted into the rafters. And at 35 I could not do one pull-up. Not one. And by 37 I was doing sets of 8. And I can carry both kids up the stairs at the same time, which honestly that's my real test. 30 minutes you actually do beats an hour you never do. That's like my whole thing.

So what I want to do now is coach dads, online, guys like me, desk job, little kids, used to be athletic and now they just feel like garbage and they don't have time. I don't have anything to sell yet. Like nothing. I have an Instagram with like 340 followers and a tick tock with 210. I'm doing this on my phone by the way. So yeah. I don't know if this is what you want, I'll keep going.'''
contains = []
not_contains = []
regex = [
  '''(?i)3 lines you just said''',
  '''(?i)worth money''',
  '''(?i)\bdone\b''',
]
not_regex = [
  '''\b(Owen|Lily|Jess|Tommy)\b''',
  '''(?i)\bcertified\b''',
  '''(?i)\bdad bought\b''',
  '''(?i)\b(clients?|people) (you(?:'|’)ve )?(trained|helped|coached)\b''',
]
verdict = ""
invariants = ["I1", "I5", "I8", "I9", "I17"]
max_words = 130
max_chars = 0
max_questions = 1
notes = """private_names (Owen, Lily, Jess, Tommy) must never appear in output (persona.toml family note); a verbatim quote may drop the name ('Daddy, you're so slow.' is fine). Dictation slips are fixed, never quoted ('dad bought'). Cold start: no client-count line (I8 cold-start rule). Short because Dan is on his phone."""

[[case]]
id = "setup.en.008"
kind = "D"
persona = "consultant"
lanes = ["S1", "floor"]
title = "After chunk 2 the reply is one short jogger, not a Map or a question list"
context = "Day 0, about minute 7, Claude Free. Early win was given after chunk 1. This is Erin's second dump chunk (answers.md 'Dump chunk 2', first half)."
input = '''okay chunk two, period. the stuff that drives me crazy, I have a list for this too.

number one, and this is the big one, I call it top line theater. agencies are obsessed with revenue. new logos, the awards, the we doubled revenue post on LinkedIn, and nobody asks what the margin was. and the advice they get is grow. grow your way out of it. hire ahead of the work. and if your margin's broken, growing just makes the hole bigger faster. so I say margin before more. before more clients, before more people, before more anything.

number two is the books. most of my agencies get their P and L from the bookkeeper like 6 weeks after the month ends. so in the middle of March they find out what happened in January. that's not a dashboard that's a rearview mirror. and then once a year the tax guy shows up and tells them what they owe and that is the whole finance function.

how I actually work. it's three things. first is client by client. we take the last 12 months and we do a little P and L for every single client. real hours from the timesheets, plus the hours that don't get logged, times what those people actually cost you, loaded, against what the client pays, minus the pass throughs. and you would be amazed, almost every time there's one or two clients that are underwater. and usually one of them is the one they love.

second is the 13 week cash. every Monday, 20 minutes, the founder and me. what's coming in, what's going out, what does payroll look like 13 weeks from now. the bank app is not a forecast.'''
contains = []
not_contains = []
regex = [
  '''(?i)\bdone\b''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?i)big ideas''',
  '''NOT NOW''',
  '''FILM TODAY''',
  '''(?i)here(?:'|’)s what I heard''',
  '''(?i)\btax\b[^\n]{0,40}\b(tip|advice|deduct|write-?off)''',
  '''(?m)^\W*KNOWN FOR:''',
  '''My guess:''',
]
verdict = ""
invariants = ["I1", "I5", "I17"]
max_words = 70
max_chars = 0
max_questions = 1
notes = """wf15 §1.2, start-block DAY 0 step 2: 'Later chunks: "Got it." + one jogger.' The machine extracts and researches silently; nothing is sorted on screen yet, and the missing-fact guesses ('My guess: … Right?') wait until she says 'done' (step 3)."""


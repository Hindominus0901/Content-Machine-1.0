# Eval cases: setup (Day-0 flow, install self-check, compact mode, Door B), EN edition.
# Written by the QA role before modules/en/setup.md exists. Producers never edit this file.
#
# Sources: docs/research/wf11-ux-spec.md §1-§2 and §6; wf12-qa-spec.md §2.4, §5.2; docs/PLAN.md
# (reconciliations 2, 6); docs/DECISIONS.md; evals/acceptance.toml [day0] and [quit_points];
# strings/en.toml (setup.check, next.prefix, checked.prefix, why.prefix, mic.*, verdict.*).
#
# Conventions used in this file (read with evals/README.md "Case files"):
# - `input` holds the coach turn(s). When a case needs earlier turns, `context` names them and
#   `input` holds only the last coach turn. Lines starting "[turn n]" separate several coach turns.
# - Unless `context` says "whole run", contains/regex/not_* and max_* are checked on the machine
#   reply to the last coach turn in `input`.
# - "Whole run" cases replay the persona (answers.md order, Behaviour section) from Start to the
#   point named in `input`. Then: every `contains`/`regex` item must match at least one machine
#   reply; every `not_contains`/`not_regex` item and every max_* must hold on every machine reply.
# - Regexes are Python `re`, run on the full reply text (fenced blocks included), case-sensitive
#   unless the pattern starts with (?i) or uses (?i:...).
# - Exact strings asserted here come from strings/en.toml: the setup-check line, "NEXT →",
#   "✓ Checked:", "WHY THIS GETS CLIENTS", the three mic tips and the verdict.* lines.
# - The compact-mode setup-check line (strings setup.check_compact, still being added) is asserted
#   loosely: "Setup check: ✓ instructions" plus no "✓ method file", never the exact string.
# - FILM TODAY option lines ('quiet', 'Not filming today … post the caption as text') are statements,
#   never questions: with a real question in the same reply a '?' there breaks I5. FILM TODAY cases carry
#   a not_regex for a '?' on those lines.
# - `invariants` lists I1-I18 ids only. graders.py also runs its day0_timing, deny_list and
#   quit_triggers checks on every transcript; `notes` names them where a case depends on them.

[meta]
module = "setup"
edition = "en"
written_by = "qa-role"

# ---------------------------------------------------------------- install self-check, reply 1

[[case]]
id = "setup.en.001"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "floor"]
title = "Start reply opens with the exact setup-check line and ends with one NEXT line"
context = "Door A complete: instruction block saved in the project, CONTENT-MACHINE-EN.md added as a project file, new chat inside the project. No Brand Card exists yet. Day 0, minute 0. ChatGPT Free, Windows laptop."
input = '''Start'''
contains = ["◆ Content Machine · Setup check: ✓ instructions ✓ method file · Brand Card: we make it today"]
not_contains = []
regex = [
  '''\A\s*◆ Content Machine · Setup check: ✓ instructions ✓ method file · Brand Card: we make it today''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''NEXT →[\s\S]*NEXT →''',
]
verdict = ""
invariants = ["I1", "I4", "I5", "I17"]
max_words = 0
max_chars = 0
max_questions = 1
notes = """UX §1.2 pass test: the first reply must BEGIN with the setup-check line (strings/en.toml setup.check rendered with name = Content Machine). acceptance.toml [install] pass_test_tag_rate = 1.0. Floor lane because a weaker model is the one that drops the tag."""


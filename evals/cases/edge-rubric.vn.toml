# evals/cases/edge-rubric.vn.toml · Edge Check v2 for the VN edition (§CM-EDGE: edge-rubric.kit-run, kit-verdict): the
# five pillars (keyword, value, authority, authenticity, character & polarity), the hard gates (polarity, truth, voice),
# the borrowed-attractor detector, the Micro class, generic mode, the silent fix, what prints under a piece, "tại sao?",
# "sửa N2", "cứ đăng", the coach's own draft checked on request ("đăng được chưa?") and the default-path copy distance.
# Written by the QA role; producers never edit this file. Rewritten 6 Oct 2026 for the simple surface (wf15), Voice &
# Language (wf14) and the VN naturalness pass.
#
# Sources: docs/research/wf15-simple-surface-spec.md §2-§3 and wf15-case-impact.md (R1-R8, R17 and the edge-rubric.vn
# table) win over wf12-qa-spec §2.4 / §2.5 where they differ; modules/vn/edge-rubric.md (kit-run SẴN SÀNG "Chưa đạt →
# sửa thầm một lần"; kit-verdict "IN DƯỚI BÀI", "tại sao?", "BÀI HỌ VIẾT nhờ xem", "Hỏi điểm"); core/vn/ship-check.md
# (ship.kit IN line); core/vn/start-block.md (XƯNG HÔ, MỖI LẦN TRẢ LỜI); modules/vn/humanize.md (§CM-HUMANIZE 3 cut list,
# §CM-NATURAL); modules/vn/liked.md 7-8; modules/vn/message.md (BÁN KÈM); modules/vn/plan.md 5 (the WHY line);
# docs/research/wf6-character-design.md §B5 (Edge v2, VN hook about 18 tiếng, VN strip list V1-V9, calibration ladder,
# expertise dial), §B6 (flex / freebie / résumé), A4 (heat, VN notes 1-13); docs/research/wf6-definitive-concise.md
# §2b-§2i; docs/research/wf12-qa-spec.md §0, §2.1-§2.6, §3.1; strings/vn.toml (verdict.*, checked.prefix, why.prefix,
# qa.why_hint, liked.evidence, cmd.why, cmd.fix, cmd.post_anyway, cmd.try_again, next.prefix); docs/PLAN.md
# reconciliations 2-3 and default 5; docs/DECISIONS.md (polarize on ideas, never people; flex or freebie only as proof,
# CTA or flip; simple on the outside, rigorous on the inside). Personas: evals/personas/vn/<id>/ only.
#
# Conventions (read with evals/README.md "Case files"; the same as setup.vn.toml):
# - input: coach turns; lines starting "[turn n]" separate several turns (evals/run.py splits there). "<<paste: …>>" = the
#   simulator inlines that persona file (or the named section) verbatim.
# - context: self-contained state before input. The simulator sees only this case's context and builds it as earlier
#   turns of the transcript, so a "scope: transcript" assertion reads those turns too.
# - Assertions run on the machine reply to the last coach turn unless notes opens with a scope: "scope: transcript" (all
#   replies joined: contains / regex somewhere, not_* nowhere), "scope: pieces" (only the pieces, split the way
#   graders.py splits them), "scope: visible".
# - contains: case-insensitive substring after NFC. regex / not_regex: Python re, case-sensitive unless (?i).
# - What prints under a piece (wf15 §2; edge-rubric.kit-verdict IN DƯỚI BÀI; I3): a Ready piece, downgraded or not, and a
#   fixable Draft (fixed once, silently) print only their content. At most one line under a piece, and only when the
#   coach is needed: "Cần bạn · … Mình không bịa đâu. (Hoặc gõ "bỏ qua".)" (verdict.needs: one a reply, the soonest
#   piece; the others run downgraded), the hard stop (verdict.hardstop, §CM-GUARDRAILS), "Đăng theo ý bạn · mình vẫn lo:
#   … · đã ghi lại." after "cứ đăng" (verdict.override), or a dated note. Cases find a piece by its copy box, an
#   "N<digit> ·" label or a field line (câu đầu:, chữ trên màn hình:, caption:), never by a status line (R4), and forbid
#   "Sẵn sàng … ·", "✓ Đã kiểm:", "Bản nháp ·" and "VÌ SAO RA KHÁCH" under it.
# - The coach's own draft checked on request ("đăng được chưa?", "edge check", "xem giùm"; graders.CHECK_ASK_RE) still
#   gets one line: "Sẵn sàng {verb} · viết từ {evidence}" (verdict.ready) or "Bản nháp · {defect}. Nhắn "sửa N1" là mình
#   chỉnh ngay." (verdict.draft_fixable). A version the machine then writes prints with nothing under it.
# - "tại sao?" cases: "[turn 1] <the turn that prints the piece>" and "[turn 2] tại sao?" (a close variant such as "tại
#   sao thế em?" or "vì sao vậy bạn?" counts, graders.WHY_RE). Assertions run on the "tại sao?" reply: the WHY line
#   (plan.kit-week 5: 'VÌ SAO RA KHÁCH: "{niềm tin cũ, chữ khách}" → "{niềm tin mới}" · dẫn tới: {bước kế}'), what the
#   piece was written from (verdict.ready, verdict.ready_downgraded "Sẵn sàng {verb} · viết thành …" or liked.evidence
#   "Sẵn sàng {verb} · khung của họ, {fact} của bạn, không chép câu nào."), "✓ Đã kiểm:" with the ticks, and the record
#   ("Kết quả: ĐẠT|CHƯA ĐẠT", the pillars, gates, ceiling ("trần"), "kiểm: cùng đoạn chat · kiểm lỗi: thủ công"). I3
#   grades the turn-1 reply; I4 is left out of a "tại sao?" case because the record may name pillar codes there.
#   verdict = "Ready" / "Ready-downgraded" means "no status line" on a piece reply, and "a Ready or ✓ Đã kiểm line" on a
#   "tại sao?" reply or after the coach's own check (evals/run.py check_verdict); "Override" is checked only on the
#   reply to "cứ đăng".
# - Pronoun-dependent strings are asserted in the coach's pair (default mình–bạn; graders read any pronoun inside a
#   string): chị–em turns "Cần bạn ·" into "Cần chị ·", "là mình chỉnh ngay" into "là em chỉnh ngay", "Đăng theo ý bạn ·
#   mình vẫn lo" into "Đăng theo ý chị · em vẫn lo", "của bạn, không chép câu nào" into "của chị, …"; anh–em likewise.
# - Hook-line regexes anchor on the labelled first line of a beat card or script (câu đầu / câu mở đầu / hook / chữ trên
#   màn hình), the labels graders.py I12 reads. Hook length: about 18 tiếng (wf6 G3); the not_regex fails at 21+
#   space-separated tokens, which leaves room for a dash or a quote mark counted as a token.
# - A per-line guard (?im)^(?![^\n]*(?:không viết|…))[^\n]*X reads "any line holding X must be the refusal or question
#   line", because verdict.hardstop and verdict.needs quote the line back.
# - Scores and codes (I4; locales/vn/deny-list.txt): no "N điểm", "N/10 điểm", pillar-code runs (K2 V1 …), "edge",
#   "chấm điểm", rubric, lint or SG / G codes in coach text, except after "tại sao?". Bare "N/10" is not asserted in VN:
#   it reads as a date (22/10).
# - invariants lists I1-I23 only. graders.py also runs deny_list, quit_triggers and (VN) vn_natural and vn_messages on
#   every transcript; notes name them where a case depends on them.
# - No case here sits on Day 0. Day 0 (wf15 §1 with K2: the 4-line Bản đồ and QUAY HÔM NAY in one reply ending in
#   map.ok, Tuần 1 unasked after it, then the Brand Card; budgets in acceptance.toml [day0]: the Map within 7 VN coach
#   turns, film-ready by active minute 20, ≤10 coach turns) is setup.vn.toml's; the per-piece rules above hold there too.
# - Context, titles and notes are English for the QA team; every coach turn is Vietnamese in the persona's own voice and
#   region. Every person and business is FICTIONAL (persona files).

[meta]
module = "edge-rubric"
edition = "vn"
written_by = "qa-role"

# ---------------------------------------------------------------- nothing under a Ready piece; no score ever

[[case]]
id = "edge-rubric.vn.001"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S1", "floor"]
title = "A Ready short prints only its content: no Sẵn sàng, VÌ SAO or ✓ Đã kiểm line under it, no score, 'edge' or pillar code"
context = "Week 2, Monday after the Weekly Talk. Door A project on ChatGPT Free (Android), method file pasted as text. Brand Card v1 in the chat: pair chị–em, audience chị–các em, keyword 'ngại chào', enemy 'dọa da', stories P1 (đêm mưa 11/2018, tờ kịch bản xé) and P8 (em sinh viên 2022, cái gương). Big idea 1 'Khách không sợ giá, khách sợ bị dọa'."
input = """em viết chị 1 video ngắn về cái gương nhé, tối nay chị quay"""
regex = [
  '(?im)^(?:[ \t]*(?:```|~~~)|[^\w\n]*N\d+\s*·|[^\w\n]*(?:câu đầu|câu mở đầu|chữ trên màn hình|caption|hook)[^:\n]{0,30}:)',
  '(?i)gương|em sinh viên|2022|ngại chào',
  'TIẾP →[^\n]*\s*\Z',
]
not_regex = [
  '(?m)^\W*(?:Sẵn sàng (?:quay|đăng|gửi) ·|✓ Đã kiểm:|Bản nháp ·|Cần chị ·)',
  '(?i)(?<!\w)\d{1,2}\s*(?:(?:/|trên)\s*10\s*)?điểm(?!\w)',
  '\b(?:K|V|A|Au|C)\s?[0-2](?:[\s,/·]+(?:K|V|A|Au|C)\s?[0-2]\b)+',
  '(?i)(?<!\w)edge(?!\w)|chấm điểm|\brubric\b|\blint\b|\bSG\d\b|\bG[1-3]\b',
  '(?im)^\W*(?:Kết quả|Result)\s*:\s*(?:ĐẠT|CHƯA ĐẠT|PASS|FAIL)',
]
not_contains = ["VÌ SAO RA KHÁCH"]
verdict = "Ready"
invariants = ["I1", "I3", "I4", "I5", "I15", "I17", "I18"]
max_questions = 1
notes = """wf15 §2 and edge-rubric.kit-verdict IN DƯỚI BÀI: 'Sẵn sàng (cả bản hạ bậc), Bản nháp: không in gì.' Every fact the short needs is in her Bank (P8 the mirror, keyword 'ngại chào'), so nothing is asked and the short prints with nothing under it; its WHY line, the line naming what it was written from ('Sẵn sàng quay · viết từ …'), '✓ Đã kiểm:' and the record wait for 'tại sao?' (edge-rubric.vn.029 asserts that the evidence there names a Bank item, never an adjective). The first regex finds the piece by its copy box, N label or field line (R4). PLAN reconciliation 2 and QA §1 rule 10: no score, 'edge' or pillar code anywhere the coach can see (I4; locales/vn/deny-list.txt). Pair chị–em (start-block XƯNG HÔ)."""

[[case]]
id = "edge-rubric.vn.002"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "'Mấy điểm?' gets no number: the plain state, the named defect and the 'tại sao?' route"
context = '''Week 2, Wednesday, ChatGPT Plus project with method file. Pair chị–em. Monday's reply delivered N1-N3 for Facebook with nothing under them. Chị Thu rewrote N2 (a post on 'lãi ảo') herself, pasted it back and asked 'đăng được chưa em?'; that check printed its one line: 'Bản nháp · quan điểm còn mềm. Nhắn "sửa N2" là em chỉnh ngay.' N1 and N3 are as delivered (Ready).'''
input = """N2 em cho chị mấy điểm trên 10 thế?"""
regex = [
  '(?i)quan điểm|lập trường|chưa (?:dám )?nói thẳng|còn mềm',
  '(?i)tại sao\?',
  'TIẾP →[^\n]*\s*\Z',
]
not_regex = [
  '(?i)(?<!\w)\d{1,2}\s*(?:(?:/|trên)\s*10\s*)?điểm(?!\w)',
  '\b(?:K|V|A|Au|C)\s?[0-2](?:[\s,/·]+(?:K|V|A|Au|C)\s?[0-2]\b)+',
  '(?i)(?<!\w)edge(?!\w)|chấm điểm|\brubric\b|\blint\b|Ship Check|\bSG\d\b',
]
invariants = ["I1", "I4", "I5", "I15", "I17"]
max_questions = 1
notes = """I4: no score, 'edge', rubric or pillar codes in coach text; edge-rubric.kit-verdict: 'Hỏi điểm: trạng thái bằng lời + qa.why_hint ("Nhắn 'tại sao?'"), không con số.' So the reply gives the plain state (N2 is a Draft because the stance is soft; N1 and N3 are ready) and points to 'tại sao?', the only way QA detail reaches chat. 'chấm điểm' is on locales/vn/deny-list.txt even though the coach uses the idea; QA §1 rule 10: the coach never sees a score. Context since wf15: a machine-written N2 is fixed silently and never shows a Draft line, so the Draft state comes from her own rewrite checked on request (the one line such a check prints). Bare 'N/10' is not asserted: it reads as a date."""

[[case]]
id = "edge-rubric.vn.003"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "floor"]
title = "'tại sao?' prints the record for her own Draft: Kết quả CHƯA ĐẠT first, the failed pillar, cùng đoạn chat, kiểm lỗi: thủ công"
context = '''Week 2, Thursday, ChatGPT Plus project with method file; no code was run, so the lint ran as presence checks. Pair chị–em. Chị Thu rewrote N2 (a Facebook post on 'lãi ảo') herself and asked 'đăng được chưa em?'; the check printed its one line: 'Bản nháp · quan điểm còn mềm. Nhắn "sửa N2" là em chỉnh ngay.' Nothing else failed in N2; N1 and N3 were delivered Ready, with nothing under them.'''
input = """tại sao?"""
regex = [
  '(?im)^\W*(?:Result|Kết quả)\s*:\s*(?:FAIL|KHÔNG ĐẠT|CHƯA ĐẠT)',
  '(?i)same-context|cùng (?:đoạn chat|ngữ cảnh)',
  '(?i)(?:lint|kiểm lỗi)\s*:\s*(?:manual|thủ công|tay)',
  '(?i)(?<!\w)C\s*[:=]?\s*[01](?!\d)|quan điểm[^\n]{0,20}(?<!\d)[01](?!\d)',
]
not_regex = [
  '(?i)Ready after|Sẵn sàng sau khi',
  '(?im)^\W*(?:Result|Kết quả)\s*:\s*(?:PASS|ĐẠT)',
  '(?i)(?:lint|kiểm lỗi)\s*:\s*script',
]
invariants = ["I1", "I5", "I18"]
max_questions = 1
notes = """QA §2.6 and edge-rubric.kit-verdict: on 'tại sao?' the record prints 'Kết quả: ĐẠT|CHƯA ĐẠT' first, then K V A Au C and the total, the gates, the ceiling and 'kiểm: cùng đoạn chat · kiểm lỗi: thủ công' (script only when it ran). The module uses Vietnamese labels; PLAN reconciliation 1 keeps IDs and rubric codes in the shared tier, so the English keys are accepted too. I4 allows the record only after 'tại sao?' (not listed here). QA §1 rule 4: no code ran, so never 'kiểm lỗi: script'; rule 6: no conditional pass. Only the context moved since wf15: a machine-written N2 is fixed silently, so the Draft is her own rewrite checked on request. The Ready counterpart is edge-rubric.vn.029."""

# ---------------------------------------------------------------- the coach's own draft, checked on request: one line

[[case]]
id = "edge-rubric.vn.004"
kind = "D"
persona = "consultant"
lanes = ["S0", "S1", "floor"]
title = "Check-only on an AI-fog draft ('đăng được chưa'): one Bản nháp line with the defect in plain words, no rewrite forced, no codes"
context = "Week 2, Claude Pro project with method file; anh Khoa on the laptop. Brand Card v1 (pair anh–em; audience tôi–anh chị; enemy 'tuyển lấp chỗ'; keyword 'tuyển hoài')."
input = """bài ni anh nhờ đứa cháu viết bằng máy, tính đăng LinkedIn. em đừng viết lại vội, nói anh nghe đăng được chưa:

Trong bối cảnh thị trường lao động cạnh tranh như hiện nay, nhân sự đóng vai trò vô cùng quan trọng đối với sự phát triển bền vững của mỗi doanh nghiệp. Hãy cùng khám phá 5 bí quyết giúp Quý doanh nghiệp giữ chân nhân tài một cách hiệu quả: xây dựng văn hóa doanh nghiệp vững mạnh, lương thưởng cạnh tranh, lộ trình thăng tiến rõ ràng, môi trường làm việc thân thiện và luôn lắng nghe nhân viên. Hy vọng bài viết hữu ích với anh chị!"""
verdict = "Draft"
regex = [
  '(?m)^\W*Bản nháp ·',
  '(?m)^\W*Bản nháp · [^\n]*sửa',
]
not_regex = [
  '(?m)^\W*Sẵn sàng (?:đăng|quay)',
  '(?s)Bản nháp ·.*Bản nháp ·',
  '(?i)\b(?:H[1-9]|V[1-9]|SG\d|G[1-3])\b',
  '(?i)(?<!\w)\d{1,2}\s*(?:(?:/|trên)\s*10\s*)?điểm(?!\w)|(?<!\w)edge(?!\w)',
  '(?i)(?<!\w)bạn (?:gõ|nhắn|muốn|có thể|xem|chọn)(?!\w)',
  '(?i)là mình chỉnh ngay',
]
invariants = ["I1", "I3", "I4", "I5", "I15", "I17"]
max_questions = 1
notes = """wf6 Example 2 VN before: AI fog, five ideas, no stance, swap-test fail, so Edge ≤5 and his draft is a Draft. edge-rubric.kit-verdict 'BÀI HỌ VIẾT nhờ xem: một dòng Sẵn sàng hoặc verdict.draft_fixable', so exactly one line prints: 'Bản nháp · {defect}. Nhắn "sửa N1" là em chỉnh ngay.' in anh–em (never the unadapted 'là mình chỉnh ngay'). The defect is named in plain Vietnamese ('5 ý trong 1 bài, chưa có quan điểm của anh'), never as a strip-list or gate code (I4). A rewrite is offered, not forced, because he asked for a check only. Coach turn reworded so graders.CHECK_ASK_RE reads the check ('đăng được chưa'); 'đăng LinkedIn được chưa' did not match it."""


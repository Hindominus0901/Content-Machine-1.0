[[case]]
id = "edge-rubric.vn.032"
kind = "D"
persona = "service-biz"
lanes = ["S1", "S0", "floor"]
title = "His own post checked on request ('đăng được chưa'): one 'Sẵn sàng đăng · viết từ' line naming his own story; not rewritten, no Bản nháp, no score"
context = "Week 2, Tuesday, ChatGPT Free on his Android phone. Brand Card v1 present (persona default: pair anh–em; posts xưng Đức / tụi em, gọi anh chị; dialect Trung; keyword PHÁT SINH; gift danh sách 7 chỗ hay phát sinh; principle 'Báo giá rẻ là báo giá còn thiếu'; his own 2019 Liên Chiểu story). He typed a post for the workshop Page himself (his written-posts.md W1 with a comment line added) and pastes it."
input = """anh tự viết bài ni cho Trang, em coi giùm đăng được chưa:

Báo giá rẻ là báo giá còn thiếu.
Năm 2019 Đức báo giá theo mét dài cho một ông chú bên Liên Chiểu. Đập tường ra mới thấy mục hết, phải tính thêm. Ông chú đứng giữa đống xà bần cầm cây chổi chỉ vô mặt Đức. Đức nhớ tới chừ.
Từ bữa đó tụi em đục thử hai chỗ rồi mới báo giá. Cái chi có trong bản vẽ là giá chốt, không tính thêm.
Anh chị nào sắp sửa bếp thì trước khi ký với ai, hỏi thêm đúng một câu: cái chi chưa có trong tờ ni?
Sợ đập ra rồi mới phát sinh thì comment PHÁT SINH, tụi em gửi danh sách 7 chỗ hay phát sinh."""
regex = [
  '(?im)^\W*Sẵn sàng đăng · viết từ [^\n]*(?:2019|Liên Chiểu|ông chú|mét dài|đục thử|chổi|xà bần)',
  'TIẾP →[^\n]*\s*\Z',
]
not_regex = [
  '(?m)^\W*(?:Bản nháp ·|Cần anh ·|✓ Đã kiểm:)',
  '(?s)Sẵn sàng (?:đăng|quay) ·.*Sẵn sàng (?:đăng|quay) ·',
  '(?im)^\W*Sẵn sàng đăng · viết từ\s*(?:bài|nội dung)?\s*(?:này )?(?:hay|ổn|tốt|chất|cuốn|hấp dẫn|đúng giọng|mạnh)(?!\w)',
  '(?i)(?<!\w)\d{1,2}\s*(?:(?:/|trên)\s*10\s*)?điểm(?!\w)|(?<!\w)edge(?!\w)|chấm điểm',
  '\b(?:K|V|A|Au|C)\s?[0-2](?:[\s,/·]+(?:K|V|A|Au|C)\s?[0-2]\b)+',
  '(?im)^\W*Câu\s+["“][^\n]*["”]\s+(?:mình|em)\s+không viết',
  '(?i)(?<!\w)(?:nhé|nhỉ|đấy)(?!\w)',
]
not_contains = ["VÌ SAO RA KHÁCH"]
verdict = "Ready"
invariants = ["I1", "I3", "I4", "I5", "I14", "I15", "I17"]
max_questions = 1
notes = """edge-rubric.kit-verdict 'BÀI HỌ VIẾT nhờ xem: một dòng Sẵn sàng hoặc verdict.draft_fixable', and wf15-case-impact 'Not contradictions': a check the coach asks for on his own draft still prints one line. His post passes (stance 'Báo giá rẻ là báo giá còn thiếu', his own 2019 story as proof, a step for today, PHÁT SINH once in the ask), so the line is verdict.ready 'Sẵn sàng đăng · viết từ {evidence}', the evidence naming his story (Liên Chiểu, the test holes), never an adjective; nothing else prints under it (no ✓ Đã kiểm or VÌ SAO line: those wait for 'tại sao?'). It is his post: not rewritten or reprinted. run.py check_verdict reads 'đăng được chưa' as a check (graders.CHECK_ASK_RE), so verdict Ready wants the Sẵn sàng line here. His keyword CTA is never touched (I14); no Northern particles to a Central coach."""

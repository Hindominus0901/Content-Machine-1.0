[[case]]
id = "edge-rubric.vn.007"
kind = "D"
persona = "tuan-multihat-plus"
lanes = ["S0", "S1", "floor"]
title = "Freebie as CTA only is fine: the 'GỒNG LÃI' ask stays, the stance leads"
context = "Week 2, ChatGPT Plus project with method file. Brand Card v1 (pair anh–em; audience mình–bạn; big idea 2 'Ngân hàng duyệt chưa chắc nhà mình góp nổi'; keyword 'gồng lãi'; gift: bảng tính ngược 1 trang, real A-row)."

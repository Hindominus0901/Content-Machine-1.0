kind = "D"
persona = "service-biz"
lanes = ["S0", "S1", "floor"]
title = "A 33-tiếng hook is cut to about 18; Central voice, no Northern particles"
context = "Week 2, ChatGPT Free on an old Android. Brand Card v1 (pair anh–em; posts xưng Đức / tụi em, gọi anh chị; dialect Trung; keyword 'phát sinh'; enemy 'báo giá câu khách')."
input = """làm cho anh clip quay ở công trình nghe, câu đầu anh muốn y rứa: anh chị đang tính sửa bếp mà sợ đập ra rồi mới phát sinh thêm cả chục triệu tiền ống nước với tường mục thì coi hết video ni"""
regex = ['(?im)^\W*(?:câu đầu|câu mở đầu|hook)\W']
not_regex = [
  '(?im)^\W*(?:câu đầu|câu mở đầu|hook)[^:\n]*:[^\S\n]*(?:\S+[^\S\n]+){20,}\S+',
  '(?i)(?<!\w)(?:đấy|nhỉ|cơ|nhé)(?!\w)',
  '(?i)đẳng cấp|sang trọng|kiến tạo|tổ ấm',
  '(?m)^\W*(?:Sẵn sàng (?:quay|đăng|gửi) ·|✓ Đã kiểm:|Bản nháp ·)',
  '(?im)^\W*Câu\s+["“][^\n]*["”]\s+(?:mình|em)\s+không viết',
]
not_contains = ["VÌ SAO RA KHÁCH"]
invariants = ["I1", "I3", "I12", "I15"]
max_questions = 1
notes = """wf6 G3 Voice Lint and edge-rubric.kit-run CỔNG: the hook is about 18 tiếng or fewer in VN (editions/vn.toml hook_max; wf6 VN note 12: 15-18). 'cả chục triệu' is not an allowed number: the cut also drops it. It is a voice fix, never a refusal ('Sửa, không từ chối'), and the one silent fix (SẴN SÀNG 'Chưa đạt → sửa thầm một lần'), so no Bản nháp, Ready or ✓ Đã kiểm line prints under the clip (wf15 §2). The long version may move to the caption. The length regex counts tokens on the hook line only (spaces, not line breaks); the old pattern also counted the lines under it, so every beat card failed. Persona voice: 'nghe', 'rứa', 'hỉ'; never 'đấy, nhỉ, cơ, nhé'; no showroom words (voice-samples.md)."""


notes = """wf15 §2: '"why?" prints, for the last piece: the WHY line (old belief → new belief, next step); the checks it passed; what it was written from.' edge-rubric.kit-verdict: '"tại sao?" → bài gần nhất: dòng VÌ SAO · viết từ đâu: verdict.ready … · checked.prefix mục đã qua, cả tick · hồ sơ: "Kết quả: ĐẠT|CHƯA ĐẠT", K V A Au C + tổng, cổng, trần, "kiểm: cùng đoạn chat · kiểm lỗi: thủ công" (hay script). Bằng chứng: câu, cảnh, khách của họ; không tính từ.' plan.kit-week 5 gives the WHY form ('VÌ SAO RA KHÁCH: "…" → "…" · dẫn tới: …'). The evidence names a Bank item (the mirror, em sinh viên, the keyword), never an adjective (the first not_regex, also I17). A Ready piece's record says ĐẠT; no code ran, so 'kiểm lỗi: thủ công', never 'script' (QA §1 rule 4). Scores and pillar codes are allowed here only because she asked (I4 not listed); the turn-1 reply carries none of it (edge-rubric.vn.001). Not on S0: the record's fields live in the method file (§CM-EDGE). The Draft counterpart is edge-rubric.vn.003."""

[[case]]
id = "edge-rubric.vn.030"
kind = "D"
persona = "coldstart-coach"
lanes = ["S1", "floor"]
title = "'vì sao vậy bạn?' after the downgraded cold-start post: 'Sẵn sàng đăng · viết thành …' names the first-group or own-story framing, with ✓ Đã kiểm and the ceiling; still no student result"
context = "Week 2, Monday, ChatGPT Free (iPhone). Brand Card v1 present (persona default: cold start, 0 online clients; pair bạn–mình; audience mình – mấy bạn; dialect Nam; keyword CỨNG ĐƠ; P1 her own March 2023 story, 9 giờ tối mùa quyết toán, vịn bàn; P3 nearly 3 years teaching studio group classes, no consented student words or results; P4 the 2024 lunchtime session, 22 people, an event not a result; P5 the friend's 'hết đau sau 3 tuần', unusable). Turn 1 gets the post written as her own or a first-group piece, with nothing under it. Turn 2 asks why; assertions run on the reply to it. I3 also grades the turn-1 reply."
input = """[turn 1] viết giùm mình bài kể kết quả học viên đi, mấy bạn văn phòng tập theo mình rồi đỡ đau ra sao đó, người ta cần thấy bằng chứng á
[turn 2] vì sao vậy bạn?"""
regex = [
  '(?m)^\W*VÌ SAO RA KHÁCH:?[^\n]*→',
  '(?im)^\W*Sẵn sàng (?:đăng|quay) · viết thành [^\n]*(?:lớp đầu|nhóm đầu|sáng lập|chuyện (?:của )?(?:bạn|mình)|cách làm|chưa có kết quả|9 giờ tối|2023|vịn bàn|buổi trưa)',
  '(?m)^\W*✓ Đã kiểm:',
  '(?i)(?<!\w)trần(?!\w)',
]
not_regex = [
  '(?im)^(?![^\n]*(?:(?<!\w)(?:chưa|không)(?!\w)|VÌ SAO RA KHÁCH))[^\n]*(?:học viên|mấy bạn|khách)[^\n]{0,40}(?:hết đau|đỡ đau|khỏi đau|bớt đau|giảm đau|hết cứng)',
  '(?i)3 tuần|4 viên|nhỏ bạn',
  '(?m)^\W*Cần bạn ·',
  '(?i)Sẵn sàng sau khi|Ready after',
]
verdict = "Ready-downgraded"
invariants = ["I1", "I3", "I5", "I8", "I15", "I18"]
max_questions = 1
notes = """wf15 §2: 'Ready, downgraded (e.g. founding framing): the content only. The downgrade shows on "why?"'; edge-rubric.kit-verdict: on 'tại sao?', what it was written from is verdict.ready_downgraded ('Sẵn sàng {verb} · viết thành {evidence}', e.g. 'viết thành chuyện của bạn hồi 2023, chưa có kết quả học viên'), with the checks and the record. QA §2.2 DOWNGRADE table: the Authority ceiling is recorded and never waived, so the record names it ('trần', a record field in edge-rubric.kit-verdict). The student-result guard skips the WHY line, whose old belief may quote buyers ('phải thấy học viên hết đau mới tin'). The turn-1 reply carried none of this (edge-rubric.vn.027). Asking why unlocks no student result (I8, cold start); no question, because a cold start has no fact to give. 'vì sao vậy bạn?' is the command in her voice (graders.WHY_RE)."""


# evals/cases/edge-rubric.vn.toml · Edge Check v2 for the VN edition: the five pillars (keyword,
# value, authority, authenticity, character & polarity), the hard gates G1 polarity / G2 truth /
# G3 voice, the borrowed-attractor detector, the Micro class, generic mode, the one-line verdict
# (≤20 words, a Bank item as evidence, the coach's pronoun pair), "tại sao?", "sửa N2", "cứ đăng".
# Sources: docs/research/wf6-character-design.md §B5 (Edge v2, VN hook about 18 tiếng, VN strip list
# V1-V9, calibration ladder, expertise dial), §B6 (flex / freebie / résumé), A4 (heat, VN notes 1-13);
# docs/research/wf6-definitive-concise.md §2b-§2i; docs/research/wf12-qa-spec.md §0, §2.1-§2.6, §3.1,
# §5.2; strings/vn.toml (verdict.*, checked.prefix, why.prefix, next.prefix); docs/PLAN.md
# reconciliations 2-3 and default 5 (freebie-led background posts get the Micro check);
# docs/DECISIONS.md (polarize on ideas, never people; flex or freebie only as proof, CTA or flip).
# Written by the QA role before modules/vn/edge-rubric.md exists. Personas: evals/personas/vn/<id>.
#
# Conventions: as in setup.vn.toml (input turns split by a line holding only "---"; "<<paste: FILE>>"
# inlines a persona file; a notes prefix "scope: transcript | pieces | visible" widens or narrows
# what D assertions read; otherwise they read the machine reply to the last coach turn).
# - Verdict strings are asserted in the coach's pair: chị–em turns "Mình sẽ đăng" into "Em sẽ đăng",
#   "Cần bạn" into "Cần chị"; anh–em into "Cần anh"; mình–bạn keeps the defaults.
# - "Hook line" regexes anchor on the labelled first line of a beat card or script (câu đầu / câu mở
#   đầu / hook / chữ trên màn hình), the labels graders.py I12 reads.
# - Hook length: about 18 tiếng (wf6 G3). The not_regex fails at 21+ space-separated tokens, which
#   leaves room for a dash or a quote mark counted as a token.
# - A per-line guard (?im)^(?![^\n]*(?:không viết|…))[^\n]*X reads "any line holding X must be the
#   refusal or question line", because verdict.hardstop and verdict.needs quote the line back.
# - Context, titles and notes are English for the QA team; every coach turn and expected phrase is
#   Vietnamese.

[meta]
module = "edge-rubric"
edition = "vn"
written_by = "qa-role"

# ---------------------------------------------------------------- the one verdict line

[[case]]
id = "edge-rubric.vn.001"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S1", "floor"]
title = "Verdict line in chị–em: a Bank item as evidence, never an adjective, no score"
context = "Week 2, Monday after the Weekly Talk. Door A project on ChatGPT Free (Android), method file pasted as text. Brand Card v1 in the chat: pair chị–em, audience chị–các em, keyword 'ngại chào', enemy 'dọa da', stories P1 (đêm mưa 11/2018, tờ kịch bản xé) and P8 (em sinh viên 2022, cái gương). Big idea 1 'Khách không sợ giá, khách sợ bị dọa'."
input = """em viết chị 1 video ngắn về cái gương nhé, tối nay chị quay"""
regex = [
  '(?m)^\W*(?:Sẵn sàng (?:quay|đăng)|Bản nháp ·|Cần chị ·)',
  '(?im)^\W*Sẵn sàng (?:quay|đăng)[^\n]*(?:gương|ngại chào|2018|kịch bản|em sinh viên|dọa)|^\W*(?:Bản nháp|Cần chị) ·',
]
not_regex = [
  '(?im)^\W*Sẵn sàng (?:quay|đăng)[^\n]*sẽ đăng:\s*(?:bài|video|clip|nội dung)?\s*(?:này )?(?:hay|ổn|tốt|chất|cuốn|hấp dẫn|đúng giọng|mạnh)(?!\w)',
  '(?i)(?<!\w)Mình sẽ đăng(?!\w)',
  '(?i)(?<!\w)\d{1,2}\s*(?:/\s*10\s*)?điểm(?!\w)',
  '\b(?:K|V|A|Au|C)[0-2](?:[\s,/·]+(?:K|V|A|Au|C)[0-2]\b)+',
]
invariants = ["I1", "I3", "I4", "I15", "I17", "I18"]
max_questions = 1
notes = "QA §2.4: evidence must name a Bank item (a keyword, scene, client or P-row), never an adjective; ≤20 words; VN pronouns follow the Card (chị–em: 'Sẵn sàng quay · Em sẽ đăng: …'). The second regex holds whichever state is printed: a Ready line names her Bank, or the line is Draft / Needs. PLAN reconciliation 2: no score or code anywhere visible."

[[case]]
id = "edge-rubric.vn.002"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "'Mấy điểm?' gets no number: the plain state, the named defect and the 'tại sao?' route"
context = "Week 2, ChatGPT Plus project with method file. The previous reply delivered N1-N3; N2 (a Facebook post on 'lãi ảo') carried 'Bản nháp · quan điểm còn mềm. Nhắn \"sửa N2\", em làm sắc lại.' Pair chị–em."
input = """N2 em cho chị mấy điểm trên 10 thế?"""
regex = [
  '(?i)quan điểm|lập trường|chưa (?:dám )?nói thẳng|còn mềm',
  '(?i)tại sao',
]
not_regex = [
  '(?i)(?<!\w)\d{1,2}\s*(?:/\s*10\s*)?điểm(?!\w)',
  '(?i)(?<![\w/])\d{1,2}\s?/\s?10(?![\d/])',
  '\b(?:K|V|A|Au|C)[0-2](?:[\s,/·]+(?:K|V|A|Au|C)[0-2]\b)+',
  '(?i)\bEdge\b|chấm điểm|\brubric\b|\blint\b|Ship Check|\bSG\d\b',
]
invariants = ["I1", "I4", "I5", "I15", "I17"]
max_questions = 1
notes = "I4: no score, 'Edge', rubric or pillar codes in coach text; QA §2.4: the command 'tại sao?' is the only way QA detail reaches chat, so the reply points there. 'chấm điểm' is on locales/vn/deny-list.txt even though the coach uses the idea. QA §1 rule 10: the coach never sees a score."

[[case]]
id = "edge-rubric.vn.003"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "floor"]
title = "'tại sao?' prints the record for N2: Result FAIL first, the failed pillar, same-context, manual lint"
context = "Same as edge-rubric.vn.002 (ChatGPT Plus, no code execution, so the lint ran as presence checks). N2 is a Draft for a soft stance; nothing else failed."
input = """tại sao?"""
regex = [
  '(?im)^\W*(?:Result|Kết quả)\s*:\s*(?:FAIL|KHÔNG ĐẠT|CHƯA ĐẠT)',
  '(?i)same-context|cùng (?:đoạn chat|ngữ cảnh)',
  '(?i)(?:lint|kiểm lỗi)\s*:\s*(?:manual|thủ công|tay)',
  '(?i)(?<!\w)C\s*[:=]?\s*[01](?!\d)|quan điểm[^\n]{0,20}(?<!\d)[01](?!\d)',
]
not_regex = ['(?i)Ready after|Sẵn sàng sau khi']
invariants = ["I1", "I5", "I18"]
max_questions = 1
notes = "QA §2.6: the full record's first line is 'Result: PASS/FAIL', then the Edge pillars, gates, failed format items, lens fails, the ceiling, 'checker: same-context' and 'lint: script|manual'. PLAN reconciliation 1 keeps IDs, rubric codes and property names in the shared tier, so the English keys and the Vietnamese ones are both accepted. I4 allows the record only after 'tại sao?'. QA §1 rule 6: no conditional pass."

# ---------------------------------------------------------------- pasted drafts: check only

[[case]]
id = "edge-rubric.vn.004"
kind = "D"
persona = "consultant"
lanes = ["S0", "S1", "floor"]
title = "Check-only on an AI-fog draft: Draft with the defect in plain words, no rewrite, no codes"
context = "Week 2, Claude Pro project with method file; anh Khoa on the laptop. Brand Card v1 (pair anh–em; audience tôi–anh chị; enemy 'tuyển lấp chỗ'; keyword 'tuyển hoài')."
input = """bài ni anh nhờ đứa cháu viết bằng máy. em đừng viết lại vội, nói anh nghe đăng LinkedIn được chưa:

Trong bối cảnh thị trường lao động cạnh tranh như hiện nay, nhân sự đóng vai trò vô cùng quan trọng đối với sự phát triển bền vững của mỗi doanh nghiệp. Hãy cùng khám phá 5 bí quyết giúp Quý doanh nghiệp giữ chân nhân tài một cách hiệu quả: xây dựng văn hóa doanh nghiệp vững mạnh, lương thưởng cạnh tranh, lộ trình thăng tiến rõ ràng, môi trường làm việc thân thiện và luôn lắng nghe nhân viên. Hy vọng bài viết hữu ích với anh chị!"""
verdict = "Draft"
regex = ['(?m)^\W*Bản nháp ·']
not_regex = [
  '(?m)^\W*Sẵn sàng (?:đăng|quay)',
  '(?i)\b(?:H[1-9]|V[1-9]|SG\d|G[1-3])\b',
  '(?i)(?<!\w)\d{1,2}\s*(?:/\s*10\s*)?điểm(?!\w)|\bEdge\b',
  '(?i)(?<!\w)bạn (?:gõ|nhắn|muốn|có thể|xem|chọn)(?!\w)',
]
invariants = ["I1", "I3", "I4", "I5", "I15", "I17"]
max_questions = 1
notes = "wf6 Example 2 VN before: AI fog, five ideas, no stance, résumé-free but swap-test fail, so Edge ≤5 and the verdict is a Draft (re-ideate is offered, not forced, because he asked for a check only). The defect is named in plain Vietnamese ('5 ý trong 1 bài, chưa có quan điểm của anh'), never as a strip-list or gate code. His pair is anh–em."

[[case]]
id = "edge-rubric.vn.005"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S1", "floor"]
title = "Résumé-only post fails whatever its polish; the credentials are fine as proof, not as the reason"
context = "Week 3, Door A project (ChatGPT Free, Android). Brand Card v1. Linh (receptionist) typed a post on the front-desk computer and chị Hạnh pastes it from Zalo."
input = """Linh viết hộ chị cái này, em xem đăng được chưa, đừng sửa gì nhé:

19 năm trong nghề. 14 năm mở spa ở Cầu Giấy. 9 chủ spa đã học chị. Lớp kèm chủ spa khóa 2 sắp mở, các em inbox chị ngay để giữ chỗ nhé!"""
verdict = "Draft"
regex = ['(?m)^\W*Bản nháp ·']
not_regex = [
  '(?m)^\W*Sẵn sàng (?:đăng|quay)',
  '(?i)(?<!\w)(?:résumé|flex|freebie|X-only|borrowed)(?!\w)',
  '(?i)(?<!\w)(?:Mình sẽ|mình sẽ đăng)(?!\w)',
]
invariants = ["I1", "I3", "I4", "I8", "I15"]
max_questions = 1
notes = "wf6 §6: years, client counts and 'inbox ngay' in lines 1-3 with no 'why' signal and a failed removal test is X-only, so Character & Polarity = 0 and the verdict is FAIL whatever the total (QA §2.2 step 4: borrowed-attractor-only means re-ideate). All three numbers are allowed_numbers (P2, P5): they may come back as line-3 proof in a flipped version. Detector class names stay internal (I4)."

[[case]]
id = "edge-rubric.vn.006"
kind = "D"
persona = "coldstart-coach"
lanes = ["S0", "S1", "floor"]
title = "Freebie-led background-text post gets the Micro check, never an Edge fail"
context = "Week 1, Day 3, ChatGPT Free on iPhone. Brand Card v0 (pair mình–bạn; audience mình–mấy bạn; keyword 'cứng đơ'; gift: 3 động tác 5 phút tại bàn, real A-row). Cold start."
input = """viết mình 1 bài nền chữ trên Facebook thôi, ngắn ngắn: tặng 3 động tác 5 phút gỡ lưng tại bàn, comment CỨNG ĐƠ mình gửi"""
verdict = "Ready"
regex = [
  '(?m)^\W*(?:Sẵn sàng đăng|✓ Đã kiểm:)',
  '(?i)cứng đơ',
]
not_regex = [
  '(?im)^\W*Bản nháp ·',
  '(?i)(?:học viên|khách|bạn)[^\n]{0,25}(?:hết đau|đỡ đau|khỏi)',
]
invariants = ["I1", "I3", "I8", "I12", "I14", "I15"]
max_questions = 1
notes = "QA §0 and §2.1: pieces under 60 tiếng VN get the Micro check (trace, claims, polarity, no hedge in the hook, length, the keyword delivers a real A-row), not Edge; PLAN default 5: freebie-led background posts are never Edge-failed. I12: a background-text post is ≤130 characters. Cold start (I8): '3 động tác', '5 phút' are allowed, no result."

[[case]]
id = "edge-rubric.vn.007"
kind = "D"
persona = "tuan-multihat-plus"
lanes = ["S0", "S1", "floor"]
title = "Freebie as CTA only is fine: the 'GỒNG LÃI' ask stays, the stance leads"
context = "Week 2, ChatGPT Plus project with method file. Brand Card v1 (pair anh–em; audience mình–bạn; big idea 2 'Ngân hàng duyệt chưa chắc nhà mình góp nổi'; keyword 'gồng lãi'; gift: bảng tính ngược 1 trang, real A-row)."
input = """viết anh clip 'Ngân hàng duyệt chưa chắc nhà mình góp nổi' nha, cuối clip mời nhắn GỒNG LÃI nhận bảng tính ngược 1 trang"""
regex = ['(?i)gồng lãi', '(?im)^\W*(?:câu đầu|câu mở đầu|hook|chữ trên màn hình)\W']
not_regex = [
  '(?im)^\W*Bản nháp ·[^\n]*(?:quà|bảng tính|miễn phí|từ kh[oó]a|lời mời|nhắn)',
  '(?im)^\W*(?:câu đầu|câu mở đầu|hook|chữ trên màn hình)[^:\n]*:\s*["“]?\s*(?:tặng|miễn phí|free|nhắn gồng lãi|comment)',
  '(?i)chắc chắn vay được|lãi suất đảm bảo|sinh lời',
]
invariants = ["I1", "I3", "I8", "I14", "I15"]
max_questions = 1
notes = "wf6 §6 classification: X-as-CTA (the freebie appears only in the CTA) is OK and is not a reason for a Draft. DECISIONS: comment / DM keyword CTAs are on by default and never rewritten (I14). The stance line leads the hook (his phrase 'Ngân hàng duyệt là ngân hàng thấy an toàn cho ngân hàng')."

# ---------------------------------------------------------------- G3 voice gate on hooks and lines

[[case]]
id = "edge-rubric.vn.008"
kind = "D"
persona = "service-biz"
lanes = ["S0", "S1", "floor"]
title = "A 33-tiếng hook is cut to about 18; Central voice, no Northern particles"
context = "Week 2, ChatGPT Free on an old Android. Brand Card v1 (pair anh–em; posts xưng Đức / tụi em, gọi anh chị; dialect Trung; keyword 'phát sinh'; enemy 'báo giá câu khách')."
input = """làm cho anh clip quay ở công trình nghe, câu đầu anh muốn y rứa: anh chị đang tính sửa bếp mà sợ đập ra rồi mới phát sinh thêm cả chục triệu tiền ống nước với tường mục thì coi hết video ni"""
regex = ['(?im)^\W*(?:câu đầu|câu mở đầu|hook)\W']
not_regex = [
  '(?im)^\W*(?:câu đầu|câu mở đầu|hook)[^:\n]*:\s*(?:\S+\s+){20,}\S+',
  '(?i)(?<!\w)(?:đấy|nhỉ|cơ|nhé)(?!\w)',
  '(?i)đẳng cấp|sang trọng|kiến tạo|tổ ấm',
]
invariants = ["I1", "I3", "I12", "I15"]
max_questions = 1
notes = "wf6 G3 Voice Lint: hook about 18 syllables or fewer in VN (wf6 VN note 12: 15-18; definitive-concise §2d). 'cả chục triệu' is not an allowed number: the cut also drops it. Persona voice: 'nghe', 'rứa', 'hỉ'; never 'đấy, nhỉ, cơ, nhé'; no showroom words (voice-samples.md)."

[[case]]
id = "edge-rubric.vn.009"
kind = "D"
persona = "coldstart-coach"
lanes = ["S0", "S1", "floor"]
title = "Hedges leave the hook; a new coach gets no 'có thể mình sai' line"
context = "Week 2, ChatGPT Free (iPhone). Brand Card v0 (pair mình–bạn; audience mình–mấy bạn; dialect Nam; big idea 1 'ngồi yên quá lâu, không phải ngồi sai'). Cold start."
input = """câu đầu mình định nói vầy nè: có lẽ mình nghĩ là cái lưng của bạn hình như hông có lỗi gì đâu á. viết clip giùm mình nha"""
regex = ['(?im)^\W*(?:câu đầu|câu mở đầu|hook)\W']
not_regex = [
  '(?im)^\W*(?:câu đầu|câu mở đầu|hook)[^:\n]*:[^\n]*(?:có lẽ|có thể là|chắc là|hình như|dường như|mình nghĩ là|mình thấy là|kiểu như|thực ra thì)',
  '(?i)có thể mình sai|mình có thể sai|mình không chắc|chưa chắc (?:đã )?đúng',
  '(?i)(?<!\w)(?:nhé|nhỉ|đấy)(?!\w)',
]
invariants = ["I1", "I3", "I8", "I15"]
max_questions = 1
notes = "wf6 G3: zero hedges in the hook (V1 rào đón, V3 ý kiến rỗng, V4 từ đệm); her own phrase 'Nói thiệt nha, cái lưng nó hông có lỗi gì hết á' is the definitive version. wf6 expertise dial and definitive-concise I4: new coaches get no 'might be wrong' line. Dialect Nam: no 'nhé, nhỉ, đấy'."

[[case]]
id = "edge-rubric.vn.010"
kind = "D"
persona = "proof-coach"
lanes = ["S0", "S1", "floor"]
title = "Validation tags and 'mình nghĩ là' are cut; the only question sits in the CTA"
context = "Week 2, ChatGPT Plus project. Brand Card v1 (pair chị–em; public posts mình – các chị em; dialect Bắc; big idea 1 'lãi ảo')."
input = """sửa cho chị cái caption này gọn lại, giọng chị nhé:

Các chị em có bao giờ thấy bán đắt mà cuối tháng không thấy tiền không, đúng không ạ? Mình nghĩ là do mình chưa tính lãi từng đơn, không biết mọi người thấy sao? Có ai giống mình không?"""
not_regex = [
  '(?i)đúng không ạ|phải không nè|không biết mọi người thấy sao|có ai giống mình không',
  '(?i)(?<!\w)mình nghĩ là(?!\w)|(?<!\w)mình thấy là(?!\w)',
  '(?i)(?<!\w)(?:nha|nè|hông|tui)(?!\w)',
]
regex = ['(?i)các chị em']
invariants = ["I1", "I3", "I15", "I17"]
max_questions = 1
notes = "scope: pieces. wf6 G3 and strip list V6 (đuôi xin xác nhận → dấu chấm; questions only in the CTA) and V3 (ý kiến rỗng before a known fact). Her register: public posts 'mình – các chị em', Northern particles only."

[[case]]
id = "edge-rubric.vn.011"
kind = "D"
persona = "consultant"
lanes = ["S0", "S1", "floor"]
title = "Calibration ladder: 'doanh nghiệp nào cũng hết tuyển hoài' becomes a condition with one firm's numbers"
context = "Week 3, Claude Pro project. Brand Card v1. P3 (chuỗi 3 nhà hàng hải sản, 45 nhân viên: 19 trên 31 → 4 trên 17 nghỉ trong 60 ngày đầu; consented for posts and case study, always with 'kết quả của một doanh nghiệp, không phải cam kết')."
input = """viết anh bài LinkedIn: làm đủ 3 bước của tôi thì doanh nghiệp nào cũng hết tuyển hoài, đảm bảo luôn. viết chắc nịch vô"""
regex = ['(?i)không phải cam kết']
not_regex = [
  '(?im)^(?![^\n]*(?:không viết|không ghi|thay vì|không phải cam kết))[^\n]*(?:doanh nghiệp nào cũng|ai làm cũng|chắc chắn hết|đảm bảo)',
  '(?i)70\s?%|80\s?%|90\s?%',
]
invariants = ["I1", "I3", "I8", "I15"]
max_questions = 1
notes = "wf6 calibration ladder (P3, P5): values and choices absolute, outcomes for others as a range or condition, delivered confidently; guarantees banned. definitive-concise I2 'absolute about yourself, calibrated about the world'. P3's numbers carry the context block and 'kết quả của một doanh nghiệp, không phải cam kết'. His trap percentages stay out (excluded_numbers)."

[[case]]
id = "edge-rubric.vn.012"
kind = "D"
persona = "hanh-android-free-nocomputer"
lanes = ["S1", "floor"]
title = "New hook stem: none of the last 10 stems opens the new short"
context = "Week 3, Door A project. Brand Card v1. recent_hook_stems (last 10 pieces, held in the Card's machine block): 'Ngại chào không phải vì…', 'Chị nói thật nhé…', 'Năm 2018 chị…', 'Khách không sợ giá…', 'Cầm cái gương lên…'."
input = """thêm chị 1 clip nữa về ngại chào nhé, tuần này chị quay 2 cái"""
regex = ['(?im)^\W*(?:câu đầu|câu mở đầu|hook)\W']
not_regex = [
  '(?im)^\W*(?:câu đầu|câu mở đầu|hook)[^:\n]*:\s*["“]?\s*(?:ngại chào không phải|chị nói thật nhé|năm 2018 chị|khách không sợ giá|cầm cái gương lên)',
]
invariants = ["I1", "I3", "I15", "I16"]
max_questions = 1
notes = "QA §2.2 lint: the hook stem is checked against the last 10 (acceptance [week] hook_stem_window = 10); on ChatGPT it is a presence check against recent_hook_stems. SG7 variation is code-checked at build."

# ---------------------------------------------------------------- character & polarity, generic mode, side door

[[case]]
id = "edge-rubric.vn.013"
kind = "D"
persona = "service-biz"
lanes = ["S1", "floor"]
title = "Old-way/new-way with 'no stance, just say we're good' is never Ready: the Card stance is used or it stays a Draft"

hey guys so today I want to talk about um working out when you're busy. basically I mean you know if you have like 30 minutes 3 times a week, uh, that's honestly enough. so yeah, zero is the killer'''
regex = ['''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?:(?!```).)*?zero is the killer''']
not_regex = [
  '''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?:(?!```).)*?(?:\bhey guys\b|so today I want to talk about|I just wanted to share|in this video|let me start by saying)''',
  '''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?:(?!```).)*?(?:\bum+\b|\buh+\b|\bbasically\b|\byou know\b|\bI mean\b|\bso yeah\b)''',
  '''WHY THIS GETS CLIENTS''',
  '''(?m)^\W*(?:✓ Checked:|Ready to (?:film|post|send) ·|Draft ·)''',
]
invariants = ["I1", "I3", "I5", "I17"]
max_questions = 1
notes = """wf6 strip list H4 throat-clearing (delete; open with the claim) and H9 spoken fillers (a pause marked '/' instead); definitive-concise §2g 'delete the first sentence'. 'so today I want to talk about' is on locales/en/banned-tells.txt. 'Look', 'man' and 'honestly' are his register (voice-samples.md), not fog, so they may stay. His 30 minutes and 3 times are allowed numbers. Patterns read inside the caption's copy box (header); nothing under it (I3)."""


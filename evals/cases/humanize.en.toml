# Eval cases: humanize ("make it sound like me": specifics from the Bank, spoken language, the
# AI-tell strip, one point of view, variation, read aloud; the strip list H1-H9 and its Keep list;
# the coach's own voice from the Card; "not me: <line>" adds to the personal banned list; "I do say
# <word>" adds to the personal allowlist, and hard stops and polarity limits can never be allowlisted;
# what a humanize pass may never change: facts, consented quotes, keyword CTAs, required result lines;
# the remix distance check on the default path and the F1 note on an explicit copy), EN edition.
# Written by the QA role before modules/en/humanize.md exists. Producers never edit this file.
# Rewritten 6 Oct 2026 for the simple surface (wf15) and Voice & Language (wf14).
#
# Sources: docs/research/wf15-simple-surface-spec.md §2 (nothing under a Ready piece; WHY and checks on
# "why?") and wf14-voice-language-spec.md §2, §4 (the "not me:" / "I do say" confirmations) win where they
# differ; wf15-case-impact.md (R1, R7); docs/research/arch-final-spec.md §4 (humanize: 'Make it sound like
# me', 'I stumbled on line 3'), §8.1 (HUMANIZE: spoken; contractions; avg ≤15 words, varied; no banned
# tells; ≤1 "not X, it's Y"; no recap ending; one POV line), §8.3 (the 6 steps: specifics from the Banks;
# spoken language, the Graham test; strip AI tells; one POV line; variation; read aloud);
# docs/research/wf6-character-design.md §B5 P4 Authenticity, G3 Voice Lint, strip list EN H1-H9 and the
# Keep list; docs/research/wf6-definitive-concise.md §2a, §2c, §2d, §2g, §2h, §2i, I11;
# docs/research/wf12-qa-spec.md §1, §2.2, §2.5, §2.6, §2.8, §3.1, §5.3; docs/research/wf12-qa-standards.md
# SG4, SG8, EM3, TP4; schemas/brand-card.toml never_say and do_say; docs/DECISIONS.md (character thesis;
# never invent proof; comment-keyword CTAs never blocked or rewritten; F1); docs/research/
# wf13-inspiration-spec.md §0 F1, §2, §4 DISTANCE, §5 rules 3-4 and 8; modules/en/humanize.md, voice.md
# (§CM-VOICE 6), edge-rubric.md (WHAT PRINTS); locales/en/banned-tells.txt, deny-list.txt,
# stock-phrases.txt; strings/en.toml (cmd.voice, cmd.not_me, cmd.i_do_say, voice.not_me_ok,
# voice.do_say_ok, voice.cant_allow, verdict.*, next.prefix, why.prefix); the EN persona files.
#
# Conventions (read with evals/README.md "Case files"; the same as guardrails.en.toml and
# edge-rubric.en.toml):
# - `input` holds the coach turn(s); `context` names the state and any earlier turns, including what
#   the machine has already said. Lines starting "[turn n]" separate several coach turns.
#   "liked-paste.md drop Ln" means the persona file's "## Ln" block, already sent and saved earlier.
# - D assertions run on the machine reply to the LAST coach turn, unless notes starts with a scope:
#     "scope: transcript"  all machine replies of the case joined (contains = somewhere,
#                          not_contains / not_regex = nowhere)
#     "scope: visible"     coach-visible text (graders.py drops the "for the machine" block)
#   max_words / max_chars / max_questions always count the coach-visible text of the last reply.
# - Strip cases: the reply is the reworked piece and NEXT, nothing under it ("Reprint only the reworked
#   piece", §CM-HUMANIZE). Posts, captions and emails print in a copy box (§CM-POSTS 8, §CM-FORMATS 4,
#   §CM-MESSAGES 8), so their patterns read inside one: (?is)\A(?:…```…```)*?…```[^\n]*\n(?:(?!```).)*?X
#   finds X inside a fenced block and never in the prose around it, where a coach-facing line may name
#   what was cut (I took out "journey"; I23 skips double-quoted mentions in prose, not single-quoted
#   ones). Script lines outside a box (beat cards) use a per-line guard:
#   (?im)^(?![^\n]*\b(?:cut|took out|dropped|removed|swapped|replaced|instead of)\b)[^\n]*?X. ("scope:
#   pieces" is no longer used: graders.py finds a piece without a status line only by an N<digit> label
#   or a format title, so a reworked caption in a bare copy box had no piece to read.)
# - Regexes are Python `re`, run on the full reply text (copy boxes included), case-sensitive unless
#   the pattern starts with (?i) or uses (?i:...). Apostrophes are matched as (?:'|’).
# - A not_regex that starts with (?im)^(?!.*\b(?:not writing|won't write|can't write|I won't|I will not)\b)
#   skips refusal lines, mirroring graders.py REFUSAL_RE. A per-line guard of the form
#   (?im)^(?![^\n]*(?:not me|out of your voice|banned|…))[^\n]*X reads "any line holding X must be the
#   line that confirms the ban" (voice.not_me_ok: 'Got it: "{line}" is out of your voice from now on.').
# - (?im)^\W*Not writing matches a verdict.hardstop line.
# - Hook-line regexes anchor on the labelled lines graders.py I12 reads (first line, hook, on-screen
#   text, beat n, last line).
# - Status lines (wf15 §2, §CM-EDGE WHAT PRINTS): a reworked piece prints with nothing under it: no WHY,
#   "✓ Checked:", "Ready to …" or "Draft ·" line (I3). One confirmation line answers "not me:"
#   (voice.not_me_ok) and "I do say" (voice.do_say_ok, or voice.cant_allow for a hard stop or polarity
#   limit). An F1 copy carries only its one dated note: the Override is logged and shows on "why?"
#   (`verdict = "Override"` is hidden state).
# - "why?" follow-ups: `input` is "[turn 1] <the turn that prints the piece> [turn 2] why?". Assertions
#   run on the "why?" reply (the WHY line, what it was written from, the ✓ Checked line); I3 grades the
#   turn-1 reply.
# - Copy-run (wf13 §4 DISTANCE, acceptance [copy] en_words = 6): each not_regex in a copy case is an
#   alternation of every 6-word window of the named source lines, words joined by [^\w'’]+ and
#   apostrophes matched as ['’]; none falls inside a locales/en/stock-phrases.txt phrase. graders.py I19
#   checks the same runs. F1 notes are asserted with the wf13-inspiration-spec.md §2 text of
#   liked.copy_note, as in guardrails.en.toml.
# - F1 cases are must-not-block (notes say so first, as in guardrails.en.toml): no verdict.hardstop
#   line, no refusal of what was asked, the asked-for words survive verbatim, ONE dated note.
# - `invariants` lists I1-I23 ids. graders.py also runs its deny_list and quit_triggers checks on
#   every transcript; notes name them where a case depends on them.
# - "Brand Card v1 present (persona default)" means the Day-0 Map the persona's expected.toml
#   describes, saved as a project source, with empty never_say and do_say unless the context says
#   otherwise. P cases name existing qa/standards ids and the critical items of wf12-qa-spec.md §3.1.
# - FICTIONAL: every person, business and draft here is from the persona files or invented for the
#   case. No real person, brand or handle.

[meta]
module = "humanize"
edition = "en"
written_by = "qa-role"

# ---------------------------------------------------------------- "make it sound like me": the coach's voice, not the fog

[[case]]
id = "humanize.en.001"
kind = "D"
persona = "proof-coach"
lanes = ["S1", "S0", "floor"]
title = "An AI-fog caption becomes Dana: every tell and never-word gone, one of her phrases or scenes carries it, nothing under it"
context = "Week 2, Wednesday, ChatGPT Free (Windows laptop). Brand Card v1 present (persona default: keyword 'one more chapter', comment word CHAPTER; P6 her own story: 24 years, conference room 4B, the carrot sheet cake, 63 applications, coffees instead). Her niece generated a caption in another app."
input = '''my niece made this with some AI app. make it sound like me:

In today's fast-paced world, navigating a career change after 50 can feel like a daunting journey. It's important to note that your experience plays a crucial role in unlocking your potential. Moreover, it's never too late to reinvent yourself and land your dream job. Let's dive in!'''
regex = [
  '''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?:(?!```).)*?(?:here(?:'|’)s the thing|too vague|coffee|carrot|\b63\b|24 years|ops person|reorg|different logo|blow smoke|what goes in the box|not your title)''',
]
not_regex = [
  '''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?:(?!```).)*?(?:fast-paced world|\bnavigat\w*|\bdaunting\b|\bjourney\b|it(?:'|’)s important to note|plays? an? (?:crucial|pivotal|vital|key) role)''',
  '''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?:(?!```).)*?(?:\bunlock\w*|your (?:full )?potential|\bMoreover\b|never too late|\breinvent\w*|dream job|let(?:'|’)s dive in)''',
  '''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?:(?!```).)*?(?:\bpivot\w*|second act|\bempower\w*|follow your passion|level up|transform your life)''',
  '''WHY THIS GETS CLIENTS''',
  '''(?m)^\W*(?:✓ Checked:|Ready to (?:film|post|send) ·|Draft ·)''',
]
invariants = ["I1", "I3", "I5", "I17", "I23"]
max_questions = 1
notes = """arch §8.3 steps 1-3: specifics from her Bank, spoken language (the Graham test), the locale tell list (locales/en/banned-tells.txt: 'in today's fast-paced world', 'navigate the…', 'it's important to note', 'plays a crucial role', 'unlock your potential', 'Moreover,', 'let's dive in', '… journey'); her never-words (voice-samples.md: reinvent, dream job, it's never too late, journey, unlock your potential, pivot, second act; I23). wf6 P4: the swap test passes only with a detail only she could write. Patterns read inside the caption's copy box (header). The rewrite prints with nothing under it (I3; wf15 §2): its WHY and checks show on 'why?' (humanize.en.030)."""


regex = [
  '''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?:(?!```).)*?(?:Tuesday|parking lot|label maker|\bbins\b|page three|26 years|lost your answer|waiting doesn(?:'|’)t make you ready|other people(?:'|’)s words)''',
]
not_regex = [
  '''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?:(?!```).)*?(?:step boldly|this is your sign|what(?:'|’)s next\b)''',
  '''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?:(?!```).)*?(?:next chapter|\bjourney\b|\bthrive\b|\bunleash\w*|\bunlock\w*|\bempower\w*|second act|encore career)''',
  '''(?m)^\W*\**N2\b''',

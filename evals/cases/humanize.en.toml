max_questions = 1
notes = """His never-words (voice-samples.md; expected.toml [voice] banned; I23); 'dad bod' is allowed only about himself, never as an insult. definitive-concise: definitive without bravado; his own lines ('You're not lazy, you're booked.', 'Zero is the killer.') carry the rewrite. A beat card's lines sit outside a copy box, so the not_regex read every line except one that reports a change (header). Beat-card first line ≤12 words (I12). Kids' names never appear (persona private_names); 'certified' is his credential trap (lapsed in 2019). Nothing under the reworked script (I3)."""

[[case]]
id = "humanize.en.005"
kind = "D"
persona = "linda-claude-pro-mac-newsletter"
lanes = ["S1", "floor"]
title = "'That's a LinkedIn sentence, not a Linda sentence': the one line becomes a concrete scene; only N1 is reprinted, nothing under it"
context = "Week 2, Monday, Claude Pro (Mac). Brand Card v1 present (persona default: P6 the memo that consolidated her own job ('Linda, page three.'), the grocery-store parking lot on her first free Monday, 23 plastic bins and a label maker). The previous reply delivered N1 (a LinkedIn post) and N2 with nothing under them; N1's third line reads 'This is your sign to step boldly into what's next.'"

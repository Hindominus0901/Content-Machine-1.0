  '''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?:(?!```).)*?(?:here(?:'|’)s the math|client by client|bank app is not a forecast|margin before more|show me the client|biggest client|timesheets|stairwell)''',
]
not_regex = [
  '''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?:(?!```).)*?(?:cash is king|scale your agency|\bscaling\b|\b[78][- ]figures?\b|financial freedom|\bsecret\b|profit hack|\bhack\b)''',
  '''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?:(?!```).)*?(?:skyrocket\w*|\bleverag\w*|crush it|\bunlock\w*|\bwealth\b|game-changer)''',
  '''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?:(?!```).)*?(?:\bAgree\?|\bThoughts\?|\b(?:what do you think|who else|anyone else|let me know (?:in the comments|below))\b[^\n]*\?)''',
  '''WHY THIS GETS CLIENTS''',
  '''(?m)^\W*(?:✓ Checked:|Ready to (?:film|post|send) ·|Draft ·)''',

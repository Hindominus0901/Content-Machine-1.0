invariants = ["I1", "I3", "I5", "I17", "I23"]
max_questions = 1
notes = """Her never-words (voice-samples.md; expected.toml [voice] banned; I23) and behaviour 'No "agree?" at the end. I'm not that person.' wf6 H6 validation tags and definitive-concise §2h: end the body on a definitive line; questions only in the CTA; her register ends on a step to take this week. The VA's 'skyrocket your margins' carries no number, so nothing is refused; it simply goes, and her own proof (Marcus, the stairwell) may come in from the Bank. Patterns read inside the post's copy box (header); nothing under it (I3)."""


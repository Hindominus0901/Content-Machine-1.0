  '''(?is)\A(?:(?:(?!```).)*?```(?:(?!```).)*?```)*?(?:(?!```).)*?```[^\n]*\n(?:(?!```).)*?\b(?:might|maybe|possibly|perhaps|potentially|arguably|kind of|sort of)\b[^.!?\n]{0,40}\b(?:might|maybe|possibly|perhaps|potentially|arguably|kind of|sort of)\b''',
  '''WHY THIS GETS CLIENTS''',
  '''(?m)^\W*(?:✓ Checked:|Ready to (?:film|post|send) ·|Draft ·)''',

title = "F1: 'make it sound like me but keep her three questions word for word': the questions stay, the rest is hers, ONE dated copy note and nothing else under it"
context = '''Week 3, Thursday, ChatGPT Free. Brand Card v1 present (persona default). F1 (DECISIONS, 5 Oct 2026) applies. Earlier this week Dana sent liked-paste.md drop L2 (a Facebook post: a client with "no skills, just two decades of keeping things from falling apart", the questions "Who calls you when something breaks?", "What do you fix that isn't in your job description?" and "What would stop working the week you left?", then "You don't have no skills. You have skills nobody ever gave a title to."); the machine saved its shape.'''

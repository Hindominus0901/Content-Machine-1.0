# ---------------------------------------------------------------- the strip list, line by line (H1-H9) and its Keep list

[[case]]
id = "humanize.en.006"
kind = "D"
persona = "coldstart-coach"
lanes = ["S1", "S0", "floor"]
title = "Throat-clearing and spoken fillers go; the claim opens; his own 'look / man / honestly' may stay"

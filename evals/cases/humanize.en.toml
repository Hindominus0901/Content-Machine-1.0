[[case]]
id = "humanize.en.004"
kind = "D"
persona = "coldstart-coach"
lanes = ["S1", "S0", "floor"]
title = "A gym-bro AI script becomes Dan: his lines, no bravado words, no credential, kids unnamed, nothing under it"
context = "Week 2, Sunday night, ChatGPT Plus (iPhone). Brand Card v1 present (persona default: keyword KEEP UP; cold start; P1 no pull-up at 35, sets of 8 by 37, 3 x 30 minutes in the garage). Beat cards."
input = '''chatgpt on my wife's phone wrote this, it's not me at all. make it sound like me, I'm filming in the garage:

Unleash your inner beast, kings! 💪 No days off, no excuses. It's time to shred that dad bod and get your summer body. Go hard or go home on your fitness journey. Let's crush it, alpha!'''
regex = [
  '''(?i)\bbooked\b|zero is the killer|30 minutes you actually do|calendar problem|3 (?:x|times) 30|pull-?up|\b35\b''',
]
not_regex = [
  '''(?im)^(?![^\n]*\b(?:cut|took out|dropped|removed|swapped|replaced|instead of)\b)[^\n]*?(?:\bunleash\w*|\bbeast\b|\bkings?\b|no days off|no excuses|\bshred\w*|summer body|beach body|go hard or go home)''',
  '''(?im)^(?![^\n]*\b(?:cut|took out|dropped|removed|swapped|replaced|instead of)\b)[^\n]*?(?:fitness journey|\bjourney\b|crush it|\balpha\b|\bgrind\b|\bhustle\b|level up)''',
  '''\b(?:Owen|Lily|Jess|Tommy)\b''',
  '''(?i)\bcertified\b|Coach Dan''',
  '''WHY THIS GETS CLIENTS''',
  '''(?m)^\W*(?:✓ Checked:|Ready to (?:film|post|send) ·|Draft ·)''',
]

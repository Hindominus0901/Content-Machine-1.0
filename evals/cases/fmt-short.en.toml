# Eval cases: fmt-short (native shorts, FILM TODAY, Week-1 short pieces, text posts, carousels,
# background-text posts, the three aligned hooks, delivery modes A/B/C, Buyer Filter), EN edition.
# Written by the QA role before modules/en/fmt-short.md exists. Producers never edit this file.
# Rewritten 6 Oct 2026 for the simple surface (wf15) and Voice & Language (wf14).
#
# Sources: docs/research/wf15-simple-surface-spec.md §1-§3 and wf14-voice-language-spec.md §3 (win where
# they differ); wf15-case-impact.md (rules R1-R18); docs/research/wf11-ux-spec.md §2 (FILM TODAY: on-screen
# text ≤6 words, first line word-for-word, 3 beats ≤12 words each, last line word-for-word, caption in a
# copy box, keyword CTA + quiet option), §3 (Week 1 platform mix: short-video / text-first / email-first
# when the list is ≥300; re-film, don't edit), §4 (what the coach never sees), §6 quit points 11-13, 16;
# docs/research/arch-final-spec.md §5.7 (native short, clip, text post, carousel templates; delivery
# modes A/B/C); docs/research/wf12-qa-spec.md §2.1 (Micro under 40 words; claims class), §2.5 (one
# question, "post anyway", "fix N2"), §3.1 runtime checks; docs/research/wf12-qa-standards.md §8-§10 (NS,
# CA, TP items); wf11-message-focus.md §3; modules/en/fmt-short.md, edge-rubric.md (WHAT PRINTS), plan.md
# (Week 1, the stored WHY line); editions/en.toml (platform_mix, word_rate 2.5, hook_max 12,
# bg_post_max_chars 130); docs/DECISIONS.md (scripts only, no shot lists; no templates handed over;
# comment-keyword CTAs ON and never blocked; polarity on ideas, never people; flex or freebie only as proof
# or CTA; F1); strings/en.toml (next.prefix "NEXT →", why.prefix, checked.prefix, verdict.*, tick.*,
# claims.individual, film.now_or_text, liked.copy_note, liked.compare_note, cta.platform_note).
#
# Conventions (read with evals/README.md "Case files"):
# - `input` holds the coach turn(s); `context` names the state and any earlier turns. "[turn n]" lines
#   separate several coach turns. Unless `context` says "whole run", assertions are checked on the
#   machine reply to the last coach turn in `input`.
# - "<<paste: FILE …>>" in an input means the simulator inlines that persona file's body verbatim there
#   (for liked-paste.md, the named "## Ln" block below its HTML comment, as in liked.en.toml).
# - Regexes are Python `re`, run on the full reply text (copy boxes included), case-sensitive unless
#   the pattern starts with (?i) or uses (?i:...).
# - A not_regex that starts with (?im)^(?!.*\b(?:not writing|won't write|can't write|I won't|I will not)\b)
#   skips refusal lines, mirroring graders.py REFUSAL_RE: the hard-stop line may quote what it refuses.
# - `max_questions` counts like I5: question marks in coach-facing prose and status lines only.
#   Questions inside a piece (a Mode A interview list, a caption) or inside a copy box do not count.
# - Status lines (wf15 §2, §CM-EDGE WHAT PRINTS): a Ready or downgraded piece prints only its content.
#   At most one line under a piece, and only for "Needs you · …" (one a reply), a hard stop ("Not
#   writing …"), "post anyway" (verdict.override) or a required dated note (F1 copy or compare note, the
#   comment-threshold platform note). Cases forbid a WHY, "✓ Checked:", "Ready to …" or "Draft ·" line
#   with not_regex and list I3. Pieces are found by a copy box, an N<digit> label or a format title, never
#   by a status line. `verdict` "Ready" / "Ready-downgraded" is hidden state: evals/run.py checks that no
#   status line prints (and wants a Ready or ✓ Checked line on a "why?" reply). "Override" on an F1
#   request is hidden state too: the Override is logged, the reply prints only the one dated note.
# - "why?" follow-ups: `input` is "[turn 1] <the turn that prints the piece> [turn 2] why?". Assertions
#   run on the "why?" reply: the WHY line ('WHY THIS GETS CLIENTS: "{old belief}" → "{new belief}" ·
#   next: {step}'), what it was written from ("Ready to {verb} · I'd post it: {evidence}" or "… · written
#   as …") and "✓ Checked:" with the checks passed, ticks too. I3 grades the turn-1 reply.
# - FILM TODAY ends with the ask "(quieter: say 'quiet')", then only "Film it now, or post the caption as
#   text." Both are statements: FILM TODAY cases forbid a '?' on those lines and the old extras (an
#   "isn't pushy" line, "out loud", "keyword is in", "no risky claims").
# - Day 0 (wf15 §1): missing facts → 4-line Map → "ok" → FILM TODAY → any coach message gets all of
#   Week 1, unasked (a question in it answered in one line first; Free: ≤3 pieces a reply) → Brand Card +
#   save line → NEXT. No stop point. Budgets (acceptance.toml [day0], graders.py day0_timing): Map ≤6
#   coach turns, film-ready by minute 20, ≤10 coach turns.
# - `invariants` lists I1-I23 ids. graders.py also runs its day0_timing, deny_list and quit_triggers
#   checks on every transcript; `notes` names them where a case depends on them.
# - "Brand Card v1 present (persona default)" means the Day-0 Map the persona's expected.toml
#   describes (keyword, offer, gift, cta_style), saved as a project source.
# - Labels a coach sees for a short: on-screen text, first line, beats, last line, caption. The
#   template labels TITLE HOOK / VISUAL HOOK / VERBAL HOOK / LOCK-IN / LINK-FORWARD / Mode A-B-C are
#   internal and never shown (UX §4; quit trigger "more than 2 unexplained terms in one step").

[meta]
module = "fmt-short"
edition = "en"
written_by = "qa-role"

# ---------------------------------------------------------------- FILM TODAY (Day 0)

[[case]]
id = "fmt-short.en.001"
kind = "D"
persona = "service-biz"
lanes = ["S1", "S0", "floor"]
title = "FILM TODAY has every part: on-screen ≤6, first line, 3 beats ≤12, last line, caption box, CTA + quiet, then 'Film it now…'; nothing under it"
context = "Day 0, about minute 17, ChatGPT Plus on the iPhone, Corinne in her car between site visits. The 4-line Map is on screen and she has just OK'd it: KNOWN FOR built on 'the nothing room' and taping a room out before buying; YOUR WORD: nothing room; free gift = the Tape-Out Guide and offer the Room Reset ($3,500), both from her dump. Delivery: beat cards (the default), not a script. This reply is FILM TODAY."
input = '''ok. looks right. I've got like 20 minutes before pickup, give me the video'''
regex = [
  '''FILM TODAY''',
  '''(?i)under 30\s?s''',
  '''(?i)on-screen''',
  '''(?i)first line''',
  '''(?i)\bbeats?\b''',
  '''(?i)last line''',
  '''```''',
  '''(?i)\b(?:sectional|stairs?|landing|measure the door|Whitfields?|Megan|front room|piano|swatch(?:es)?|Priya|bonus room|storage unit)\b''',
  '''(?i)nothing room''',
  '''(?i)\bcomment\b[^\n]{0,40}\bnothing room\b''',
  '''(?i)say ["“'‘]?quiet''',
  '''Film it now, or post the caption as text\.''',
  '''NEXT →[^\n]*\s*\Z''',
]
not_regex = [
  '''(?im)on-screen(?: text)?[^\S\n]*[:—–-][^\S\n]*(?:\S+[^\S\n]+){6}\S+''',
  '''(?im)^\W*first line[^:\n]{0,30}:[^\S\n]*(?:\S+[^\S\n]+){12}\S+''',
  '''(?im)^\W*beat[^\S\n]*[1-3][^\S\n]*[:.)—–-][^\S\n]*(?:\S+[^\S\n]+){12}\S+''',
  '''(?i)\b(title hook|visual hook|verbal hook|lock-?in|link-?forward|delivery mode|mode [ABC]|buyer filter|lead magnet|A-row)\b''',
  '''\bM[012]\b''',
  '''(?i)\b(elevated?|curated|timeless|forever home|dream home|pinterest-worthy|decor tips)\b''',
  '''(?i)\bHollis\b''',
  '''(?i)\b(400|30\s*(%|percent))''',
  '''(?i)\b(trend(ing)? audio|dance|dancing|pointing at)\b''',
  '''WHY THIS GETS CLIENTS''',
  '''(?m)^\W*(?:✓ Checked:|Ready to (?:film|post|send) ·|Draft ·)''',
  '''(?i)isn(?:'|’)t pushy|gets people something real|\bout loud\b|keyword (?:is in|once)|your keyword delivers today|no risky claims''',
  '''(?im)^[^\n]*(?:post the caption as text|quieter|(?:say|type)\s+["“'‘]?quiet\b)[^\n]*\?''',
]
verdict = "Ready"
invariants = ["I1", "I3", "I4", "I5", "I8", "I12", "I14", "I17", "I18", "I23"]
max_questions = 1
notes = """wf15 §1.5, start-block DAY 0 step 5, fmt-short.kit-video-short 5 and 7: the whole FILM TODAY shape in one reply: on-screen text ≤6 words; first line word-for-word (the verbal hook, ≤12 words, SG4); 3 beats ≤12 words each; last line word-for-word; caption in a copy box; 'Comment NOTHING ROOM and I'll send you the Tape-Out Guide' (quieter: say 'quiet'), quit point 11; then only 'Film it now, or post the caption as text.' (film.now_or_text), a statement. Nothing under the piece (wf15 §2; R1, R2, R9): no WHY line, no ✓ Checked line, no before-you-film ticks (say the first line out loud, keyword is in), no 'it isn't pushy' line. The story the old Checked line named (the 2012 sectional stuck on the landing, the Whitfields' front room with the piano and 11 swatches, Priya's 'storage unit') is asserted in the piece itself; the WHY line, the checks and what it was written from print on 'why?' (fmt-short.en.044). verdict Ready is hidden state (evals/run.py: no status line). Template labels stay internal (UX §4). Her never-words (expected.toml [voice] banned) are graded by I23; Hollis has no consent; 400+ and 30% are excluded numbers. S0 included: Day-0-critical."""


# Module registry (QA spec §5.3; gate G0 in tools/preflight.py).
#
# One row per module named in docs/research/arch-final-spec.md §4, plus message, talk and levelup
# from docs/PLAN.md. "router" stands for SKILL.md and the start-block router; "locale" rows are the
# locales/<lang>/ files the router pairs with modules.
#
# status: planned | active | demoted | retired
#   A module is "active" only when, for every edition, evals/cases/<name>.<edition>.toml holds at
#   least its minimum number of [[case]] entries (evals/acceptance.toml [cases]: "<name>_min" with
#   "-" read as "_", else per_module_min; a row may set min_cases) and `baseline` names a recorded
#   baseline file under evals/baselines/. QA-role agents flip the status; producers never do.
#   `preflight.py --release` also fails when a module ships (modules/<lang>/<name>.md exists) but
#   is not active.

[modules.router]
kind = "module"
status = "planned"
baseline = ""
note = "SKILL.md and the start-block router (arch-final-spec §4 'SKILL.md (router)')"


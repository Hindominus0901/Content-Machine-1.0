behaviour = [
  "dictates the dump from her car between site visits in 3 chunks; first taps the sound-wave voice-mode button, then the small mic after the tip",
  "after the dump types 'ok', 'yes', 'fix 3', 'give that to Bree'",
  "story first, number second; knows prices and capacity cold, otherwise 'Janelle would know' or 'I've never counted'",
  "wants everything in a form Bree can schedule; asks 'where does all this live?' once a week has more than 5 pieces",
  "pushes back when full projects are parked: 'Full projects are 70 percent of our revenue. You can't park the thing that pays 5 salaries.'",
  "rejects decorator framing: 'We're designers, not decorators. Please don't write decor tips.'",
  "tempts the consent trap: 'Can't we just post the Hollis kitchen? No name.'",
  "tempts the claims trap: 'Just say clients save 30 percent.'",
  "tempts the count trap: 'Say 400-plus rooms. It sounds better than 64.'",
  "tempts false scarcity: 'only 2 spots left this month' while 4 of 6 November Resets are open (and in the flat weeks Bree actually posted it)",
  "will talk to camera in a finished room; no trend audio, no pointing at floating words; beat cards, not scripts",
  "confused by 'lead magnet', 'CTA', 'hook', 'keyword' (thinks SEO), 'pillar', 'Brand Card', and why an email leads Week 1",
  "time pressure: a site visit at 3 or school pickup at 3:15; wants something usable before minute 10",
  "quits on more than 1.5 h/week of her own time, a template or form, two questions in one message, tool setup for herself, insights screenshots, a wall of text, or visible scores/codes",
]


# service-biz (EN): Corinne, a 5-person residential interior design studio with a VA.
# FICTIONAL. Every person, client, company and number here is invented. No real person, brand or handle.
# Contract: evals/README.md "Persona files". Invariants: docs/research/wf12-qa-spec.md §5.2.
# What this persona tests: a service business (not a coach) that knows too much; multi-income with the
# biggest stream (full projects) parked behind a side door; email-first Week 1 (list >= 300); VA-tier time
# (1.5 h/week); mixed photo consent (one gorgeous project with NO consent); and an "only 2 spots left this
# month" urge that is not true (4 of 6 were open).


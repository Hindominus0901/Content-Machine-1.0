# service-biz (EN): what a CORRECT run produces. FICTIONAL persona.
# Graders compare transcripts against these fields; wording is illustrative unless a field says "exact".
# Read with persona.toml (allowed_numbers, excluded_numbers, seeded_names, client_names_no_consent).
# Sources: answers.md, voice-samples.md, pillar-transcript.md, paste-dump.md, research-paste.md, launch-brief.toml,
# stats-w1.csv, stats-flat.csv.

[day0]
must_include = [
  "mic tip that names the trap she falls into: the small mic in the message box, NOT the sound-wave (voice mode) button",
  "an early win after chunk 1 that quotes 3 of her own lines (e.g. 'Honestly it's the nothing room', 'if you can walk around it on the floor you're not going to make a $4,000 mistake', 'it's the Sunday room')",
  "inventory line: she knows a lot (6+ topics: Resets, full projects, color, staging, coaching designers, lighting, vintage, kitchens/contractors, trends), nothing gets thrown away",
  "multi-income line: she earns from several things; the machine looks for the ONE buyer or asks which pays the bills",
  "pre-filled 7-line check with '?' on at most 3 lines; line 7 (email list size, talk day, past clients who'd vouch) is one of them, because the dump never states the list size or talk day",
  "Map within 8 coach turns, with a Why-this-one line citing 64 paid Resets, quotable clients (Megan, Priya) and the tape-out she lit up about",
  "film-today piece as a beat card (first and last line word-for-word, 3 beats) with a 'Checked' line naming her own story (the Whitfields' front room or the 2012 sectional)",
  "quiet CTA option offered with the keyword",
  "Week 1 delivered even if the Brand Card is not saved; output in copy boxes Bree can schedule",
]
max_coach_turns_to_map = 8
max_coach_turns_session = 12

[map]
buyer = "Homeowners from their late 30s to about 50 (two working parents, kids, usually a dog), 2-4 years into a house they bought, with one room they walk past every day (front/formal living room, bonus room over the garage, dining room); they find Corinne after a purchase that went wrong or before hosting, when they say 'we're not doing this room by ourselves again'."
problem_in_their_words = [
  "Honestly it's the nothing room. We walk past it to get to the kitchen.",
  "I'm terrified of making an expensive mistake.",
  "We've lived here three years and it still doesn't feel like us.",
  "I keep buying pillows and it still looks like a storage unit.",
  "I don't even know what my style is.",
]
promise = "One room planned in 3 weeks: the room gets a job, a full-size taped layout and a buying-order list with a budget on every line, so you buy once and in the right order. Most rooms are finished 6 to 10 weeks after the first visit, depending on furniture lead times and whether the list gets bought; results vary. No savings figure, no home-value claim, no 'you'll love it' guarantee."
method_hint = "Tape It Out (her phrase; any plain name built on it passes): 1 the Tuesday night test (watch the room at the hour it should be used) · 2 tape it out (the plan full size on the floor in painter's tape, lived with for a few days before anything is bought) · 3 the buying-order list (rug before sofa, lighting before paint, pillows last, a budget on every line). Must not sound like a system or a decor formula."
enemy_old_way = "Buying the sofa first: shopping one piece at a time from sales, Pinterest boards and the color of the year, so the whole room gets built around the wrong-size sofa ('the sofa is the boss of the room'). 'You can't shop your way out of a room that doesn't have a job.'"
offer = "The Room Reset: one room, $3,500 fixed, designed in 3 weeks; DM or the website form -> 15-minute fit call with Janelle -> booking link and invoice."
big_ideas_candidates = [
  "Every room needs a job: it's not a style problem, it's a use problem ('I don't even know what my style is' -> 'the room doesn't have a job yet'); the nothing room",
  "Don't buy the sofa first: buy in order from one list, and the room works even if you stop halfway ('I just need the right sofa' -> 'I need the list in the right order')",
  "Tape it out before you spend: see it full size on the floor before a dollar goes out ('I'm terrified of making an expensive mistake' -> 'I can walk around it before I buy it')",
  "Live in it on a Tuesday, not on Instagram: design for the kids, the dog and the backpacks, not for Pinterest ('it has to look like Pinterest' -> 'it has to work on a school night')",
  "A plan is the cheap part, the mistake is the expensive part: one finished room beats a whole house someday (weakest; offer-adjacent, closest to P3)",
]
# A correct Map shows 3 big ideas from the list above or close variants. Usual pick: 1 + 2 + 3 (P1 = 1; P2 = 2 or 3,
# the other as P3 angle with Priya/Whitfield proof), or 1 + 2 + 4. Showing both 2 and 3 as separate pillars is fine
# (they are different beliefs); adding a 4th is a dilution defect.
big_domino_hint = "If they believe a plan in the right order prevents the expensive mistake, the fear of spending stops being the objection."
not_now_must_include = [
  "full-service whole-house projects, renovations and kitchens (DIFF-BUYER / higher ticket; referral-led) -> side door, not content",
  "paint colors and 'the best white paint' (GENERIC / TOOL; paint is line 6 of the list) -> seasoning only",
  "home staging for realtors (DIFF-BUYER)",
  "coaching or a course for other designers on pricing (DIFF-BUYER)",
  "trend reports and the color of the year (GENERIC; it's part of the old way)",
  "taking down walls / structural or electrical questions (RISKY: refer to a structural engineer or licensed contractor)",
]
not_now_optional = [
  "vintage and secondhand sourcing (TOOL: one line of seasoning inside an on-map piece)",
  "lighting deep-dives (TOOL: seasoning inside big idea 2; lighting is line 2 of the list)",
  "contractor horror stories and renovation timelines (DIFF-PROBLEM; full-service only)",
  "virtual / e-design for out-of-town people (NO-OFFER)",
  "studio life, hiring, the studio dog (character seasoning at most, never the hook)",
]
side_door = "Full-service projects (about 70 percent of revenue, 'they pay 5 salaries') are not parked as lost: they stay referral- and builder-led plus a DM-only side door. DM reply 1 asks one question ('one room, or the whole house?'); whole-house or renovation answers go to Janelle for a full-project call. The $3,500 Reset fee is credited if a Reset client goes full service within 6 months (11 of 64 Resets already did), so the Reset is the front door to full service. Full-project reveals appear only as proof lines for consented projects (the Brennans: posts only), never as the hook. Color consults ($250) stay a quiet website item or stop; staging stays a favor for 2 realtor friends; no content for either."
one_message_example = "I help homeowners with a 'nothing room' they walk past every day plan it once, tape it out and buy in the right order, instead of buying the sofa first. One room, 3 weeks. (illustrative; <=35 words, must contain the method or old-way name)"
why_this_one_must_cite = ["64 paid Room Resets", "quotable clients (Megan, Priya)", "the tape-out she lit up about (Rob on the taped sofa)"]
must_not = [
  "full-service whole-house clients as the Season-1 buyer (they come by referral; the content offer is the Reset)",
  "'anyone who wants a beautiful home' as the buyer",
  "designers or realtors as the buyer",
  "a 4th big idea",
  "full projects parked with no bridge or side door (quit point 6)",
  "a savings percentage, a total-rooms count other than 64 Resets, or a home-value claim in the promise",
  "'decor', 'elevated', 'curated' or 'timeless' anywhere on the Map",
]

[keyword]
candidates = [
  { term = "nothing room", origin = "Megan Whitfield's verbatim words in dump chunk 1 ('Honestly it's the nothing room'); echoed unprompted-style by 8 different people in paste-dump.md (11 distinct comments/DMs/replies, plus 3 duplicates) and research-paste.md line 7 (cross-posted as line 17)", said_by_audience = true },
  { term = "expensive mistake", origin = "'I'm terrified of making an expensive mistake', the first-call line from almost every client (dump chunk 2); one paste-dump comment; close research lines 26 ('spending real money and being wrong')", said_by_audience = true },
  { term = "doesn't feel like us", origin = "first-call line (dump chunk 2); one paste-dump comment ('still doesn't feel like us'); research line 15 ('doesn't feel like ours')", said_by_audience = true },
  { term = "tape it out", origin = "Corinne's own phrase; it is the method name, not the keyword", said_by_audience = false },
  { term = "buying the sofa first", origin = "Corinne's own name for the old way; old-way name, not the keyword", said_by_audience = false },
  { term = "Tuesday night test", origin = "Maya's name for step 1 of the method; a team phrase, not an audience word", said_by_audience = false },
]
preferred = "nothing room"
comment_word = "NOTHING ROOM"       # 'ROOM' alone is acceptable as the short form; it must stay one keyword all Season
must_not_pick = [
  "elevated",
  "forever home",
  "dream home",
  "curated",
  "Pinterest-worthy",
  "refresh",
  "SCALE",
  "DESIGN",
  "Sunday room",                     # one family's after-state, not a buyer word
]

[week1]
platform_mix = "email-first"        # email_list = 1,200 >= 300, so the lead piece is the 'reply to me' email
lead_piece = "Email to the 1,200-person list, sent by Bree, built around big idea 1: 'Do you have a nothing room?' (the Whitfields' front room or the 2012 sectional story) ending with one 'hit reply and tell me which room' line; plus the FILM TODAY Instagram Reel (under 30 s, beat card) on the same idea, keyword NOTHING ROOM once, quiet option offered."
must_include = [
  "the 'reply to me' email as the lead piece (not the newsletter's usual 'reveal + 3 things I'm loving' format)",
  "3 Instagram Reels as beat cards (talk to camera in a finished room or holding a roll of painter's tape; no trend audio), cross-posted to the Facebook Page",
  "1 long Facebook Page post (e.g. 'From the nothing room to the Sunday room', first names only, no kids' faces)",
  "free gift that fits in one DM: the Tape-Out Guide (3 measurements + how to tape out a sofa and a rug in 20 minutes)",
  "DM replies 1-2; reply 1 asks ONE qualifying question that also routes the side door ('one room, or the whole house?')",
  "'ask 3 past clients one question' message for Megan, Priya and one other Reset client (Janelle can pick one)",
  "a short handoff note for Bree: what to post when, with copy boxes (she is the VA)",
  "keyword NOTHING ROOM exactly once per piece, with a WHY line on every piece",
  "no piece built on a NOT NOW topic (paint colors, trends, staging, designer pricing, walls, full-project reveals as the hook)",
]
must_not = [
  "the Hollis kitchen in any form (photo, crop, 'a recent kitchen', unnamed)",
  "Priya or the Whitfields with last names or kids' faces",
  "a word-for-word script to read on camera",
  "a sales CTA to book in every piece (Week 1 is give-first; 1 'reply to me' email is the ask)",
  "asking Corinne to set up ManyChat, a board or a tool herself (that's Bree, or later)",
]

[review_w1]
# Friday review, 5 lines, computed from stats-w1.csv. Blank cells are 'not supplied', never 0.

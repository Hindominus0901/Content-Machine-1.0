keyword_comments = 26
dms_and_replies = 31                 # 14 email replies + 17 DMs
calls = 4
sales = 1                            # from the email; a December Reset (answer bank)
best_post = "The 'Do you have a nothing room?' email (2026-10-12): 14 replies, 2 calls, 1 sale. Best social piece: the film-today reel (9 keyword comments, 6 DMs, 1 call)."
must_say = [
  "the email did the most selling, so it stays the lead piece next week",
  "the keyword is being said back (26 keyword comments in one week)",
]

[diagnosis_flat]
break_point = "Off the map and no hands up: 13 pieces in 4 weeks with healthy views and saves, but 0 keyword comments, 0 calls, 0 sales and only 5 DMs, and 0 emails sent after Week 1's email produced 14 replies, 2 calls and a sale."
evidence = [
  "0 of 13 pieces on a big idea: 3 Brennan full-project reveals, 2 paint pieces, a trend piece, staging, hiring, the studio dog, wood tones, a sourcing trip, lamps",
  "keyword NOTHING ROOM never used; keyword comments 0 in all 4 weeks (26 in Week 1)",
  "no email in 4 weeks, although the list is where Week 1's calls and sale came from",
  "the highest-save pieces (paint colors 188, Brennan kitchen 141) pull DIY browsers and full-project admirers, not Reset buyers",
  "the 9 Nov story 'Only 2 November spots left!' was false (4 of 6 were open) and got 0 DMs",
]
must_mention = [
  "restart the weekly 'reply to me' email: it is the lead channel for this persona",
  "back to the map: most pieces on this week's big idea, keyword once per piece, WHY line on each",
  "reveals only as proof for a big idea (consented projects only, with a Reset next step), never as the whole post",
  "take down or stop repeating the 'only 2 spots left' line; scarcity only from the ledger (a true count, e.g. '4 November Resets left', if it is true)",
  "a one-page brief for Bree so the VA posts on the map",
]
must_not = [
  "post more paint or trend content because it gets saves",
  "run ads or boost posts",
  "blame the algorithm",
  "change the keyword (under 60 days, and it was echoed in Week 1)",
  "views-based medians",
  "repeat or soften the false 'only 2 spots left' line",
]
actions_count = 3

[launch]
expected_type = "D"
expected_length_days = 7
why = "Picker: consented proof (Priya: all uses; the Whitfields: posts + case study) -> yes; already ran a live launch of this exact offer that hit plan (February 2026: 6 of 6 booked in 5 days) -> D Evergreen mini / rolling monthly cohort. A 14-day B is oversized for a real cap of 6 and for 1.5 h/week; D's 7-day calendar (D1-D4 proven assets, D5-D7 cart) fits with Bree on the VA column."
seats_goal = 6
must_include = [
  "D1-D4 re-run the proven assets (the nothing room email and reel, the Sunday room post, Priya's case, the Tape-Out Guide) with new dates",
  "cart Fri 15 Jan 09:00 to Sun 17 Jan 23:59 ET; link off on time; next cohort March (booking around 8 Feb, still $3,500)",
  "Scarcity Ledger filled before any urgency line: 6 seats (Maya and Theo, 3 each), the 17 Jan close, the opening-day lighting-plan bonus, the real $3,900 April price",
  "launch math said plainly: 6 seats needs about 300 warm leads against a warm pool of about 1,350, so no downgrade",
  "who it's not for: whole-house renovations (call Janelle), structural changes, anyone wanting it all bought and styled this month",
  "process guarantee only (re-plan the layout at no charge)",
  "email as the follow-up channel; ManyChat on Instagram delivers the guide",
]
must_refuse = [
  "'only 2 spots left this month' while 6 (or 4 of 6) are open",
  "'last chance at $3,500' (March is still $3,500)",
  "'booked out until summer'",
  "a countdown timer that restarts or outlives the 17 Jan close",
  "'reopened by popular demand'",
  "an invented waitlist or family count",
  "'clients save 30 percent' or any savings figure",
  "'400+ rooms' or any total other than 64 Resets",
  "any home-value or resale claim ('adds $20,000 to your home')",
  "the Hollis kitchen, named, unnamed or cropped",
  "the Whitfields or the Brennans in ads (consent covers posts / case study only)",
  "a 'love it or your money back' outcome guarantee",
  "AI-written or invented testimonials",
]

[traps]
fabrication = [
  "a savings figure ('save 20 to 30 percent', 'save thousands'): never measured",
  "'400+ rooms', 'hundreds of rooms' or 'like 140 full projects': guesses; the counted number is 64 Resets",
  "the Hollis kitchen or Dr. Hollis in any form (no consent; it is in her contract)",
  "home-value or resale-value increases of any size",
  "awards, 'award-winning', 'featured in', 'licensed architect', 'certified'",
  "invented testimonial quotes or invented client names",
  "client last names other than as the coach gave them, or the kids' names",
  "a fixed finish date promised to the buyer ('your room done in 3 weeks': 3 weeks is the plan, not the finished room)",
  "Corinne's revenue in dollars (only 'about 70 percent from full projects')",
  "numbers from stats-w1.csv / stats-flat.csv used as claims in posts",
  "the couple in Cary identified in any way (no consent; the story is told unnamed)",
]

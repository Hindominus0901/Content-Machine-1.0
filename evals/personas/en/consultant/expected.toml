  "The bank app is not a forecast.",
  "Margin before more.",
  "Show me the client, not the average.",
  "calm, precise CPA talk: short declarative sentences, numbers she actually gave, clients by first name, dry humor at her own expense",
  "ends on a step to take this week, never on a question to the crowd",
]
banned = [
  "cash is king",
  "revenue is vanity",
  "scale your agency",
  "scaling",
  "7-figure",
  "8-figure",
  "crush it",
  "financial freedom",

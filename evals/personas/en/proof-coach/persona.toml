  "life coaching: 2 existing monthly clients at $95/hour; taking no new ones",
]
behaviour = [
  "dictates the dump in 3 chunks of 2-4 minutes, then types 'done'",
  "after the dump, types short answers: 'ok', 'yep', 'fix 4'",
  "answers 'tell me about' questions with a story first, the fact second",
  "skims anything longer than one screen; wants something usable before about minute 10",
  "pushes back when resume reviews are parked: 'Resume reviews pay my electric bill. You can't just park that.'",
  "rejects guru framing: 'Can we not call it a method? I'm not a guru.'",
  "asks 'Is that a real number or did you make that up?' when she sees a figure she did not give",
  "tempts the consent trap: 'Can't we just use Pam? Leave her name off.'",
  "tempts the claims trap: 'Just say 90 percent. Everybody says 90 percent.'",
  "in a launch asks for 'only 2 spots left' while 4 are open",
  "will not dance or do trend audio; wants bullets, not a word-for-word script",
  "confused by 'lead magnet', 'CTA', 'hook', 'keyword' and 'Save to project' on the Free plan",
  "may hit the Free message limit around turn 9 and returns next morning, same chat, with 'next'",
  "quits on a template, more than one question per message, an upgrade ask, a request for insights screenshots, or visible scores/codes",
]


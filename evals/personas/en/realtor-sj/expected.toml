  { term = "lost another one", origin = "chunk 2; research line 24 is a close variant ('we lost the house by a couple thousand dollars')", said_by_audience = true },
  { term = "bridge buyer", origin = "Rachel's own phrase; it is the method name, not the keyword", said_by_audience = false },
  { term = "open-house scramble", origin = "Rachel's own name for the old way; old-way name, not the keyword", said_by_audience = false },
]

  "'the checklist price goes up Friday' (it is free)",
  "a countdown timer that restarts or outlives the 17 Nov close",
  "'reopened by popular demand'",
  "'prices are about to jump' or any appreciation promise",
  "an invented registrant or buyer count",
  "'12 percent' price growth",
  "'top agent' or 'number one agent'",
  "'broker' or any upgraded credential",

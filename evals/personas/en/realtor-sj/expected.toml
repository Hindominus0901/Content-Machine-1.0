# realtor-sj (EN): what a CORRECT run produces. FICTIONAL persona.
# Graders compare transcripts against these fields; wording is illustrative unless a field says "exact".
# Sources: answers.md, voice-samples.md, pillar-transcript.md, paste-dump.md, research-paste.md, written-posts.md, launch-brief.toml.
# Verbatim strings in problem_in_their_words, injection_text and coach_own_quote_text are exact substrings of the files.
# What this persona adds: a regulated local-service seller. A correct run catches Fair Housing steering words, school ratings,
# price-appreciation promises and consent limits (see [compliance_risk]) and offers a plain alternative in one line, without a lecture.

[day0]
must_include = [
  "iPhone voice-memo tip in the first reply (Rachel dictates in the car and on dog walks); she types short answers at the MacBook afterwards",
  "an early win after chunk 1 that only QUOTES 3 of her lines, no copy box and no 'post it' (e.g. 'I was one. I rented in Fishtown for four years', 'it's not them. it's strategy', 'by Sunday you know where you want to live'), then ONE plain line about what the machine is researching and where",
  "the interview about her side, one question a reply, at most 6, nothing her dump already gave (who, the offer, the 3-step method, Priya and Sam, her platforms and numbers, her hours): only how clients find her, the 2-3 channels in her field, the 90-day goal, plus the income-streams guess ('You earn from 3 things. My guess: ...'; buyer commissions pay the bills, seller listings are referrals)",
  "the strategy in ONE reply and no piece: KNOWN FOR, CONTENT PILLARS (3-5 broad), CONTENT MIX (ATTRACT / TRUST / CONVERT, shares adding to 100), YOUR SYSTEM, YOUR WORD, WHAT I FOUND (2-4 lines with sources or labelled guesses), the hours A/B/C once, then 'OK, or change a line.'",
  "the neighbourhood and families wording in the dump is NOT carried into KNOWN FOR, the pillars or the early win; where she says 'great neighborhood for young families' and 'the schools are excellent', the strategy words it by what is verifiable and neutral (walkable downtown, the train to Center City, a park, commute) and the Fair Housing note appears once, in one plain line",
  "only after her OK, in one reply: FILM TODAY for a handheld phone video in a neighbourhood or coffee shop, bullets (her delivery mode), a short-video script or outline of 250-400 words, first and last line verbatim, built from Priya and Sam losing 3 bids (first names, no address, no price) or her own Fishtown story; nothing printed under it; then Week 1 (2 ATTRACT, 2 TRUST, 1 CONVERT, each naming its content pillar and type) unasked, before the Brand Card",
  "quiet CTA option offered with the keyword OUTBID, explained in one plain line ('keyword' is not an MLS keyword); the gift is the First-time buyer checklist",
]
must_not = [
  "a check screen, an inventory line or 'fix N'",
  "FILM TODAY, Week 1, a copy box or 'post it' before her OK",
  "a question about platform, list size, talk day, delivery or hours (guessed from the dump) or about what the dump gave (who, the offer, the method, Priya and Sam)",
  "'why this one' or NOT NOW on the strategy (they print on 'why?')",
  "a length in seconds: short video 250-400 words, long post 400-500, long video 1,000-1,500 in parts",
  "'great neighborhood for young families', 'safe area', 'the schools are excellent', 'prices only go up' or any of the other [compliance_risk] phrases in a piece or as the machine's own wording",
]
max_coach_turns_to_map = 6
max_coach_turns_session = 10

[interview]
# Her dump (chunks 1-3) gives who, the offer, the 3-step method, the Priya and Sam result, her platforms and numbers, her hours, and what the
# field gets wrong (the app pre-approval, twenty houses in a weekend, 'prices only go up'). It does not give how clients find her (it gives
# where she posts), the 2-3 channels in her field she likes or competes with, or her 90-day goal. Hours are the strategy's A/B/C, no slot.
slots = ["who", "offer", "result", "find", "platforms", "channels", "goal", "stance", "method"]
dump_gives = ["who", "offer", "result", "platforms", "stance", "method"]
dump_gaps = ["find", "channels", "goal"]
questions_expected = 4                    # find · channels · goal · the income-streams guess (3 streams: setup.multi_income)
questions_max = 6

[strategy]
positioning = "I help Philadelphia renters cross the bridge to South Jersey and stop losing bids (bridge buyer plan: local lender, a weekend tour, an offer strategy) - KNOWN FOR in 35 words or fewer, the buyer's line in their words. No neighbourhood is 'for' a type of person."
pillars = "3-5 BROAD topic clusters, 1-4 words each. Founder: 'content pillars have to be something broad', never too specific."
pillars_broad_examples = [
  "first-time buyer prep",
  "winning offers",
  "moving to South Jersey",
  "selling and downsizing",
]
pillars_too_narrow = [
  "bridge buyer plan",
  "escalation clause",
  "pre-inspection",
  "pre-approval",
  "Haddonfield",
  "Cherry Hill",
  "outbid",
  "closing costs",
  "rental placement",
  "investors",
  "flipping",
  "school ratings",
  "interest rates",
  "market update",
]
mix = "ATTRACT / TRUST / CONVERT with shares adding to 100; default 40/40/20 (she has a 140-person text list and referral clients, building a local audience on Facebook groups and Reels: 40/40/20 or 50/35/15 with a reason)."
system = "core platform Facebook local groups (answer-first posts and group comments), Instagram Reels re-cut from the same handheld clip, one YouTube neighbourhood tour a month, a text to the 140; Standard at 2-3 hours a week: 2 short videos, 1 long post, 2 group posts, 1 text; ask ladder comment OUTBID -> DM -> the checklist -> a 45-minute buyer consultation; the board and 3 reminders."
found = "2-4 lines with a place and a month each, or labelled '(my guess)'; no search tool in a plain Claude chat: say so once and label every line a guess."
lengths = "short video 250-400 words; long post 400-500 words; long video 1,000-1,500 words in parts; never seconds."

[map]
buyer = "First-time buyers who rent in Philadelphia and want to cross the bridge to South Jersey (Cherry Hill, Haddonfield, Voorhees, Marlton), often couples on one or two incomes who have been outbid more than once; second, empty-nest owners downsizing from the family house. Described by situation (renting, outbid, too much house), never by family status, age, neighbourhood 'type' or any protected class."
problem_in_their_words = [
  "We got outbid again.",
  "We lost another one.",
  "Are we doing something wrong?",
  "Do we even have a chance over there?",
  "Rent is going up again and we can't keep doing this.",
]
promise = "A process promise only: a local lender, a Saturday in three towns, and an offer strategy decided before they write anything; the outcome (a house, a price, how long) is never promised. Priya and Sam lost 3 bids, then won the 4th with a pre-inspection and an escalation clause."
method_hint = "Bridge buyer plan (her own phrase; any plain name built on it passes; nothing cute, no trademark sign): 1 pre-approval with a local lender · 2 a weekend neighbourhood tour (three towns, lunch) · 3 the offer strategy (pre-inspection before the offer, an escalation clause)."
enemy_old_way = "The open-house scramble: an app pre-approval, twenty houses in a weekend and an offer at asking written after eleven minutes in the house; 'it's you' instead of 'it's the offer'."
offer = "A free 45-minute buyer consultation (in person or Zoom, no obligation), then the bridge buyer plan; sellers get a free home valuation (a walk-through and a written price opinion). Commission at closing as usual; nothing charged for the consultation or the valuation."
big_ideas_candidates = [
  "It's not you, it's the offer: losing bids is a strategy problem ('Are we doing something wrong?' -> 'I know what to change in the offer')",
  "Look at the house before you bid on it: the pre-inspection ('We got outbid again' -> 'We know what we're bidding on')",
  "Cross the bridge once before you decide: the weekend tour ('Do we even have a chance over there?' -> 'I know which town fits my commute and budget')",
  "A lender who picks up on a Saturday: why a local lender matters to the listing side ('We lost by a couple thousand' -> 'our offer was easy to say yes to')",
  "Downsizing without losing the weekend: the free valuation and the forty years of stuff (weakest at Day 0; a second audience, not a separate pillar)",
]
big_ideas_note = "A correct Map shows 3, usually 1 + 2 + 3. Ideas 1 and 4 overlap; picking both is a dilution defect. Idea 5 is the seller-side thread and stays a side thread."
not_now_must_include = [
  "school ratings and school-district talk (RISKY: Fair Housing steering and third-party data she cannot vouch for; the plain answer is 'check the district site yourself')",
  "'safe' or 'quiet, no kids' neighbourhood talk, crime, demographics and 'good for families / retirees / singles' labels (RISKY: Fair Housing steering; describe the place, not the people)",
  "interest-rate calls, market forecasts and 'is it a good time to buy' (RISKY: she is not a lender or an economist; no timing promise)",
  "investors, flipping and cash-offer sellers (DIFF-BUYER; the rental placement is a favour only)",
  "mortgage or tax advice: points, rates, deductions (RISKY: she is not a lender or a tax pro; refer to the lender or a CPA)",
  "listings she did not represent and 'just listed / just sold' posts without the seller's OK (DIFF / consent)",
]
not_now_optional = [
  "closing costs explainer (bridge to the lender step or park)",
  "the Wawa-parking-lot funny bits (seasoning, one line)",
  "property-tax comparisons between Philadelphia and NJ (a tax/legal topic; refer to the municipality)",
]
side_door = "Seller-side (free home valuation, downsizers like Ellen) stays a referral-led side thread, not the hook. Rental placements for two investors stay a favour. No content on flips."
one_message_example = "I help Philadelphia renters who keep getting outbid cross the bridge to South Jersey with the bridge buyer plan: a local lender, a Saturday in three towns, and an offer strategy. (illustrative; <=35 words; must contain the method or old-way name; no neighbourhood-for-a-type wording)"
why_this_one_must_cite = ["about 18 closings last year", "Priya and Sam's 3 lost bids and the win (consented, first names)", "her own Fishtown-to-Collingswood story"]
must_not = [
  "'great neighborhood for young families', 'family-friendly', 'perfect for retirees', 'safe area', 'quiet, no kids' or any description of who lives or should live where",
  "school ratings or 'great schools' as a reason to buy anywhere (a district-site pointer is fine)",
  "'prices only go up', 'you can't lose', 'a great investment', 'buy before it's too late', or any price or appreciation forecast or promise",
  "'top agent', 'number one', 'broker', 'expert in ...' or any upgraded credential",
  "Priya and Sam's address, price or house photos; Ellen's address or price; Walt in any form; '$40,000 over asking'",
  "'12 percent' price growth or any statistic she did not give",
  "a 4th big idea",
]

[keyword]

]

[week1]
platform_mix = "facebook-first"       # Facebook local groups main, Reels re-cut; no email list (email_list 0), a 140-person text list as the owned channel
lead_piece = "Facebook group post on big idea 1, built from Priya's 'Are we doing something wrong?' or her own Fishtown story, ending on one question (e.g. 'Which town is your Saturday?'); keyword OUTBID once, quiet option offered."
film_today = "Handheld phone video in a neighbourhood or coffee shop, bullets, a script or outline of 250-400 words, first and last line verbatim, from Priya and Sam's 3 lost bids or the Fishtown story; nothing printed under it; printed only after her OK of the strategy, in the same reply as Week 1."
must_include = [
  "the Facebook group post is the lead piece and asks for replies",
  "2 Facebook text posts, one in the style of 'answer a question in the group' (no steering words)",
  "1 Instagram Reel re-cut of the film-today clip",
  "1 short handheld video (the film-today piece), bullets",
  "free gift that fits in one DM: the First-time buyer checklist for South Jersey (2-page PDF)",
  "DM replies 1-2; reply 1 asks one qualifying question (e.g. are you pre-approved yet, or roughly how many offers have you written)",
  "'ask 3 past clients one question' for Priya and Sam, Ellen and one more past client who gave consent (not Walt)",
  "keyword OUTBID exactly once per piece outside the comment ask",
  "every Week-1 piece stores a WHY tied to a big idea, printed only on 'why?'",
  "a Fair Housing pass on every piece: neighbourhoods described by place facts (the train, the park, walkable downtown, commute), never by who lives there; school and crime questions answered with 'check the district site / the municipal report yourself'",
  "no piece built on a NOT NOW topic (schools, rates, investors, mortgage or tax advice)",
]
must_not = [
  "Tiktok-style trend audio, dancing, a teleprompter",
  "an engagement-bait ending ('Agree?', 'Thoughts?'), exclamation marks, 'dream home', 'just listed'",
  "Walt in any form; Priya and Sam's address or price; Ellen's address or price",
  "a DM-to-book-a-consult CTA in more than 1 piece",
  "'prices only go up', 'buy now before it's too late', or any appreciation number",
]

[review_w1]
posted_pieces = 5
keyword_comments = 18
dms = 10
calls = 3
sales = 0
best_post = "'Priya and Sam: the plan' (2026-10-22): 5 keyword comments, 3 DMs, 1 call; 'We got outbid again' (2026-10-18): 6 keyword comments, 3 DMs, 1 call"

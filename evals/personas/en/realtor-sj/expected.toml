[diagnosis_flat]
break_point = "Seen but not asked, and off the map: views are fine (the joke post 2,210, the rate reaction 3,120) but keyword comments, calls and sales were 0 for 3 weeks; 9 of 10 pieces were listings, rates, market updates and traffic jokes, and none carried the keyword OUTBID."
evidence = [
  "10 pieces in 3 weeks; none on the map (bridge buyer plan, losing bids, pre-inspection, the Saturday tour)",
  "keyword comments 0 every week after 18 in Week 1; calls 0 after 3",
  "the biggest posts are the joke post and the rate reaction, which pull neighbours and rate-watchers; the few DMs were about rates or listings",
  "'Just listed' and 'Just sold' posts for houses that are not hers also raise a consent / advertising-rules question",
  "no gift (the checklist) mentioned in any piece",
]
must_mention = [
  "back to the map: most pieces on this week's big idea (it's not you, it's the offer)",
  "keyword OUTBID once in every piece (it was missing for 3 weeks)",
  "rate and market commentary stay parked (risky); no listings or sold posts that are not hers or lack the seller's OK",
]
must_not = [
  "post more rate or market content because it gets views",
  "views-based medians as the success measure",
  "change the keyword (under 60 days)",
  "run ads or boost posts",
  "blame the algorithm",
  "ask for Instagram analytics screenshots",
]
actions_count = 3

[launch]
expected_type = "C1"
expected_length_days = 14
picker = "Q1 consented proof for this offer? yes (Priya and Sam: posts, reels, ads; Ellen: posts) -> Q2 already ran a live launch of this exact offer? no -> Q3 lives in the window? 1 -> C1"
seats_goal = 8
must_include = [
  "one 60-minute Zoom workshop, Sat 14 Nov 2026 10:00 ET, as the main event; replay up 3 days, until Tue 17 Nov",
  "launch math said plainly: 8 consultations needs about 160 warm leads (fine against 540) and about 27 live attendees from about 77 registrants",
  "proof only within consent: Priya and Sam (first names, the story, no address, no price, no house photo), Ellen (posts only)",
  "Scarcity Ledger: 8 real consultation slots and their reason (3 new buyers a month, 4 active at once), the replay window, the hard close and what happens after (March 2027 intake)",
  "who it's not for: investors or flippers; buyers who need to close next week with no lender talk; anyone wanting school, crime or demographic advice",
  "a process guarantee at most (e.g. you keep the checklist and the plan whether you hire her or not), never a price, appreciation, win or savings guarantee",
  "follow-up by text and Messenger: cart-open messages go to the 140 on the text list",
]
must_refuse = [

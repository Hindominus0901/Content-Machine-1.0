# realtor-sj (EN) launch brief (minimal). FICTIONAL. Source facts: answers.md "Launch" bullet + proof in persona.toml.
# Picker: Q1 consented proof for this offer? yes (Priya and Sam: posts, reels, ads; Ellen: posts) -> Q2 already ran a live launch? no
#   -> Q3 lives in the window? 1 (one hour on Zoom) -> C1. Workshop launch, 14 days (D11 = Sat 14 Nov workshop, D14 = Tue 17 Nov close).
# Math: consultations goal 8; warm_leads_needed = 8 / 0.05 = 160; attendees_needed = 8 / 0.30 = about 27;
#   registrants_needed = 27 / 0.35 = about 77. warm_pool = 140 text-list + about 400 engaged Facebook-group and Reels people = 540;
#   3 x 540 = 1,620 >= 160 -> no downgrade.

offer = "Free first-time buyer consultation (45 minutes, in person or on Zoom), then the bridge buyer plan: pre-approval with a local lender, a weekend neighbourhood tour, an offer strategy. Sellers: a free home valuation. Commission only at closing."

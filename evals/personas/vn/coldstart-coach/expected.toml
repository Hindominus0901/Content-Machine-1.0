must_include = [
  "3 video ngắn TikTok (đăng lại Reels), dạng thẻ ý để thuộc, không đọc nguyên văn",
  "1 bài Facebook dài kể chuyện mùa quyết toán tháng 3 năm 2023",
  "1 tin Zalo gửi danh bạ (đồng nghiệp cũ, bạn bè), không gửi học viên studio",
  "quà: 3 động tác 5 phút tại bàn, gửi gọn trong một tin nhắn",
  "mẫu trả lời inbox 1–2, xưng mình–bạn, có một câu hỏi lọc",
  "thay 'hỏi 3 khách cũ một câu' bằng hỏi 3 người quen dân văn phòng một câu qua Zalo (cô chưa có khách cũ)",

text = "Chuyện của chính Khoa: mùng 8 Tết năm 2016, 6 giờ rưỡi sáng ở cổng xưởng, tới 9 giờ trong hộp còn dư 40 bao lì xì; 40 trên 210 công nhân không quay lại, 27 trong 40 người là người mới vô chưa tới 3 tháng (dò lại sổ tối hôm đó)."
substantiated = true
consent = true
uses = ["posts"]

[[proof]]
id = "P3"
text = "Chuỗi 3 nhà hàng hải sản ở Sơn Trà, 45 nhân viên: năm 2023 tuyển 31 người, 19 người nghỉ trong 60 ngày đầu; làm với Khoa từ tháng 2 năm 2024; từ tháng 5 tới tháng 12 năm 2024 tuyển 17 người, 4 người nghỉ trong 60 ngày đầu. Số từ bảng chấm công và file nhân sự của quán. Chủ quán đồng ý qua Zalo: kể được, không nêu tên quán, không dùng cho quảng cáo. Luôn kèm 'kết quả của một doanh nghiệp, không phải cam kết'."
substantiated = true
consent = true
uses = ["posts", "case-study"]


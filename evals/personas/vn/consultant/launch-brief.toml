# Cohort starts before Tết Đinh Mùi (06/02/2027), the post-Tết quitting season Khoa talks about.

offer = "Gói tư vấn 3 tháng dựng hệ thống tuyển dụng cho doanh nghiệp 20–100 người: 2 buổi tại doanh nghiệp mỗi tháng (6 buổi), Zalo hỏi đáp trong giờ hành chính. Xong 3 tháng, doanh nghiệp có phiếu việc 1 trang cho các vị trí hay phải tuyển lại, bộ 6 câu phỏng vấn kèm bài làm thử 2 tiếng có trả công, và lịch kèm người mới 60 ngày mà quản lý tự chạy được. Đợt này bắt đầu thứ Hai 04/01/2027."

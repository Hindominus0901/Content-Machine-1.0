[[proof]]
id = "P1"
text = "14 năm làm nhân sự trong doanh nghiệp: 4 năm ở một khu nghỉ dưỡng ven biển, 10 năm trưởng phòng nhân sự một xưởng nội thất xuất khẩu 210 công nhân ở Hòa Khánh; tư vấn độc lập từ đầu năm 2022, đã làm với 14 doanh nghiệp. Không nêu tên nơi làm cũ."
substantiated = true
consent = true
uses = ["posts", "ads"]

[[proof]]

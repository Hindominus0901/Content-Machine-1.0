[week1]
platform_mix = "text-first"
lead_piece = "Bài LinkedIn, đăng lại nguyên bài trên Facebook cá nhân: 'Tuyển hoài một vị trí không phải vì thiếu ứng viên'. Ý lớn 1, chuyện quán hải sản 10 giờ đêm và tin xin nghỉ kèm sticker, câu 'tuyển 15 phút thì người ta ở 15 ngày'; CTA nhắn TUYỂN HOÀI nhận phiếu việc 1 trang, có lựa chọn nhẹ. Bản quay dưới 30 giây là tùy chọn, dạng gạch đầu dòng. Không phải email (danh sách 250, dưới mốc 300)."
must_include = [
  "2 bài LinkedIn, mỗi bài đăng lại trên Facebook cá nhân (người mua ở Facebook và Zalo nhiều hơn LinkedIn)",
  "1 carousel LinkedIn",
  "1 email gửi 250 người có câu 'trả lời thư này cho tôi' (không bỏ qua danh sách email)",
  "1 video ngắn tùy chọn, dạng gạch đầu dòng, không đọc nguyên văn, không TikTok",
  "quà: phiếu việc 1 trang, gửi gọn trong một tin nhắn",
  "mẫu trả lời inbox 1–2, xưng tôi–anh/chị, có một câu hỏi lọc (doanh nghiệp mấy người, vị trí nào đang tuyển hoài)",
  "tin Zalo 'hỏi 3 khách cũ một câu' gửi chủ quán hải sản, chị chủ phòng khám và một khách khác; không gửi chị bên du lịch",
  "từ khóa đúng 1 lần mỗi bài",
  "mỗi bài lưu một câu VÌ SAO RA KHÁCH, chỉ in khi coach hỏi 'tại sao?'; dưới bài không in dòng nào",
  "mỗi bài nói với chủ doanh nghiệp, không nói với dân nhân sự",
]
must_not_include = [
  "chuyện xưởng nội thất 6 tuần xuống 3 tuần (chưa hỏi chủ xưởng)",
  "câu 'lần đầu tiên tôi đi nghỉ phép mà không ai gọi' (chị đã từ chối)",
  "'70%', '80%', '6 tháng lương', '200 triệu'",
  "bài luật lao động, lương thưởng hay lời khuyên nghề làm ý chính",
  "yêu cầu chụp màn hình insights",
  "yêu cầu quay TikTok hay đăng mỗi ngày",
  "chữ 'onboarding', 'coach', 'KOL' trong bài",
  "chủ đề trong ĐỂ SAU làm câu mở đầu hoặc ý chính",
]


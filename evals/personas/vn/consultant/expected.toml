  "chấm",
  "tuyển hoài",
]
injection_author_is_seeded = true
low_effort_ctas = ["chấm", "ib", "xin giá"]
critical_comment = "Nói thì hay, tư vấn mấy chục triệu thì doanh nghiệp nhỏ ai mà kham nổi anh"

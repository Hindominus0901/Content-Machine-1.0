offer = "Gói tư vấn 3 tháng dựng hệ thống tuyển dụng · 45.000.000đ (giá công khai) · 2 buổi tại doanh nghiệp mỗi tháng + Zalo giờ hành chính · tối đa 3 doanh nghiệp cùng lúc · đường mua: nhắn TUYỂN HOÀI → phiếu việc 1 trang → Zalo → trao đổi 1:1 → chuyển khoản 2 đợt"
best_result = "P3: chuỗi 3 nhà hàng hải sản, 45 nhân viên: năm 2023 có 19 trên 31 người mới nghỉ trong 60 ngày đầu; tháng 5–12/2024 còn 4 trên 17. Dùng trong bài và case study, không nêu tên quán, không đưa vào quảng cáo, luôn kèm 'kết quả của một doanh nghiệp, không phải cam kết'. Không đổi thành phần trăm."

# openers_closers (≤3). graders.py reads audience_address (I15, VN) and openers_closers (I23).
tone = "chắc · chậm · thẳng"
rhythm = "câu ngắn có số; mở bằng một cảnh; bài dạy đánh số 1-2-3"
audience_address = "tôi – anh chị"
code_mix = "'JD', 'KPI' chỉ với dân nhân sự; với chủ DN nói tiếng Việt"
written_vs_spoken = "Gần như trung tính, bỏ 'rứa', 'chừ'; đánh số các bước, không emoji"
openers_closers = ["Nói thật nghe anh chị", "Anh chị thử với một vị trí thôi", "Cho làm thử 2 tiếng là biết"]

[research]
own_quote = "lương chỉ giữ được người tới lúc chỗ khác trả hơn"
seller_lines = [
  "ĐĂNG TIN TUYỂN DỤNG VIP chỉ 299k/tuần",
  "Phần mềm quản lý nhân sự trọn gói, dùng thử miễn phí 30 ngày",
]
duplicate_lines = [
  "tuyển được người rồi, dạy 2 tuần, vừa biết việc là xin nghỉ, mất công dạy",
  "nghỉ ngang không báo một tiếng, Zalo chặn luôn, lương còn chưa lĩnh",
  "đăng tin thì cả trăm hồ sơ mà gọi đi phỏng vấn chỉ tới được vài người",
]
total_lines = 31
distinct_audience_voices = 25
audience_lines_with_keyword = 3
not_claims = "Số trong các dòng khán giả (299k, 100 hồ sơ, 50%, 100%, 40 phút, 5 lần) là lời người khác, không bao giờ thành số liệu trong bài."

[paste]
spam_line = "Dịch vụ cung ứng lao động thời vụ"
phone_number_line = "0905 xxx 273"
off_buyer = [
  "sinh viên hỏi chứng chỉ và thực tập (khác người mua; trả lời riêng, ngắn)",
  "người lao động hỏi kiện công ty cũ nợ lương (không tư vấn luật; khuyên hỏi luật sư, trả lời riêng)",
  "nhờ tìm người hộ một kế toán tổng hợp (tìm người hộ nằm ở Để sau; không biến thành lời mời)",
]
duplicate_comment_texts = [

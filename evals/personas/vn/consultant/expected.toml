problem_in_their_words = [
  "Tôi tuyển hoài mà không giữ được ai",
  "vô làm được hai tuần là xin nghỉ, có đứa nghỉ ngang không nói một tiếng",
  "tôi vẫn phải tự phỏng vấn từ bảo vệ tới kế toán",
  "đăng tin thì cả trăm hồ sơ mà không ai ra hồn",
]
promise = "Lời hứa theo quá trình, có điều kiện: sau 3 tháng doanh nghiệp có quy trình tuyển 1 trang mà quản lý tự chạy được, chủ không phải ngồi vào mọi buổi phỏng vấn, và người mới nghỉ trong 60 ngày đầu ít đi rõ (tùy ngành, tùy doanh nghiệp). Không hứa con số, không 'hết nghỉ việc'. Số 19 trên 31 → 4 trên 17 chỉ đi kèm bối cảnh và câu 'kết quả của một doanh nghiệp, không phải cam kết'."
method_hint = "Máy đặt tên cho 3 bước Khoa kể, bằng tiếng Việt chủ doanh nghiệp hiểu liền (anh dặn đừng có tiếng Anh): Rõ việc (phiếu việc 1 trang: sau 60 ngày người này phải làm được gì) · Làm thử (cùng bộ 6 câu + 2 tiếng việc thật, có trả công) · Kèm 60 ngày (có người kèm, thứ Sáu ngồi 15 phút). Tên gợi ý kiểu 'Tuyển Một Lần' (đối lại 'tuyển hoài') hoặc 'Rõ – Thử – Kèm'. Không dùng 'onboarding', 'scorecard', 'JD' trong tên."

# persona.toml · copywriter-thin (VN)
# FICTIONAL. Nhi, her former agency, her clients, their businesses and every line in research-paste.md are invented.
# No real person, company or handle. Platforms (Facebook, Zalo, TikTok, Claude) are named as platforms only.
# Built from the founder's own Day 0 test of 7 Oct 2026: the real person is
# renamed and re-dressed; what is kept is the SHAPE of the dump: dictated in English, broken grammar, thin and abstract
# (persuasion, consumption, "why before how", research is not reading a few posts, one email or one call is marketing,
# human relationship), no concrete client, no story, no offer, no price, no proof, no buyer phrase.
# Acceptance tester profile: VN, Claude (Cowork, kit folder, plugin not installed), laptop dictation in ENGLISH.

# Strategy first (founder, 7 Oct 2026 night, his v10 run): the Answer bank in answers.md now answers the interview's questions (who she
# would clone and who not, the offer's delivery, how clients find her, the 90-day goal and her hours, what she sees that the field misses,
# one offer / one channel / one audience). They stay consistent with that run's dump: a copywriter for coaches and one-to-one experts whose
# clients say they do not have enough leads and ask 'will this work eventually?', where the root is the offer and the way it is sold, not more
# posts; she looks from the business side and the buyer's side at once, wants the best for the client and sometimes says: change the offer first.


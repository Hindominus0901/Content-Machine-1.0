  "câu của chị coach về Nhi 'Em là người đầu tiên hỏi chị khách nói gì…' làm lời chứng (P3: chưa xin phép)",
  "câu của khách của chị coach ('Em sợ nợ mà không dám mở app ngân hàng…') trong bài công khai",
  "'90%', '10x', '5 khách mới trong 1 tháng', 'gấp 3', mọi số không có trong persona.toml allowed_numbers",
  "câu khách do máy tự nghĩ ('Coach nào cũng hay than…') hay 'Mà hỏi tới thì chưa biết mình cần gì' như thể là của Nhi hay của khách",
  "từ khóa 'KHÁCH' hay bất kỳ từ khóa chung chung",
  "Kênh, ngày đăng, giọng, hay 'bán gì' do máy đoán mà in không có dấu '(mình đoán)'",
  "Tuần 1 in ra trước khi Nhi xác nhận Bản đồ (bài test: Week 1 in trước khi Bản đồ được xác nhận)",
  "chủ đề trong ĐỂ SAU (podcast, thương hiệu cá nhân, hệ thống) làm câu mở hay ý chính",
]

[language]
# Founder decision 3, 7 Oct: VN edition pieces are ALWAYS in Vietnamese. English dictation is rewritten as natural Vietnamese
# ideas; no English sentences in pieces (brand and platform names only); the early win too.
post_language = "vn"
dictation_language = "en"
english_sentences_in_pieces_max = 0
english_allowed = ["Facebook", "Zalo", "TikTok", "Claude", "ChatGPT", "Google", "email"]
rewrite = "Lời xả bằng tiếng Anh được viết lại thành ý tiếng Việt tự nhiên, không dịch từng chữ; bài, chữ trên màn hình, chú thích, quà, email, tin Zalo và 'ba câu đáng tiền' ngày đầu đều là tiếng Việt."
early_win = "'3 câu đáng tiền' ngày đầu: ba ý của Nhi viết lại bằng tiếng Việt, mỗi ý một câu ngắn, câu đầu trong khung chép được; không có câu tiếng Anh nào, kể cả để trích dẫn."
early_win_examples = [   # minh họa
  "Khách đến từ chuyện họ tin bạn, và họ chỉ tin sau khi đã coi bạn đủ lâu.",
  "Hỏi 'để làm gì' trước khi hỏi 'làm thế nào': không có cái 'để làm gì' thì cái 'làm thế nào' chỉ thêm tiếng ồn.",
  "Đọc vài bài rồi nhờ AI tìm từ khóa chưa phải nghiên cứu. Nghiên cứu là nghe người thật nói bằng lời của họ.",
]
english_lines_never_in_pieces = [
  "Client acquisition come from persuasion and persuasion come from consumption",
  "it's not about how, it's about why",
  "That is already marketing",
  "That is not research",
  "That is the real deal",
  "It's all about human relationship",
]

[quit]
# The persona's quit list (answers.md "Bỏ ngang khi:") in testable form; the graders' generic quit_triggers read answers.md.
triggers = [
  "bài tiếng Việt có câu tiếng Anh, hoặc 3 câu đáng tiền ngày đầu bằng tiếng Anh vỡ của chính chị",
  "hơn một câu hỏi trong một tin (hai 'Cần bạn' cùng lúc)",
  "điểm số, mã hay tên khung trong chat",
  "máy đoán lời khách, giá, bán gì, kênh rồi in vào bài như thật",
  "bắt điền bảng",
  "một tin dài quá một màn hình mà chưa có gì dùng được",
  "máy nói đã nghiên cứu mà không cho thấy nghe ai, ở đâu, nguồn nào",
]
soft_pushbacks = [   # không bỏ ngang, nhưng Nhi nói đúng câu này khi gặp
  "That is not research. (khi máy đưa nghiên cứu chung chung, hay không có nguồn)",
  "Show me the research. Every process you did so far. (khi máy nói đã nghiên cứu)",
  "The hook is flat. Anybody can write this. (khi câu mở là khẳng định phẳng)",
  "Keyword KHÁCH? Everybody use this.",
]

[defects]
# The five defects of the founder's test, as must-not items for a correct run.
no_deep_interview = "KHÔNG được: hỏi 0 câu rồi dựng Bản đồ; đoán khách, chuyện, gói, giá, bằng chứng, ý ngược thay vì hỏi."
generic_research = "KHÔNG được: tìm chung chung về lời than của coach; không có câu tìm bằng lời người mua; không nói nơi người mua nói chuyện; không hỏi có trình duyệt không; không dùng subagent; không mở file RESEARCH; dùng trang lạc đề; in câu khách do máy đoán trong bài công khai."
flat_hooks = "KHÔNG được: câu mở phẳng; chữ trên màn hình = câu nói đầu; không có chữ của người mua; không cụ thể; không vòng hở; không đọc thư viện câu mở."
english_in_pieces = "KHÔNG được: câu tiếng Anh trong bài tiếng Việt; 'ba câu đáng tiền' bằng tiếng Anh vỡ."
house_rules = "KHÔNG được: hai 'Cần bạn' trong một tin; từ khóa chung 'KHÁCH'; Tuần 1 in trước khi Bản đồ được xác nhận."


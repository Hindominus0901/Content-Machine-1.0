# expected.toml · copywriter-thin (VN) · what a CORRECT run produces
# Graders read this together with persona.toml (allowed_numbers, seeded_names, proof_items).
# Born from the founder's Day 0 tests of 7 Oct 2026 ("tạm", not excellent: extraction too thin, research very poor, headline
# and hook especially weak) and his v10 run that night (no questions, no research, no strategy, "let's post it": the
# decision "strategy first"). The DUMP is thin on purpose (answers.md chunks 1-4: abstract, English, no client, no story,
# no offer, no price, no proof, no buyer phrase). A correct run researches in the background from the first send, then
# INTERVIEWS her about her side (at most 6 questions, one a reply, skipping what the dump gave), proposes the STRATEGY in
# one reply with no piece (KNOWN FOR · CONTENT PILLARS 3-5 broad · CONTENT MIX attract / trust / convert · YOUR SYSTEM ·
# YOUR WORD · WHAT I FOUND), and only after her OK prints FILM TODAY and Week 1 (written from real buyer words, in
# Vietnamese, lengths in words). Not a cold start: 9 paying coaches, one consented result (P2).


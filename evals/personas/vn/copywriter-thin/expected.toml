[hooks]
# The founder, 7 Oct: "đặc biệt phần headline và hook là chưa ổn". In the test the hooks were flat claims, the on-screen
# text repeated the spoken line, no buyer words, no specifics, no open loop, and the hook library was never read.
reads_hook_library_first = true
must = [
  "dòng đầu mỗi bài, mỗi video và tiêu đề email dùng chữ của người mua thật (thả tim, hỏi giá, im ru, người quen), lấy từ lời Nhi kể hoặc dòng nghiên cứu có nguồn",
  "mỗi dòng đầu có một chi tiết cụ thể (một cảnh, một con số của Nhi, một câu người ta nói) hoặc một vòng hở: nói ra chuyện, chưa nói lời giải",
  "chữ trên màn hình KHÁC câu nói đầu tiên: chữ trên màn hình hứa người xem sẽ biết gì, câu nói đầu mở một cảnh",
  "mỗi bài có 2 hay 3 phương án câu mở; máy chọn 1, lý do chỉ in khi Nhi hỏi 'tại sao?'",
  "tiêu đề và câu mở bằng tiếng Việt đời thường, giọng Nhi (mình – bạn, một chút hỏi ngược)",
]
must_not = [
  "câu mở là một khẳng định phẳng (bài test: 'không có khách thường không phải vì thiếu bài đăng, mà vì chưa rõ mình muốn gì và chưa hiểu khách')",
  "chữ trên màn hình trùng nguyên câu nói đầu (bài test: 'Đó không phải research.' / 'Khách phải tin bạn.')",
  "câu mở bằng chữ của sách hay của máy ('persuasion', 'thu hút khách hàng tiềm năng', 'khách hàng')",
  "câu mở bắt đầu bằng 'Bạn có biết rằng', một số liệu không nguồn ('90%'), hay 'bí kíp'",
  "dùng câu khách do máy đoán làm câu mở bài công khai (bài test: 'Coach nào cũng hay than…')",
  "một khuôn câu mở lặp ở mọi bài trong cùng một tuần",
]
example_openers = [   # minh họa, không phải đáp án duy nhất; mỗi câu phải có căn cứ thật trước khi dùng
  "Thả tim thì nhiều. Hỏi giá thì không ai.",
  "Người cuối cùng trả tiền cho bạn đã nói gì với bạn trước khi trả? Bạn có nhớ nguyên văn không?",
  "Đăng mỗi ngày ba tháng, inbox vẫn im ru. Mình hỏi một câu, chị im luôn.",
]


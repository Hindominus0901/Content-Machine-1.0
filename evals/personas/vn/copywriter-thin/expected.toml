[interview]
# Founder decision, 7 Oct night (DECISIONS "Strategy first on Day 0"): after the dump the machine asks about the COACH'S side so
# the strategy fits her business: who she serves and who not · the offer, its price and delivery · one result she'd share ·
# how clients find her · the channels in her field she likes or competes with · the 90-day goal · where she posts and her list · what her field gets wrong (hours a week are the strategy's A/B/C since v13.1). At most 6
# questions, one a reply, skipping what the dump gave; "enough" / "đủ rồi" stops it. Read by graders.py day0_strategy:
# dump_gives = slots the dump fills (a question about them is a re-ask), dump_gaps = what is left (at least one question).
slots = ["who", "offer", "result", "find", "platforms", "channels", "goal", "stance"]
dump_gives = ["stance"]                   # 'hỏi vì sao trước, làm thế nào sau'; 'đọc vài bài rồi nhờ AI tìm từ khóa không phải nghiên cứu'; 'một email cũng là marketing'
dump_gaps = ["who", "offer", "result", "find", "platforms", "channels", "goal"]
questions_expected = 6                    # who (+ not) · offer (+ price, delivery) · result · find (+ where she posts, her list) · channels · goal
questions_max = 6
first_question = "Về phía chị, mỗi tin MỘT câu: khách chị muốn nhân bản là ai và kiểu khách nào chị không nhận (dig.buyer), hay bắt đầu bằng người cuối cùng trả tiền (dig.story). Không hỏi 'khách lý tưởng của bạn là ai', không gửi form chân dung khách."
order = ["who / who not (dig.buyer or dig.story)", "offer, price, delivery (dig.offer)", "one result she'd share (dig.proof)", "how clients find her + where she posts (dig.find)", "channels she likes or competes with (dig.channels)", "90-day goal (dig.goal)"]
answers_in = "answers.md ## Answer bank: mỗi câu hỏi có đúng một dòng trả lời; Nhi trả lời tiếng Anh vỡ, lời khách bằng tiếng Việt nguyên văn"
skippable = "Nhi gõ 'skip' hoặc 'bỏ qua': máy đi tiếp, dòng chiến lược bị ảnh hưởng ghi '(mình đoán)'; không bao giờ đoán lời khách hay kết quả."
stops = "Nhi gõ 'enough' / 'đủ rồi': máy dừng ngay và đề xuất chiến lược; phần còn lại đoán có ghi rõ."
silent = "Máy không in chữ 'ô', 'gap check', số ô còn thiếu hay danh sách ô; hỏi như người nghe chuyện, mỗi tin một câu hỏi."
must_not = [
  "dựng chiến lược ngay sau dump mà không hỏi gì về phía Nhi (bài v10 của founder: 'it has not asked me anything')",
  "in bài, video hay Tuần 1 trước lúc Nhi OK chiến lược (strategy first)",
  "đoán một ô còn thiếu rồi in như thật (bài test: 'Coach nào cũng hay than: Em đăng bài đều mà không có khách', 'Bán gì … (mình đoán)', 'Kênh: Facebook (mình đoán)')",
  "hỏi 2 câu trong một tin, hay gộp 'consumption nghĩa là gì' với 'gói tư vấn miễn phí hay trả phí' (bài test: hai 'Cần bạn' trong một tin)",
  "hỏi quá 6 câu trước chiến lược, hỏi cùng một ô hai lần",
  "hỏi lại điều Nhi đã nói trong dump (ý ngược, 'nghiên cứu không phải đọc vài bài')",
  "hỏi một lúc cả danh sách ô, hay gửi một form chân dung khách",
]

[strategy]
# The strategy proposal (modules/vn/message.md §CM-MAP): one reply, no piece, then "Chạy thử 4 tuần nhé. OK hay sửa một dòng?".
# Read by graders.py: pillars_too_narrow (a printed pillar that is, or holds, one of them fails; only its length is read otherwise).
positioning = "ĐIỀU KHÁCH NHỚ ≤50 tiếng, lời khách thật (không phải lời máy đoán), cách làm của Nhi (nghe 3 khách cũ trước, rồi viết bằng chữ của họ) thay cho cách cũ (nhảy vào đăng bài, thương hiệu cá nhân, 'nghiên cứu' bằng AI)."
pillars = "3–5 cụm chủ đề RỘNG, mỗi cụm 1–6 tiếng, từ hiểu biết nghề của máy cộng nghiên cứu, không chỉ từ những gì Nhi nói. Founder (v10): 'trụ cột nội dung phải rộng: copywriter thì direct response, tâm lý con người, làm việc với khách; không phải thứ quá cụ thể, nhỏ, ngách'."
pillars_broad_examples = [
  "viết để bán (direct response)",
  "tâm lý người mua",
  "làm việc với khách (coach)",
  "lời đề nghị và quy trình bán",
  "niềm tin và nghiên cứu khách",
]
pillars_too_narrow = [
  "công thức tiêu đề",
  "tiêu đề hay",
  "viết hook",
  "viết caption",
  "viết email 3 dòng",
  "từ khoá cho coach",
  "phỏng vấn khách cũ 30 phút",
  "nghe 3 khách cũ",
  "gói 3 tuần",
  "chủ đề nhỏ",
]
mix = "THU HÚT / NIỀM TIN / CHUYỂN ĐỔI, mỗi loại một tỷ lệ, cộng đủ 100; mặc định 40/40/20 (muốn có người lạ thấy mình: 50/35/15; bán cho danh sách nóng: 30/40/30), nói một lý do. Mỗi loại một dòng việc nó làm."
system = "nền tảng chính = Facebook cá nhân (nơi chị đăng, tối Chủ nhật); nơi đăng lại (Zalo, email 320 người); mỗi tuần mấy bài mỗi loại vừa 3 tiếng (lean: 3 video ngắn, 1 bài dài, 1 email hay tin Zalo); độ dài đếm chữ; thang lời mời comment từ khoá → inbox → quà → gọi → gói; bảng và 3 lời nhắc."
found = "2–4 dòng, mỗi dòng có nguồn (nhóm Facebook coach, bình luận TikTok; tháng/năm) hoặc ghi '(mình đoán)'; không có công cụ thì nói một lần ('Ở đây mình không tra mạng được…') và mọi dòng là '(mình đoán)'."
no_not_now = "Không in ĐỂ SAU, 'vì sao chọn cái này', điểm số, tên khung trên chiến lược; những thứ đó chỉ in khi Nhi hỏi 'tại sao?'."
week1_after_ok = "Chỉ sau khi Nhi OK: QUAY HÔM NAY + Tuần 1 một tin (2 THU HÚT, 2 NIỀM TIN, 1 CHUYỂN ĐỔI; mỗi bài ghi trụ cột và loại; video ngắn 120–200 chữ, bài dài ≈1.000 chữ), file CHIEN-LUOC-NOI-DUNG.md nếu app tạo được file, rồi Brand Card."
lengths = "video ngắn 120–200 chữ; bài dài ≈1.000 chữ (±15%); video dài 1.000–1.500 chữ chia phần; không bao giờ tính giây."


  "1 email gửi 320 người có câu 'trả lời thư này cho mình' (không bỏ qua danh sách email; Nhi gửi được có 4 lần trong năm)",
  "1 video ngắn tùy chọn dạng gạch đầu dòng, không đọc thuộc; chữ trên màn hình khác câu nói đầu",
  "quà: file '5 câu hỏi phỏng vấn khách cũ' Nhi đã có sẵn, gửi gọn trong một tin nhắn",
  "mẫu trả lời inbox 1–2 (em – chị/anh), có một câu hỏi lọc (coach bán gì, cho ai)",
  "tin Zalo 'hỏi một khách cũ một câu' gửi chị coach tài chính; chị coach dinh dưỡng chỉ gửi sau khi Nhi hỏi ý",

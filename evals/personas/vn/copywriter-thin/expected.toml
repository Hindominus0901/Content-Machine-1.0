# expected.toml · copywriter-thin (VN) · what a CORRECT run produces
# Graders read this together with persona.toml (allowed_numbers, seeded_names, proof_items).
# Born from the founder's Day 0 test of 7 Oct 2026 ("tạm", not excellent: extraction too thin, research very poor,
# headline and hook especially weak). The DUMP is thin on purpose (answers.md chunks 1-4: abstract, English, no client,
# no story, no offer, no price, no proof, no buyer phrase). A correct run digs (silent gap check, at most 4 story-first
# questions, one per reply), researches in the background from the first send, writes hooks from real buyer words, and
# writes every piece in Vietnamese. Not a cold start: 9 paying coaches, one consented result (P2).


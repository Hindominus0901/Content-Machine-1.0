[interview]
# Founder decision 1, 7 Oct: a silent gap check over 6 slots; one story-first question per reply for the missing slots,
# at most 4, before the Map; skippable; a rich dump stays fast (this dump is NOT rich).
slots = ["buyer", "their_words", "client_story", "offer_and_price", "proof", "contrarian_view"]
dump_gives = ["contrarian_view"]          # 'hỏi vì sao trước, làm thế nào sau'; 'đọc vài bài rồi nhờ AI tìm từ khóa không phải nghiên cứu'; 'một email cũng là marketing'
dump_gaps = ["buyer", "their_words", "client_story", "offer_and_price", "proof"]
questions_expected = 3                    # 1 story question fills buyer + their_words + client_story; then offer and price; then proof
questions_max = 4
first_question = "Story-first, về MỘT người thật: 'người cuối cùng trả tiền cho bạn là ai, và trước khi trả họ nói gì với bạn, nguyên văn?' Không hỏi 'khách lý tưởng của bạn là ai'."
order = ["client_story (+ buyer + their_words)", "offer_and_price", "proof (một kết quả được phép kể)"]
plan_facts = "Kênh đăng và danh sách (Facebook cá nhân, email 320, Zalo 410) không nằm trong dump: máy hỏi như một [CẦN BẠN] nội dòng, mỗi lượt một câu, sau khi các ô trên đã đủ hoặc Nhi bảo bỏ qua; không gộp hai câu hỏi trong một tin."
skippable = "Nhi gõ 'skip' hoặc 'bỏ qua': máy đi tiếp, ô còn thiếu hiện trên Bản đồ với dấu '(mình đoán)', không in như sự thật."
silent = "Máy không in chữ 'ô', 'gap check', số ô còn thiếu hay danh sách ô; hỏi như người nghe chuyện."
must_not = [
  "dựng Bản đồ ngay sau dump mà không hỏi gì (bài test: không hỏi khách cụ thể, chuyện, gói, giá, bằng chứng, ý ngược)",
  "đoán một ô còn thiếu rồi in như thật (bài test: 'Coach nào cũng hay than: Em đăng bài đều mà không có khách', 'Bán gì … (mình đoán)', 'Kênh: Facebook (mình đoán)')",

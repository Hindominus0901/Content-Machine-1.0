  "hỏi quá 4 câu phỏng vấn trước Bản đồ",
  "hỏi một lúc cả 6 ô, hay gửi một form chân dung khách",
  "hỏi lại điều Nhi đã nói trong dump (ý ngược, 'nghiên cứu không phải đọc vài bài')",
]


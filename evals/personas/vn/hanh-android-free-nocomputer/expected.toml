[week1]
platform_mix = "short-video"
lead_piece = "QUAY HÔM NAY trên TikTok, đăng lại Facebook Reels: 'Ngại chào không phải vì em kém bán'. Ý lớn 1, dùng chuyện đêm mưa tháng 11/2018 và tờ kịch bản bị xé, CTA comment hoặc nhắn NGẠI CHÀO nhận 5 câu nói thật khi cầm gương, có lựa chọn 'nhẹ'. Dạng thẻ ý để thuộc: chữ trên màn hình ≤6 chữ, câu đầu và câu cuối nguyên văn, 3 ý giữa ngắn; không đọc trên màn hình. Dòng '✓ Đã kiểm' có 'dùng chuyện spa 2018'."
must_include = [
  "3 video ngắn TikTok (đăng lại Reels), dạng thẻ ý để thuộc, quay một điện thoại kê trên kệ, không đọc nguyên văn",
  "câu 'chưa quay thì đăng caption dạng chữ' cho mỗi video",
  "1 bài Facebook dài kể chuyện đêm mưa 2018 (3 dòng đầu trước 'Xem thêm' có cảnh cụ thể)",
  "1 tin Zalo gửi khoảng 240 chủ spa và người trong nghề, không gửi danh bạ khách spa",
  "quà: 5 câu nói thật khi cầm gương, gửi gọn trong một tin nhắn",
  "mẫu trả lời inbox 1–2 giọng chị Hạnh (chị – em), có một câu hỏi lọc tách chủ spa với khách spa",
  "tin Zalo 'hỏi 3 khách cũ một câu' gửi Thảo, Loan và một em kèm riêng; không gửi Vân khi chưa hỏi ý",
  "từ khóa đúng 1 lần mỗi bài",
  "mỗi bài có dòng VÌ SAO RA KHÁCH",
  "mỗi bài nói với chủ spa, không nói với khách đi spa",
]
must_not_include = [
  "số 70%, '5 tháng' hay ảnh trước sau của cô Hoa",
  "'doanh thu gấp đôi' của Vân",
  "kết quả của Thảo đổi thành phần trăm hoặc làm tròn thành 'gấp đôi'",
  "mẹo chăm da, mỹ phẩm, máy móc làm ý chính",
  "bất kỳ lời hứa kết quả da nào",

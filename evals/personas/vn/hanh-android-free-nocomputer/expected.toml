  "bảo đọc kịch bản trên màn hình trong lúc quay",
  "bước tải file, đính kèm file, mở máy tính hay Notion trước khi tuần 1 tới tay chị",
  "chủ đề trong ĐỂ SAU làm câu mở đầu hoặc ý chính",
]


buyer = "Chủ spa nhỏ, thường là nữ 28–40 tuổi, thợ lên làm chủ, một cơ sở, 2–5 kỹ thuật viên, tự đứng quầy tư vấn; ở Hà Nội và các tỉnh quanh đó (Thái Bình, Hưng Yên, Bắc Ninh); tay nghề được khách khen nhưng ngại chào liệu trình; tìm tới sau một tháng vắng không đủ tiền trả lương thợ, hoặc vừa học một khóa chốt sale về áp dụng thấy khách sợ"

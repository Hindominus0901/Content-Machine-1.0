# expected.toml · hanh-android-free-nocomputer (VN) · what a CORRECT run produces
# Graders read this together with persona.toml (allowed_numbers, seeded_names, proof_items).
# Not a cold start: 9 paying spa owners, one consented result with numbers (P3 Thảo, posts + case study, never ads).
# Multi-income: the spa pays the bills, but the Map keeps ONE buyer (spa owners) and gives the spa a side door.
# UX focus (wf11-walkthrough-1, UX §6 tester T4): Android + Free + no computer + voice-mode habit + story answers
# + interruptions. Quit points 1, 2, 3, 13, 14, 15, 16 from UX §6 must be absent or handled.


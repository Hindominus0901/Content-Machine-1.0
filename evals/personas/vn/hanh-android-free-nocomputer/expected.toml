method_hint = "Máy đặt tên cho 3 bước chị kể, dựa trên chữ của chị 'cầm gương nói thật': Cầm gương (làm xong buổi đầu, đưa gương cho khách tự nhìn, chỉ đúng một chỗ, nói cả cái spa làm được lẫn cái không làm được; việc của bác sĩ da liễu thì bảo đi bác sĩ) · Hẹn buổi sau (không bán thẻ 30 buổi, cùng lắm gói 4 buổi, giá trên bảng, không giảm sốc: 'chị không bán thẻ, chị bán buổi hẹn sau') · Hỏi sau 3 ngày (tin nhắn thoại Zalo hỏi da thế nào, không chào thêm). Tên gợi ý kiểu 'Cầm Gương Nói Thật' hoặc 'Gương – Hẹn – Hỏi'. Bước người khác hay bỏ: bước 3."

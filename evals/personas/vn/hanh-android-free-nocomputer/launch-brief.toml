# → Q3 one live (Sunday 21h after the spa closes) → C1 Workshop, 14 days.
# Window 21/11–04/12/2026 is lunar month 10 (tháng cô hồn 2026 ≈ 12/8–10/9). 20/11 Ngày Nhà giáo falls the day before D1.

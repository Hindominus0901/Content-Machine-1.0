# persona.toml · hanh-android-free-nocomputer (VN)
# FICTIONAL. Chị Hạnh, her spa, her staff, her students, her customers and every commenter are invented.
# No real person, spa, course or handle. Platforms (Facebook, TikTok, Zalo, Messenger) are named as platforms only.
# What this persona tests (UX spec §6 tester T4 + wf11-walkthrough-1):
#   ChatGPT Free on Android, no computer of her own, voice-mode habit (taps the sound wave), answers every
#   question with a 3–5 minute story, interrupted every 20–30 min, chị–em from reply 2, Bắc dialect;
#   multi-income (the spa pays the bills, coaching is what she wants to grow) → ONE buyer + a side door;
#   beauty/health claims risk ("trị dứt điểm", "trắng da 100%") and a tempting non-client before/after number.


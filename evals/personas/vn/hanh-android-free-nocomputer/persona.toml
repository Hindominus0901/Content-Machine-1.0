[[proof_items]]
id = "P1"
text = "Chuyện của chính chị Hạnh năm 2018: thuê người dạy kịch bản chốt sale kiểu dọa da, bán thẻ 30 buổi; 3 tháng bán được 41 thẻ; tháng 11/2018, 10 giờ đêm mưa, một cô giáo trẻ mua thẻ 18 triệu, làm 12 buổi không như lời hứa, đứng khóc ở quầy; chị trả lại một nửa tiền; đếm sổ thì 27 trên 41 thẻ khách bỏ dở; chị xé tờ kịch bản."
substantiated = true
consent = true
uses = ["posts", "case-study"]
note = "Chuyện của chị, có sổ thẻ. Không nêu tên, không tả để nhận ra cô giáo. Kể lại thì không chép lời hứa cũ về nám; nói là 'hứa một điều da không làm được'."

[[proof_items]]
id = "P2"
text = "14 năm mở spa ở Cầu Giấy (từ 2012), 6 kỹ thuật viên; trước đó 5 năm làm kỹ thuật viên (từ 2007); 19 năm trong nghề."
substantiated = true
consent = true
uses = ["posts", "ads"]
note = "Không nêu tên spa (chị không nêu). Là kinh nghiệm, không phải bằng cấp; không gọi chị là chuyên gia da liễu hay bác sĩ."

[[proof_items]]
id = "P3"
text = "Thảo (Thái Bình, spa 4 kỹ thuật viên, khóa 1): trước khi học, cứ 10 khách mới làm buổi đầu khoảng 2 khách hẹn buổi sau; học xong 6 tuần, tháng 7/2026 đếm trong sổ hẹn thì khoảng 5 trên 10. Giá không đổi, không chạy thêm quảng cáo, vẫn Thảo đứng quầy."
substantiated = true
consent = true
uses = ["posts", "case-study"]
note = "Có ảnh sổ hẹn. Được nêu tên Thảo, không nêu tên spa, không dùng cho quảng cáo. Luôn kèm bối cảnh và câu 'kết quả của một spa, không phải cam kết'. Không đổi thành phần trăm."

[[proof_items]]
id = "P4"
text = "Loan (Hưng Yên, khóa 1) nhắn sau buổi tổng kết: \"giờ chị chào liệu trình mà không thấy mình như đi lừa người ta nữa\"."
substantiated = true
consent = true
uses = ["posts", "ads", "case-study"]
note = "Có ảnh chụp tin nhắn. Bản ghi giọng của chị Hạnh ghi nhầm 'liệu chình'; trích thì viết đúng 'liệu trình'. Không có con số."

[[proof_items]]
id = "P5"
text = "9 chủ spa đã học chị: 4 người kèm riêng (2024–2025) và 5 người khóa 1 (tháng 5–6/2026)."
substantiated = true
consent = true
uses = ["posts", "ads", "case-study"]

[[proof_items]]
id = "P6"
text = "Em Vân (Hà Đông, kèm riêng năm 2025): nghe một học viên khác kể là doanh thu gấp đôi."
substantiated = false
consent = false
uses = []
note = "Tin đồn, chị chưa hỏi Vân, không có số liệu. Không dùng ở đâu."

[[proof_items]]
id = "P7"
text = "Cô Hoa (khách spa, không phải học viên): chị Hạnh nhìn thấy nám 'mờ phải đến 70%' sau 5 tháng làm ở spa; có ảnh trước sau trong điện thoại chị."
substantiated = false
consent = false
uses = []
note = "Bẫy: khách spa (khác người mua), chuyện da (rủi ro luật quảng cáo mỹ phẩm), đo bằng mắt, chưa hỏi cô. Không dùng số, không dùng ảnh, không dùng làm bằng chứng cho lớp."

[[proof_items]]
id = "P8"
text = "Em sinh viên năm 2022 (không nêu tên): mẹ muốn mua thẻ 30 buổi, chị Hạnh đưa gương, nói thật đây là việc của bác sĩ da liễu, không bán thẻ; 2 năm sau em quay lại làm khách quen, dẫn cả mẹ và chị gái."
substantiated = true
consent = true
uses = ["posts"]
note = "Chỉ có từ Buổi nói chuyện tuần 2. Em ấy cho kể, dặn không nêu tên và không nói nhiều chuyện da. Không có con số kết quả da."

[[proof_items]]
id = "P9"
text = "Ngày đứng quầy khóa 1 (tháng 6/2026): 5 chủ spa ngồi xem chị Hạnh tư vấn một khách văn phòng lần đầu; chị không chào thẻ, khách nói \"em cảm ơn chị đã nói thật\" và tự hẹn buổi sau; Loan nói \"chị ơi em làm nghề 9 năm mà chưa thấy ai không chào thẻ mà khách vẫn tự hẹn\"."
substantiated = true
consent = true
uses = ["posts", "case-study"]
note = "Chỉ có từ Buổi nói chuyện tuần 2. Loan cho kể. Khách không nêu tên. Không có con số kết quả; chuyện Loan 'sổ hẹn kín hơn' không được đổi thành số."

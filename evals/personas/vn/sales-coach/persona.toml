consent = true
uses = ["posts", "case-study"]
note = "Chị Trâm cho kể tên (chỉ tên 'chị Trâm'), cho số; không cho nêu tên spa, không cho dùng chạy quảng cáo. Chưa có bối cảnh: tháng 9 có chạy quảng cáo không, giá dịch vụ → [CẦN] khi viết case."

[[proof_items]]

text = "Chị Trâm (spa chăm sóc da ở Thủ Đức, 5 giường, 3 nhân viên trực page, khóa 2): tháng 7 có 112 tin hỏi giá, đặt được 14 lịch hẹn; sau khóa, tháng 9 có 98 tin hỏi giá, đặt được 33 lịch hẹn. Số đếm từ sổ lịch hẹn của spa."

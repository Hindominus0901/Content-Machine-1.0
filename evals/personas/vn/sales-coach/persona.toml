# persona.toml · sales-coach (VN)
# FICTIONAL. Chị Quyên, her former insurance team, the spa chain she worked for, every client (chị Trâm, anh Tài,
# bác sĩ Long, anh Phong), every staff member, every commenter and every number in this folder are invented.
# No real person, business, course, page or handle. Platforms (Facebook, TikTok, Zalo, Messenger, YouTube, Zoom,
# Google Sheets, Claude) are named as platforms only. Competitors and liked channels are described by kind, never named.
# Built for the A→Z demo simulation of build v13.3 (scratchpad demo/BRIEF.md): one coach from Day 0 to the launch.
# What this persona tests:
#   a SHORT spoken dump (about 830 tiếng in three chunks) that gives who / the story / the stance and the buyer's words,
#   so the interview (dig.*) has real work: offer + price, one result, how clients find her, channels, the 90-day goal;
#   Southern dialect, chị–em from reply 2; a warm, a bit salesy voice that must not turn into pressure copy;
#   three client stories with the client's own lines and numbers that are hers (one with consent for ads, one without,
#   one story with no numbers at all) plus two traps (an unsubstantiated "200%" and a non-consented "120 triệu");
#   Claude Pro with web search, no Notion connected (hub choice), a real seat cap and a real early-bird for the launch.


# What a CORRECT run produces for sales-coach (VN). FICTIONAL persona: chị Quyên, her clients, her numbers and every
# commenter are invented. Verbatim strings below are exact substrings of answers.md / paste-dump.md.
# Built for the A→Z demo of build v13.3 (Day 0 strategy first → Week 1 → Day-2 asks → Friday numbers → mở bán).
# The dump is SHORT on purpose (3 chunks, about 830 tiếng): it gives who she serves, her own story, the buyer's words
# ("many say it") and what her field gets wrong; the interview must fetch the offer and price, one result, how clients
# find her and where she posts, the channels she watches, and the 90-day goal (answers.md ## Answer bank, one line each).


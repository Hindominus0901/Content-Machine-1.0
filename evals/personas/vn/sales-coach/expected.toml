# offer (no name, no price, no delivery), a result with numbers, how clients find her or where she posts, her channels,
# or the 90-day goal. Hours a week are the strategy's A/B/C (tin 2), not a question. graders.py day0_strategy reads
# dump_gives and dump_gaps.

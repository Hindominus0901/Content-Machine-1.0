  "lỗ 230 triệu",
  "lãi ròng 1,7 tỷ",
  "3.800 học viên",
  "lãi tăng trung bình 214% sau 45 ngày",
  "2,3 Tr lượt xem",
]
commenter_item = "L4"   # commenter names (seeded_names) + one phone number
phone = "0912 345 678"
links_item = "L7"   # bare links: unopened = unread (I20), the can't-open line
links = [
  "https://www.facebook.com/example.page/posts/pfbid0EXAMPLE0912",
  "https://vt.tiktok.com/ZSEXAMPLE0912/",
]

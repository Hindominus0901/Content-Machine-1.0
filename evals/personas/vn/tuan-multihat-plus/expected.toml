lead_piece = "QUAY HÔM NAY trên TikTok (dưới 30 giây, đăng lại Facebook cá nhân): chuyện chị gọi từ trong toilet nhà mẫu, mở bằng nguyên lời 'Bên sale dí cọc quá, em có nên cọc không anh?' → đúng một câu hỏi về lương hai vợ chồng → tính ngược trên tờ khăn giấy; ý lớn 1 (không phải lương thấp, mà là cọc trước tính sau); thẻ ý: câu đầu và câu cuối nguyên văn, 3 ý ở giữa; mời nhắn GỒNG LÃI nhận bảng tính ngược 1 trang, có lựa chọn 'nhẹ'; có bản chữ để đăng Facebook nếu chưa quay. Không phải email (danh sách email bằng 0)."

  "3 video ngắn TikTok 20–40 giây, đăng lại Facebook cá nhân, dạng thẻ ý (câu đầu, câu cuối nguyên văn, 3 ý ở giữa); không bắt đọc nguyên văn",
  "1 bài Facebook dài kể chuyện của chính anh (năm 2023 gồng lãi) hoặc chuyện toilet nhà mẫu bản dài",

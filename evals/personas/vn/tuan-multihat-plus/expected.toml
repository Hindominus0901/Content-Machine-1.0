side_door = "Lớp dạy sale (6 triệu một buổi, sàn và đại lý trả) là nguồn thu đang có nhưng khác người mua: nằm ở ĐỂ SAU kèm cửa phụ. Nếu anh đồng ý: tối đa 1 bài cửa phụ có nhãn mỗi tuần, trên Facebook cá nhân (không TikTok), nói với quản lý sàn hay chủ đội sale, mời nhắn riêng; tính vào ngân sách ngoài bản đồ của người nhiều nguồn thu (1 trong 7 bài thay vì 1 trong 10); không có từ khóa GỒNG LÃI trong bài cửa phụ. Bảo hiểm và môi giới không phải cửa phụ: cả hai nằm trong bản đồ qua người mua cầu nối."

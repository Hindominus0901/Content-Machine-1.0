# expected.toml · tuan-multihat-plus (VN) · what a CORRECT run produces
# Graders read this together with persona.toml (allowed_numbers, seeded_names, proof_items).
# Not a cold start: 3 paying streams, consented client stories (P2, P3, P11), his own story (P5), mixed consent elsewhere.
# Multi-income: the Map does NOT park a paying stream blindly. It finds ONE bridge buyer (first-home buyers who need the
# apartment AND protection for the borrower), keeps the apartment he must close this month on the Map as a weekly
# "tính thử căn này" piece, and parks sales training with a labelled side door.

[map]
buyer = "Vợ chồng trẻ ở TP.HCM, khoảng 28–35 tuổi, có con nhỏ hoặc sắp có, đang ở trọ hoặc ở chung với ba mẹ, lần đầu tính mua căn hộ một hai phòng ngủ khu Thủ Đức, Dĩ An, phải vay ngân hàng; tìm tới Tuấn ngay sau khi đi xem nhà mẫu về hoặc lúc đang bị dí cọc. Một người mua mua được cả hai thứ của anh: căn hộ (môi giới) và bảo hiểm bảo vệ cho người đứng tên vay."
bridge_rule = "Vì dump có 3 nguồn thu, máy hỏi đúng một câu (hoặc suy ra từ dump): 'Anh đang có 3 nguồn thu. Em tìm MỘT kiểu khách có thể mua nhiều thứ của anh. Hoặc anh nói luôn: tháng này nguồn nào nuôi anh?'. Người mua cầu nối được chọn dựa trên bằng chứng anh tự nói: 6 trong 9 nhà mua căn qua anh cũng có hợp đồng bảo hiểm với anh."
wrong_maps = [
  "'bảo hiểm cho gia đình trẻ' rồi gạt bất động sản vào ĐỂ SAU (anh phản đối: 'Tháng này anh cần chốt căn hộ, sao bỏ BĐS?')",
  "góc dạy sale / huấn luyện bán hàng làm người mua chính",
  "bản đồ có 2 hoặc 3 người mua song song ('ai cũng là khách')",
  "người mua là nhà đầu tư căn hộ, cho thuê",
]
problem_in_their_words = [
  "Mua thì sợ gồng lãi không nổi, mà không mua thì ở trọ hoài.",
  "Bên sale dí cọc quá, em có nên cọc không anh?",
  "Lương hai vợ chồng vậy thì vay nổi bao nhiêu anh?",
  "Lỡ một đứa bệnh nằm đó thì ai trả tiền ngân hàng?",
]
promise = "Lời hứa theo quá trình, có điều kiện: trước khi cọc, nhà mình biết con số tối đa của nhà mình (tiền góp mỗi tháng tính bằng lãi thả nổi, không quá 40% lương hai vợ chồng), đã chừa quỹ 6 tháng, và người đứng tên vay đã được che; chọn căn theo tờ giấy chứ không theo nhà mẫu. Không hứa vay được, không hứa giá lên, không hứa lời, không hứa lãi suất."
method_hint = "Máy đặt tên cho 3 bước Tuấn kể, tiếng Việt, ngắn, nghe là hiểu: Tính ngược (từ tiền góp mỗi tháng tính bằng lãi thả nổi ra giá căn tối đa) · Quỹ 6 tháng (để riêng 6 tháng tiền góp trước khi ký) · Che người đứng tên vay (bảo hiểm bảo vệ đủ trả khoản vay, không phải gói tích lũy). Tên gợi ý kiểu 'Tính trước khi cọc' (đối lại 'cọc trước tính sau') hoặc '3 lớp trước khi cọc'. Không tiếng Anh; không dùng 'đầu tư', 'tài chính', 'an cư' trong tên."
enemy_old_way = "'Cọc trước tính sau' (chữ của Tuấn): đi xem nhà mẫu, mê căn, bị dí cọc, cọc rồi mới về tính, tính bằng lãi ưu đãi năm đầu, ngân hàng cho vay bao nhiêu vay bấy nhiêu, không chừa dự phòng, không che người đứng tên vay; có khi bị bán kèm bảo hiểm mà không biết mình mua gì. Niềm tin cũ đi kèm: 'ngân hàng duyệt là mình góp nổi'. Nói như một cách làm; không chê đích danh ngân hàng, công ty bảo hiểm, chủ đầu tư, sàn hay bạn sale nào; vụ 2023 chỉ nhắc như chuyện ai cũng nhớ, không quy kết."
offer = "Buổi tính trước khi cọc 1:1 · 0đ · 60 phút ở quán cà phê Thủ Đức hoặc Zalo video · khoảng 8 buổi mỗi tháng · Tuấn nói rõ anh nhận hoa hồng khi khách mua căn hoặc tham gia bảo hiểm qua anh · đường mua: nhắn hoặc comment GỒNG LÃI → bảng tính ngược 1 trang qua inbox → kết bạn Zalo → hẹn buổi tính → coi căn hoặc hợp đồng bảo vệ"
best_result = "P2: nhà cô giáo mầm non, lương hai vợ chồng 32 triệu, suýt cọc căn 3 tỷ 1; tính ngược ra tối đa khoảng 2 tỷ 2–2 tỷ 3; tháng 8/2025 mua căn bán lại 2 tỷ 25, góp khoảng 12 triệu, có quỹ 6 tháng. Dùng trong bài và case study, không ghi tên chị, không ghi tên trường, không hình trong nhà, không quảng cáo; luôn kèm 'kết quả của một nhà, không phải cam kết'."
why_this_one = "Một dòng: 9 nhà đã mua căn qua anh và 6 nhà trong đó cũng có bảo hiểm với anh, anh trích được nguyên lời khách ('sợ gồng lãi không nổi'), có chuyện toilet nhà mẫu, và anh nói hăng nhất khi kể về cọc trước tính sau."
pillars_shown = "3 ý lớn; ý lớn 3 (bằng chứng) dùng P2, P3 (không số tiền), P5, P11, P12 (không lộ là chị họ); không dùng P4, P7, P8, P9, P10"
framing = "Coach thấy 'mình chạy thử 4 tuần, rồi xem khách nói lại gì'; không bao giờ thấy 'khóa 90 ngày' hay 'khóa'."
big_ideas_candidates = [

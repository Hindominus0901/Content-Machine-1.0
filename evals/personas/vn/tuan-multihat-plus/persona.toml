[[proof_items]]
id = "P1"
text = "Đại lý bảo hiểm nhân thọ từ 2019 (7 năm), có chứng chỉ đại lý; chứng chỉ hành nghề môi giới bất động sản từ 2022, làm qua một sàn nhỏ ở Thủ Đức; dạy sale bán thời gian từ 2021, 31 lớp (có ghi sổ); trước đó bán xe hơi 3 năm. Không nêu tên công ty bảo hiểm, sàn hay đại lý ô tô."
substantiated = true
consent = true
uses = ["posts", "ads"]

[[proof_items]]
id = "P2"
text = "Nhà cô giáo mầm non và chồng làm kỹ thuật điện lạnh: lương hai vợ chồng 32 triệu; tháng 6/2025 suýt cọc 50 triệu cho căn 3 tỷ 1 ở nhà mẫu (gọi Tuấn từ trong toilet nhà mẫu: 'Bên sale dí cọc quá, em có nên cọc không anh?'); tính ngược ra căn tối đa khoảng 2 tỷ 2–2 tỷ 3; tháng 8/2025 mua căn bán lại 2 tỷ 25, góp khoảng 12 triệu một tháng, có quỹ 6 tháng; dọn vô tháng 10/2025. Chị đồng ý qua Zalo: kể được, không ghi tên chị, không ghi tên trường, không chụp hình trong nhà. Là chuyện về cách Tuấn làm khi môi giới, kèm 'kết quả của một nhà, không phải cam kết'."
substantiated = true
consent = true
uses = ["posts", "case-study"]

[[proof_items]]

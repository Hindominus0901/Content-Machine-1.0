# No real person, company, project or handle. Platforms (TikTok, Facebook, Zalo, Zoom, Messenger) are named as platforms only.
# The 2023 bancassurance mis-selling is referred to only as a public event everyone remembers; no bank or insurer is named.
# Acceptance tester profile: VN T5 (ChatGPT Plus, laptop + phone, multi-income, impatient). UX walkthrough: docs/research/wf11-walkthrough-2.md.
# What this persona tests: the Map finds ONE bridge buyer across paying streams (first-home buyers who need the apartment AND
# protection for the borrower), keeps the apartment he must close this month on the Map, and gives the parked sales-training
# stream a labelled side door. Also: early win before minute 8–10, "thử 4 tuần" (never "khóa 90 ngày"), Southern register,
# insurance / real-estate claims guard, an undecided audience pronoun pair.


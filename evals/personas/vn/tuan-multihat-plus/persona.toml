text = "Chị họ của Tuấn: đi vay ngân hàng mua xe, được giới thiệu mua thêm một gói bảo hiểm phí 20 triệu một năm, tưởng là gửi tiết kiệm ('em tưởng em gửi tiết kiệm'). Chị cho kể nhưng không được để lộ là chị; không nêu ngân hàng hay công ty bảo hiểm nào."

[[proof]]
id = "P1"
text = "Đại lý bảo hiểm nhân thọ từ 2019 (7 năm), có chứng chỉ đại lý; chứng chỉ hành nghề môi giới bất động sản từ 2022, làm qua một sàn nhỏ ở Thủ Đức; dạy sale bán thời gian từ 2021, 31 lớp (có ghi sổ); trước đó bán xe hơi 3 năm. Không nêu tên công ty bảo hiểm, sàn hay đại lý ô tô."
substantiated = true
consent = true
uses = ["posts", "ads"]

[[proof]]
id = "P2"
text = "Nhà cô giáo mầm non và chồng làm kỹ thuật điện lạnh: lương hai vợ chồng 32 triệu; tháng 6/2025 suýt cọc 50 triệu cho căn 3 tỷ 1 ở nhà mẫu (gọi Tuấn từ trong toilet nhà mẫu); tính ngược ra căn tối đa khoảng 2 tỷ 2–2 tỷ 3; tháng 8/2025 mua căn bán lại 2 tỷ 25, góp khoảng 12 triệu một tháng, có quỹ 6 tháng; dọn vô tháng 10/2025. Chị đồng ý qua Zalo: kể được, không ghi tên chị, không ghi tên trường, không chụp hình trong nhà. Là chuyện về cách Tuấn làm việc khi môi giới, không phải kết quả của lớp. Kèm 'kết quả của một nhà, không phải cam kết'."
substantiated = true
consent = true
uses = ["posts", "case-study"]

[[proof]]
id = "P3"
text = "Anh khách làm kỹ thuật ở khu công nghệ cao, mua căn qua Tuấn năm 2023, có hợp đồng bảo hiểm với Tuấn: tháng 4/2024 té xe gãy chân, nghỉ làm 3 tháng; hợp đồng chi trả quyền lợi tai nạn và nằm viện, cộng quỹ 6 tháng nhà anh để riêng, ba tháng đó không trễ kỳ góp nào. Anh đồng ý kể, không ghi tên, không ghi số tiền bảo hiểm trả."
substantiated = true
consent = true
uses = ["posts"]

[[proof]]
id = "P4"
text = "Số tiền bảo hiểm chi trả cho anh khách gãy chân: 68 triệu. Có thật nhưng anh dặn đừng ghi: không được dùng ở bất kỳ đâu."
substantiated = true
consent = false
uses = []

[[proof]]
id = "P5"
text = "Chuyện của chính Tuấn: năm 2022 mua căn ở Dĩ An 1 tỷ 95, vay 1 tỷ 2, năm đầu lãi ưu đãi 7,5%, góp 9 triệu một tháng; năm 2023 thả nổi lên khoảng 12%, góp 13 triệu, đúng lúc vợ sanh con và nghỉ thai sản; anh nhận thêm lớp dạy sale cuối tuần để gồng."
substantiated = true
consent = true
uses = ["posts"]

[[proof]]
id = "P6"
text = "Số trong sổ của Tuấn: đang chăm 58 hợp đồng bảo hiểm; từ 2023 chốt 9 căn hộ; 6 trong 9 nhà mua căn qua anh cũng có hợp đồng bảo hiểm với anh. Là số việc làm, không phải kết quả của khách."
substantiated = true
consent = true
uses = ["posts"]

[[proof]]
id = "P7"
text = "Tin Zalo riêng của anh quản lý một sàn: 'từ hồi anh dạy, tụi nhỏ bớt dí cọc khách hẳn'. Tuấn chưa hỏi đăng được không: chưa được dùng."
substantiated = true
consent = false

[[proof]]
id = "P10"
text = "Cặp vợ chồng năm 2024 được ngân hàng sơ bộ duyệt 2 tỷ 1 (Tuấn tính tối đa 1 tỷ 5), mua qua bên khác căn 2 tỷ 9; tháng 9/2026 trễ 2 kỳ và nhờ Tuấn bán lại. Tuấn chưa hỏi anh chị cho kể: không dùng chi tiết nào nhận ra được người."
substantiated = true
consent = false

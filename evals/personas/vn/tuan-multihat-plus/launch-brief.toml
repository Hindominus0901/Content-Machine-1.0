# launch-brief.toml · tuan-multihat-plus (VN) · anh Tuấn (fictional)
# What Tuấn brings when he says "lên kế hoạch mở lớp nhỏ cho vợ chồng trẻ trước Tết" after Season 1.
# The class is a NEW offer: nobody has ever paid Tuấn to calculate or to learn (his income is commission
# paid by sellers and the insurer). Picker Q1 = no → A. Founding-member, 7 days, one 45-minute live.
# His agent-client stories (P2, P3, P5, P11) are consented stories about how he works, NOT results of
# the class: the machine may tell them as process proof but must not write "học viên đạt được…".
# Launch window avoids tháng cô hồn (lunar 7th month ≈ 12/8–10/9/2026); 03/12–09/12/2026 is lunar month 10–11.
# Class ends before the Tết bonus season (Tết Đinh Mùi 06/02/2027), when young couples plan a down payment.

offer = "Lớp nhỏ 'Tính trước khi cọc' cho vợ chồng trẻ lần đầu mua căn hộ: 2 buổi tối trên Zoom (20h–21h30 thứ Ba 15/12/2026 và thứ Năm 17/12/2026). Mỗi nhà về có tờ tính ngược của chính nhà mình (tiền góp tối đa tính bằng lãi cao, vay tối đa, giá căn tối đa), số tiền quỹ dự phòng cần để riêng, và danh sách câu hỏi trước khi cọc. Sau lớp, mỗi nhà có 1 buổi tính riêng 30 phút qua Zalo video với Tuấn (18/12–27/12/2026). Trong giờ học không giới thiệu căn nào, không bán hợp đồng bảo hiểm nào."
price = "490.000đ"
price_note = "Giá cho một nhà (hai vợ chồng học chung một máy). Đây là giá lớp đầu; lớp sau tháng 3/2027 là 790.000đ, Tuấn đã quyết và sẽ làm thật. Giá công khai, không 'giá ib', không giá gạch."
payment_terms = "Chuyển khoản VietQR khi đăng ký. Học xong buổi 1 thấy không hợp, nhắn Tuấn trước 20h buổi 2 (thứ Năm 17/12/2026) thì được hoàn đủ 490.000đ, không hỏi lý do. Đây là điều khoản hoàn tiền của lớp, không phải lời hứa về kết quả (máy không viết chữ 'cam kết' cho điều khoản này)."
disclosure = "Tuấn là đại lý bảo hiểm nhân thọ và môi giới căn hộ có chứng chỉ, có nhận hoa hồng khi khách mua căn hoặc tham gia hợp đồng qua anh. Lớp không bắt ai mua gì; nhà nào muốn ngồi riêng sau lớp thì hẹn riêng."
capacity = 20
capacity_reason = "Mỗi nhà có 1 buổi tính riêng 30 phút sau lớp; 20 nhà là 10 tiếng, đúng số giờ Tuấn xếp được từ 18/12 tới 27/12/2026 bên cạnh lịch dẫn khách coi nhà cuối tuần. Làm một mình, không có trợ lý."
revenue_goal = "9.800.000đ (20 nhà × 490.000đ). Hoa hồng căn hộ và bảo hiểm sau lớp không đưa vào mục tiêu vì không đoán trước được và không được hứa trong lớp."

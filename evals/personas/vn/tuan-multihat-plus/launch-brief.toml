[[proof]]
id = "P11"
text = "Nhà làm ở một công ty giày bên Dĩ An, mua căn qua Tuấn năm 2024, góp 11 triệu một tháng, có quỹ 6 tháng (hơn 60 triệu); cuối năm 2025 lương chồng còn phân nửa 4 tháng liền, lấy quỹ bù tiền góp, không trễ kỳ nào. Đồng ý kể, không nói tên công ty."

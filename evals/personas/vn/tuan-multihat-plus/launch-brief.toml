[[proof]]
id = "P8"
text = "Câu Tuấn tự hào: 'khách tui chưa ai bị từ chối bồi thường'. Không đúng như câu nói: 11 hồ sơ bồi thường có 1 hồ sơ bị trả một phần vì lúc ký khách khai sức khỏe thiếu; câu này lại nghe như một lời hứa. Không được dùng."
substantiated = false
consent = false
uses = []

[[proof]]

text = "Chuyện của chính anh Đức, chừng năm 2015 khi còn làm tổ trưởng đội lắp cho một công ty nội thất: tới nhà ống bên Hòa Khánh mới thấy tường nghiêng, đá chưa khoét, dây điện nhỏ, người báo giá không tới; chị chủ nhà hỏi \"Rứa mấy cái ni ai chịu?\"."

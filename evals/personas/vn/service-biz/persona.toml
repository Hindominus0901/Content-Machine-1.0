text = "Một chị bên Ngũ Hành Sơn (giữa năm 2026) mang hai bản báo giá ra quán cà phê: bên kia một tờ, rẻ hơn gần 20 triệu; tô vàng từng dòng thì tờ bên kia trắng tinh; chị nói \"Hóa ra bên kia rẻ vì bên kia chưa ghi\"; tuần sau ký với anh."
substantiated = true
consent = true
uses = ["posts"]
note = "Chỉ có từ Buổi nói chuyện tuần 2. Kể được, không nêu tên. Không nêu hay ám chỉ đội kia."

[[proof_items]]

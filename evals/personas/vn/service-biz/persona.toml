[[proof_items]]
id = "P1"
text = "Chị Loan (nhà ống Thanh Khê, bếp xài 18 năm, hư sau trận ngập 14/10/2022): gọi 3 bên; anh đục thử trước, báo giá chốt 96 triệu; làm tại nhà 6 ngày; quyết toán đúng 96 triệu. Câu của chị: \"Em sợ nhất là đập ra rồi mới phát sinh\" (trước) và \"Báo nhiêu trả nấy, lần đầu em sửa nhà mà không cãi nhau với thợ\" (sau)."
substantiated = true
consent = true
uses = ["posts", "case-study"]
note = "Có hợp đồng, quyết toán, hình trước sau. Đồng ý đăng hình và kể chuyện, không ghi số nhà, tên đường. Không đồng ý chạy quảng cáo."

[[proof_items]]
id = "P2"
text = "Anh Hưng chị Yến (căn hộ chung cư Sơn Trà, 2025): bếp bàn giao mới 4 năm đã xệ; có 2 đứa nhỏ nên dựng bếp tạm ngoài lô gia, che bụi; làm 5 ngày; báo giá chốt 112 triệu, chị Yến đổi sang đá thạch anh nên ký phụ lục 4,5 triệu trước khi đặt đá; quyết toán 116,5 triệu. Câu của chị Yến: \"Sửa bếp rồi cả nhà nấu ăn ở mô?\"; anh Hưng: \"Thêm mà mình biết trước thì không thấy tức\"."
substantiated = true
consent = true
uses = ["posts", "ads", "case-study"]
note = "Đồng ý nêu tên, đăng hình, chạy quảng cáo, làm case. Con số quyết toán vẫn không đưa vào quảng cáo (luật mở đợt)."

[[proof_items]]
id = "P3"
text = "Cô Sáu (Cẩm Lệ, 2024): anh đục thử sau chậu rửa thì ống tốt, nhưng ống nước âm tường đi lên bồn nằm chỗ khác bị mục; chụp hình gửi Zalo, báo thêm 3,2 triệu, cô duyệt rồi mới làm; cô hỏi \"răng không nói trước\"; từ đó anh đục thử hai chỗ."
substantiated = true
consent = true
uses = ["posts"]
note = "Ca anh sai (ca lệch kết quả, rất có giá trị). Kể được, không nêu tên, không đăng hình nhà."

[[proof_items]]
id = "P4"
text = "Tin Zalo một chị ở Hải Châu (làm xong 2023): \"Bếp nhà em 2 năm rồi mà cánh tủ vẫn khít, mùa mưa không phồng chút nào\"."
substantiated = true
consent = true
uses = ["posts", "ads"]
note = "Thảo đã xin; chụp màn hình che tên."

[[proof_items]]
id = "P5"
text = "Khoảng 40 công trình bếp trọn gói từ 2022 đến nay, công trình nào cũng có ảnh trước sau; bìa còng ở văn phòng kẹp báo giá chốt cạnh bản quyết toán, che tên khách."
substantiated = true
consent = true
uses = ["posts", "ads", "case-study"]
note = "Con số 40 và cái bìa còng dùng được. Ảnh của từng công trình chỉ dùng khi chính khách đó đồng ý (hiện chỉ P1, P2)."

[[proof_items]]
id = "P6"
text = "4 căn bếp homestay của anh Quân ở An Thượng (2025): công trình đẹp nhất, hình chụp đẹp."
substantiated = true
consent = false
uses = []
note = "Anh Quân không cho đăng (sợ lộ chỗ, sợ người ta làm theo). Không dùng ở đâu, kể cả che tên hay cắt ảnh."

[[proof_items]]
id = "P7"
text = "Dì Năm bên vợ ở Hội An: một đội khác báo 70 triệu, xong trả 130 triệu, \"gần gấp đôi\"."

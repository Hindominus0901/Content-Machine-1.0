text = "Chuyện của chính anh Đức, năm 2019: báo giá theo mét dài cho một ông chú bên Liên Chiểu; đập ra tường mục, ống rỉ; ông chú cầm chổi chỉ vô mặt: \"Mi báo giá rứa là để gạt tau hả\"; anh bù 9 triệu tiền túi rồi bỏ báo giá theo mét dài."

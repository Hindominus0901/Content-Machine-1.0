text = "Một nhà phố bên Hòa Cường (2024) chọn bên rẻ hơn chừng 15 triệu; 8 tháng sau tủ chậu ván thường phồng mục, gọi anh qua; anh thay tủ chậu ván nhựa, nâng chân inox, chỉ lấy tiền vật tư với công; chị nói \"Phải chi hồi đó em hỏi kỹ\"."
substantiated = true

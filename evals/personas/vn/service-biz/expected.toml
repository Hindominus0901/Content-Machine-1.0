[week1]
platform_mix = "short-video"
lead_piece = "QUAY HÔM NAY trên TikTok (đăng lại Reels trên Trang): quay ở công trình, cầm máy đi một vòng mà nói, mở bằng \"Sửa bếp, anh chị sợ đập ra rồi mới phát sinh?\"; thẻ ý: câu đầu và câu cuối nguyên văn, giữa 3 ý (phát sinh nằm ở chỗ chưa đo · trưa năm 2019 ông chú bên Liên Chiểu · tụi em đục thử trước rồi mới báo giá); mời comment \"phát sinh\" nhận danh sách 7 chỗ, có lựa chọn \"nhẹ\"; có bản chữ để Thảo đăng nếu chưa quay"
must_include = [
  "3 video ngắn quay ở công trình hoặc xưởng (TikTok, đăng lại Reels trên Trang), dạng thẻ ý: câu đầu, câu cuối nguyên văn, 3 ý ở giữa; không bắt ngồi nói trước camera",
  "1 bài Facebook dài trên trang cá nhân kể chuyện năm 2019 (đăng lại được lên Trang)",
  "1 tin Zalo gửi khách cũ và người từng hỏi giá, mời trả lời lại (thay cho email vì danh sách email bằng 0)",
  "quà = danh sách 7 chỗ hay phát sinh khi sửa bếp, gửi vừa trong một tin nhắn",
  "mẫu trả lời inbox 1–2 để Thảo dán: mở bằng \"Dạ\", xưng em, gửi danh sách, có một câu hỏi lọc (nhà phố hay chung cư, bếp xài bao lâu rồi), xin kết bạn Zalo, không xin số điện thoại công khai",
  "tin \"hỏi 3 khách cũ một câu\" gửi qua Zalo (chị Loan, anh Hưng chị Yến, chị ở Hải Châu)",
  "mỗi bài có dòng VÌ SAO RA KHÁCH và từ khóa đúng 1 lần",
  "có lựa chọn lời mời nhẹ (gõ \"nhẹ\")",
  "ít nhất một bài dùng chuyện của chính anh (năm 2019 ở Liên Chiểu)",
  "chỉ dùng hình của công trình đã đồng ý (P1 trên Trang, không quảng cáo; P2)",
]
must_not_include = [
  "chủ đề trong Để sau làm ý chính (homestay, thầu phụ, chống thấm, phong thủy, thiết bị bếp, tuyển thợ)",
  "hình nhà anh Quân, chuyện dì Năm hay con số 70 / 130 triệu",
  "câu hứa \"không phát sinh\" tuyệt đối",
  "so sánh hay chê đội thi công khác",
  "yêu cầu chụp màn hình số liệu Facebook hay TikTok",
  "tiểu từ giọng Bắc trong bài của anh (đấy, nhỉ, nhé)",
  "bất kỳ tên nào trong seeded_names",
]
friday_review_from_stats_w1 = { posted = 6, keyword_comments = 91, dms = 60, calls = 5, sales = 0 }
friday_best_post = "Video quay hôm nay 12/10 (31 comment từ khóa, 1 hẹn khảo sát) hoặc tin Zalo 15/10 (23 trả lời, 2 hẹn khảo sát); máy phải nói rõ tiêu chí chọn"
friday_note = "calls = hẹn khảo sát, sales = ký hợp đồng (bếp cần khảo sát, bản vẽ, báo giá nên 0 hợp đồng ở tuần 1 là bình thường, không phải thất bại). Ô trống là anh không biết (lượt xem bài chữ và album, lượt lưu Facebook), không phải 0; máy không được tính như 0 hay bịa."


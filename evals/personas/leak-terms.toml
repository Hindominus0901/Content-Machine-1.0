# leak-terms.toml · distinctive facts of each persona fixture (v13.8, COMPARE v13.7 new defect 1)
#
# The kit's own examples must never be built from a test persona's facts: when they are, a demo run cannot tell
# whether the machine thought or copied (v13.7: "Một spa từ 14 lên 33 lịch hẹn mỗi tháng…" was the kit's example).
# tools/lint.py E148 fails when any term below appears in a kit source that ships: every module and core section
# body (both editions), every strings/*.toml value, and every file under plugin/. Matching is case-insensitive, on
# NFC text, on word edges ("112 tin" does not match "1120 tin"); a line ending in <!-- lint-ok: E148 --> is exempt.
# tools/tests/test_lint_leak_terms.py also checks that every term still occurs in its fixture folder, so the list
# stays honest when a persona is rewritten; "echoes" are the same facts in the other edition's words (checked by
# lint, not required in the folder).
#
# What goes here: names (clients, the coach, the business), offer and gift names, coined phrases, signature lines,
# and the numbers that only make sense as that persona's story ("14 lên 33", "112 tin"). Not here: generic words a
# kit needs anyway ("seen", "phát sinh", "hỏi giá", "record year"), or bare numbers.
# The founder-approved hook examples built from sales-coach (docs/research/hooks-cta/PRINCIPLES.md) stay in docs only.

[sales-coach]
fixture = "evals/personas/vn/sales-coach"
terms = [
  "chị Quyên", "chị Trâm", "anh Tài", "bác sĩ Long", "anh Phong",
  "Chốt Khách Không Ép",
  "112 tin", "98 tin", "14 lịch", "33 lịch", "14 lịch hẹn", "33 lịch hẹn",
  "10 năm làm sale", "để chị suy nghĩ", "để anh về bàn với vợ",
  "hỏi trước, báo giá sau", "khách hỏi giá rồi seen", "41 bé", "38 nghìn",
]
# The same facts as a kit example carried them (v13.7 kit, founder-approved list) and in EN words; these are derived
# from the folder, not quoted in it, so lint checks them but the fixture test does not.
echoes = [
  "14 lên 33", "14 → 33", "14→33", "10 năm → 10 phút", "x2 lịch hẹn", "không phải tại giá", "bỏ kịch bản đi",
  "trước cả bảng giá",
  "14 to 33", "112 inquiries", "112 messages", "14 bookings", "Tram's spa", "10 years in sales",
  "10 years → 10 min", "10 years in 10 minutes", "2x bookings", "drop the script", "not the price.",
  "Comment THINK ABOUT IT",
]


  "just a phase",
]

[research]
# Extra table for the research grader (research-paste.md line numbers).
coach_own_quote_line = 15
coach_own_quote = "Your kid doesn't need a new trick, he needs the same answer every night."
seller_lines = [8, 9]
duplicate_lines = [10, 17, 24]     # duplicates of lines 2, 7 and 1
distinct_audience_voices = 26      # 32 lines - 2 sellers - 3 duplicates - 1 coach quote
note = "Line 16 (fell asleep at a stoplight with the baby in the back) is a genuine audience voice that echoes Ren's red-light story; it must NOT be merged with the coach quote. Lines 22 and 26 are RISKY / DIFF-BUYER signals (melatonin, a 4-week-old) and must not become content angles."


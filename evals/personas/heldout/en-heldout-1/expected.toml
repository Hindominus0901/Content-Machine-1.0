  "Have you tried one thing for 2 weeks?",
  "Night 3 is the worst night, not the failure.",
  "Crying is how they talk.",
  "That's not a sleep thing, that's a doctor thing.",
  "Feed, then read.",
  "an ex-preschool teacher talking to a tired friend: short sentences, times on the clock, rooms in the house, warm and a little self-mocking",
  "story first, then the step; 'your kid', never 'your little one'",
]
banned = [
  "mama",
  "hey mamas",
  "little one",
  "sleep journey",
  "no tears",
  "tear-free",
  "cry-free",
  "guaranteed",

[map]
buyer = "Mẹ đi làm giờ hành chánh, 28–38 tuổi, con lớp 1–lớp 3, thường kèm một mình (ba làm xa hoặc về trễ); 8 giờ mới ngồi vô bàn mà 10 giờ chưa xong, tối nào cũng la con; tìm tới cô lúc đã sợ giờ học bài."
problem_in_their_words = [
  "Cô ơi, tối nào kèm con học em cũng tăng xông",
  "Nó ngồi vô bàn là đi tè, uống nước, gọt viết chì, 15 phút chưa viết được chữ nào",
  "Ở lớp cô khen mà về nhà làm bài thì như người khác",
  "em phải ngồi canh nó từng chữ",
  "em sợ tới giờ học bài còn hơn con nữa",
]
problem_secondary = ["Cô ơi chữ con đẹp rồi mà tối về làm bài vẫn tăng xông cô ơi"]   # a rèn-chữ parent: bridge evidence, not a result
promise = "Sau 4 tuần: con tự ngồi vô bàn với đồng hồ cát, mẹ lùi ra được bàn ăn, giờ học bài tối gọn lại và mẹ bớt la (kết quả tùy mỗi bé). Hứa quy trình, không hứa số phút, điểm số, chữ đẹp hay \"tự giác\"."
method_hint = "Kèm Lùi (chữ của cô; tên khác dựa trên \"kèm lùi\" / \"lùi dần\" cũng đạt, không đặt tên y khoa hay kiểu \"thần kỳ\"): 1 chốt giờ chốt chỗ (đồng hồ cát 20 phút con tự lật, nghỉ 5 phút) · 2 cất cục gôm, chấm bút chì bên lề cho con tự dò lỗi · 3 lùi một bước mỗi tuần: kế bên → đối diện → bàn ăn → con tự mang tập ra."
enemy_old_way = "Ngồi canh: kéo ghế ngồi sát, cầm cục gôm bôi từng chữ, bắt viết lại nguyên trang, so sánh con nhà người ta, hù; hoặc mệt quá thì gửi đi học thêm buổi tối cho khoẻ. Cô gọi là \"canh tù chớ đâu phải kèm\"."
offer = "Khoá Kèm Con Không La · 4 tuần · Zoom tối thứ Năm 21h + nhóm Zalo + mỗi tuần 1 clip 2 phút cô trả lời bằng tin nhắn thoại · 1.490.000đ · tối đa 25 mẹ · Messenger → Zalo → chuyển khoản"
core_message_example = "Cô giúp mấy mẹ đi làm có con lớp 1–3 đang \"tối nào kèm con học cũng tăng xông\" để con tự ngồi vô bàn, bằng cách Kèm Lùi, thay vì ngồi canh. (minh hoạ; ≤50 âm tiết, có tên cách làm hoặc tên cách cũ)"
why_this_one_must_cite = ["14 mẹ đã trả tiền khoá 1", "lời của mấy mẹ (\"tăng xông\")", "chuyện mẹ bé lớp 2 ở Bình Thủy hoặc sổ giờ học khoá 1", "chuyện tối 2017 của chính cô (cô nói dài và xúc động nhất)"]
big_ideas_candidates = [
  "Tăng xông không phải tại mẹ nóng tính: ở nhà thiếu giờ, thiếu chỗ, mẹ ngồi quá sát (\"Em nóng tính quá\" → \"Tại giờ học không có giờ, không có chỗ\")",
  "Ngồi canh càng sát, con càng chậm: con chờ mẹ dò, dòm mặt mẹ từng chữ (\"Hổng canh là nó chơi\" → \"Canh thì nó chờ mẹ\")",
  "Cất cục gôm: con tự kiếm ra lỗi thì con nhớ cái lỗi (\"Phải sửa giùm cho nhanh\" → \"Chấm bên lề, con tự dò\")",
  "Mẹ đi làm về mệt vẫn kèm được: 20 phút đồng hồ cát, lùi một bước mỗi tuần (\"Em đâu có thời gian\" → \"Ngồi bàn ăn uống ly nước là đủ\")",
  "Ở lớp ngoan vì ở lớp có giờ, có chỗ, chớ đâu phải tại cô giỏi (biến thể của ý 1)",
]
# A correct Map shows 3 big ideas from the list or close variants; the usual pick is 1 + 2 + 4 (3 may stand in for 2, 5 for 1).
# Picking a handwriting idea, a homework-tutoring (học thêm) idea or an ADHD idea as a big idea is a defect.
not_now_must_include = [
  "Rèn chữ đẹp: nét, tư thế ngồi, cầm viết, chọn tập 4 hay 5 ô ly (DIFF-PROBLEM; lớp đã đủ chỗ → cửa phụ, xem side_door)",
  "Tăng động giảm chú ý (RISKY: ngoài chuyên môn, chỉ một câu \"đưa con đi khám bác sĩ chuyên khoa\"; không bao giờ thành nội dung)",
  "Quy định dạy thêm học thêm (RISKY: luật, dễ sai, đụng tới đồng nghiệp)",
  "Học trước khi vào lớp 1 (TOO-EARLY / DIFF-BUYER: mẹ con mẫu giáo)",
  "Toán tư duy, soroban (DIFF-PROBLEM)",
  "Điện thoại, iPad, giờ xem màn hình (GENERIC → chỉ làm gia vị một dòng trong \"chốt giờ chốt chỗ\")",
]
not_now_may_include = [
  "Đánh vần sách mới (RISKY / ồn ào cũ)",
  "Nói chuyện với cô chủ nhiệm, nhóm Zalo lớp (DIFF-PROBLEM)",
  "Có nên cho con đi học thêm buổi tối (câu hỏi số 1 của mẹ: chỉ được làm ví dụ của cách cũ, không thành ý chính)",
  "Tiếp thị liên kết tập luyện chữ trên Shopee (không làm content)",
  "Kèm 1-1 online (sắp ngưng)",
]
on_map_seasoning = ["điện thoại úp xuống trong bước chốt giờ chốt chỗ", "học thêm buổi tối như một kiểu cách cũ", "chữ xấu: một dòng, không hứa chữ đẹp"]
runner_up_candidate = "Rèn chữ đẹp cho bé lớp 1 (nhiều view, có trả tiền, cô giỏi): khác vấn đề, lớp đã đủ chỗ và chỉ ở Cần Thơ → Để sau, cửa phụ"
side_door = "Lớp rèn chữ cuối tuần (đang nuôi nhà, hơn 11 triệu một tháng) không bị bỏ: đã đủ 16 bé, có 7 bé chờ, nên chỉ cần cửa phụ qua tin nhắn: phụ huynh ở Cần Thơ hỏi rèn chữ thì trả lời bằng danh sách chờ; mẹ nào hỏi chữ xấu mà thật ra đang tăng xông mỗi tối thì dẫn qua khoá Kèm Con Không La. Tối đa 1 bài cửa phụ có nhãn mỗi tuần (tính vào ngân sách ngoài bản đồ 1 trên 7), không bao giờ là câu mở, ý chính hay lời mời thứ hai trong một bài. Kèm 1-1 sắp ngưng: không làm content. Tiếp thị liên kết Shopee: không làm content; nếu cô tự đăng thì phải ghi rõ là tiếp thị liên kết."
one_message_example = "Cô giúp mấy mẹ đi làm có con lớp 1–3 đang \"tối nào kèm con học cũng tăng xông\" cho con tự ngồi vô bàn, bằng cách Kèm Lùi, thay vì ngồi canh. (minh hoạ)"


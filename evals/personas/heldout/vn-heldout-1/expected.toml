# wf15 §1 shape; budgets from evals/acceptance.toml [day0] (map_max_turns_vn, session_max_turns).
must_include = [
  "lượt 1: hỏi xưng hô (gõ 1 chữ) và mẹo micro cho điện thoại Android: micro nhỏ trên bàn phím hoặc trong ô chat, KHÔNG bấm nút sóng âm (cô quen bấm nút đó)",
  "khi cô lỡ bấm nút sóng âm và hỏi \"Ủa sao nó nói chuyện lại với cô vậy em?\": một câu chỉ lại đúng chỗ, không giảng",
  "từ lượt 2: gọi \"cô\", xưng \"em\", không trượt lần nào",
  "sau chunk 1: 3 câu đáng tiền trích nguyên văn của cô (ví dụ \"Mẹ là cô giáo mà sao mẹ la con dữ vậy\", \"Cô ơi, tối nào kèm con học em cũng tăng xông\", \"cô nói vậy là canh tù chớ đâu phải kèm\")",
  "sau 'xong' chỉ hỏi cái chưa nghe được, tối đa 3, mỗi tin một câu, kèm câu đoán ('… đoán: …. Đúng không?'); dump đã có lời khách nguyên văn và một kết quả có số (mẹ bé lớp 2 ở Bình Thủy), nên thường chỉ còn câu nhiều nguồn thu",
  "câu nhiều nguồn thu: rèn chữ, khoá Kèm Con Không La, kèm 1-1, tiếp thị liên kết Shopee; đoán MỘT kiểu người mua được nhiều thứ (mẹ có con lớp 1 ở Cần Thơ) hoặc hỏi nguồn nào nuôi cô tháng này (đáp: rèn chữ)",
  "Bản đồ 4 dòng (ĐIỀU KHÁCH NHỚ, 3 CHỦ ĐỀ, TỪ KHOÁ, GIỌNG) rồi câu chạy thử 4 tuần, 'OK hay sửa một dòng?'; không có 'vì sao chọn' hay ĐỂ SAU trên Bản đồ (chỉ in khi cô hỏi 'tại sao?')",
  "quay hôm nay: viết nguyên văn (cô muốn nguyên văn) nhưng dưới 30 giây, câu ngắn để học thuộc vì cô quay bằng chính điện thoại đó; dựng từ chuyện tháng 10/2017 của chính cô; dưới bài không in dòng nào; cuối là 'Quay luôn bây giờ, hoặc đăng caption dạng bài chữ cũng được.'",
  "có lựa chọn lời mời nhẹ (gõ \"nhẹ\")",
  "tuần 1 tới ở trả lời ngay sau QUAY HÔM NAY, không chờ hỏi, trước Brand Card; chưa lưu vẫn làm tiếp; bản miễn phí hết lượt giữa chừng thì cô quay lại cùng đoạn chat, gõ \"tiếp\", máy làm tiếp đúng bước dang dở",
]

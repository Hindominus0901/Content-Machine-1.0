[week1]
platform_mix = "short-video"   # email_list = 112 < 300 and never mailed → not email-first; Zalo is the follow-up channel
lead_piece = "Video ngắn quay hôm nay (ý lớn 1): mở bằng lời của mấy mẹ \"tối nào kèm con học cũng tăng xông\", dùng chuyện tối tháng 10/2017 cô bôi rách tập của con; viết nguyên văn dưới 30 giây để cô học thuộc; có bản đăng chữ nếu chưa quay"
must_include = [
  "3 video ngắn viết nguyên văn (cô chọn nguyên văn), mỗi cái dưới 30 giây, câu ngắn dễ thuộc",
  "1 bài Facebook dài kiểu chia sẻ trên trang cá nhân (đăng lại được vào nhóm Ba Mẹ Kèm Con Lớp 1 – Lớp 2)",
  "1 tin Zalo gửi phụ huynh cũ và nhóm khoá 1, mời trả lời lại (không phải email dù có 112 email)",
  "quà = Bảng Kèm Lùi 4 tuần, một trang, gửi vừa trong một tin nhắn",
  "câu trả lời inbox 1–2 xưng cô – em (cô lớn tuổi hơn, không mở đầu bằng \"Dạ\"), có một câu hỏi lọc (bé lớp mấy, tối qua ngồi bàn học khoảng bao lâu)",
  "tin \"hỏi 3 khách cũ một câu\" gửi 3 mẹ khoá 1 qua Zalo",
  "từ khoá đúng 1 lần mỗi bài; mỗi bài lưu một câu VÌ SAO RA KHÁCH, chỉ in khi coach hỏi 'tại sao?'; dưới bài không in dòng nào",
  "có lựa chọn lời mời nhẹ (gõ \"nhẹ\")",
  "ít nhất một bài dùng chuyện của chính cô (tối tháng 10/2017)",
]
must_not_include = [
  "chủ đề trong Để sau làm ý chính (rèn chữ, tăng động, dạy thêm học thêm, học trước lớp 1, soroban, điện thoại)",
  "tên bé \"Su\" hoặc \"Gạo\", tên mẹ, hình con, hình tập có tên",
  "số 80%, 10 điểm, \"từ 3 tiếng còn 1 tiếng\", hay số phần trăm suy ra từ 31 trên 35",
  "kết quả của mẹ bé lớp 2 ở Bình Thủy trong quảng cáo",
  "tên trường cũ, câu chê giáo viên",
  "chuỗi email hoặc bài email làm bài chính",
  "tiểu từ miền Bắc (nhé, nhỉ, đấy, thế, cơ) và chữ \"bố\", \"vở ô li\", \"cục tẩy\"",
  "bất kỳ tên nào trong seeded_names",
]
friday_review_from_stats_w1 = { posted = 7, pieces = 6, keyword_comments = 111, dms = 100, calls = 4, sales = 1 }
friday_note = "7 dòng = 6 bài + 1 video đăng lại trên TikTok. Ô trống là cô không biết (lượt xem bài chữ trên Facebook, lượt lưu trên Facebook, comment của tin Zalo), không phải 0; máy không được tính như 0 hay bịa."


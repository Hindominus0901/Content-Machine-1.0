text = "Mẹ bé lớp 2 ở Bình Thủy (khoá 1): trước mỗi tối khoảng 2 tiếng, từ 8 giờ tới 10 giờ; cuối tuần 4 khoảng 40 phút xong bài. Tin nhắn Zalo 8 giờ 52 tối: \"Tối qua em không la tiếng nào cô ơi\"."
substantiated = true
consent = true
uses = ["posts", "case-study"]
note = "Có sổ giờ học 4 tuần và tin nhắn. Đồng ý kể, KHÔNG nêu tên mẹ, KHÔNG nêu tên bé (Su), không đăng hình, không chạy quảng cáo. Khối bối cảnh: bé học bán trú, không học thêm, ba làm xa, mẹ kèm một mình, học giá 990.000đ; thiếu số năm/điểm xuất phát khác → ghi [CẦN] khi viết case."


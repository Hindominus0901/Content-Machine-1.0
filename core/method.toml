# Which prose sections go into which shipped file (docs/BUILD.md §3).
# Selectors are exact section IDs ("talk.core") or a whole module ("talk.*").
# tools/build.py skips an anchor with no sections and notes it in
# dist/maintainer/manifest.json; `lint --release` turns every skip into an error.
#
# Anchor order is file order. Each anchor renders as "## §CM-<ID> · <title>", the
# title coming from strings key "anchor.<id in lower case>". Section bodies sit
# under that heading, so they use ### or deeper headings.

# ---------------------------------------------------------------- Day-0 kit method file
# CONTENT-MACHINE-<SUFFIX>.md (≤56 KB EN / ≤64 KB VN since 7 Oct night; each anchor ≤2,800 B EN / 3,600 B VN).
# The start-block router names every anchor below (lint E130). P2 fills the sections.

[method]
title_key = "method.title"
# Convention: sections named <module>.kit-<name> ship in this file (except plan.kit-month*, liked.kit-* and
# character.kit-talks, in the STRATEGY level-up since the founder's own Day 0, 7 Oct); other sections are for the L3 skill references (P4) or the level-up files (P5). Selectors ending in * are prefix matches.
# Until a module is written its anchor is empty and build skips it (lint --release errors).

[[method.anchor]]
id = "SETUP"
sections = ["setup.kit-dump", "setup.kit-facts", "setup.kit-order"]

[[method.anchor]]
id = "DIG"                       # founder 7 Oct night: the interview about the coach's side (≤6 questions) before the strategy
sections = ["setup.kit-dig"]

[[method.anchor]]
id = "CARD"
sections = ["brain.kit-*"]

[[method.anchor]]
id = "TODAY"
sections = ["levelup.kit-*"]

[[method.anchor]]
id = "TALK"
sections = ["talk.kit-*"]

[[method.anchor]]
id = "WEEK"
sections = ["plan.kit-week*"]

[[method.anchor]]
id = "FORMATS"
sections = ["fmt-short.kit-video*"]

[[method.anchor]]
id = "POSTS"
sections = ["fmt-short.kit-post*"]

[[method.anchor]]
id = "MESSAGES"
sections = ["fmt-short.kit-message*"]

[[method.anchor]]
id = "NUMBERS"
sections = ["review.kit-*"]

[[method.anchor]]
id = "MAP"                       # founder 7 Oct night: the strategy proposal (Day 0's one decision) + the keyword
sections = ["message.kit-map", "signature.kit-*"]

[[method.anchor]]
id = "DRIFT"                     # 7 Oct night: the hidden pick (from §CM-SETUP) + staying on the strategy (was §CM-MAP's second half)
sections = ["setup.kit-pick", "message.kit-drift"]

[[method.anchor]]
id = "CTA-KIT"
sections = ["convert.kit-*"]

[[method.anchor]]
id = "CHARACTER-LITE"
sections = ["character.kit-core"]     # the 3 talks (character.kit-talks) live in STRATEGY §CM-CHARACTER-DEEP since 7 Oct

[[method.anchor]]
id = "RESEARCH-LITE"
sections = ["research.kit-*"]

[[method.anchor]]
id = "EDGE"
sections = ["edge-rubric.kit-*"]

[[method.anchor]]
id = "VOICE"                     # wf14-voice-language-spec §6: the Voice Card, platform shifts, address
sections = ["voice.kit-*"]

[[method.anchor]]
id = "HUMANIZE"
sections = ["humanize.kit-pass", "humanize.kit-lists"]

[[method.anchor]]
id = "NATURAL"                   # VN language guide (6 Oct): talk, link and tell stories like a person
sections = ["humanize.kit-natural"]

[[method.anchor]]
id = "GUARDRAILS"
sections = ["guardrails.kit-*"]

[[method.anchor]]
id = "LOCALE"
sections = ["locale.kit-*"]

# ---------------------------------------------------------------- Level-up files (P5)
# One file per area under Level-ups/, built like the method file: Level-ups/<FILE>-<SUFFIX>.md, each
# with a title line, the output contract line top and bottom, and one "## §CM-<ID> · <title>" block per
# anchor (title from strings key "anchor.<id in lower case>"). Each file has its own byte budget
# (platform/targets.toml, `budget` below, E101) and its own companion skill in the plugin (`skill`).
# Anchor ids are unique across the method file and all level-up files: prose points at "§CM-<ID>" and
# the model finds the id in whichever file holds it (the project route loads the files the coach added;
# the plugin route loads the companion skill that owns the file).
#   [levelup.<area>]                     file = "<FILE>"  skill = "<skill name stem>"  budget = "<budgets key>"
#   [[levelup.<area>.anchor]]            id = "..."  sections = ["module.section", ...]


# Which prose sections go into which shipped file (docs/BUILD.md §3).
# Selectors are exact section IDs ("talk.core") or a whole module ("talk.*").
# tools/build.py skips an anchor with no sections and notes it in
# dist/maintainer/manifest.json; `lint --release` turns every skip into an error.
#
# Anchor order is file order. Each anchor renders as "## §CM-<ID> · <title>", the
# title coming from strings key "anchor.<id in lower case>". Section bodies sit
# under that heading, so they use ### or deeper headings.

# ---------------------------------------------------------------- Day-0 kit method file
# CONTENT-MACHINE-<SUFFIX>.md (≤50 KB EN / ≤55 KB VN; each anchor ≤2 KB EN / 2.25 KB VN).
# The start-block router names every anchor below (lint E130). P2 fills the sections.

[method]
title_key = "method.title"
# Convention: sections named <module>.kit-<name> ship in this file; other sections are
# for the L3 skill references (P4) or GROW (P5). Selectors ending in * are prefix matches.
# Until a module is written its anchor is empty and build skips it (lint --release errors).

[[method.anchor]]
id = "SETUP"
sections = ["setup.kit-*"]

[[method.anchor]]
id = "CARD"
sections = ["brain.kit-*"]

[[method.anchor]]
id = "TODAY"
sections = ["levelup.kit-*"]

[[method.anchor]]
id = "TALK"
sections = ["talk.kit-*"]

[[method.anchor]]
id = "WEEK"
sections = ["plan.kit-week*"]

[[method.anchor]]
id = "FORMATS"
sections = ["fmt-short.kit-video*"]

[[method.anchor]]
id = "POSTS"
sections = ["fmt-short.kit-post*"]

[[method.anchor]]
id = "MESSAGES"
sections = ["fmt-short.kit-message*"]

[[method.anchor]]
id = "NUMBERS"
sections = ["review.kit-*"]

[[method.anchor]]
id = "MONTH"
sections = ["plan.kit-month*"]

[[method.anchor]]
id = "MAP"
sections = ["message.kit-*", "signature.kit-*"]

[[method.anchor]]
id = "CTA-KIT"
sections = ["convert.kit-*"]

[[method.anchor]]
id = "CHARACTER-LITE"
sections = ["character.kit-*"]

[[method.anchor]]
id = "RESEARCH-LITE"
sections = ["research.kit-*"]

[[method.anchor]]
id = "EDGE"
sections = ["edge-rubric.kit-*"]

[[method.anchor]]
id = "HUMANIZE"
sections = ["humanize.kit-*"]

[[method.anchor]]
id = "GUARDRAILS"
sections = ["guardrails.kit-*"]

[[method.anchor]]
id = "LIKED"
sections = ["liked.kit-*"]

[[method.anchor]]
id = "LOCALE"
sections = ["locale.kit-*"]

# ---------------------------------------------------------------- Level-up GROW file
# Level-ups/GROW-<SUFFIX>.md (≤60 KB): launch, deep research, ads, packaging library (P5).
# Same shape as [method]:
#   [[grow.anchor]]
#   id = "LAUNCH"
#   sections = ["launch-plan.*"]

[grow]
title_key = "grow.title"

# ---------------------------------------------------------------- L3 Autopilot skill references
# One file per entry under <skill_name>/references/ (≤150 lines, ≤9 KB each), wrapped by
# tools/render.py with the router row's WHEN TO USE / RULES and the formats' CHECK BEFORE
# ANSWERING footer (P4):
#   [[skill.reference]]
#   file = "setup.md"
#   sections = ["setup.*", "message.*"]
#   module = "setup"              # router row (core/router.toml) for the header
#   formats = ["native-short"]    # core/format-checks.toml entries for the footer

[skill]

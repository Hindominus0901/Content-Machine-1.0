# Every line the coach can read that is not method prose (docs/BUILD.md §2).
# Keys are flat and dotted. {{param}} and {{t:key}} are template tags filled at
# build; {name} in single braces is a runtime slot the model fills.
# strings/vn.toml carries the same keys; change an EN text and its VN row goes
# stale (lint E111) until it is rewritten and its src updated.

[strings]

# Output contract, running tag and per-piece labels (UX spec §1.2, §2, §4; PLAN reconciliation 2)
"contract.output" = "Always reply in English. First line ◆ {{name}} · <step>; pieces in copy boxes; one screen of talk; end with one NEXT line."
"running.tag"     = "◆ {{name}} · {step}"
"setup.check"     = "◆ {{name}} · Setup check: ✓ instructions ✓ method file · Brand Card: we make it today"
"next.prefix"     = "NEXT →"
"why.prefix"      = "WHY THIS GETS CLIENTS"
"checked.prefix"  = "✓ Checked:"
"needs.tag"       = "[NEEDS: {question}]"

# The one-line verdict per piece, at most 20 words (QA spec §2.4). Slots: {verb} is a verb.* word;
# {evidence} names a Bank item (or, downgraded, what the piece was written as); {question} is one fact
# to ask; {defect} is the named problem; {n} is the piece label (N2); {line} is the refused line and
# {fact} the real fact that would allow it.
"verdict.ready"            = "Ready to {verb} · I'd post it: {evidence}"
"verdict.ready_downgraded" = "Ready to {verb} · written as {evidence}"
"verdict.needs"            = "Needs you · {question} I won't make it up. (Or say \"skip\".)"
"verdict.draft_queued"     = "Draft · waiting on one fact from you; I'll ask next."
"verdict.draft_fixable"    = "Draft · {defect}. Say \"fix {n}\" and I'll sharpen it."
"verdict.hardstop"         = "Not writing \"{line}\": {defect}. Give me the real {fact} and I'll write it."
"verdict.override"         = "Posted on your call · my concern: {defect} · logged."
"verdict.second_read"      = "Heads-up on {n}: {defect}. Say \"fix {n}\" before posting."

# Verdict verbs (QA spec §2.4)
"verb.film" = "film"
"verb.post" = "post"
"verb.send" = "send"


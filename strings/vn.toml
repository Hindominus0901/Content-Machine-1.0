# Vietnamese strings: same keys as strings/en.toml (docs/BUILD.md §2).
# Each value is { text = "...", src = "<first 10 hex of sha256 of the NFC EN text>" }.
# Lint fails on a missing key (E110), a stale src (E111) or a different {slot} set (E112).
# Default register is mình–bạn; the machine follows the pronoun pair the coach picks.
# G1 mirror, 6 Oct (qa/runs/g1-en-day0/review.md): contract.output carries the running tag, copy boxes and one screen
# of talk (K21; "bằng", "là" dropped for the kit budget); dump.enough is new (K1); save.limit_claude_free drops {time}
# (K18); cta.by_hand drops "bạn hoặc trợ lý gửi" (K14); research.ask3 src only (K15 is EN spelling). Byte cuts, same
# meaning: month.check drops its last line (month.check_next says it in the same message), levelup.offer_grow and
# locale.not_legal are shorter.
# G2/VG1 mirror, 6 Oct (DECISIONS "Long dumps, missing facts, an early piece to post"; qa/runs/g2-en-day0/review.md §7,
# qa/runs/vg1-vn-day0/review.md §8): dump.enough is the soft cut and carries the first câu đoán in one message (one "?"
# in all); dump.post_it is new; setup.multi_income one question (VK-3); setup.plan_guess adds the Zalo/email list and
# says what the talk day is (VK-15); setup.guess_no_result in the "Mình đoán … Đúng không?" shape so it can ride the cut.
# Language fixes, src unchanged: film.now_or_text, cta.not_pushy (VK-1), research.ask3 + ask3.question (VK-9),
# message.pushback.who (VK-10), mic.claude_vn (no Bắc "nhé" before the region is known). Byte cuts, same meaning (block
# and method file are at budget): setup.dump_posts, mic.mac, dump.keep_going, verdict.needs ("Mình không bịa đâu", as EN
# "I won't make it up"; "gõ"), month.save_card (VK-16's named cut), research.ask3, liked.no_watch, liked.copy_note,
# liked.compare_note, liked.slot, message.drift.bridge/park, save.limit_claude_free, save.claude_plain, levelup.offer_grow,
# levelup.offer_character, angle.offer, review.ask, research.drip, research.paste_steps, proof.intake (drops English
# "case study"), talk.open, talk.film. check.bet, unused by either edition after the K24 cut, was
# removed from both files together in the integration pass (E110 otherwise).
# Retest FT2 7/10 (qa/runs/retest-ft2/review.md §5 #4-5, §8 item 7), language fixes, src unchanged: dig.story ("nhớ lại",
# "Hồi mới tìm tới bạn"), dig.proof ("giờ khách đó ra sao rồi?"), research.ask3 ("Cho mình nhờ chút xíu: … sửa lại phần
# giới thiệu, muốn dùng đúng lời bạn nói."). Method file: §CM-DIG −9 B, §CM-RESEARCH-LITE −10 B.


# Vietnamese strings: same keys as strings/en.toml (docs/BUILD.md §2).
# Each value is { text = "...", src = "<first 10 hex of sha256 of the NFC EN text>" }.
# Lint fails on a missing key (E110), a stale src (E111) or a different {slot} set (E112).
# Default register is mình–bạn; the machine follows the pronoun pair the coach picks.

[strings]

# Output contract, running tag and per-piece labels (UX spec §1.2, §2, §4; PLAN reconciliation 2)
"contract.output" = { text = "Luôn trả lời bằng tiếng Việt tự nhiên, đúng cách xưng hô đã chọn. Mỗi lần một màn hình, kết thúc bằng một dòng TIẾP.", src = "01276cce59" }
"running.tag"     = { text = "◆ {{name}} · {step}", src = "82bae98171" }
"setup.check"     = { text = "◆ {{name}} · Kiểm tra cài đặt: ✓ hướng dẫn ✓ file phương pháp · Brand Card: làm ngay hôm nay", src = "a5b0d1d40d" }
"next.prefix"     = { text = "TIẾP →", src = "4c813654ab" }
"why.prefix"      = { text = "VÌ SAO RA KHÁCH", src = "f91b568b43" }
"checked.prefix"  = { text = "✓ Đã kiểm:", src = "781a6a9609" }
"needs.tag"       = { text = "[CẦN BẠN: {question}]", src = "c37b3488a8" }

# The one-line verdict per piece, at most 20 words (QA spec §2.4). Slots: {verb} is a verb.* word;
# {evidence} names a Bank item (or, downgraded, what the piece was written as); {question} is one fact
# to ask; {defect} is the named problem; {n} is the piece label (N2); {line} is the refused line and
# {fact} the real fact that would allow it.
"verdict.ready"            = { text = "Sẵn sàng {verb} · Mình sẽ đăng: {evidence}", src = "7f09f33e2c" }
"verdict.ready_downgraded" = { text = "Sẵn sàng {verb} · viết dạng {evidence}", src = "4ac9de0398" }
"verdict.needs"            = { text = "Cần bạn · {question} Mình không tự bịa phần này. (Hoặc nhắn \"bỏ qua\".)", src = "bd355b9913" }
"verdict.draft_queued"     = { text = "Bản nháp · còn thiếu 1 thông tin, mình sẽ hỏi sau.", src = "7b36c6780d" }
"verdict.draft_fixable"    = { text = "Bản nháp · {defect}. Nhắn \"sửa {n}\", mình làm sắc lại.", src = "4efe35f44e" }
"verdict.hardstop"         = { text = "Câu \"{line}\" mình không viết: {defect}. Bạn cho {fact} thật, mình viết ngay.", src = "16d7fa6c09" }
"verdict.override"         = { text = "Đăng theo quyết định của bạn · mình lưu ý: {defect} · đã ghi lại.", src = "8534b80dee" }
"verdict.second_read"      = { text = "Lưu ý {n}: {defect}. Nhắn \"sửa {n}\" trước khi đăng.", src = "1d1d0f998b" }


name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests and must-fail fixtures
        run: python3 -m unittest discover -s tools/tests

      - name: Lint (G1)
        run: |
          if [ -f tools/lint.py ]; then
            python3 tools/lint.py
          else
            echo "tools/lint.py not present yet; skipping"
          fi

      - name: Build both editions
        run: python3 tools/build.py --edition all

      - name: Package
        run: python3 tools/package.py

      - name: Upload zips and maintainer files
        uses: actions/upload-artifact@v4
        with:
          name: content-machine-dist
          path: |
            dist/*.zip
            dist/maintainer
          if-no-files-found: error
